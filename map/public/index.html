<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Applied AI Engineering Atlas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg id="map" role="img" aria-label="Applied AI Engineering Atlas"></svg>

  <div class="search" role="search">
    <input id="search" type="search" placeholder="Search the atlas" autocomplete="off" spellcheck="false"
      aria-label="Search landmarks and regions" aria-controls="search-results" aria-expanded="false">
    <ul id="search-results" role="listbox" hidden></ul>
  </div>

  <aside id="panel" class="panel" aria-labelledby="panel-name" hidden>
    <button id="panel-close" class="panel-close" aria-label="Close">×</button>
    <div class="panel-body">
      <div class="panel-where" id="panel-where"></div>
      <h1 class="panel-name" id="panel-name"></h1>
      <div class="panel-meta" id="panel-meta">
        <div class="panel-meta-row"><span class="pill" id="panel-maturity"></span><span class="panel-date" id="panel-date"></span></div>
        <p class="panel-note" id="panel-note"></p>
      </div>
      <p class="panel-summary" id="panel-summary"></p>
      <p class="panel-examples" id="panel-examples"></p>
      <section id="panel-path-section">
        <h2>Start here</h2>
        <ol class="resources numbered" id="panel-path"></ol>
      </section>
      <section id="panel-members-section">
        <h2 id="panel-members-heading">Landmarks</h2>
        <div class="chips" id="panel-members"></div>
      </section>
      <section id="panel-learn-section">
        <h2>Learn more</h2>
        <ul class="resources" id="panel-learn"></ul>
      </section>
      <section id="panel-lineage-section">
        <h2>Lineage</h2>
        <ul class="lineage" id="panel-lineage"></ul>
      </section>
    </div>
    <nav class="panel-nav" id="panel-nav" aria-label="Lineage">
      <div class="nav-row" id="panel-parents-row"><span class="nav-label">Built on</span><div class="nav-chips" id="panel-parents"></div></div>
      <div class="nav-row" id="panel-children-row"><span class="nav-label">Led to</span><div class="nav-chips" id="panel-children"></div></div>
    </nav>
  </aside>

  <div class="controls" role="group" aria-label="Zoom">
    <button id="zoom-in" aria-label="Zoom in">+</button>
    <button id="zoom-out" aria-label="Zoom out">−</button>
    <button id="zoom-fit" aria-label="Fit world">⤢</button>
  </div>
  <div class="cartouche">
    <div class="cartouche-title">Applied AI Engineering Atlas</div>
    <div class="cartouche-sub" id="edition"></div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <script src="doodles.js"></script>
  <script src="app.js"></script>
</body>
</html>
