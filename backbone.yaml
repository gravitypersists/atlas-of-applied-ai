    status: added
  - id: instruction-backtranslation
    name: Instruction Backtranslation
    aliases: [Humpback, self-alignment with backtranslation]
    region: data-and-synthetic-data
    layer: detail
    also: [adaptation-and-post-training]
    desc: Generating instructions for existing human-written documents, then having the model score and keep only the best pairs.
    summary: "Instead of having a model invent both the question and the answer, start from good human-written text and ask the model what instruction that text would answer. The model then rates its own pairs and keeps only the best for fine-tuning, and the loop repeats with the improved model. Answers come from real writing, so there is less made-up content than in fully synthetic data."
    parents:
      - {id: self-instruct, rel: extends, why: "Keeps model-generated instructions but takes the responses from human-written text.", src: "Self-Alignment with Instruction Backtranslation (Li et al. 2023)"}
      - {id: llm-annotation, rel: applies, why: "The model scores its own generated pairs to select training data.", src: "Self-Alignment with Instruction Backtranslation (Li et al. 2023)"}
    maturity: 2
    maturity_note: Influential research recipe, little used as a named practice.
    date: "2023-08"
    ref: {title: "Self-Alignment with Instruction Backtranslation (Li et al.)", arxiv: "2308.06259"}
    examples: [Humpback]
    resources:
      - {kind: docs, title: "InstructionBacktranslation - Distilabel Docs", by: "Argilla", year: 2024, url: "https://distilabel.argilla.io/latest/components-gallery/tasks/instructionbacktranslation/"}
      - {kind: paper, title: "LongForm: Effective Instruction Tuning with Reverse Instructions", by: "Abdullatif Köksal et al.", year: 2023, url: "https://arxiv.org/abs/2304.08460"}
      - {kind: paper, title: "Better Alignment with Instruction Back-and-Forth Translation", by: "Thao Nguyen et al.", year: 2024, url: "https://arxiv.org/abs/2408.04614"}
    status: added
  - id: instruction-data-selection
    name: Instruction Data Selection
    aliases: [instruction-following difficulty, IFD, SFT data pruning]
    region: data-and-synthetic-data
    layer: detail
    also: [adaptation-and-post-training]
    desc: Choosing a small, high-value subset of an instruction dataset by scoring each example's difficulty or quality.
    summary: "A few thousand well-chosen fine-tuning examples can do as well as hundreds of thousands, so it pays to pick them. One method, instruction-following difficulty (IFD), compares how hard the model finds an answer with and without its instruction: if the instruction barely helps, the example has something to teach. Other selectors use a model's quality ratings or gradient similarity to the target task."
    parents:
      - {id: data-quality-filtering, rel: specializes, why: "Filters instruction data rather than pretraining text, scoring examples by what they teach.", src: "From Quantity to Quality (Li et al. 2023)"}
    maturity: 2
    maturity_note: Active research; few application teams select data this way.
    date: "2023-08"
    ref: {title: "From Quantity to Quality: Boosting LLM Performance with Self-Guided Data Selection for Instruction Tuning (Li et al.)", arxiv: "2308.12032"}
    examples: [Cherry LLM, AlpaGasus, LESS]
    resources:
