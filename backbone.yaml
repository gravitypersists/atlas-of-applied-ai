    maturity: 4
    maturity_note: Expected practice for production LLM apps, though many teams' sets stay small and stale.
    date: "2023-07"
    ref: {title: "Patterns for Building LLM-based Systems & Products (Eugene Yan)", url: "https://eugeneyan.com/writing/llm-patterns/"}
    examples: [LangSmith datasets, Braintrust datasets, Langfuse datasets]
    resources:
