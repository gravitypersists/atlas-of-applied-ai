  - id: context-engineering
    name: Context Engineering
    aliases: [context management]
    region: prompting-and-context-engineering
    also: [agents-and-orchestration]
    desc: Curating the entire set of tokens a model sees — instructions, tools, retrieved data, history, memory — as a finite resource, especially for long-running agents.
    summary: "The successor to prompt engineering for agents: deciding, turn by turn, which instructions, tools, data, and history the model sees. The context window is treated as a limited attention budget, not free space."
