    date: "2023"
    ref: {title: "OpenTelemetry Semantic Conventions for Generative AI", url: "https://opentelemetry.io/docs/specs/semconv/gen-ai/"}
    examples: [LangSmith, Langfuse, Arize Phoenix, OpenLLMetry]
    resources:
