      - {kind: blog, title: "Building agents with the Claude Agent SDK", by: "Anthropic", year: 2025, url: "https://claude.com/resources/articles/building-agents-with-the-claude-agent-sdk"}
      - {kind: talk, title: "Claude Agent SDK [Full Workshop]", by: "Thariq Shihipar (Anthropic, AI Engineer)", year: 2026, url: "https://www.youtube.com/watch?v=TqC1qOfiVcQ"}
      - {kind: paper, title: "Measuring AI Ability to Complete Long Software Tasks", by: "Thomas Kwa et al. (METR)", year: 2025, url: "https://arxiv.org/abs/2503.14499"}
    status: added
  - id: context-aware-mcp
    name: Context-Aware MCP
    aliases: [CA-MCP, shared context store]
    region: agents-and-orchestration
    layer: detail
    desc: Adds a shared context store that MCP servers read and write, so servers coordinate on multi-step tasks without every intermediate state passing through the LLM.
    summary: "A research extension to MCP in which tool servers share a common memory. The model sets up the plan, then servers read and write intermediate state in the shared store and coordinate among themselves, which cut LLM calls on travel-planning benchmarks. It is one paper so far, not a standard."
    parents:
