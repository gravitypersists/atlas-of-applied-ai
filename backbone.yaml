    date: "2024-06"
    ref: {title: "Introducing Claude 3.5 Sonnet, with Artifacts (Anthropic, June 2024)", url: "https://www.anthropic.com/news/claude-3-5-sonnet"}
    examples: [Claude artifacts, ChatGPT Canvas, Gemini Canvas]
    resources:
      - {kind: blog, title: "Everything I built with Claude Artifacts this week", by: "Simon Willison", year: 2024, url: "https://simonwillison.net/2024/Oct/21/claude-artifacts/"}
