      - {kind: "talk", title: "Andy Zou – Top-Down Interpretability for AI Safety [Alignment Workshop]", by: "Andy Zou (FAR.AI)", year: 2024, url: "https://www.youtube.com/watch?v=ub1ivilmzSc"}
      - {kind: "paper", title: "Refusal in Language Models Is Mediated by a Single Direction", by: "Andy Arditi et al.", year: 2024, url: "https://arxiv.org/abs/2406.11717"}
      - {kind: "code", title: "repeng: A library for making RepE control vectors", by: "Theia Vogel", year: 2024, url: "https://github.com/vgel/repeng"}
    status: repaired
  - id: circuit-breakers
    name: Circuit Breakers
    aliases: [representation rerouting]
    region: safety-and-security
    desc: Training models so internal representations associated with harmful outputs are rerouted, interrupting generation.
    summary: "A training method that teaches a model to scramble its own internal representations when they start heading toward harmful output, so generation breaks down instead of completing. Because it acts on what the model is about to produce rather than on how the request was worded, it holds up against attacks it never saw in training, with little loss on normal tasks. Mostly research so far."
    parents:
      - {id: representation-engineering, rel: applies, why: "Uses representation control as a safety mechanism.", src: "Improving Alignment and Robustness with Circuit Breakers (Zou et al. 2024)"}
      - {id: jailbreaks, rel: counters, why: "Designed to resist adversarial attacks.", src: "Zou et al. 2024"}
    maturity: 1
    maturity_note: Research with limited deployment.
    date: "2024-06"
    ref: {title: "Improving Alignment and Robustness with Circuit Breakers (Zou et al.)", arxiv: "2406.04313"}
    examples: []
    resources:
      - {kind: "blog", title: "Breaking circuit breakers", by: "Confirm Labs", year: 2024, url: "https://confirmlabs.org/posts/circuit_breaking.html"}
      - {kind: "code", title: "circuit-breakers: Improving Alignment and Robustness with Circuit Breakers", by: "Gray Swan AI", year: 2024, url: "https://github.com/GraySwanAI/circuit-breakers"}
      - {kind: "paper", title: "Obfuscated Activations Bypass LLM Latent-Space Defenses", by: "Luke Bailey et al.", year: 2024, url: "https://arxiv.org/abs/2412.09565"}
