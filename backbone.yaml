  - id: data-deduplication
    name: Data Deduplication
    aliases: [near-duplicate removal, MinHash dedup]
    region: data-and-synthetic-data
    layer: detail
    desc: Removing exact and near-duplicate documents from training corpora to improve quality and reduce memorization.
    summary: "Removing exact and near-duplicate documents from a training corpus. Web crawls repeat the same text many times over, and a model trained on repeats memorizes them instead of generalizing, and wastes compute. Near-duplicates are found at scale with hashing tricks such as MinHash, which flag documents that share most of their word sequences without comparing every pair."
    parents:
      - {id: "external:minhash", rel: applies, why: "Uses locality-sensitive hashing for near-duplicate detection.", src: "Deduplicating Training Data Makes Language Models Better (Lee et al. 2021)"}
    maturity: 5
    maturity_note: Standard corpus hygiene.
    date: "2021-07"
    ref: {title: "Deduplicating Training Data Makes Language Models Better (Lee et al.)", arxiv: "2107.06499"}
    examples: [datatrove, text-dedup]
    resources:
      - {kind: blog, title: "Large-scale Near-deduplication Behind BigCode", by: "Chenghao Mou (Hugging Face)", year: 2023, url: "https://huggingface.co/blog/dedup"}
      - {kind: docs, title: "Deduplication | NeMo Curator", by: "NVIDIA", year: 2025, url: "https://docs.nvidia.com/nemo/curator/latest/curate-text/process-data/deduplication"}
      - {kind: talk, title: "Beyond Spark MLlib: Deduplicating Common Crawl at Scale", by: "Ken Obata (PyData London)", year: 2026, url: "https://www.youtube.com/watch?v=LkBvaesVeYo"}
      - {kind: paper, title: "SemDeDup: Data-efficient learning at web-scale through semantic deduplication", by: "Amro Abbas et al.", year: 2023, url: "https://arxiv.org/abs/2303.09540"}
    status: added
  - id: data-decontamination
    name: Data Decontamination
    aliases: [test-set leakage prevention]
    region: data-and-synthetic-data
    also: [evaluation-and-observability]
    desc: Removing training data that overlaps with evaluation benchmarks so scores reflect real capability.
    summary: "Removing training data that overlaps with the benchmarks or eval sets a model will be tested on, usually by matching long word sequences. If test questions leak into training, scores measure memory rather than ability. The same applies to an application team's own eval set: examples used for fine-tuning must be kept out of it."
    parents:
      - {id: "external:n-gram-overlap-detection", rel: applies, why: "Detects benchmark overlap by n-gram matching.", src: "Language Models are Few-Shot Learners (Brown et al. 2020)"}
    maturity: 4
    maturity_note: Expected in serious releases; imperfectly practiced.
    date: "2020-05"
    ref: {title: "Language Models are Few-Shot Learners, contamination analysis (Brown et al.)", arxiv: "2005.14165"}
    examples: [n-gram overlap filters]
    resources:
      - {kind: blog, title: "Catch me if you can! How to beat GPT-4 with a 13B model", by: "Shuo Yang et al. (LMSYS)", year: 2023, url: "https://www.lmsys.org/blog/2023-11-14-llm-decontaminator/"}
      - {kind: paper, title: "Benchmark Data Contamination of Large Language Models: A Survey", by: "Cheng Xu et al.", year: 2024, url: "https://arxiv.org/abs/2406.04244"}
    status: repaired
  - id: data-quality-filtering
    name: Data Quality Filtering
    aliases: [corpus curation, classifier-based filtering]
    region: data-and-synthetic-data
    layer: detail
    desc: Selecting high-value training text with heuristics and model-based quality classifiers.
    summary: "Keeping only the useful part of a raw web crawl. Simple rules drop spam, boilerplate and garbled text, and trained classifiers score what remains: early pipelines like CCNet kept text that a language model trained on Wikipedia found likely, while recent ones like FineWeb-Edu train a classifier on a model's judgments of educational value. Some pipelines iterate, adding newly found good pages to the classifier's training set and searching again, which is how DeepSeekMath mined 120 billion tokens of math from the web."
    parents:
      - {id: "external:fasttext-classifiers", rel: applies, why: "Scores documents with fast linear text classifiers and n-gram language-model perplexity.", src: "CCNet (Wenzek et al. 2019)"}
    maturity: 4
    maturity_note: Standard in pretraining pipelines.
    date: "2019-11"
    ref: {title: "CCNet: Extracting High Quality Monolingual Datasets from Web Crawl Data (Wenzek et al.)", arxiv: "1911.00359"}
    examples: [CCNet, FineWeb-Edu, DCLM, Dolma, DeepSeekMath corpus]
    resources:
      - {kind: blog, title: "FineWeb: decanting the web for the finest text data at scale", by: "Guilherme Penedo et al. (Hugging Face)", year: 2024, url: "https://huggingface.co/spaces/HuggingFaceFW/blogpost-fineweb-v1"}
      - {kind: docs, title: "Quality Assessment and Filtering | NeMo Curator", by: "NVIDIA", year: 2025, url: "https://docs.nvidia.com/nemo/curator/latest/curate-text/process-data/quality-assessment"}
      - {kind: talk, title: "Stanford CS336 Language Modeling from Scratch, Spring 2025, Lecture 14: Data 2", by: "Stanford Online", year: 2025, url: "https://www.youtube.com/watch?v=9Cd0THLS1t0"}
      - {kind: paper, title: "DataComp-LM: In search of the next generation of training sets for language models", by: "Jeffrey Li et al.", year: 2024, url: "https://arxiv.org/abs/2406.11794"}
    status: repaired
