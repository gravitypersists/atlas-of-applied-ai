      - {id: prompt-chaining, rel: extends, why: "Adds branching, cycles, and persistent state to fixed chains.", src: "LangGraph (2024)"}
      - {id: react-agent-loop, rel: replaces, why: "Replaces model-driven control flow where reliability matters.", src: "Building effective agents (Anthropic 2024)", confidence: medium}
    maturity: 4
    maturity_note: Preferred production pattern for reliable agentic applications.
    date: "2024-01"
    ref: {title: "Building effective agents (Anthropic, December 2024)", url: "https://www.anthropic.com/engineering/building-effective-agents"}
    examples: [LangGraph, Temporal, Inngest, Mastra]
    resources:
      - {kind: blog, title: "LangGraph", by: "LangChain", year: 2024, url: "https://www.langchain.com/blog/langgraph"}
      - {kind: blog, title: "How to think about agent frameworks", by: "Harrison Chase (LangChain)", year: 2025, url: "https://www.langchain.com/blog/how-to-think-about-agent-frameworks"}
      - {kind: talk, title: "How We Build Effective Agents", by: "Barry Zhang (Anthropic, AI Engineer Summit)", year: 2025, url: "https://www.youtube.com/watch?v=D7_ipDqhtwk"}
      - {kind: talk, title: "12-Factor Agents: Patterns of reliable LLM applications", by: "Dex Horthy (HumanLayer, AI Engineer World's Fair)", year: 2025, url: "https://www.youtube.com/watch?v=8kMaTybvDUw"}
