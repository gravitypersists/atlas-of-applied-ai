  - id: streaming-responses
    name: Streaming Responses
    aliases: [token streaming, server-sent events]
    region: ai-product-and-interaction-design
    also: [inference-and-serving]
    desc: Showing tokens as they are generated to cut perceived latency and let users interrupt early.
    summary: "Shows the answer token by token as the model generates it, instead of waiting for the whole reply. The total time is the same, but the first words arrive in under a second, so the wait feels much shorter and users can stop a reply that is going wrong. Every chat product does this, usually over server-sent events."
    parents:
      - {id: autoregressive-decoding, rel: applies, why: "Exposes token-by-token generation to the interface.", src: "OpenAI API streaming (2020)"}
    maturity: 5
    maturity_note: Universal pattern for text generation products.
    date: "2020"
    ref: {title: "OpenAI API streaming support"}
    examples: [Vercel AI SDK, SSE streaming APIs]
    resources:
      - {kind: docs, title: "Streaming", by: "Vercel (AI SDK)", year: 2024, url: "https://ai-sdk.dev/docs/foundations/streaming"}
      - {kind: docs, title: "Streaming messages", by: "Anthropic", year: 2024, url: "https://platform.claude.com/docs/en/build-with-claude/streaming"}
    status: repaired
  - id: copilots
    name: Copilots and Inline Assistance
    aliases: [inline completion, AI pair programming]
    region: ai-product-and-interaction-design
    desc: AI suggestions embedded directly in a user's working context, accepted or rejected with low friction.
    summary: "AI suggestions placed directly where you are already working, such as grey ghost text in a code editor that one keystroke accepts and continued typing dismisses. Because ignoring a suggestion costs nothing, the model can be wrong often and still be useful. GitHub Copilot (2021) set the pattern, and writing and office tools copied it."
    parents:
      - {id: mixed-initiative-interaction, rel: applies, why: "System takes initiative with suggestions; the user keeps control.", src: "GitHub Copilot (2021)"}
      - {id: pretrained-language-models, rel: applies, why: "Code- and text-trained models power the suggestions.", src: "Evaluating Large Language Models Trained on Code (Chen et al. 2021)"}
    maturity: 5
    maturity_note: Established pattern across editors and productivity tools.
    date: "2021-06"
    ref: {title: "Introducing GitHub Copilot: your AI pair programmer (GitHub, June 2021)", url: "https://github.blog/news-insights/product-news/introducing-github-copilot-ai-pair-programmer/"}
    examples: [GitHub Copilot, Cursor Tab, inline writing assistants]
    resources:
      - {kind: paper, title: "Evaluating Large Language Models Trained on Code", by: "Chen et al. (OpenAI)", year: 2021, url: "https://arxiv.org/abs/2107.03374"}
      - {kind: paper, title: "Productivity Assessment of Neural Code Completion", by: "Ziegler et al. (GitHub)", year: 2022, url: "https://arxiv.org/abs/2205.06537"}
      - {kind: paper, title: "Grounded Copilot: How Programmers Interact with Code-Generating Models", by: "Barke, James, Polikarpova", year: 2022, url: "https://arxiv.org/abs/2206.15000"}
