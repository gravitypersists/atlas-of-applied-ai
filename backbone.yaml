  - id: rlhf
    name: RLHF
    aliases: [reinforcement learning from human feedback, reward modeling, InstructGPT pipeline, SFT-RM-PPO]
    region: adaptation-and-post-training
    desc: Training a reward model on human preference comparisons, then optimizing the policy against it with RL.
    summary: "Humans compare pairs of model answers, a reward model learns to predict which they prefer, and reinforcement learning (usually PPO) pushes the model toward answers the reward model scores highly. InstructGPT's three stages (SFT, then a reward model, then PPO) became the standard alignment recipe. It works, but running several models at once makes it expensive and finicky."
    parents:
      - {id: policy-gradient-methods, rel: applies, why: "Optimizes a policy against a learned reward.", src: "Deep RL from Human Preferences (Christiano et al. 2017)"}
      - {id: "external:preference-learning", rel: applies, why: "Learns a reward from pairwise human comparisons.", src: "Deep RL from Human Preferences (Christiano et al. 2017)"}
    maturity: 4
    maturity_note: Established for frontier alignment; increasingly mixed with other methods.
    date: "2017-06"
    ref: {title: "Deep Reinforcement Learning from Human Preferences (Christiano et al.); applied to LLMs in InstructGPT (Ouyang et al. 2022)", arxiv: "1706.03741"}
    examples: [InstructGPT, OpenRLHF]
    resources:
      - {kind: blog, title: "Illustrating Reinforcement Learning from Human Feedback (RLHF)", by: "Hugging Face (Nathan Lambert, Louis Castricato, Leandro von Werra, Alex Havrilla)", year: 2022, url: "https://huggingface.co/blog/rlhf"}
      - {kind: blog, title: "RLHF: Reinforcement Learning from Human Feedback", by: "Chip Huyen", year: 2023, url: "https://huyenchip.com/2023/05/02/rlhf.html"}
      - {kind: talk, title: "RLHF Foundations, IFT, Reward Modeling, Rejection Sampling | Post-Training Course Lecture 2", by: "Nathan Lambert", year: 2026, url: "https://www.youtube.com/watch?v=4gIwiSPmQkU"}
      - {kind: paper, title: "Training language models to follow instructions with human feedback", by: "Ouyang et al. (OpenAI)", year: 2022, url: "https://arxiv.org/abs/2203.02155"}
    status: repaired
  - id: direct-preference-optimization
    name: Direct Preference Optimization
    aliases: [DPO, IPO, SimPO]
    region: adaptation-and-post-training
    desc: Optimizing the model directly on preference pairs with a classification-style loss, removing the separate reward model and RL loop.
    summary: "Trains directly on pairs of preferred and rejected answers with a simple classification-style loss, skipping the separate reward model and the RL loop. Cheap and stable, it became the default preference step for open models. Because it learns from a fixed dataset, it can drift toward surface traits such as longer answers; variants like IPO and SimPO adjust the loss to counter this."
    parents:
      - {id: rlhf, rel: replaces, why: "Achieves preference alignment without PPO or an explicit reward model.", src: "DPO (Rafailov et al. 2023)"}
    maturity: 4
    maturity_note: Widely used in open-model post-training.
    date: "2023-05"
    ref: {title: "Direct Preference Optimization: Your Language Model is Secretly a Reward Model (Rafailov et al.)", arxiv: "2305.18290"}
    examples: [TRL DPOTrainer]
    resources:
      - {kind: blog, title: "Preference Tuning LLMs with Direct Preference Optimization Methods", by: "Hugging Face (Kashif Rasul, Edward Beeching, Lewis Tunstall, et al.)", year: 2024, url: "https://huggingface.co/blog/pref-tuning"}
      - {kind: blog, title: "Direct Preference Optimization (DPO)", by: "Cameron R. Wolfe", year: 2025, url: "https://cameronrwolfe.substack.com/p/direct-preference-optimization"}
