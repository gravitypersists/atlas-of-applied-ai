  - id: long-context-evals
    name: Long-Context Evals
    aliases: [needle in a haystack, NIAH]
    region: evaluation-and-observability
    desc: Tests of whether models retrieve and use information placed at various depths in very long inputs.
    summary: "Tests of whether a model actually uses everything in a very long input. The classic version hides one fact (the needle) at different depths in a long document (the haystack) and asks for it back; these tests exposed the \"lost in the middle\" weakness, and harder variants like RULER now ask for multi-step reasoning over the long input rather than lookup."
    parents:
      - {id: capability-benchmarks, rel: specializes, why: "Benchmarks targeted at long-context recall and reasoning.", src: "Needle In A Haystack (Kamradt 2023)"}
    maturity: 4
    maturity_note: Cited with every long-context release; harder variants replacing NIAH.
    date: "2023-11"
    ref: {title: "Needle In A Haystack — Pressure Testing LLMs (Kamradt)", url: "https://github.com/gkamradt/LLMTest_NeedleInAHaystack"}
    examples: [NIAH, RULER]
    resources:
      - {kind: talk, title: "Needle In A Haystack (GPT-4 128K)", by: "Greg Kamradt", year: 2023, url: "https://www.youtube.com/watch?v=KwRRuiCCdmc"}
      - {kind: talk, title: "Is RAG Really Dead? Testing Multi Fact Retrieval & Reasoning in GPT4-128k", by: "LangChain", year: 2024, url: "https://www.youtube.com/watch?v=UlmyyYQGhzc"}
      - {kind: paper, title: "RULER: What's the Real Context Size of Your Long-Context Language Models?", by: "Cheng-Ping Hsieh et al.", year: 2024, url: "https://arxiv.org/abs/2404.06654"}
      - {kind: paper, title: "Lost in the Middle: How Language Models Use Long Contexts", by: "Nelson F. Liu et al.", year: 2023, url: "https://arxiv.org/abs/2307.03172"}
    status: added
  - id: agent-benchmarks
    name: Agent Benchmarks
    aliases: [SWE-bench, environment-based evals]
    region: evaluation-and-observability
    also: [agents-and-orchestration]
    desc: Evaluating agents by whether they complete tasks in real or simulated environments, judged by tests or state checks.
    summary: "Benchmarks that drop an agent into a real or simulated environment, such as a code repository, a terminal or a website, and check whether it finished the task, usually by running tests or inspecting the final state. They measure multi-step tool use rather than single answers, but they are expensive to run, sensitive to the harness, and their methodology is still argued over."
    parents:
