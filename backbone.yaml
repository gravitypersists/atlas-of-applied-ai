  - id: guardrails
    name: Guardrails and Safety Classifiers
    aliases: [input/output filters, content moderation, Llama Guard]
    region: safety-and-security
    desc: Classifiers and rule layers that check inputs and outputs for policy violations, PII, or unsafe content.
    summary: "Checks placed around the model: one screens incoming requests, another screens outgoing answers, looking for policy violations, personal data (PII) or unsafe content. Many are themselves language models prompted or fine-tuned as classifiers, such as Llama Guard. They are widely deployed, but they add latency and sometimes block legitimate requests."
    parents:
