    examples: [S-LoRA, Punica, LoRAX, vLLM multi-LoRA]
    resources:
      - {kind: blog, title: "Recipe for Serving Thousands of Concurrent LoRA Adapters", by: "Ying Sheng et al. (LMSYS)", year: 2023, url: "https://www.lmsys.org/blog/2023-11-15-slora/"}
      - {kind: blog, title: "Potentials of Multitenancy Fine-Tuned LLM Serving", by: "Lequn Chen", year: 2023, url: "https://le.qun.ch/en/blog/2023/09/11/multi-lora-potentials/"}
      - {kind: paper, title: "Punica: Multi-Tenant LoRA Serving", by: "Lequn Chen et al.", year: 2023, url: "https://arxiv.org/abs/2310.18547"}
