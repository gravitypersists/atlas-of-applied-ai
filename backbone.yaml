      - {id: progressive-disclosure, rel: applies, why: "Tool definitions are read from the file system when needed instead of loaded up front.", src: "Code execution with MCP (Anthropic 2025)"}
    maturity: 2
    maturity_note: Introduced in late 2025 by Cloudflare and Anthropic; adoption is early.
    date: "2025-09"
