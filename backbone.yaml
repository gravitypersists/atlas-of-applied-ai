    maturity: 4
    maturity_note: Established, though increasingly supplemented by synthetic data.
    date: "2023-04"
    ref: {title: "OpenAssistant Conversations — Democratizing Large Language Model Alignment (Köpf et al.)", arxiv: "2304.07327"}
    examples: [OpenAssistant, Dolly]
    resources:
