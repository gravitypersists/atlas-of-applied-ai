    maturity: 4
    maturity_note: Expected for major releases and referenced in regulation.
    date: "2018-10"
    ref: {title: "Model Cards for Model Reporting (Mitchell et al.)", arxiv: "1810.03993"}
    examples: [frontier system cards, Hugging Face model cards]
