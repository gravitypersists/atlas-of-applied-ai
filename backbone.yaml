    examples: [Vercel AI SDK, MCP UI, OpenAI Apps SDK]
    resources:
      - {kind: docs, title: "Generative User Interfaces", by: "Vercel (AI SDK)", year: 2024, url: "https://ai-sdk.dev/docs/ai-sdk-ui/generative-user-interfaces"}
      - {kind: blog, title: "Generative UI: A rich, custom, visual interactive user experience for any prompt", by: "Yaniv Leviathan et al. (Google Research)", year: 2025, url: "https://research.google/blog/generative-ui-a-rich-custom-visual-interactive-user-experience-for-any-prompt/"}
