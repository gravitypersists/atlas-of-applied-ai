    maturity: 4
    maturity_note: Adopted across major clients and providers within a year of launch.
    date: "2024-11"
    ref: {title: "Model Context Protocol specification", url: "https://modelcontextprotocol.io"}
    examples: [Claude, Cursor, VS Code, ChatGPT connectors]
    resources:
      - {kind: blog, title: "Introducing the Model Context Protocol", by: "Anthropic", year: 2024, url: "https://www.anthropic.com/news/model-context-protocol"}
