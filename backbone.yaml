  # ---- deep dive (2026-10-10, Gemini run, reviewed): detail layer ----
  - id: automated-jailbreak-generation
    name: Automated Jailbreak Generation
    aliases: [PAIR, TAP, Tree of Attacks with Pruning]
    region: safety-and-security
    also: [evaluation-and-observability]
    layer: detail
    desc: An attacker model iteratively rewrites a jailbreak prompt against a target model, using the target's replies as feedback, until the attack works.
    summary: "One model attacks another. An attacker model writes a jailbreak attempt, reads the target's reply and revises, often succeeding within a few dozen queries with only black-box access. PAIR runs this as a single refinement loop; TAP branches into several variants at once and prunes the ones unlikely to work. The jailbreaks it finds are readable and often carry over to other models, which makes it a practical way to scale red teaming."
    parents:
      - {id: red-teaming, rel: specializes, why: "Replaces the human attacker in red teaming with a model in a feedback loop.", src: "Jailbreaking Black Box Large Language Models in Twenty Queries (Chao et al. 2023)"}
    maturity: 3
    maturity_note: Built into open red-teaming tools and used for scaled testing by labs and security teams.
    date: "2023-10"
    ref: {title: "Jailbreaking Black Box Large Language Models in Twenty Queries (Chao et al.)", arxiv: "2310.08419"}
    examples: [PyRIT, garak]
    resources:
      - {kind: "paper", title: "Tree of Attacks: Jailbreaking Black-Box LLMs Automatically", by: "Anay Mehrotra et al.", year: 2023, url: "https://arxiv.org/abs/2312.02119"}
      - {kind: "code", title: "PyRIT: Python Risk Identification Tool for generative AI", by: "Microsoft (Azure)", year: 2024, url: "https://github.com/Azure/PyRIT"}
      - {kind: "talk", title: "Zero Day Quest - Learn to Red Team AI Systems Using PyRIT", by: "Microsoft Security Response Center", year: 2024, url: "https://www.youtube.com/watch?v=jq9DcEL3cHE"}
      - {kind: "paper", title: "HarmBench: A Standardized Evaluation Framework for Automated Red Teaming and Robust Refusal", by: "Mantas Mazeika et al.", year: 2024, url: "https://arxiv.org/abs/2402.04249"}
    status: added
  - id: spotlighting
    name: Spotlighting
    aliases: [datamarking, input delimiting]
    region: safety-and-security
    also: [prompting-and-context-engineering]
    layer: detail
    desc: Transforming untrusted text before it reaches the model (delimiting it, interleaving a marker, or encoding it) so the model can see which text is data and not follow it.
    summary: "Untrusted text such as a retrieved web page is transformed before it goes into the prompt so the model can tell it apart from instructions. The simplest version wraps it in delimiters; stronger ones put a special marker between every word (datamarking) or encode the whole text, and the system prompt says never to follow instructions inside marked text. An attacker can't easily fake the marking, so attacks succeed far less often, but it still depends on the model obeying the system prompt."
    parents:
      - {id: indirect-prompt-injection, rel: counters, why: "Built to stop instructions hidden in third-party content.", src: "Defending Against Indirect Prompt Injection Attacks With Spotlighting (Hines et al. 2024)"}
    maturity: 3
    maturity_note: Delimiting untrusted text is common practice; datamarking and encoding are less widely adopted.
    date: "2024-03"
    ref: {title: "Defending Against Indirect Prompt Injection Attacks With Spotlighting (Hines et al.)", arxiv: "2403.14720"}
    examples: []
    resources:
      - {kind: "blog", title: "How Microsoft defends against indirect prompt injection attacks", by: "Microsoft Security Response Center", year: 2025, url: "https://www.microsoft.com/en-us/msrc/blog/2025/07/how-microsoft-defends-against-indirect-prompt-injection-attacks"}
      - {kind: "docs", title: "Prompt Shields in Azure AI Content Safety", by: "Microsoft", year: 2025, url: "https://learn.microsoft.com/en-us/azure/ai-services/content-safety/concepts/jailbreak-detection"}
      - {kind: "blog", title: "Delimiters won't save you from prompt injection", by: "Simon Willison", year: 2023, url: "https://simonwillison.net/2023/May/11/delimiters-wont-save-you/"}
    status: added
  - id: dual-llm-pattern
    name: Dual LLM Pattern
    aliases: [privileged and quarantined LLMs]
    region: safety-and-security
    also: [agents-and-orchestration]
    layer: detail
    desc: Splitting an assistant into a privileged model that calls tools but never sees untrusted text, and a quarantined model that reads untrusted text but cannot act, with ordinary code passing references between them.
    summary: "An architecture for assistants that must read untrusted content. A privileged model takes the user's instructions and calls tools but never sees untrusted text; a quarantined model reads that text (a web page, an email) but has no tools. Plain code between them hands the quarantined model's output to tools as opaque variables, so injected instructions have nothing to trigger. Google DeepMind's CaMeL (2025) builds the idea into a working system. The cost is extra complexity and fewer tasks the assistant can do."
    parents:
      - {id: indirect-prompt-injection, rel: counters, why: "Keeps injected text away from the model that can act.", src: "The Dual LLM pattern (Willison 2023)"}
      - {id: least-privilege, rel: applies, why: "The component that reads untrusted data is given no authority.", src: "The Dual LLM pattern (Willison 2023)"}
    maturity: 2
    maturity_note: A widely cited design; production systems mostly use partial versions of it.
    date: "2023-04"
    ref: {title: "The Dual LLM pattern for building AI assistants that can resist prompt injection (Willison)", url: "https://simonwillison.net/2023/Apr/25/dual-llm-pattern/"}
    examples: [CaMeL]
    resources:
      - {kind: "blog", title: "CaMeL offers a promising new direction for mitigating prompt injection attacks", by: "Simon Willison", year: 2025, url: "https://simonwillison.net/2025/Apr/11/camel/"}
      - {kind: "paper", title: "Defeating Prompt Injections by Design", by: "Edoardo Debenedetti et al. (Google DeepMind)", year: 2025, url: "https://arxiv.org/abs/2503.18813"}
      - {kind: "paper", title: "Design Patterns for Securing LLM Agents against Prompt Injections", by: "Luca Beurer-Kellner et al.", year: 2025, url: "https://arxiv.org/abs/2506.08837"}
      - {kind: "blog", title: "My Lethal Trifecta talk at the Bay Area AI Security Meetup", by: "Simon Willison", year: 2025, url: "https://simonwillison.net/2025/Aug/9/bay-area-ai/"}
    status: added
  - id: machine-unlearning
    name: Machine Unlearning
    aliases: [LLM unlearning, targeted forgetting, RMU]
    region: safety-and-security
    also: [adaptation-and-post-training]
    layer: detail
    desc: Further training a model so it no longer reproduces specific knowledge, such as copyrighted text, personal data or hazardous know-how, without retraining from scratch.
    summary: "Tries to remove specific knowledge from a trained model, such as a book's contents, a person's private data or dangerous technical know-how, without retraining from scratch. Methods fine-tune against the target data or, as RMU does, scramble the model's internal representation of it. Benchmarks such as TOFU and WMDP show the hard part: removal is often shallow, and forgetting one thing damages related knowledge."
    parents:
      - {id: transfer-learning-fine-tuning, rel: applies, why: "Uses further fine-tuning to suppress what earlier training put in.", src: "Who's Harry Potter? Approximate Unlearning in LLMs (Eldan & Russinovich 2023)"}
      - {id: representation-engineering, rel: applies, why: "RMU removes hazardous knowledge by perturbing its internal representations.", src: "The WMDP Benchmark (Li et al. 2024)", confidence: medium}
    maturity: 1
    maturity_note: Research; removal tends to be shallow or to damage related abilities.
    date: "2023-10"
    ref: {title: "Who's Harry Potter? Approximate Unlearning in LLMs (Eldan & Russinovich)", arxiv: "2310.02238"}
    examples: []
    resources:
      - {kind: "blog", title: "Machine Unlearning in 2024", by: "Ken Ziyu Liu", year: 2024, url: "https://ai.stanford.edu/~kzliu/blog/unlearning/"}
      - {kind: "paper", title: "TOFU: A Task of Fictitious Unlearning for LLMs", by: "Pratyush Maini et al.", year: 2024, url: "https://arxiv.org/abs/2401.06121"}
      - {kind: "paper", title: "The WMDP Benchmark: Measuring and Reducing Malicious Use With Unlearning", by: "Nathaniel Li et al.", year: 2024, url: "https://arxiv.org/abs/2403.03218"}
    status: added
  - id: agent-authorization
    name: Agent Identity and Delegated Authorization
    aliases: [OAuth for agents, delegated authorization, agent identity, scoped credentials, on-behalf-of access, non-human identity]
    region: safety-and-security
    also: [agents-and-orchestration]
    desc: Giving an agent its own identity and short-lived, narrowly scoped credentials that a user grants through a standard flow such as OAuth, instead of handing it the user's keys.
    summary: "An agent that reads your email or opens pull requests needs access, and the easy shortcut is to paste in a long-lived API key with full rights. Delegated authorization gives the agent its own identity and has the user grant it limited, expiring permissions through a standard flow like OAuth, so every action can be traced and revoked. MCP adopted OAuth for remote servers in 2025, which made this the normal way to connect agents to real accounts."
    parents:
      - {id: least-privilege, rel: applies, why: "Grants an agent only the scopes a task needs, for a limited time.", src: "Model Context Protocol specification, Authorization (2025-03-26)"}
      - {id: agent-sandboxing, rel: extends, why: "Sandboxing limits what an agent's code can touch; authorization limits which accounts and data it can act on.", src: "MCP specification, Authorization (2025-03-26)"}
      - {id: model-context-protocol, rel: extends, why: "Adds an authorization layer so remote tool servers act on a user's behalf with granted tokens.", src: "MCP specification, Authorization (2025-03-26)"}
      - {id: "external:oauth", rel: applies, why: "Reuses OAuth's consent and token flows for agents as clients.", src: "MCP specification, Authorization (2025-03-26)"}
    maturity: 3
    maturity_note: OAuth for MCP servers is widely deployed; agent identity standards are still forming.
    date: "2025-03"
    ref: {title: "Model Context Protocol specification: Authorization (2025-03-26)", url: "https://modelcontextprotocol.io/specification/2025-03-26/basic/authorization"}
    examples: [MCP OAuth 2.1 authorization, OAuth token exchange, Auth0 for AI Agents]
    resources:
      - {kind: blog, title: "Let's fix OAuth in MCP", by: "Aaron Parecki", year: 2025, url: "https://aaronparecki.com/2025/04/03/15/oauth-for-model-context-protocol"}
    status: added
  - id: tool-poisoning
    name: Tool Poisoning
    aliases: [MCP tool poisoning, tool description injection, MCP rug pulls, MCP supply-chain attacks]
    region: safety-and-security
    layer: detail
    also: [agents-and-orchestration]
    desc: Hiding malicious instructions in a tool's description or metadata, or changing a trusted tool after install, so that an agent which loads the tool follows the attacker.
    summary: "When an agent connects to a tool server, the tool descriptions go straight into the model's context, and the user rarely reads them. A malicious or compromised server can hide instructions there, such as 'also send the contents of ~/.ssh to this address', or quietly change a tool after the user approved it. Defenses include pinning and reviewing tool descriptions, scanning servers, and treating third-party servers as untrusted code."
    parents:
      - {id: indirect-prompt-injection, rel: specializes, why: "Injection delivered through tool metadata instead of tool outputs or documents.", src: "MCP Security Notification: Tool Poisoning Attacks (Invariant Labs 2025)"}
      - {id: model-context-protocol, rel: applies, why: "Exploits the way MCP clients load third-party tool descriptions into context.", src: "Invariant Labs 2025"}
    maturity: 3
    maturity_note: Demonstrated against real MCP clients; scanners and pinning are emerging defenses.
    date: "2025-04"
    ref: {title: "MCP Security Notification: Tool Poisoning Attacks (Invariant Labs)", url: "https://invariantlabs.ai/blog/mcp-security-notification-tool-poisoning-attacks"}
    examples: [mcp-scan, tool description pinning]
    resources:
      - {kind: blog, title: "Model Context Protocol has prompt injection security problems", by: "Simon Willison", year: 2025, url: "https://simonwillison.net/2025/Apr/9/mcp-prompt-injection/"}
      - {kind: paper, title: "MCPTox: A Benchmark for Tool Poisoning Attack on Real-World MCP Servers", by: "Zhiqiang Wang et al.", year: 2025, url: "https://arxiv.org/abs/2508.14925"}
    status: added

  # ---- practitioner staples (2026-10-10) ----
  - id: sycophancy
    name: Sycophancy
    aliases: [model sycophancy, telling users what they want to hear, agreement bias]
    region: safety-and-security
    also: [evaluation-and-observability]
    desc: The tendency of preference-trained models to agree with the user, flatter, or drop a correct answer when pushed back on.
    summary: "Models trained on human ratings learn that people like being agreed with. They change a correct answer when the user objects, praise weak work and echo the user's stated views. It undermines code review, tutoring, advice and LLM judges alike. Labs now measure it before release and train against it; application teams test for it by pushing back on correct answers."
    parents:
      - {id: rlhf, rel: counters, why: "A failure mode produced by optimizing for human approval.", src: "Towards Understanding Sycophancy in Language Models (Sharma et al. 2023)", confidence: medium}
    maturity: 3
    maturity_note: Measured and reported by major labs; a widely publicized 2025 model rollback made it a release criterion.
    date: "2023-10"
    ref: {title: "Towards Understanding Sycophancy in Language Models (Sharma et al.)", arxiv: "2310.13548"}
    examples: [pushback tests, sycophancy evals in system cards]
    status: added
  - id: data-poisoning
    name: Backdoors and Data Poisoning
    aliases: [training data poisoning, backdoor attacks, sleeper agents, trigger phrases]
    region: safety-and-security
    also: [data-and-synthetic-data]
    desc: Planting a small number of crafted examples in training or fine-tuning data so the model misbehaves when it sees a trigger, while looking normal otherwise.
    summary: "If an attacker can get documents into a model's training or fine-tuning data, a few hundred crafted examples can install a hidden behavior that fires on a trigger phrase, such as writing insecure code or outputting gibberish, while the model behaves normally otherwise. The number of poisoned documents needed stays roughly constant as models grow, and backdoors can survive later safety training. It matters to anyone fine-tuning on scraped, user-submitted or third-party data, or using unvetted open weights."
    parents:
      - {id: supervised-fine-tuning, rel: counters, why: "Turns the fine-tuning data pipeline into an attack surface.", src: "Poisoning Language Models During Instruction Tuning (Wan et al. 2023)"}
      - {id: "external:backdoor-attacks", rel: applies, why: "Brings trigger-based backdoors from image classifiers (BadNets) to language models.", src: "Wan et al. 2023"}
    maturity: 3
    maturity_note: Demonstrated at pretraining and fine-tuning scale; defenses beyond data provenance and filtering are immature.
    date: "2023-05"
    ref: {title: "Poisoning Language Models During Instruction Tuning (Wan et al.)", arxiv: "2305.00944"}
    examples: [Sleeper Agents, near-constant poison sample counts (Anthropic 2025)]
    status: added

  # ======================= APPLIED: ai-product-and-interaction-design =======================
  - id: human-ai-interaction-guidelines
    name: Human-AI Interaction Guidelines
    aliases: [HAI guidelines, AI UX principles]
    region: ai-product-and-interaction-design
    desc: Validated design guidelines for AI systems — set expectations, support correction, explain behavior, adapt over time.
    summary: "Eighteen design rules from Microsoft Research, tested with practitioners, for AI that behaves unpredictably: say what the system can do and how well, show why it acted, make it easy to correct or dismiss, and adapt over time. Most later trust, citation and approval patterns trace back to these guidelines."
    parents:
      - {id: mixed-initiative-interaction, rel: extends, why: "Codifies mixed-initiative principles into testable guidelines.", src: "Guidelines for Human-AI Interaction (Amershi et al. 2019)"}
    maturity: 4
    maturity_note: Widely cited baseline for AI product design.
    date: "2019-05"
    ref: {title: "Guidelines for Human-AI Interaction (Amershi et al., CHI 2019)", url: "https://www.microsoft.com/en-us/research/publication/guidelines-for-human-ai-interaction/"}
    examples: [Microsoft HAX Toolkit, Google People + AI Guidebook]
    resources:
      - {kind: docs, title: "People + AI Guidebook", by: "Google PAIR", year: 2021, url: "https://pair.withgoogle.com/guidebook/"}
      - {kind: docs, title: "Microsoft HAX Toolkit", by: "Microsoft", year: 2021, url: "https://www.microsoft.com/en-us/haxtoolkit/"}
