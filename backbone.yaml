  - id: progressive-disclosure
    name: Progressive Disclosure
    aliases: [just-in-time context, lazy-loaded context]
    region: prompting-and-context-engineering
    also: [agents-and-orchestration]
    layer: detail
    desc: Giving an agent lightweight identifiers (file paths, search tools, short skill descriptions) instead of full content, so it loads detail only when a step needs it.
    summary: Instead of loading everything an agent might need up front, give it lightweight pointers and let it pull in details only when it needs them. This keeps the context small and focused over long tasks.
    parents:
      - {id: context-engineering, rel: specializes, why: "A strategy for deferring context until execution time.", src: "Effective context engineering for AI agents (Anthropic 2025)"}
    maturity: 3
    maturity_note: Standard in coding agents; patterns are still settling.
    date: "2025-09"
    ref: {title: "Effective context engineering for AI agents (Anthropic)", url: "https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents"}
    examples: [Claude Code file exploration, agent skills, lazy-loaded tool schemas]
    resources:
