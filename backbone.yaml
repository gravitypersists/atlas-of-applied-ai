  - id: microscaling-formats
    name: Microscaling Formats
    aliases: [MXFP4, NVFP4, FP4, block-scaled quantization]
    region: inference-and-serving
    layer: detail
    desc: Low-precision number formats in which small blocks of values share one scale factor, computed on natively by recent accelerators.
    summary: "At very low precision, such as 4-bit floating point, one scale factor for a whole tensor loses too much range. Microscaling formats give each small block of values (16 or 32 numbers) its own shared scale, so an outlier in one block doesn't wreck precision elsewhere. Recent accelerators, starting with NVIDIA's Blackwell GPUs, compute on these formats directly, which makes 4-bit models fast as well as small; OpenAI's gpt-oss models shipped with MXFP4 weights."
    parents:
      - {id: weight-quantization, rel: specializes, why: "Block-scaled floating-point formats for quantized weights and activations.", src: "Microscaling Data Formats for Deep Learning (Rouhani et al. 2023)"}
    maturity: 3
    maturity_note: Native on Blackwell GPUs and used for released open weights; tooling and recipes still settling.
    date: "2023-10"
    ref: {title: "Microscaling Data Formats for Deep Learning (Rouhani et al.)", arxiv: "2310.10537"}
    examples: [MXFP4, NVFP4, TensorRT Model Optimizer]
    resources:
      - {kind: blog, title: "Introducing NVFP4 for Efficient and Accurate Low-Precision Inference", by: "NVIDIA", year: 2025, url: "https://developer.nvidia.com/blog/introducing-nvfp4-for-efficient-and-accurate-low-precision-inference/"}
      - {kind: talk, title: "mxfp8, mxfp4, nvfp4 formats and applications in PyTorch", by: "Vasily Kuznetsov & Driss Guessous, Meta (PyTorch Conference)", year: 2025, url: "https://www.youtube.com/watch?v=Up0EfrudTSQ"}
      - {kind: blog, title: "Tricks from OpenAI gpt-oss YOU 🫵 can use with transformers", by: "Hugging Face", year: 2025, url: "https://huggingface.co/blog/faster-transformers"}
    status: added

  # ---- practitioner staples (2026-10-10) ----
  - id: semantic-caching
    name: Semantic Caching
    aliases: [response caching, GPTCache, embedding-based caching]
    region: inference-and-serving
    desc: Returning a stored answer when a new request is close enough in meaning to an earlier one, matched by embedding similarity, skipping the model call.
    summary: "Many users ask the same thing in different words. A semantic cache embeds each incoming request, looks for a previous request whose vector is close enough, and returns the stored answer instead of calling the model. It cuts cost and latency for repetitive traffic such as support questions, but the similarity threshold is a real risk: set it loose and users get answers to a question they didn't ask. Unlike prompt caching, it skips the model entirely."
    parents:
      - {id: text-embeddings, rel: applies, why: "Uses embeddings to decide that two differently worded requests mean the same thing.", src: "GPTCache (Bang 2023)"}
      - {id: approximate-nearest-neighbor-search, rel: applies, why: "Looks up the nearest earlier request in a vector index.", src: "GPTCache (Bang 2023)"}
      - {id: "external:web-caching", rel: extends, why: "Exact-match response caching, loosened from identical keys to similar meanings.", src: "GPTCache (Bang 2023)", confidence: medium}
    maturity: 3
    maturity_note: Offered by gateways and vector databases; correctness of loose matches limits it to repetitive, low-stakes traffic.
    date: "2023-03"
    ref: {title: "GPTCache: An Open-Source Semantic Cache for LLM Applications (Zilliz)", url: "https://github.com/zilliztech/GPTCache"}
    examples: [GPTCache, Redis semantic cache, LiteLLM caching, Portkey]
    status: added
  - id: llm-gateways
    name: LLM Gateways
    aliases: [AI gateway, LLM proxy, model fallback, rate limiting, cost budgets, LiteLLM]
    region: inference-and-serving
    also: [software-engineering]
    desc: A proxy between applications and model providers that gives one API over many models and adds fallback, retries, rate limits, spend budgets, keys and logging.
    summary: "Instead of each application calling each provider directly, every call goes through one proxy. The gateway speaks a single API for many models, retries or falls back to another provider when one fails or is rate-limited, enforces per-team keys, rate limits and spend budgets, and logs every request for cost tracking. It is the API-gateway pattern from web services applied to models, and the natural place to put routing, caching and guardrails."
    parents:
      - {id: model-routing, rel: extends, why: "Wraps per-request model choice in fallback, retries and policy.", src: "LiteLLM (BerriAI 2023)"}
      - {id: "external:api-gateways", rel: applies, why: "Applies the API-gateway pattern (auth, quotas, retries, logging) to model providers.", src: "LiteLLM (BerriAI 2023)", confidence: medium}
    maturity: 4
    maturity_note: Standard in companies using several providers; open-source and managed options are mature.
    date: "2023-07"
    ref: {title: "LiteLLM: call 100+ LLM APIs in one format, with fallbacks, budgets and logging (BerriAI)", url: "https://github.com/BerriAI/litellm"}
    examples: [LiteLLM, OpenRouter, Portkey, Cloudflare AI Gateway, Kong AI Gateway]
    status: added
  - id: context-window-extension
    name: Context Window Extension
    aliases: [RoPE scaling, position interpolation, YaRN, NTK-aware scaling, long-context extension]
    region: inference-and-serving
    also: [deep-learning-nlp, adaptation-and-post-training]
    desc: Stretching a model's usable context beyond its training length by rescaling its rotary position frequencies, usually with a short fine-tune on long documents.
    summary: "A model trained on 4,000-token documents breaks down on longer inputs because it has never seen those positions. Rescaling the rotary position angles squeezes long inputs into the range the model knows, and a short fine-tune on long documents repairs the rest. Methods such as position interpolation and YaRN are how most open models reach 128K tokens, and engineers meet them as the rope_scaling setting in model configs and serving engines."
    parents:
      - {id: rotary-position-embeddings, rel: extends, why: "Rescales RoPE's rotation frequencies to cover positions beyond the training length.", src: "Extending Context Window of Large Language Models via Positional Interpolation (Chen et al. 2023)"}
      - {id: transfer-learning-fine-tuning, rel: applies, why: "Repairs the rescaled model with a short fine-tune on long sequences.", src: "YaRN (Peng et al. 2023)"}
    maturity: 4
    maturity_note: Used to build the long-context versions of Llama, Qwen and DeepSeek; exposed as a serving-time config option.
    date: "2023-06"
    ref: {title: "Extending Context Window of Large Language Models via Positional Interpolation (Chen et al.)", arxiv: "2306.15595"}
    examples: [position interpolation, YaRN, NTK-aware scaling, LongRoPE, rope_scaling in vLLM]
    status: added
  - id: model-parallelism
    name: Tensor, Pipeline and Expert Parallelism
    aliases: [model parallelism, tensor parallelism, pipeline parallelism, expert parallelism, TP, PP, EP, Megatron]
    region: inference-and-serving
    also: [deep-learning-nlp]
    desc: Splitting one model across many GPUs, by slicing each layer's matrices (tensor), assigning layers to stages (pipeline), or placing MoE experts on different devices (expert).
    summary: "A large model doesn't fit on one GPU, so it is split. Tensor parallelism cuts each layer's weight matrices across GPUs that work in lockstep and needs fast links, so it stays within one server. Pipeline parallelism gives each GPU a block of layers and passes activations along, which works across servers. Expert parallelism puts different mixture-of-experts experts on different GPUs. Choosing the mix is the first decision when deploying a large model, and serving engines expose it as flags."
    parents:
      - {id: transformer-architecture, rel: applies, why: "Partitions the transformer's attention and MLP matrices across devices.", src: "Megatron-LM (Shoeybi et al. 2019)"}
      - {id: mixture-of-experts, rel: applies, why: "Expert parallelism shards MoE experts across devices.", src: "GShard (Lepikhin et al. 2020)"}
    maturity: 4
    maturity_note: Assumed by every multi-GPU serving engine; the right mix for MoE models is still tuned case by case.
    date: "2019-09"
    ref: {title: "Megatron-LM: Training Multi-Billion Parameter Language Models Using Model Parallelism (Shoeybi et al.)", arxiv: "1909.08053"}
    examples: [Megatron-LM, vLLM --tensor-parallel-size, DeepSpeed, SGLang expert parallelism]
