  - id: online-evaluation
    name: Online Evaluation and Monitoring
    aliases: [production evals, drift monitoring]
    region: evaluation-and-observability
    desc: Scoring live traffic with automated graders and user signals to catch regressions and drift after deployment.
    summary: "Scoring live production traffic after deployment, using judges or heuristics on sampled traces plus user signals like thumbs-down or retries, to catch quality regressions and drift. It closes the loop with offline evals: failures found in production become new test cases. Running judges on high-volume traffic is costly, so teams sample and use small models."
    parents:
      - {id: llm-tracing, rel: extends, why: "Runs evaluators over captured production traces.", src: "Industry practice (2024)"}
      - {id: llm-as-a-judge, rel: applies, why: "Uses model graders on sampled traffic.", src: "Industry practice (2024)"}
    maturity: 3
    maturity_note: Growing practice; methods and tooling still forming.
    date: "2024"
    ref: {title: "Evaluate Production Traffic (Langfuse)", url: "https://langfuse.com/docs/evaluation/get-started/online"}
    examples: [Langfuse, Arize, Braintrust online scoring]
    resources:
      - {kind: docs, title: "Run online evals on traces - Arize AX Docs", by: "Arize", year: 2025, url: "https://arize.com/docs/ax/evaluate/run-evals-on-traces"}
