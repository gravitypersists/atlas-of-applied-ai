      - {kind: paper, title: "XGrammar: Flexible and Efficient Structured Generation Engine for Large Language Models", by: "Yixin Dong et al.", year: 2024, url: "https://arxiv.org/abs/2411.15100"}
    status: added
  - id: model-routing
    name: Model Routing and Cascades
    aliases: [LLM routing, FrugalGPT, model cascades]
    region: inference-and-serving
    also: [agents-and-orchestration]
    desc: Sending each request to the cheapest model likely to handle it well, or escalating through a cascade of models.
    summary: "Sends each request to the cheapest model likely to answer it well, using a trained router or simple rules, or tries a cheap model first and escalates to a stronger one when the answer looks unreliable (a cascade). Most traffic is easy, so this can cut cost substantially with little loss in quality. The hard parts are predicting difficulty before answering and keeping the router calibrated as models change."
    parents:
