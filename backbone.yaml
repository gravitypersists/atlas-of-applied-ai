    maturity: 4
    maturity_note: Default open-source adaptation method.
    date: "2021-06"
    ref: {title: "LoRA: Low-Rank Adaptation of Large Language Models (Hu et al.)", arxiv: "2106.09685"}
    examples: [QLoRA, Unsloth, hosted fine-tuning APIs]
