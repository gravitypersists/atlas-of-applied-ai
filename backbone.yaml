      - {kind: paper, title: "Evaluating Verifiability in Generative Search Engines", by: "Liu, Zhang, Liang (Stanford)", year: 2023, url: "https://arxiv.org/abs/2304.09848"}
      - {kind: docs, title: "Citations", by: "Anthropic", year: 2025, url: "https://platform.claude.com/docs/en/build-with-claude/citations"}
    status: repaired
  - id: human-in-the-loop-approval
    name: Human-in-the-Loop Approval
    aliases: [HITL, tool confirmation, permission prompts, interrupts, agent breakpoints]
    region: ai-product-and-interaction-design
    also: [agents-and-orchestration]
    desc: Agents pause before consequential actions and ask the user to approve, edit, or reject them.
    summary: "Before an agent does something consequential, such as sending an email, running a command or spending money, it pauses and asks the user to approve, edit or reject the action. Frameworks implement this as an interrupt that saves the agent's state and resumes it after the answer, even days later. The design question is which actions need a gate: too many prompts and users approve without reading."
    parents:
      - {id: mixed-initiative-interaction, rel: applies, why: "Keeps the human as decision-maker at key points.", src: "Principles of Mixed-Initiative User Interfaces (1999)"}
      - {id: function-calling, rel: applies, why: "Approval gates tool calls before execution.", src: "Industry practice (2023)"}
    maturity: 4
    maturity_note: Essential for agents taking real actions.
    date: "2023"
    ref: {title: "LangGraph interrupts documentation (LangChain)", url: "https://docs.langchain.com/oss/python/langgraph/interrupts"}
    examples: [LangGraph interrupts, Claude Code permission prompts]
    resources:
      - {kind: docs, title: "Human-in-the-loop", by: "OpenAI (Agents SDK)", year: 2025, url: "https://openai.github.io/openai-agents-python/human_in_the_loop/"}
      - {kind: docs, title: "Configure permissions", by: "Anthropic (Claude Code)", year: 2025, url: "https://code.claude.com/docs/en/permissions"}
      - {kind: talk, title: "Ambient Agents and the New Agent Inbox ft. Harrison Chase", by: "Harrison Chase (LangChain), Sequoia Capital", year: 2025, url: "https://www.youtube.com/watch?v=egSh4TxS5go"}
