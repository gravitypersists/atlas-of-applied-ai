    status: added
  - id: chat-interfaces
    name: Chat Interfaces
    aliases: [conversational UI, chat assistants]
    region: ai-product-and-interaction-design
    desc: Turn-based conversational interfaces to general-purpose models, the dominant surface for AI products.
    summary: "The turn-based message thread most people meet AI through: you type, the model replies, and the history is the context. It became the default product surface with ChatGPT in 2022. It works well for questions and quick tasks, but long or evolving outputs get lost in the scroll, which is why canvases and generative UI grew out of it."
    parents:
      - {id: conversational-agents, rel: extends, why: "Revives dialogue interfaces with general-purpose models.", src: "Introducing ChatGPT (OpenAI 2022)"}
      - {id: rlhf, rel: applies, why: "Made practical by RLHF-tuned conversational models.", src: "Introducing ChatGPT (OpenAI 2022)"}
    maturity: 5
    maturity_note: The default AI product surface.
    date: "2022-11"
    ref: {title: "Introducing ChatGPT (OpenAI, November 2022)"}
    examples: [ChatGPT, Claude, Gemini]
    resources:
      - {kind: blog, title: "Why Chatbots Are Not the Future of Interfaces", by: "Amelia Wattenberger", year: 2023, url: "https://wattenberger.com/thoughts/boo-chatbots/"}
      - {kind: blog, title: "AI: First New UI Paradigm in 60 Years", by: "Jakob Nielsen (Nielsen Norman Group)", year: 2023, url: "https://www.nngroup.com/articles/ai-paradigm/"}
      - {kind: talk, title: "Generative Interfaces Beyond Chat", by: "Linus Lee (LLMs in Production Conference)", year: 2023, url: "https://www.youtube.com/watch?v=rd-J3hmycQs"}
      - {kind: blog, title: "Language Model Sketchbook, or Why I Hate Chatbots", by: "Maggie Appleton", year: 2023, url: "https://maggieappleton.com/lm-sketchbook"}
