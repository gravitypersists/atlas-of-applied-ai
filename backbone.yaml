  # ---- deep dive (2026-10-09, Gemini run, reviewed): detail layer unless noted ----
  - id: parent-document-retrieval
    name: Parent-Document Retrieval
    aliases: [small-to-big retrieval, ParentDocumentRetriever, sentence-window retrieval, auto-merging retrieval]
    region: retrieval-and-knowledge
    desc: Indexing small chunks for precise matching but handing the model the larger parent section each match came from.
    summary: "Search small, return big. Documents are split twice: small chunks are embedded and searched because they match precisely, and when one matches, the system returns the larger section it came from so the model has enough context to answer. It separates the unit you search from the unit you read, and is one of the most common upgrades to a basic RAG pipeline."
    parents:
      - {id: chunking-strategies, rel: extends, why: "Decouples the unit of retrieval from the unit passed to generation.", src: "LangChain ParentDocumentRetriever (2023)"}
    maturity: 3
    maturity_note: Built into the major RAG frameworks and widely used; the right chunk and parent sizes are still tuned per corpus.
    date: "2023-08"
    ref: {title: "parent document retriever (LangChain pull request #8941)", url: "https://github.com/langchain-ai/langchain/pull/8941"}
    examples: [LangChain ParentDocumentRetriever, LlamaIndex auto-merging retriever, LlamaIndex sentence-window retrieval]
    resources:
      - {kind: docs, title: "Auto Merging Retriever", by: "LlamaIndex", year: 2024, url: "https://developers.llamaindex.ai/python/framework/integrations/retrievers/auto_merging_retriever/"}
      - {kind: tutorial, title: "Advanced RAG 02 - Parent Document Retriever", by: "Sam Witteveen (YouTube)", year: 2023, url: "https://www.youtube.com/watch?v=wQEl0GGxPcM"}
      - {kind: tutorial, title: "Building and Evaluating Advanced RAG", by: "Jerry Liu, Anupam Datta (DeepLearning.AI)", year: 2023, url: "https://www.deeplearning.ai/courses/building-evaluating-advanced-rag"}
      - {kind: paper, title: "RAPTOR: Recursive Abstractive Processing for Tree-Organized Retrieval", by: "Parth Sarthi et al.", year: 2024, url: "https://arxiv.org/abs/2401.18059"}
    status: added
  - id: late-interaction
    name: Late Interaction
    aliases: [ColBERT, multi-vector retrieval, MaxSim]
    region: retrieval-and-knowledge
    desc: Encoding queries and documents into one vector per token and scoring by summing each query token's best match (MaxSim), approaching cross-encoder accuracy at near bi-encoder speed.
    summary: "Ordinary vector search squeezes a whole passage into one vector, which blurs detail. Late interaction keeps one vector per token, and scores a passage by finding, for each word of the question, its best-matching word in the passage and adding those scores up. It comes close to a reranker's accuracy while still searching a precomputed index; the cost is a much larger index, which compression (ColBERTv2, PLAID) has cut down."
    parents:
      - {id: dense-retrieval, rel: extends, why: "Keeps a vector per token instead of pooling each passage into one.", src: "ColBERT (Khattab & Zaharia 2020)"}
      - {id: cross-encoder-reranking, rel: extends, why: "Delays query-document interaction until after independent encoding, keeping much of a cross-encoder's precision while documents can be pre-indexed.", src: "ColBERT (Khattab & Zaharia 2020)"}
    maturity: 3
    maturity_note: Supported natively by Vespa, Qdrant and others and used in production, but single-vector search remains the default; index size is the main cost.
    date: "2020-04"
    ref: {title: "ColBERT: Efficient and Effective Passage Search via Contextualized Late Interaction over BERT (Khattab & Zaharia)", arxiv: "2004.12832"}
    examples: [ColBERTv2, RAGatouille, Jina-ColBERT, Vespa, Qdrant multivectors]
    resources:
      - {kind: blog, title: "What is ColBERT and Late Interaction and Why They Matter in Search?", by: "Han Xiao (Jina AI)", year: 2024, url: "https://jina.ai/news/what-is-colbert-and-late-interaction-and-why-they-matter-in-search/"}
      - {kind: blog, title: "Announcing the Vespa ColBERT embedder", by: "Jo Kristian Bergum (Vespa)", year: 2024, url: "https://blog.vespa.ai/announcing-colbert-embedder-in-vespa/"}
      - {kind: talk, title: "Programming Foundation Models with DSPy / Multivector Semantic Search with ColBERT - Omar Khattab", by: "Omar Khattab (Cohere)", year: 2024, url: "https://www.youtube.com/watch?v=Y94tw4eDHW0"}
      - {kind: paper, title: "ColBERTv2: Effective and Efficient Retrieval via Lightweight Late Interaction", by: "Keshav Santhanam, Omar Khattab et al.", year: 2021, url: "https://arxiv.org/abs/2112.01488"}
    status: added
  - id: learned-sparse-retrieval
    name: Learned Sparse Retrieval
    aliases: [SPLADE, neural sparse retrieval]
    region: retrieval-and-knowledge
    layer: detail
    desc: Using a transformer to produce sparse term-weight vectors over the vocabulary, learning term importance and adding related terms, so retrieval still runs on an inverted index.
    summary: "Keyword search with learned weights. A transformer reads a passage and outputs a weight for each vocabulary word, including related words that never appear in the text, so a passage about \"cars\" can match \"automobile\". The output is still a sparse list of terms, so it runs on the same inverted indexes as BM25, and it is often the sparse half of a hybrid search setup."
    parents:
      - {id: bm25, rel: extends, why: "Replaces hand-set term weights with learned weights and expansion terms while keeping the inverted index.", src: "SPLADE (Formal et al. 2021)"}
      - {id: pretrained-language-models, rel: applies, why: "Uses a pretrained masked-language-model head to score vocabulary terms.", src: "SPLADE (Formal et al. 2021)"}
      - {id: dense-retrieval, rel: applies, why: "Trains with the dense retrievers' contrastive first-stage recipe but outputs sparse vocabulary weights.", src: "SPLADE v2 (Formal et al. 2021)", confidence: medium}
    maturity: 3
    maturity_note: Shipped in search engines (Elastic ELSER, OpenSearch neural sparse) and embedding models with sparse outputs; less common than dense vectors.
    date: "2021-07"
    ref: {title: "SPLADE: Sparse Lexical and Expansion Model for First Stage Ranking (Formal et al.)", arxiv: "2107.05720"}
    examples: [SPLADE, Elastic ELSER, OpenSearch neural sparse search, BGE-M3 sparse]
    resources:
      - {kind: blog, title: "SPLADE for Sparse Vector Search Explained", by: "James Briggs (Pinecone)", year: 2023, url: "https://www.pinecone.io/learn/splade/"}
      - {kind: docs, title: "ELSER | Elastic Docs", by: "Elastic", year: 2024, url: "https://www.elastic.co/docs/explore-analyze/machine-learning/nlp/ml-nlp-elser"}
      - {kind: paper, title: "SPLADE v2: Sparse Lexical and Expansion Model for Information Retrieval", by: "Thibault Formal et al.", year: 2021, url: "https://arxiv.org/abs/2109.10086"}
    status: added
  - id: propositional-chunking
    name: Propositional Chunking
    aliases: [Dense X Retrieval, proposition indexing]
    region: retrieval-and-knowledge
    layer: detail
    desc: Using a model to rewrite documents into short, self-contained factual statements (propositions) and indexing those instead of fixed-size passages.
    summary: "A model rewrites each document into a list of standalone facts (\"Acme's Q3 revenue grew 15%\"), and those facts are what gets indexed. Each one is short and names what it is about, so searches for specific facts match more precisely. Indexing needs a model call per passage, and it suits fact-dense text better than narrative."
    parents:
      - {id: chunking-strategies, rel: specializes, why: "Chooses chunk boundaries by meaning (one fact per unit) rather than by length.", src: "Dense X Retrieval (Chen et al. 2023)"}
    maturity: 2
    maturity_note: Clear gains on factoid retrieval in the paper; indexing cost and weak fit for narrative text limit adoption.
    date: "2023-12"
    ref: {title: "Dense X Retrieval: What Retrieval Granularity Should We Use? (Chen et al.)", arxiv: "2312.06648"}
    examples: [LangChain propositional-retrieval template, LlamaIndex DenseXRetrievalPack]
    resources:
      - {kind: talk, title: "The 5 Levels Of Text Splitting For Retrieval", by: "Greg Kamradt (YouTube)", year: 2024, url: "https://www.youtube.com/watch?v=8OJC21T2SL4"}
      - {kind: code, title: "langchain/templates/propositional-retrieval", by: "LangChain", year: 2023, url: "https://github.com/langchain-ai/langchain/tree/v0.1.0/templates/propositional-retrieval"}
      - {kind: code, title: "chentong0/factoid-wiki: Dense X Retrieval: What Retrieval Granularity Should We Use?", by: "Tong Chen et al.", year: 2023, url: "https://github.com/chentong0/factoid-wiki"}
    status: added
  - id: late-chunking
    name: Late Chunking
    aliases: [post-embedding chunking]
    region: retrieval-and-knowledge
    layer: detail
    desc: Running a long-context embedding model over the whole document first, then pooling the contextualized token vectors into chunk embeddings.
    summary: "Read the whole document, then cut it up. A long-context embedding model processes the full document at once, so every token's vector already reflects the surrounding text, and only then are those vectors averaged into per-chunk embeddings. Chunks that say \"it\" or \"the company\" keep their meaning, without the model call per chunk that contextual retrieval needs."
    parents:
      - {id: chunking-strategies, rel: extends, why: "Moves chunking after encoding so chunk embeddings keep document context.", src: "Late Chunking (Günther et al. 2024)"}
      - {id: text-embeddings, rel: applies, why: "Requires long-context embedding models and access to their token-level outputs.", src: "Late Chunking (Günther et al. 2024)"}
    maturity: 2
    maturity_note: Available in Jina's embedding API and a few vector-database integrations; needs a long-context embedding model that exposes token vectors.
    date: "2024-09"
    ref: {title: "Late Chunking: Contextual Chunk Embeddings Using Long-Context Embedding Models (Günther et al.)", arxiv: "2409.04701"}
    examples: [Jina Embeddings v3 late chunking]
    resources:
      - {kind: blog, title: "Late Chunking in Long-Context Embedding Models", by: "Jina AI", year: 2024, url: "https://jina.ai/news/late-chunking-in-long-context-embedding-models/"}
      - {kind: blog, title: "Late Chunking: Balancing Precision and Cost in Long Context Retrieval", by: "Weaviate", year: 2024, url: "https://weaviate.io/blog/late-chunking"}
      - {kind: talk, title: "Late chunking improves context recall in RAG pipelines", by: "Weaviate (YouTube)", year: 2024, url: "https://www.youtube.com/watch?v=buzWGXOydD8"}
      - {kind: code, title: "jina-ai/late-chunking: Code for explaining and evaluating late chunking (chunked pooling)", by: "Jina AI", year: 2024, url: "https://github.com/jina-ai/late-chunking"}
    status: added
  - id: active-retrieval
    name: Active Retrieval
    aliases: [FLARE, forward-looking active retrieval]
    region: retrieval-and-knowledge
    layer: detail
    desc: Retrieving repeatedly during generation, triggered when the model's confidence in its upcoming sentence drops, using that draft sentence as the query.
    summary: "Look things up while writing, not just at the start. The model drafts its next sentence; if it is unsure of any words in it, it uses the draft as a search query, retrieves, and rewrites the sentence from what it found. This suits long answers whose information needs change as they go, at the cost of many retrieval rounds."
    parents:
      - {id: retrieval-augmented-generation, rel: extends, why: "Turns retrieval from a single step before generation into a repeated, confidence-triggered step during it.", src: "Active Retrieval Augmented Generation (Jiang et al. 2023)"}
    maturity: 2
    maturity_note: Influential research pattern; latency and the need for token probabilities limit direct use, and agentic RAG absorbs the idea.
    date: "2023-05"
    ref: {title: "Active Retrieval Augmented Generation (Jiang et al.)", arxiv: "2305.06983"}
    examples: [FLARE]
    resources:
      - {kind: talk, title: "Active Retrieval Augmented Generation (FLARE) Explained!", by: "Weaviate (YouTube)", year: 2023, url: "https://www.youtube.com/watch?v=IVYwLLDABzI"}
      - {kind: code, title: "jzbjyb/FLARE: Forward-Looking Active REtrieval-augmented generation (FLARE)", by: "Zhengbao Jiang et al.", year: 2023, url: "https://github.com/jzbjyb/FLARE"}
      - {kind: paper, title: "Adaptive-RAG: Learning to Adapt Retrieval-Augmented Large Language Models through Question Complexity", by: "Soyeong Jeong et al.", year: 2024, url: "https://arxiv.org/abs/2403.14403"}
      - {kind: paper, title: "DRAGIN: Dynamic Retrieval Augmented Generation based on the Information Needs of Large Language Models", by: "Weihang Su et al.", year: 2024, url: "https://arxiv.org/abs/2403.10081"}
    status: added
  - id: speculative-rag
    name: Speculative RAG
    aliases: [draft-then-verify RAG]
    region: retrieval-and-knowledge
    also: [inference-and-serving]
    layer: detail
    desc: A small model drafts several answers in parallel from different subsets of the retrieved documents, and a larger model picks the best-supported draft.
    summary: "A small, fast model writes several draft answers at once, each from a different slice of the retrieved documents, and a larger model checks the drafts and picks the best one. The large model never has to read every document, which cuts latency and can improve accuracy. It borrows the draft-and-verify idea from speculative decoding."
    parents:
      - {id: retrieval-augmented-generation, rel: extends, why: "Splits retrieved evidence across parallel drafts verified by a larger model.", src: "Speculative RAG (Wang et al. 2024)"}
      - {id: speculative-decoding, rel: applies, why: "Lifts the small-model-drafts, large-model-verifies pattern from tokens to whole answers.", src: "Speculative RAG (Wang et al. 2024)", confidence: medium}
    maturity: 1
    maturity_note: Research results; little sign of production use.
    date: "2024-07"
    ref: {title: "Speculative RAG: Enhancing Retrieval Augmented Generation through Drafting (Wang et al.)", arxiv: "2407.08223"}
    resources:
      - {kind: blog, title: "Speculative RAG: Enhancing retrieval augmented generation through drafting", by: "Google Research", year: 2024, url: "https://research.google/blog/speculative-rag-enhancing-retrieval-augmented-generation-through-drafting/"}
      - {kind: talk, title: "Speculative RAG: Enhancing Retrieval Augmented Generation through Drafting Explained", by: "Zilong Wang (Unify paper session)", year: 2024, url: "https://www.youtube.com/watch?v=VW5GdH8AsGE"}
    status: added
  - id: lightweight-graph-rag
    name: Lightweight GraphRAG
    aliases: [LightRAG, LazyGraphRAG]
    region: retrieval-and-knowledge
    layer: detail
    desc: Graph-based retrieval that skips GraphRAG's up-front community summarization, using a flatter entity graph and doing most of the model work at query time.
    summary: "Full GraphRAG summarizes the whole graph before anyone asks a question, which makes indexing very expensive. Lighter variants extract a simpler entity graph and do most of the work only when a query arrives: LightRAG searches entities and relationships at two levels, and Microsoft's LazyGraphRAG defers summarization entirely. Indexing costs drop to roughly those of vector RAG while keeping much of the multi-hop benefit."
    parents:
      - {id: graph-rag, rel: specializes, why: "Keeps the entity graph but drops or defers the expensive community summaries.", src: "LightRAG (Guo et al. 2024)"}
    maturity: 2
    maturity_note: Popular open-source implementations and early production use; claims of near-GraphRAG quality come mostly from the authors.
    date: "2024-10"
    ref: {title: "LightRAG: Simple and Fast Retrieval-Augmented Generation (Guo et al.)", arxiv: "2410.05779"}
    examples: [LightRAG, Microsoft LazyGraphRAG]
    resources:
      - {kind: blog, title: "LazyGraphRAG: Setting a new standard for quality and cost", by: "Microsoft Research", year: 2024, url: "https://www.microsoft.com/en-us/research/blog/lazygraphrag-setting-a-new-standard-for-quality-and-cost/"}
      - {kind: talk, title: "GraphRAG methods to create optimized LLM context windows for Retrieval — Jonathan Larson, Microsoft", by: "Jonathan Larson (AI Engineer World's Fair)", year: 2025, url: "https://www.youtube.com/watch?v=c5qJHr3DnT4"}
      - {kind: code, title: "HKUDS/LightRAG: LightRAG: Simple and Fast Retrieval-Augmented Generation", by: "HKU Data Intelligence Lab", year: 2024, url: "https://github.com/HKUDS/LightRAG"}
      - {kind: code, title: "gusye1234/nano-graphrag: A simple, easy-to-hack GraphRAG implementation", by: "gusye1234 (GitHub)", year: 2024, url: "https://github.com/gusye1234/nano-graphrag"}
    status: added
  - id: long-context-routing
    name: RAG vs. Long-Context Routing
    aliases: [Self-Route, Pre-Route]
    region: retrieval-and-knowledge
    also: [inference-and-serving]
    layer: detail
    desc: Deciding per query whether to answer from retrieved chunks or by passing whole documents to a long-context model.
    summary: "Long context windows didn't replace retrieval: models get distracted by irrelevant text, and sending whole documents costs far more per question. Routing picks per question. Self-Route tries RAG first and falls back to the full documents only when the model says it can't answer; later routers predict the right path up front from the question and documents."
    parents:
      - {id: retrieval-augmented-generation, rel: extends, why: "Adds a per-query choice between retrieval and reading whole documents.", src: "Retrieval Augmented Generation or Long-Context LLMs? (Li et al. 2024)"}
      - {id: model-routing, rel: applies, why: "Applies cost-aware routing to the choice of context strategy instead of model.", src: "Retrieval Augmented Generation or Long-Context LLMs? (Li et al. 2024)", confidence: medium}
    maturity: 2
    maturity_note: Clear cost savings in studies; production systems mostly route by hand-written rules.
    date: "2024-07"
    ref: {title: "Retrieval Augmented Generation or Long-Context LLMs? A Comprehensive Study and Hybrid Approach (Li et al.)", arxiv: "2407.16833"}
    examples: [Self-Route, Pre-Route]
    resources:
      - {kind: blog, title: "Long Context RAG Performance of LLMs", by: "Databricks", year: 2024, url: "https://www.databricks.com/blog/long-context-rag-performance-llms"}
      - {kind: talk, title: "RAG for long context LLMs", by: "Lance Martin (LangChain)", year: 2024, url: "https://www.youtube.com/watch?v=SsHUNfhF32s"}
      - {kind: paper, title: "In Defense of RAG in the Era of Long-Context Language Models", by: "Tan Yu, Anbang Xu, Rama Akkiraju", year: 2024, url: "https://arxiv.org/abs/2409.01666"}
    status: added

  # ---- practitioner staples (2026-10-10) ----
  - id: text-to-sql
    name: Text-to-SQL
    aliases: [natural language to SQL, NL2SQL, structured-data QA, table question answering]
    region: retrieval-and-knowledge
    desc: Answering questions over databases by having a model write a SQL query from the question and the schema, running it, and reporting the result.
    summary: "Much of a company's knowledge lives in tables, not documents, and embedding rows works poorly for questions like \"revenue by region last quarter\". Text-to-SQL gives the model the database schema and a few example queries, has it write SQL, runs the query and answers from the result. Picking the relevant tables, describing what columns mean and checking the query before running it matter more than the model; it is the usual way to put a chat interface on analytics."
    parents:
      - {id: retrieval-augmented-generation, rel: specializes, why: "Retrieves with a generated query against a database instead of a search index, then answers from the rows.", src: "Text-to-SQL Empowered by Large Language Models (Gao et al. 2023)", confidence: medium}
      - {id: open-domain-qa, rel: specializes, why: "Question answering where the source is a database rather than a text corpus.", src: "Evaluating the Text-to-SQL Capabilities of Large Language Models (Rajkumar et al. 2022)", confidence: medium}
      - {id: "external:semantic-parsing", rel: replaces, why: "Replaces trained semantic parsers with prompted LLMs.", src: "Rajkumar et al. 2022"}
      - {id: few-shot-prompting, rel: applies, why: "Prompts with the schema and example question-query pairs.", src: "DAIL-SQL (Gao et al. 2023)"}
    maturity: 3
    maturity_note: Shipped in BI and data-warehouse products; accuracy on large, messy schemas still needs schema curation and human review.
    date: "2022-03"
    ref: {title: "Evaluating the Text-to-SQL Capabilities of Large Language Models (Rajkumar et al.)", arxiv: "2204.00498"}
    examples: [Vanna, Snowflake Cortex Analyst, Databricks Genie, BIRD and Spider benchmarks]
    status: added
  - id: embedding-compression
    name: Embedding Compression
    aliases: [Matryoshka embeddings, MRL, binary embeddings, embedding quantization, truncatable embeddings]
    region: retrieval-and-knowledge
    layer: detail
    desc: Shrinking stored vectors by training embeddings whose leading dimensions work on their own (Matryoshka) and by quantizing them to int8 or single bits.
    summary: "Embedding indexes get large: millions of 1,000-dimension float vectors. Matryoshka training makes the first dimensions carry the most meaning, so a vector can be cut to a quarter of its length with little loss. Binary quantization keeps one bit per dimension for a 32× saving. A common pattern searches the small vectors first and rescores the top hits with the full ones."
    parents:
      - {id: text-embeddings, rel: extends, why: "Trains embeddings so their prefixes are usable at any length.", src: "Matryoshka Representation Learning (Kusupati et al. 2022)"}
      - {id: approximate-nearest-neighbor-search, rel: applies, why: "Pairs a coarse search over compressed vectors with exact rescoring.", src: "Embedding Quantization (Hugging Face 2024)", confidence: medium}
    maturity: 3
    maturity_note: Supported by major embedding APIs (OpenAI text-embedding-3 dimensions parameter) and vector databases.
    date: "2022-05"
    ref: {title: "Matryoshka Representation Learning (Kusupati et al.)", arxiv: "2205.13147"}
    examples: [OpenAI text-embedding-3 dimensions, Nomic Embed, binary quantization in Qdrant and Weaviate]
    status: added
  - id: embedding-fine-tuning
    name: Embedding Fine-Tuning
    aliases: [domain adaptation of embedders, fine-tuning embedding models, GPL, synthetic query generation for retrieval]
    region: retrieval-and-knowledge
    also: [adaptation-and-post-training]
    layer: detail
    desc: Adapting an embedding model to a domain by training it on in-domain question-passage pairs, often generated by an LLM from the corpus itself.
    summary: "General embedding models miss what matters in specialized text: legal clauses, part numbers, internal jargon. Fine-tuning on pairs of questions and the passages that answer them fixes much of this, and the pairs can be generated by having a model write questions for each chunk of your own documents. A small fine-tuned embedder often beats a larger general one on its home domain."
    parents:
      - {id: text-embeddings, rel: specializes, why: "Adapts a general embedder to one domain's notion of relevance.", src: "GPL (Wang et al. 2021)"}
      - {id: dense-retrieval, rel: extends, why: "Trains the retriever with contrastive pairs mined or generated from the target corpus.", src: "GPL (Wang et al. 2021)"}
    maturity: 3
    maturity_note: Common in production search with tooling in Sentence Transformers; many teams still skip it in favor of rerankers.
    date: "2021-12"
    ref: {title: "GPL: Generative Pseudo Labeling for Unsupervised Domain Adaptation of Dense Retrieval (Wang et al.)", arxiv: "2112.07577"}
    examples: [Sentence Transformers training, LlamaIndex finetune_embedding, Voyage custom models]
    status: added

  # ======================= APPLIED: agents-and-orchestration =======================
  - id: mrkl-systems
    name: MRKL Systems
    aliases: [modular reasoning, neuro-symbolic routing]
    region: agents-and-orchestration
    desc: Architectures that route parts of a query from an LLM to discrete expert modules such as calculators, APIs, and databases.
    summary: "An early architecture where a language model acts as a router, sending parts of a request to dedicated modules such as a calculator, an API, or a database instead of answering everything itself. It set the pattern that exact work goes to exact tools."
    parents:
      - {id: expert-systems, rel: applies, why: "Revives modular expert routing with an LLM as the router.", src: "MRKL Systems (Karpas et al. 2022)", confidence: medium}
      - {id: pretrained-language-models, rel: combines, why: "The language model handles understanding and routing.", src: "MRKL Systems (Karpas et al. 2022)"}
    maturity: 4
    maturity_note: Concept absorbed into standard tool use.
    date: "2022-05"
    ref: {title: "MRKL Systems: A modular, neuro-symbolic architecture that combines large language models, external knowledge sources and discrete reasoning (Karpas et al.)", arxiv: "2205.00445"}
    examples: [early LangChain agents]
    resources:
      - {kind: blog, title: "Jurassic-X: Crossing the neuro-symbolic chasm with the MRKL system", by: "AI21 Labs", year: 2022, url: "https://www.ai21.com/blog/jurassic-x-crossing-the-neuro-symbolic-chasm-with-the-mrkl-system/"}
      - {kind: blog, title: "LLM Powered Autonomous Agents", by: "Lilian Weng", year: 2023, url: "https://lilianweng.github.io/posts/2023-06-23-agent/"}
      - {kind: paper, title: "Augmented Language Models: a Survey", by: "Grégoire Mialon et al.", year: 2023, url: "https://arxiv.org/abs/2302.07842"}
    status: added
  - id: tool-learning
    name: Tool Learning
    aliases: [Toolformer, self-taught tool use]
    region: agents-and-orchestration
    desc: Training models to decide when and how to call tools by inserting API calls into their own training data.
    summary: "Training a model to decide for itself when to call a tool and with what arguments. Toolformer inserted candidate API calls into training text and kept only the ones whose results helped predict what came next. Tool use is now trained into every frontier model."
    parents:
      - {id: mrkl-systems, rel: extends, why: "Learns tool invocation rather than hand-routing.", src: "Toolformer (Schick et al. 2023)"}
      - {id: few-shot-prompting, rel: applies, why: "Uses few-shot prompting to annotate candidate API calls.", src: "Toolformer (Schick et al. 2023)"}
    maturity: 4
    maturity_note: Tool use is now trained into every frontier model.
    date: "2023-02"
    ref: {title: "Toolformer: Language Models Can Teach Themselves to Use Tools (Schick et al.)", arxiv: "2302.04761"}
    examples: [tool-use training data in frontier models]
    resources:
      - {kind: blog, title: "LLM Powered Autonomous Agents", by: "Lilian Weng", year: 2023, url: "https://lilianweng.github.io/posts/2023-06-23-agent/"}
      - {kind: paper, title: "Tool Learning with Foundation Models", by: "Yujia Qin et al.", year: 2023, url: "https://arxiv.org/abs/2304.08354"}
      - {kind: paper, title: "Gorilla: Large Language Model Connected with Massive APIs", by: "Shishir G. Patil et al.", year: 2023, url: "https://arxiv.org/abs/2305.15334"}
      - {kind: paper, title: "ToolLLM: Facilitating Large Language Models to Master 16000+ Real-world APIs", by: "Yujia Qin et al.", year: 2023, url: "https://arxiv.org/abs/2307.16789"}
    status: added
  - id: function-calling
    name: Function Calling
    aliases: [tool use, tool calling]
    region: agents-and-orchestration
    desc: A model emits a structured call matching a declared schema; the host executes it and returns the result to the model.
    summary: "The model replies with a structured call, a function name plus arguments matching a schema you declared, instead of prose. Your code runs the function and sends the result back. It is the basic primitive every agent is built on."
    parents:
      - {id: tool-learning, rel: extends, why: "Productizes trained tool use as an API contract.", src: "OpenAI function calling announcement (2023)"}
      - {id: structured-outputs, rel: combines, why: "Calls are schema-conformant structured output.", src: "OpenAI function calling announcement (2023)"}
    maturity: 5
