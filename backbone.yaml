  - id: golden-eval-sets
    name: Golden and Eval Sets
    aliases: [golden datasets, eval datasets, test sets, reference sets]
    region: data-and-synthetic-data
    also: [evaluation-and-observability]
    desc: Building and maintaining the labeled examples an application is tested against, drawn from real traffic, expert labels and generated cases.
    summary: "The set of example inputs, with expected answers or grading notes, that an application is tested against on every change. Teams start from real user requests and failures found by reading traces, have a domain expert label them, and fill gaps with generated cases for rare or risky situations. The set is never finished: new failures from production are added, and stale examples are retired."
    parents:
      - {id: "external:held-out-test-sets", rel: applies, why: "Applies machine learning's held-out test set to one product's own tasks.", src: "Patterns for Building LLM-based Systems & Products (Yan 2023)"}
