  - id: llm-annotation
    name: LLM-Assisted Annotation
    aliases: [LLM labeling, model-as-annotator]
    region: data-and-synthetic-data
    also: [evaluation-and-observability]
    desc: Using models to label or classify data in place of, or alongside, human annotators.
    summary: "Using a model to label data, such as tagging topics, classifying intents, or scoring quality, instead of or alongside human annotators. You write the labeling guidelines into a prompt, run it over the data, and have people review a sample and the cases the model is unsure about. It is far cheaper and faster than crowd work and often as accurate, which is why most data pipelines now have a model labeling step somewhere."
    parents:
