  # ======================= APPLIED: inference-and-serving =======================
  - id: autoregressive-decoding
    name: Autoregressive Decoding
    aliases: [next-token generation, sampling]
    region: inference-and-serving
    desc: Generating text one token at a time, each conditioned on everything generated so far, using a sampling strategy.
    summary: "A language model writes one token at a time. It scores every possible next token, a sampling rule (greedy, temperature, top-p) picks one, and that token is appended and fed back in. Every new token needs another pass through the whole model, and that pass is limited mostly by how fast weights and cached state can be read from memory, not by arithmetic. Almost every technique in this region attacks that cost."
    parents:
      - {id: pretrained-language-models, rel: applies, why: "The generation loop for causal language models.", src: "Improving Language Understanding by Generative Pre-Training (2018)"}
    maturity: 5
    maturity_note: The baseline execution pattern of every generative model.
    date: "2018-06"
    ref: {title: "Improving Language Understanding by Generative Pre-Training (Radford et al.)", url: "https://cdn.openai.com/research-covers/language-unsupervised/language_understanding_paper.pdf"}
    examples: [vLLM, llama.cpp, Hugging Face generate]
    resources:
      - {kind: blog, title: "How to generate text: using different decoding methods for language generation with Transformers", by: "Patrick von Platen (Hugging Face)", year: 2020, url: "https://huggingface.co/blog/how-to-generate"}
      - {kind: docs, title: "Generation strategies", by: "Hugging Face", year: 2024, url: "https://huggingface.co/docs/transformers/main/en/generation_strategies"}
      - {kind: talk, title: "Stanford CS336 Language Modeling from Scratch | Spring 2025 | Lecture 10: Inference", by: "Percy Liang (Stanford Online)", year: 2025, url: "https://www.youtube.com/watch?v=fcgPYo3OtV0"}
      - {kind: paper, title: "The Curious Case of Neural Text Degeneration", by: "Ari Holtzman et al.", year: 2019, url: "https://arxiv.org/abs/1904.09751"}
    status: repaired
  - id: kv-cache
    name: KV Cache
    aliases: [key-value cache, incremental decoding]
    region: inference-and-serving
    desc: Storing attention keys and values from earlier tokens so each decoding step avoids recomputation; its memory footprint dominates serving design.
    summary: "During generation, attention needs the keys and values of every earlier token. The KV cache stores them, so each step computes them only for the new token instead of reprocessing the whole sequence. The catch is memory: the cache grows with every token and every concurrent request, and for long contexts it can outgrow the model weights, so most serving design is about fitting, sharing and shrinking it."
    parents:
      - {id: autoregressive-decoding, rel: extends, why: "Memoizes attention state across decoding steps.", src: "Fast Transformer Decoding: One Write-Head is All You Need (Shazeer 2019)"}
    maturity: 5
    maturity_note: Non-negotiable serving infrastructure.
    date: "2019-11"
    ref: {title: "Fast Transformer Decoding: One Write-Head is All You Need (Shazeer)", arxiv: "1911.02150"}
    examples: [TensorRT-LLM, vLLM]
    resources:
      - {kind: blog, title: "Understanding and Coding the KV Cache in LLMs from Scratch", by: "Sebastian Raschka", year: 2025, url: "https://magazine.sebastianraschka.com/p/coding-the-kv-cache-in-llms"}
      - {kind: blog, title: "Transformer Inference Arithmetic", by: "kipply (Carol Chen)", year: 2022, url: "https://kipp.ly/p/transformer-inference-arithmetic"}
      - {kind: talk, title: "LLaMA explained: KV-Cache, Rotary Positional Embedding, RMS Norm, Grouped Query Attention, SwiGLU", by: "Umar Jamil", year: 2023, url: "https://www.youtube.com/watch?v=Mn_9W1nCFLo"}
      - {kind: blog, title: "Optimizing AI Inference at Character.AI", by: "Character.AI", year: 2024, url: "https://blog.character.ai/optimizing-ai-inference-at-character-ai/"}
    status: repaired
  - id: paged-attention
    name: PagedAttention
    aliases: [paged KV cache]
    region: inference-and-serving
    desc: Stores the KV cache in non-contiguous fixed-size blocks, like OS virtual memory, cutting fragmentation and raising batch sizes.
    summary: "Stores each request's KV cache in small fixed-size blocks scattered across GPU memory and tracked by a block table, the way an operating system pages virtual memory. Engines no longer reserve one large contiguous region per request for its maximum length, so far less memory is wasted and many more requests fit in a batch. Requests with the same prefix can also share blocks. It was the core idea behind vLLM."
    parents:
      - {id: kv-cache, rel: extends, why: "Applies virtual-memory paging to KV cache storage.", src: "Efficient Memory Management for LLM Serving with PagedAttention (Kwon et al. 2023)"}
    maturity: 4
    maturity_note: Dominant memory-management approach in serving engines.
    date: "2023-09"
    ref: {title: "Efficient Memory Management for Large Language Model Serving with PagedAttention (Kwon et al.)", arxiv: "2309.06180"}
    examples: [vLLM]
    resources:
      - {kind: blog, title: "vLLM: Easy, Fast, and Cheap LLM Serving with PagedAttention", by: "Woosuk Kwon, Zhuohan Li et al. (vLLM)", year: 2023, url: "https://vllm.ai/blog/2023-06-20-vllm"}
      - {kind: talk, title: "SOSP '23 | Efficient Memory Management for Large Language Model Serving with PagedAttention", by: "Woosuk Kwon (SOSP 2023)", year: 2023, url: "https://www.youtube.com/watch?v=UdNocRPQS3Y"}
      - {kind: docs, title: "PagedAttention", by: "Hugging Face (Text Generation Inference)", year: 2024, url: "https://huggingface.co/docs/text-generation-inference/conceptual/paged_attention"}
    status: repaired
  - id: continuous-batching
    name: Continuous Batching
    aliases: [in-flight batching, iteration-level scheduling]
    region: inference-and-serving
    desc: Scheduling at the level of decoding steps so new requests join and finished ones leave a batch continuously.
    summary: "Schedules work one decoding step at a time instead of one batch of requests at a time. When a request finishes, a waiting one takes its slot on the next step, so the GPU never sits idle while a batch waits for its longest answer. It raises throughput several times over static batching and is how every production serving engine runs."
    parents:
      - {id: autoregressive-decoding, rel: extends, why: "Schedules per decoding iteration rather than per request.", src: "Orca (Yu et al., OSDI 2022)"}
    maturity: 4
    maturity_note: Required for production-scale serving.
    date: "2022-07"
    ref: {title: "Orca: A Distributed Serving System for Transformer-Based Generative Models (Yu et al., OSDI 2022)", url: "https://www.usenix.org/conference/osdi22/presentation/yu"}
    examples: [vLLM, TGI, TensorRT-LLM]
    resources:
      - {kind: blog, title: "Achieve 23x LLM Inference Throughput & Reduce p50 Latency", by: "Cade Daniel et al. (Anyscale)", year: 2023, url: "https://www.anyscale.com/blog/continuous-batching-llm-inference"}
      - {kind: talk, title: "OSDI '22 - Orca: A Distributed Serving System for Transformer-Based Generative Models", by: "Gyeong-In Yu (OSDI 2022)", year: 2022, url: "https://www.youtube.com/watch?v=Ob9PPLxETYU"}
      - {kind: blog, title: "vLLM V1: A Major Upgrade to vLLM's Core Architecture", by: "vLLM Team", year: 2025, url: "https://vllm.ai/blog/2025-01-27-v1-alpha-release"}
    status: repaired
  - id: speculative-decoding
    name: Speculative Decoding
    aliases: [assisted generation, draft-and-verify]
    region: inference-and-serving
    desc: A small draft model or head proposes several tokens that the target model verifies in parallel, reducing latency without changing outputs.
    summary: "A fast drafter guesses the next several tokens, and the large model checks all of the guesses in one forward pass, keeping the ones it agrees with. Checking several tokens costs about the same as generating one, so each accepted guess saves a full step, and an acceptance rule keeps the output distribution identical to the large model's. Gains are largest on predictable text such as code and shrink at large batch sizes, where the GPU is already busy."
    parents:
      - {id: autoregressive-decoding, rel: extends, why: "Breaks the strictly serial decode loop with parallel verification.", src: "Fast Inference from Transformers via Speculative Decoding (Leviathan et al. 2022)"}
    maturity: 4
    maturity_note: Broadly integrated into serving engines; draft-head variants (EAGLE, Medusa) are now the common form.
    date: "2022-11"
    ref: {title: "Fast Inference from Transformers via Speculative Decoding (Leviathan et al.)", arxiv: "2211.17192"}
    examples: [Hugging Face assisted generation, vLLM speculative decoding, SGLang]
    resources:
      - {kind: blog, title: "Looking back at speculative decoding", by: "Yaniv Leviathan, Matan Kalman, Yossi Matias (Google Research)", year: 2024, url: "https://research.google/blog/looking-back-at-speculative-decoding/"}
      - {kind: blog, title: "Assisted Generation: a new direction toward low-latency text generation", by: "Joao Gante (Hugging Face)", year: 2023, url: "https://huggingface.co/blog/assisted-generation"}
      - {kind: talk, title: "Lecture 22: Hacker's Guide to Speculative Decoding in VLLM", by: "Cade Daniel (GPU MODE)", year: 2024, url: "https://www.youtube.com/watch?v=9wNAgpX6z_4"}
      - {kind: blog, title: "How Speculative Decoding Boosts vLLM Performance by up to 2.8x", by: "vLLM Team", year: 2024, url: "https://vllm.ai/blog/2024-10-17-spec-decode"}
    status: repaired
  - id: weight-quantization
    name: Weight Quantization
    aliases: [INT8, INT4, FP8, GPTQ, AWQ]
    region: inference-and-serving
    desc: Storing weights at lower numerical precision to cut memory and bandwidth with minimal quality loss.
    summary: "Stores model weights in fewer bits, for example 8 or 4 instead of 16, so the model takes less memory and each decoding step reads less data. Because decoding is limited by memory bandwidth, smaller weights also mean faster generation. Methods such as GPTQ and AWQ choose how to round the weights so quality barely drops, and handle the few outlier values that break naive rounding."
    parents:
      - {id: transformer-architecture, rel: applies, why: "Applies low-precision numerics to transformer weight matrices.", src: "LLM.int8() (Dettmers et al. 2022)"}
    maturity: 4
    maturity_note: Standard for local and cost-sensitive serving.
    date: "2022-08"
    ref: {title: "LLM.int8(): 8-bit Matrix Multiplication for Transformers at Scale (Dettmers et al.)", arxiv: "2208.07339"}
    examples: [GPTQ, AWQ, GGUF, bitsandbytes]
    resources:
      - {kind: blog, title: "A Visual Guide to Quantization", by: "Maarten Grootendorst", year: 2024, url: "https://newsletter.maartengrootendorst.com/p/a-visual-guide-to-quantization"}
      - {kind: blog, title: "A Gentle Introduction to 8-bit Matrix Multiplication for transformers at scale using transformers, accelerate and bitsandbytes", by: "Younes Belkada, Tim Dettmers (Hugging Face)", year: 2022, url: "https://huggingface.co/blog/hf-bitsandbytes-integration"}
      - {kind: talk, title: "Lecture 73: [ScaleML Series] Quantization in Large Models", by: "Chris De Sa (GPU MODE)", year: 2025, url: "https://www.youtube.com/watch?v=6Cxnnvv3DnY"}
      - {kind: paper, title: "AWQ: Activation-aware Weight Quantization for LLM Compression and Acceleration", by: "Ji Lin et al.", year: 2023, url: "https://arxiv.org/abs/2306.00978"}
    status: repaired
  - id: kv-cache-quantization
    name: KV Cache Quantization
    aliases: [KIVI, compressed KV cache]
    region: inference-and-serving
    desc: Storing cached keys and values at reduced precision to fit longer contexts and larger batches in memory.
    summary: "Stores the cached keys and values at lower precision (8-bit, 4-bit, even 2-bit) instead of 16-bit. Long conversations and large batches are often limited by cache size rather than by the weights, so a smaller cache fits longer contexts and more concurrent requests on the same GPU. Keys and values have different outlier patterns, so good methods quantize them differently."
    parents:
      - {id: kv-cache, rel: specializes, why: "Targets the KV cache's memory footprint specifically.", src: "KIVI (Liu et al. 2024)"}
      - {id: weight-quantization, rel: applies, why: "Applies quantization to activation state rather than weights.", src: "KIVI (Liu et al. 2024)"}
    maturity: 3
    maturity_note: Supported in major engines; methods still competing.
    date: "2024-02"
    ref: {title: "KIVI: A Tuning-Free Asymmetric 2bit Quantization for KV Cache (Liu et al.)", arxiv: "2402.02750"}
    examples: [vLLM FP8 KV cache, KIVI]
    resources:
      - {kind: blog, title: "Unlocking Longer Generation with Key-Value Cache Quantization", by: "Raushan Turganbay (Hugging Face)", year: 2024, url: "https://huggingface.co/blog/kv-cache-quantization"}
      - {kind: docs, title: "Quantized KV Cache - vLLM", by: "vLLM", year: 2025, url: "https://docs.vllm.ai/en/latest/features/quantization/quantized_kvcache/"}
      - {kind: paper, title: "KVQuant: Towards 10 Million Context Length LLM Inference with KV Cache Quantization", by: "Coleman Hooper et al.", year: 2024, url: "https://arxiv.org/abs/2401.18079"}
    status: repaired
  - id: prompt-caching
    name: Prompt Caching
    aliases: [prefix caching, RadixAttention]
    region: inference-and-serving
    also: [prompting-and-context-engineering]
    desc: Reusing the computed KV cache for shared prompt prefixes across requests, cutting prefill cost and latency.
    summary: "When many requests start with the same text, such as a system prompt, tool definitions or a long document, the server keeps the KV cache it computed for that prefix and reuses it instead of processing the prefix again. That cuts latency and cost for the shared part. Engines match prefixes in fixed-size blocks (vLLM) or token by token in a radix tree (SGLang's RadixAttention), and API providers bill cache hits as cheaper input tokens, which rewards putting stable content first in a prompt."
    parents:
      - {id: kv-cache, rel: extends, why: "Turns the KV cache into a long-lived, shared asset across requests.", src: "SGLang (Zheng et al. 2023)"}
    maturity: 4
    maturity_note: Offered by major API providers; shapes how prompts are structured.
    date: "2023-12"
    ref: {title: "SGLang: Efficient Execution of Structured Language Model Programs (Zheng et al.)", arxiv: "2312.07104"}
    examples: [Anthropic prompt caching, OpenAI prompt caching, SGLang]
    resources:
      - {kind: blog, title: "Fast and Expressive LLM Inference with RadixAttention and SGLang", by: "Lianmin Zheng, Ying Sheng et al. (LMSYS)", year: 2024, url: "https://www.lmsys.org/blog/2024-01-17-sglang/"}
      - {kind: docs, title: "Automatic Prefix Caching - vLLM", by: "vLLM", year: 2025, url: "https://docs.vllm.ai/en/latest/design/prefix_caching/"}
      - {kind: docs, title: "Prompt caching - Claude Platform Docs", by: "Anthropic", year: 2024, url: "https://platform.claude.com/docs/en/build-with-claude/prompt-caching"}
      - {kind: talk, title: "Efficient LLM Inference with SGLang, Lianmin Zheng, xAI", by: "Lianmin Zheng (AMD Developer Central)", year: 2024, url: "https://www.youtube.com/watch?v=Ny4xxErgFgQ"}
    status: repaired
  - id: constrained-decoding
    name: Constrained Decoding
    aliases: [grammar-constrained generation, guided decoding, JSON mode, grammar automata]
    region: inference-and-serving
    also: [prompting-and-context-engineering]
    desc: Masking invalid tokens at each decoding step so output is guaranteed to match a grammar or schema.
    summary: "At every generation step, tokens that would break a required format (a JSON schema, a regular expression, a grammar) are masked out before sampling, so the output is guaranteed to parse. Libraries such as Outlines and XGrammar compile the grammar ahead of time into a state machine, which makes the check at each step nearly free. It is the mechanism under the structured-output features of the major APIs."
    parents:
      - {id: autoregressive-decoding, rel: extends, why: "Restricts the sampling step to tokens valid under a grammar.", src: "Synchromesh (Poesia et al. 2022)"}
    maturity: 4
    maturity_note: Backs the structured-output features of major APIs.
    date: "2022-01"
    ref: {title: "Synchromesh: Reliable Code Generation from Pre-trained Language Models (Poesia et al.)", arxiv: "2201.11227"}
    examples: [Outlines, llguidance, XGrammar]
    resources:
      - {kind: blog, title: "Achieving Efficient, Flexible, and Portable Structured Generation with XGrammar", by: "MLC team (Yixin Dong et al.)", year: 2024, url: "https://blog.mlc.ai/2024/11/22/achieving-efficient-flexible-portable-structured-generation-with-xgrammar"}
      - {kind: talk, title: "No more bad outputs with structured generation: Remi Louf", by: "Rémi Louf (AI Engineer)", year: 2024, url: "https://www.youtube.com/watch?v=aNmfvN6S_n4"}
