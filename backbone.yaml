      - {kind: talk, title: "Don't Build Agents, Build Skills Instead – Barry Zhang & Mahesh Murag, Anthropic", by: "Barry Zhang, Mahesh Murag (AI Engineer)", year: 2025, url: "https://www.youtube.com/watch?v=CEvIs9y1uog"}
