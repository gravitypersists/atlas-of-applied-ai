  - id: parameter-efficient-fine-tuning
    name: Parameter-Efficient Fine-Tuning
    aliases: [PEFT, adapters]
    region: adaptation-and-post-training
    desc: Fine-tuning only a small set of added or selected parameters, cutting memory and storage costs.
    summary: "Fine-tuning only a small set of added or selected parameters while the rest of the model stays frozen. This cuts the memory needed for training, and each customized version is a small file instead of a full copy of the model."
