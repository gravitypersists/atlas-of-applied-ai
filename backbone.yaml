  - id: mcp-code-execution
    name: Code Execution with MCP
    aliases: [Code Mode, tools as code APIs]
    region: agents-and-orchestration
    layer: detail
    desc: Presenting tools to an agent as a code API it calls from a sandbox, so intermediate results are filtered in code and only what matters returns to the context window.
    summary: "Instead of calling tools one at a time and reading every result, the agent writes a short program against the tools and runs it in a sandbox. Large intermediate results, such as a 10,000-row spreadsheet, stay in the sandbox and only the filtered answer comes back, which saves tokens and round trips."
    parents:
