      - {kind: blog, title: "EgoMimic: Scaling Imitation Learning via Egocentric Video (project page)", by: "Simar Kareer et al.", year: 2024, url: "https://egomimic.github.io/"}
    status: added
  - id: flow-matching-policy
    name: Flow-Matching Action Heads
    aliases: [flow-matching policy, π0 action expert, action flow matching]
    region: embodied-ai-and-world-models
    layer: detail
    desc: Generating continuous action chunks with a flow-matching model attached to a VLA, which needs fewer steps than diffusion and supports high-rate control.
    summary: "Diffusion policies need many denoising passes per action chunk, which is too slow for fast, dexterous control. π0 attached a small flow-matching network, an 'action expert', to a vision-language model; it turns noise into a smooth chunk of actions in a few steps, fast enough for 50 actions a second. This became a common action head for VLAs, alongside better action tokenizers such as FAST that keep the simpler token-by-token approach competitive."
    parents:
      - {id: flow-matching, rel: applies, why: "Uses the flow-matching objective from image generation to generate action sequences.", src: "π0: A Vision-Language-Action Flow Model for General Robot Control (Black et al. 2024)"}
      - {id: diffusion-policy, rel: replaces, why: "Does the same job with fewer sampling steps, fast enough for high-rate control.", src: "Black et al. 2024"}
      - {id: vision-language-action-models, rel: extends, why: "Gives a VLA a continuous action expert instead of discrete action tokens.", src: "Black et al. 2024"}
    maturity: 3
    maturity_note: The action head of several leading open and commercial VLAs; discrete tokenizers remain a competing choice.
    date: "2024-10"
    ref: {title: "π0: A Vision-Language-Action Flow Model for General Robot Control (Black et al.)", arxiv: "2410.24164"}
    examples: [π0, π0.5, GR00T N1, FAST tokenizer (alternative)]
    resources:
      - {kind: docs, title: "π₀ (Pi0)", by: "Hugging Face LeRobot", year: 2025, url: "https://huggingface.co/docs/lerobot/pi0"}
      - {kind: code, title: "openpi", by: "Physical Intelligence", year: 2025, url: "https://github.com/Physical-Intelligence/openpi"}
      - {kind: talk, title: "π0: A Foundation Model for Robotics with Sergey Levine", by: "Sergey Levine (The TWIML AI Podcast)", year: 2025, url: "https://www.youtube.com/watch?v=5mY71rGXAkM"}
      - {kind: paper, title: "FAST: Efficient Action Tokenization for Vision-Language-Action Models", by: "Karl Pertsch et al.", year: 2025, url: "https://arxiv.org/abs/2501.09747"}
    status: added
  - id: generative-sim-to-real
    name: Generative Sim-to-Real
    aliases: [LucidSim, generative augmentation, generative digital twins]
    region: embodied-ai-and-world-models
    layer: detail
    also: [data-and-synthetic-data]
    desc: Using image or video generators to repaint a physics simulator's rendered frames into realistic, varied images that stay consistent with the simulated geometry, so camera-based policies transfer to the real world.
    summary: "Simulators get the physics roughly right but look like old video games, so a policy that relies on camera images can fail on real ones. Generative sim-to-real keeps the simulator for physics and uses an image generator, guided by the simulator's depth and layout, to paint realistic and varied scenes over each frame. LucidSim used this to train a robot dog for visual parkour entirely in simulation."
    parents:
      - {id: sim-to-real-transfer, rel: extends, why: "Replaces hand-made visual randomization with realistic generated images.", src: "Learning Visual Parkour from Generated Images (Yu et al. 2024)"}
      - {id: text-to-image, rel: applies, why: "Uses conditioned image generators to render training observations.", src: "Yu et al. 2024"}
    maturity: 2
    maturity_note: Strong research results; generation cost limits it at large simulation scale.
    date: "2024-10"
    ref: {title: "Learning Visual Parkour from Generated Images (Yu et al.)", arxiv: "2411.00083"}
    examples: [LucidSim, NVIDIA Cosmos Transfer]
    resources:
      - {kind: blog, title: "Can robots learn from machine dreams?", by: "MIT News (MIT CSAIL)", year: 2024, url: "https://news.mit.edu/2024/can-robots-learn-machine-dreams-1119"}
      - {kind: talk, title: "Robots that learn from machine dreams", by: "MIT CSAIL", year: 2024, url: "https://www.youtube.com/watch?v=fgnJQrvTj70"}
      - {kind: docs, title: "NVIDIA Cosmos documentation", by: "NVIDIA", year: 2025, url: "https://docs.nvidia.com/cosmos/latest/index.html"}
    status: added
  - id: dual-system-vlas
    name: Dual-System VLAs
    aliases: [System 1 / System 2 robot models, slow-fast VLAs, hierarchical VLAs, Helix]
    region: embodied-ai-and-world-models
    layer: detail
    desc: Splitting a robot model into a slow vision-language model that understands the scene and instruction a few times a second and a fast action policy that turns its output into motor commands at high rate.
    summary: "A large vision-language model is too slow to drive motors directly, and a small fast policy doesn't understand instructions. Dual-system designs use both: the large model looks at the scene and instruction a few times a second and passes a compact plan or embedding to a small policy that runs fast enough to react to contact. It brings back the hierarchy of planner and controller, but both parts are learned and trained together."
    parents:
      - {id: vision-language-action-models, rel: extends, why: "Splits a VLA into a slow reasoning model and a fast action policy.", src: "GR00T N1: An Open Foundation Model for Generalist Humanoid Robots (NVIDIA 2025)"}
      - {id: llm-robot-planning, rel: combines, why: "Keeps the planner-over-controller hierarchy, but with both layers learned end to end.", src: "NVIDIA 2025"}
    maturity: 2
    maturity_note: The common architecture of 2025 humanoid models; patterns still settling.
    date: "2025-03"
    ref: {title: "GR00T N1: An Open Foundation Model for Generalist Humanoid Robots (NVIDIA)", arxiv: "2503.14734"}
    examples: [GR00T N1, Figure Helix, π0.5, Gemini Robotics]
    resources:
      - {kind: blog, title: "Helix: A Vision-Language-Action Model for Generalist Humanoid Control", by: "Figure AI", year: 2025, url: "https://www.figure.ai/news/helix"}
      - {kind: blog, title: "Accelerate Generalist Humanoid Robot Development with NVIDIA Isaac GR00T N1", by: "NVIDIA Technical Blog", year: 2025, url: "https://developer.nvidia.com/blog/accelerate-generalist-humanoid-robot-development-with-nvidia-isaac-gr00t-n1/"}
      - {kind: talk, title: "What Is a Humanoid Foundation Model? An Introduction to GR00T N1", by: "Annika & Aastha (NVIDIA, AI Engineer)", year: 2025, url: "https://www.youtube.com/watch?v=mWKYvT9Lc50"}
      - {kind: paper, title: "π0.5: a Vision-Language-Action Model with Open-World Generalization", by: "Physical Intelligence (Kevin Black et al.)", year: 2025, url: "https://arxiv.org/abs/2504.16054"}
    status: added
  - id: vla-reinforcement-learning
    name: RL Fine-Tuning of VLAs
    aliases: [VLA online RL, ReinFlow, flow policy RL]
    region: embodied-ai-and-world-models
    layer: detail
    also: [adaptation-and-post-training]
    desc: Improving a VLA beyond its demonstrations with reinforcement learning, which for flow and diffusion action heads requires adding noise to their sampling so action probabilities can be computed.
    summary: "A policy trained only to imitate can't get better than its demonstrations, and it struggles to recover from situations they never showed. Reinforcement learning lets it improve from its own successes and failures, in simulation or on real robots. For flow-matching action heads, which normally turn noise into actions deterministically, methods like ReinFlow add learned noise to each step so standard algorithms such as PPO can update them."
    parents:
      - {id: flow-matching-policy, rel: extends, why: "Makes flow-matching action heads trainable with policy gradients by injecting noise into their sampling steps.", src: "ReinFlow: Fine-tuning Flow Matching Policy with Online Reinforcement Learning (Zhang et al. 2025)"}
      - {id: ppo, rel: applies, why: "Uses PPO-style policy gradient updates on the continuous action head.", src: "Zhang et al. 2025"}
    maturity: 2
    maturity_note: An active 2025–26 frontier; most production policies are still trained by imitation.
    date: "2025-05"
    ref: {title: "ReinFlow: Fine-tuning Flow Matching Policy with Online Reinforcement Learning (Zhang et al.)", arxiv: "2505.22094"}
    examples: [ReinFlow, πRL]
    resources:
      - {kind: talk, title: "Sergey Levine (UC Berkeley & PI): RL for Robot Foundation Models", by: "Sergey Levine (ICRA 2026 Workshop on RL in the Era of IL)", year: 2026, url: "https://www.youtube.com/watch?v=u0WJXi8PC6Y"}
      - {kind: code, title: "SimpleVLA-RL: Scaling VLA Training via Reinforcement Learning", by: "PRIME-RL", year: 2025, url: "https://github.com/PRIME-RL/SimpleVLA-RL"}
      - {kind: paper, title: "SimpleVLA-RL: Scaling VLA Training via Reinforcement Learning", by: "Haozhan Li et al.", year: 2025, url: "https://arxiv.org/abs/2509.09674"}
      - {kind: paper, title: "What Can RL Bring to VLA Generalization? An Empirical Study", by: "Jijia Liu et al.", year: 2025, url: "https://arxiv.org/abs/2505.19789"}
    status: added

  # ======================= APPLIED: governance-and-compliance =======================
  - id: model-documentation
    name: Model and System Cards
    aliases: [model cards, system cards, transparency documentation]
    region: governance-and-compliance
    desc: Standardized documentation of a model's intended use, evaluations, limitations, and safety testing.
    summary: "Standard documents published with a model that state what it is for, how it was evaluated, where it falls short, and what safety testing was done. Model cards began as short reports that included results broken down by demographic group; frontier labs now publish long system cards covering red teaming and dangerous-capability tests. They are expected for major releases and referenced in regulation."
    parents:
