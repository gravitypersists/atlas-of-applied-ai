  - id: context-ordering
    name: Context Ordering
    aliases: [position engineering, context reordering, lost-in-the-middle mitigation]
    region: prompting-and-context-engineering
    also: [retrieval-and-knowledge]
    layer: detail
    desc: Arranging long inputs so the highest-value material sits at the start or end of the context, where models attend most reliably.
    summary: Models pay most attention to the start and end of a long context and can miss what's in the middle. Putting the most important material at the edges is a cheap, reliable fix.
    parents:
      - {id: retrieval-augmented-generation, rel: extends, why: "Orders retrieved passages by relevance toward the edges of the prompt.", src: "Lost in the Middle (Liu et al. 2023)"}
      - {id: few-shot-prompting, rel: extends, why: "Sensitivity to demonstration order was the first sign that position in the prompt changes results.", src: "Fantastically Ordered Prompts and Where to Find Them (Lu et al. 2021)", confidence: medium}
    maturity: 3
    maturity_note: Common in RAG pipelines; less critical as long-context models improve.
    date: "2023-07"
