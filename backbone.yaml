  - id: reasoning-models
    name: Reasoning Models
    aliases: [thinking models, extended thinking, o1-class models]
    region: planning-and-reasoning
    also: [adaptation-and-post-training]
    desc: Models trained with RL to produce long internal reasoning before answering, with controllable thinking budgets.
    summary: "Models trained with reinforcement learning to think at length before answering, backtracking and checking their own work along the way. They are much stronger on math, code and multi-step problems, at the cost of more tokens and latency, and most expose a thinking budget or effort setting. OpenAI's o1 introduced the class in 2024; DeepSeek-R1 showed the recipe openly."
