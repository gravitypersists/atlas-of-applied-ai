  - id: llm-plus-p
    name: LLM+P
    aliases: [LLM-to-PDDL translation, LLM + classical planner]
    region: planning-and-reasoning
    desc: The LLM translates a natural-language problem into PDDL, a classical planner solves it, and the LLM translates the plan back.
    summary: "The language model translates a planning problem from plain language into PDDL, a classical planner finds a provably valid plan, and the model translates the plan back. The model never plans; it only translates. It showed how to get guaranteed-correct plans from models that are unreliable planners on their own."
    parents:
