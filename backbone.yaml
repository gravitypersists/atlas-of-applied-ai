  - id: low-rank-adaptation
    name: LoRA
    aliases: [low-rank adaptation, QLoRA]
    region: adaptation-and-post-training
    desc: Freezing base weights and training small low-rank update matrices injected into each layer.
    summary: "Freezes the base model and trains small low-rank matrices added to its layers; the update can be merged into the weights or swapped in per request. QLoRA keeps the frozen base in 4-bit precision, so large models can be fine-tuned on a single GPU. It is the default way open models get customized."
    parents:
