      - {kind: talk, title: "Context Engineering SF: Context Engineering for Engineers - Jeff Huber", by: "Jeff Huber (Chroma)", year: 2025, url: "https://www.youtube.com/watch?v=L8ZM78APDPk"}
      - {kind: paper, title: "Found in the Middle: Calibrating Positional Attention Bias Improves Long Context Utilization", by: "Cheng-Yu Hsieh et al.", year: 2024, url: "https://arxiv.org/abs/2406.16008"}
