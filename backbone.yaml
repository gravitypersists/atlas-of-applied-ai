      - {kind: docs, title: "Define success criteria and build evaluations", by: "Anthropic", year: 2025, url: "https://platform.claude.com/docs/en/test-and-evaluate/develop-tests"}
    status: repaired
  - id: llm-tracing
    name: LLM Tracing
    aliases: [LLM observability, agent traces, OpenTelemetry GenAI conventions, gen_ai spans]
    region: evaluation-and-observability
    desc: Capturing nested spans for model calls, retrieval, and tool use to debug quality, latency, and cost.
    summary: "Recording every step of an LLM application as nested spans: each model call with its prompt, tokens and latency, plus retrieval steps and tool calls, so you can see exactly what happened on a given request. OpenTelemetry's GenAI conventions give these spans a shared vocabulary across providers and frameworks, though the spec is still changing and has broken dashboards along the way."
