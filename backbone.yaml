      - {kind: "paper", title: "Scalable watermarking for identifying large language model outputs", by: "Sumanth Dathathri et al. (Nature)", year: 2024, url: "https://www.nature.com/articles/s41586-024-08025-4"}
    status: added
  # ---- deep dive (2026-10-10) ----
  - id: io-aware-attention
    name: FlashAttention
    aliases: [IO-aware attention, FlashAttention-2, FlashAttention-3, fused attention kernels, FlashInfer]
    region: inference-and-serving
    desc: Computing exact attention in tiles that stay in fast on-chip GPU memory, so the full attention matrix is never written to main memory.
    summary: "Computes exactly the same attention as the standard method, but in small tiles that stay in the GPU's fast on-chip memory, so the large attention matrix is never written out to slower main memory. Moving less data makes attention several times faster and lets memory use grow linearly rather than quadratically with sequence length, which made long contexts practical. Later versions target newer GPUs, and libraries such as FlashInfer adapt the same ideas to paged KV caches inside serving engines."
    parents:
      - {id: transformer-architecture, rel: applies, why: "Re-implements the transformer's exact attention around the GPU memory hierarchy.", src: "FlashAttention (Dao et al. 2022)"}
    maturity: 5
    maturity_note: The default attention implementation in training and serving frameworks.
    date: "2022-05"
    ref: {title: "FlashAttention: Fast and Memory-Efficient Exact Attention with IO-Awareness (Dao et al.)", arxiv: "2205.14135"}
    examples: [FlashAttention-3, FlashInfer, PyTorch SDPA, xFormers]
    resources:
      - {kind: blog, title: "FlashAttention-3: Fast and Accurate Attention with Asynchrony and Low-precision", by: "Tri Dao et al.", year: 2024, url: "https://tridao.me/blog/2024/flash3/"}
      - {kind: talk, title: "FlashAttention - Tri Dao | Stanford MLSys #67", by: "Tri Dao (Stanford MLSys Seminar)", year: 2023, url: "https://www.youtube.com/watch?v=gMOAud7hZg4"}
      - {kind: blog, title: "Accelerating Self-Attentions for LLM Serving with FlashInfer", by: "Zihao Ye et al. (FlashInfer)", year: 2024, url: "https://flashinfer.ai/2024/02/02/introduce-flashinfer.html"}
      - {kind: paper, title: "FlashInfer: Efficient and Customizable Attention Engine for LLM Inference Serving", by: "Zihao Ye et al.", year: 2025, url: "https://arxiv.org/abs/2501.01005"}
    status: added
  - id: grouped-query-attention
    name: Grouped-Query Attention
    aliases: [GQA, multi-query attention, MQA]
    region: inference-and-serving
    also: [deep-learning-nlp]
    layer: detail
    desc: Letting groups of query heads share one key and value head, so the KV cache shrinks by the group factor with little quality loss.
    summary: "In standard multi-head attention every head keeps its own keys and values in the cache. Grouped-query attention lets several query heads share one key-value head, shrinking the KV cache by that factor (often 4 to 8 times) while keeping quality close to the original. It sits between multi-query attention, where all heads share a single key-value head, and full multi-head attention. It is fixed when a model is trained, but the payoff comes at serving time, and most open models now use it."
    parents:
      - {id: kv-cache, rel: extends, why: "Shares key-value heads across query groups to shrink the cache, generalizing multi-query attention.", src: "GQA (Ainslie et al. 2023)"}
      - {id: transformer-architecture, rel: specializes, why: "A variant of the transformer's multi-head attention.", src: "GQA (Ainslie et al. 2023)"}
    maturity: 4
    maturity_note: Used by most open-weight models; well-understood quality and memory tradeoff.
    date: "2023-05"
    ref: {title: "GQA: Training Generalized Multi-Query Transformer Models from Multi-Head Checkpoints (Ainslie et al.)", arxiv: "2305.13245"}
    examples: [Llama 3, Mistral, Qwen2.5]
    resources:
      - {kind: blog, title: "The Big LLM Architecture Comparison", by: "Sebastian Raschka", year: 2025, url: "https://magazine.sebastianraschka.com/p/the-big-llm-architecture-comparison"}
      - {kind: talk, title: "LLaMA explained: KV-Cache, Rotary Positional Embedding, RMS Norm, Grouped Query Attention, SwiGLU", by: "Umar Jamil", year: 2023, url: "https://www.youtube.com/watch?v=Mn_9W1nCFLo"}
      - {kind: blog, title: "Optimizing AI Inference at Character.AI", by: "Character.AI", year: 2024, url: "https://blog.character.ai/optimizing-ai-inference-at-character-ai/"}
    status: added
  - id: multi-head-latent-attention
    name: Multi-Head Latent Attention
    aliases: [MLA, DeepSeek MLA]
    region: inference-and-serving
    also: [deep-learning-nlp]
    layer: detail
    desc: Compressing keys and values into one small latent vector per token before caching, and expanding them again inside attention.
    summary: "Instead of caching full keys and values for every head, the model caches one small compressed vector per token and expands it back inside attention. DeepSeek reported a much smaller cache than grouped-query attention with quality at least as good as standard attention. The cost is engineering: the speed-up needs specialized kernels and tricks such as folding the expansion matrices into neighboring weights, so serving-engine support arrived later than for GQA."
    parents:
      - {id: grouped-query-attention, rel: replaces, why: "Proposed as a smaller-cache, higher-quality alternative to grouped- and multi-query attention.", src: "DeepSeek-V2 (DeepSeek-AI 2024)"}
    maturity: 3
    maturity_note: Used by DeepSeek-V2, V3 and R1 and by Kimi K2; engines added dedicated kernels such as FlashMLA.
    date: "2024-05"
    ref: {title: "DeepSeek-V2: A Strong, Economical, and Efficient Mixture-of-Experts Language Model (DeepSeek-AI)", arxiv: "2405.04434"}
    examples: [DeepSeek-V3, Kimi K2, FlashMLA]
    resources:
      - {kind: blog, title: "The Big LLM Architecture Comparison", by: "Sebastian Raschka", year: 2025, url: "https://magazine.sebastianraschka.com/p/the-big-llm-architecture-comparison"}
      - {kind: talk, title: "Multi-Head Latent Attention From Scratch | One of the major DeepSeek innovation", by: "Vizuara", year: 2025, url: "https://www.youtube.com/watch?v=NlDQUj1olXM"}
      - {kind: paper, title: "DeepSeek-V3 Technical Report", by: "DeepSeek-AI", year: 2024, url: "https://arxiv.org/abs/2412.19437"}
    status: added
  - id: chunked-prefill
    name: Chunked Prefill
    aliases: [Sarathi, stall-free batching, piggybacked decodes]
    region: inference-and-serving
    layer: detail
    desc: Splitting long prompts into chunks processed alongside ongoing decode steps, so a big prefill doesn't stall other requests' token generation.
    summary: "A long new prompt can occupy the GPU for one large step and freeze token generation for every other request in the batch. Chunked prefill splits the prompt into pieces and processes one piece per step alongside the other requests' decoding, so everyone keeps receiving tokens at a steady pace. A per-step token budget sets the tradeoff between time to first token and smooth streaming."
    parents:
      - {id: continuous-batching, rel: extends, why: "Mixes prompt chunks and decode steps in each iteration-level batch.", src: "SARATHI (Agrawal et al. 2023)"}
    maturity: 4
    maturity_note: On by default in vLLM and supported by SGLang and TensorRT-LLM.
    date: "2023-08"
    ref: {title: "SARATHI: Efficient LLM Inference by Piggybacking Decodes with Chunked Prefills (Agrawal et al.)", arxiv: "2308.16369"}
    examples: [Sarathi-Serve, vLLM, TensorRT-LLM]
    resources:
      - {kind: talk, title: "OSDI '24 - Taming Throughput-Latency Tradeoff in LLM Inference with Sarathi-Serve", by: "Amey Agrawal (OSDI 2024)", year: 2024, url: "https://www.youtube.com/watch?v=S8rq3pYboZY"}
      - {kind: paper, title: "Taming Throughput-Latency Tradeoff in LLM Inference with Sarathi-Serve", by: "Amey Agrawal et al.", year: 2024, url: "https://arxiv.org/abs/2403.02310"}
      - {kind: docs, title: "Optimization and Tuning - vLLM", by: "vLLM", year: 2025, url: "https://docs.vllm.ai/en/latest/configuration/optimization/"}
    status: added
  - id: kv-cache-offloading
    name: KV Cache Offloading
    aliases: [tiered KV cache, KV cache pool, KV-centric serving]
    region: inference-and-serving
    layer: detail
    desc: Moving KV cache out of GPU memory into CPU memory, SSD or a shared networked pool, so cached prefixes survive GPU eviction and can be reused across machines.
    summary: "GPU memory holds only a small part of the KV cache worth keeping. Offloading moves cache blocks down to CPU memory, local SSD or a pool shared across machines, and brings them back when a later request has the same prefix, which for long prefixes is faster than recomputing them. Moonshot built Mooncake, the serving system behind Kimi, around such a pool, and open engines do the same with tools like LMCache and NVIDIA Dynamo."
    parents:
      - {id: prompt-caching, rel: extends, why: "Extends prefix reuse beyond GPU memory into CPU, SSD and cluster-wide tiers.", src: "Mooncake (Qin et al. 2024)"}
      - {id: prefill-decode-disaggregation, rel: combines, why: "Shares the fast KV transfer path between machines that disaggregated serving needs.", src: "Mooncake (Qin et al. 2024)"}
    maturity: 3
    maturity_note: In production at large providers; open tooling (LMCache, Dynamo, llm-d) still settling.
    date: "2024-07"
    ref: {title: "Mooncake: A KVCache-centric Disaggregated Architecture for LLM Serving (Qin et al.)", arxiv: "2407.00079"}
    examples: [Mooncake, LMCache, NVIDIA Dynamo, llm-d]
    resources:
      - {kind: talk, title: "FAST '25 - Mooncake: Trading More Storage for Less Computation — A KVCache-centric Architecture for Serving LLM Chatbot", by: "Ruoyu Qin (USENIX FAST 2025)", year: 2025, url: "https://www.youtube.com/watch?v=-Lpx9QuCEsw"}
      - {kind: talk, title: "Next-Gen Long-Context LLM Inference with LMCache", by: "Junchen Jiang (UChicago & LMCache)", year: 2025, url: "https://www.youtube.com/watch?v=Z4vmQhV4w-I"}
      - {kind: paper, title: "LMCache: An Efficient KV Cache Layer for Enterprise-Scale LLM Inference", by: "LMCache team (Yihua Cheng et al.)", year: 2025, url: "https://arxiv.org/abs/2510.09665"}
      - {kind: docs, title: "Welcome to Mooncake", by: "kvcache-ai (Moonshot AI)", year: 2025, url: "https://kvcache-ai.github.io/Mooncake/"}
    status: added
  - id: multi-lora-serving
    name: Multi-LoRA Serving
    aliases: [S-LoRA, Punica, adapter serving]
    region: inference-and-serving
    also: [adaptation-and-post-training]
    layer: detail
    desc: Serving many LoRA adapters on one shared base model, batching requests for different adapters together.
    summary: "Fine-tuning with LoRA produces small adapters on top of a shared base model, and a platform may host thousands of them, one per customer or task. Multi-LoRA serving keeps one copy of the base model on the GPU, swaps adapter weights in and out of memory on demand, and uses custom kernels so requests for different adapters run in the same batch. Each fine-tuned model then costs a small fraction of a dedicated deployment."
    parents:
      - {id: low-rank-adaptation, rel: applies, why: "Serves many LoRA adapters over one shared base model.", src: "S-LoRA (Sheng et al. 2023)"}
      - {id: paged-attention, rel: applies, why: "Pages adapter weights in the same unified memory pool as the KV cache.", src: "S-LoRA (Sheng et al. 2023)"}
    maturity: 4
    maturity_note: Supported in vLLM, SGLang, TensorRT-LLM and LoRAX; common on hosted fine-tuning platforms.
    date: "2023-11"
