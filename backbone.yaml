  - id: mcp-code-execution
    name: Code Execution with MCP
    aliases: [Code Mode, tools as code APIs]
    region: agents-and-orchestration
    layer: detail
    desc: Presenting tools to an agent as a code API it calls from a sandbox, so intermediate results are filtered in code and only what matters returns to the context window.
    summary: "Instead of calling tools one at a time and reading every result, the agent writes a short program against the tools and runs it in a sandbox. Large intermediate results, such as a 10,000-row spreadsheet, stay in the sandbox and only the filtered answer comes back, which saves tokens and round trips."
    parents:
      - {id: model-context-protocol, rel: extends, why: "Exposes MCP servers as a code API the agent programs against, rather than as individual tool calls.", src: "Code Mode: the better way to use MCP (Cloudflare 2025)"}
      - {id: progressive-disclosure, rel: applies, why: "Tool definitions are read from the file system when needed instead of loaded up front.", src: "Code execution with MCP (Anthropic 2025)"}
    maturity: 2
    maturity_note: Introduced in late 2025 by Cloudflare and Anthropic; adoption is early.
    date: "2025-09"
    ref: {title: "Code Mode: the better way to use MCP (Cloudflare)", url: "https://blog.cloudflare.com/code-mode/"}
    examples: [Cloudflare Code Mode, Claude Agent SDK]
    resources:
      - {kind: blog, title: "Code execution with MCP: building more efficient AI agents", by: "Anthropic", year: 2025, url: "https://www.anthropic.com/engineering/code-execution-with-mcp"}
      - {kind: blog, title: "Introducing advanced tool use on the Claude Developer Platform", by: "Anthropic", year: 2025, url: "https://www.anthropic.com/engineering/advanced-tool-use"}
      - {kind: paper, title: "Executable Code Actions Elicit Better LLM Agents", by: "Xingyao Wang et al.", year: 2024, url: "https://arxiv.org/abs/2402.01030"}
    status: added
  - id: long-running-agent-harness
    name: Long-Running Agent Harnesses
    aliases: [multi-session agents, initializer agent pattern, progress files]
    region: agents-and-orchestration
    layer: detail
    desc: Harness patterns for tasks spanning many context windows - a first session writes a feature list and progress file, and each later session reads them, makes one tested increment, commits, and updates the notes.
    summary: "How to keep an agent productive on a task too big for one context window. A first session sets up the environment and writes the plan down, as a feature checklist and a progress file; each later session reads that state, makes one tested increment, commits it, and updates the notes. Written state and git history, not a bigger window, carry the work forward."
    parents:
      - {id: coding-agents, rel: extends, why: "Stretches a single coding-agent session into many coordinated ones.", src: "Effective harnesses for long-running agents (Anthropic 2025)"}
      - {id: agent-memory, rel: applies, why: "Progress files and git history are the memory that carries state between sessions.", src: "Effective harnesses for long-running agents (Anthropic 2025)"}
    maturity: 3
    maturity_note: Used in shipping coding agents; patterns published in late 2025 and still settling.
    date: "2025-11"
    ref: {title: "Effective harnesses for long-running agents (Anthropic)", url: "https://www.anthropic.com/engineering/effective-harnesses-for-long-running-agents"}
    examples: [Claude Agent SDK, Claude Code]
