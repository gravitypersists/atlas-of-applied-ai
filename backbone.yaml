  # ---- deep dive (2026-10-10, Gemini run, reviewed): detail layer unless noted ----
  - id: dynamic-resolution-encoding
    name: Dynamic Resolution Encoding
    aliases: [native resolution, AnyRes, image tiling, M-RoPE]
    region: multimodal-applied
    layer: detail
    desc: Feeding images to a vision-language model at their native size and aspect ratio, so the number of visual tokens grows with the image instead of being squeezed into a fixed grid.
    summary: "Early vision-language models shrank every image to a small fixed square, which made small text, dense charts and screen details unreadable. Newer models cut the image into tiles or patches at its own resolution and use 2D position encodings, so a large image becomes more tokens. Detail improves, but an image's token cost now depends on its size, which engineers control with resolution settings."
    parents:
      - {id: vision-language-models, rel: extends, why: "Replaces the fixed-size image input of early VLMs with a variable number of visual tokens.", src: "Qwen2-VL (Wang et al. 2024)"}
    maturity: 4
    maturity_note: Standard in current VLMs; exposed to engineers as resolution and image-token settings.
    date: "2024-09"
    ref: {title: "Qwen2-VL: Enhancing Vision-Language Model's Perception of the World at Any Resolution (Wang et al.)", arxiv: "2409.12191"}
    examples: [Qwen2-VL, LLaVA-NeXT AnyRes, image detail settings]
    resources:
      - {kind: blog, title: "Qwen2.5 VL! Qwen2.5 VL! Qwen2.5 VL!", by: "Qwen Team", year: 2025, url: "https://qwenlm.github.io/blog/qwen2.5-vl/"}
      - {kind: blog, title: "LLaVA-NeXT: Improved reasoning, OCR, and world knowledge", by: "Haotian Liu et al.", year: 2024, url: "https://llava-vl.github.io/blog/2024-01-30-llava-next/"}
      - {kind: docs, title: "Vision", by: "Anthropic (Claude Platform Docs)", year: 2025, url: "https://platform.claude.com/docs/en/build-with-claude/vision"}
      - {kind: paper, title: "Patch n' Pack: NaViT, a Vision Transformer for any Aspect Ratio and Resolution", by: "Mostafa Dehghani et al.", year: 2023, url: "https://arxiv.org/abs/2307.06304"}
    status: added
  - id: video-understanding
    name: Video Understanding
    aliases: [video VLMs, video-LLMs, spatiotemporal vision encoding]
    region: multimodal-applied
    layer: detail
    desc: Vision-language models that answer questions about video by sampling frames, encoding them, and pooling the visual tokens over space and time.
    summary: "Letting a vision-language model watch a video and answer questions about it. The model samples frames, encodes each one like an image, and pools or compresses the results so minutes of video fit in its context window. How many frames to sample and how hard to compress them trades cost against missing short events."
    parents:
      - {id: vision-language-models, rel: extends, why: "Extends image VLMs to sequences of frames.", src: "Video-ChatGPT (Maaz et al. 2023)"}
    maturity: 3
    maturity_note: Available in frontier APIs; frame sampling and token budgets are still tuned per use case.
    date: "2023-06"
    ref: {title: "Video-ChatGPT: Towards Detailed Video Understanding via Large Vision and Language Models (Maaz et al.)", arxiv: "2306.05424"}
    examples: [Gemini video input, Qwen2.5-VL, Video-LLaVA]
    resources:
      - {kind: docs, title: "Video understanding | Gemini API", by: "Google AI for Developers", year: 2025, url: "https://ai.google.dev/gemini-api/docs/video-understanding"}
      - {kind: talk, title: "Token-Efficient Long Video Understanding for Multimodal LLMs | Paper explained", by: "Letitia Parcalabescu (AI Coffee Break)", year: 2025, url: "https://www.youtube.com/watch?v=uMk3VN4S8TQ"}
      - {kind: paper, title: "Video-LLaVA: Learning United Visual Representation by Alignment Before Projection", by: "Bin Lin et al.", year: 2023, url: "https://arxiv.org/abs/2311.10122"}
      - {kind: paper, title: "Video Understanding with Large Language Models: A Survey", by: "Yunlong Tang et al.", year: 2023, url: "https://arxiv.org/abs/2312.17432"}
    status: added
  - id: audio-language-models
    name: Audio Language Models
    aliases: [neural codec language models, codec TTS, zero-shot TTS, AudioLM, VALL-E]
    region: multimodal-applied
    layer: core
    desc: Language models trained on discrete audio tokens from a neural codec, predicting audio the way text models predict words; the basis of modern speech synthesis and end-to-end voice models.
    summary: "A neural audio codec compresses sound into a sequence of discrete tokens, and a language model learns to predict the next one, exactly as a text model predicts the next word. This produces natural speech and music, and from a few seconds of a speaker's voice it can continue in that voice (zero-shot text-to-speech). The same audio tokens let end-to-end voice assistants hear and speak without converting to text."
    parents:
      - {id: pretrained-language-models, rel: applies, why: "Applies next-token language modeling to audio codec tokens.", src: "AudioLM (Borsos et al. 2022)"}
      - {id: "external:neural-audio-codecs", rel: combines, why: "Tokenizes audio with a neural codec such as SoundStream or EnCodec.", src: "AudioLM (Borsos et al. 2022)"}
    maturity: 3
    maturity_note: Behind current speech synthesis and voice models; voice cloning raises open consent and misuse questions.
    date: "2022-09"
    ref: {title: "AudioLM: a Language Modeling Approach to Audio Generation (Borsos et al.)", arxiv: "2209.03143"}
    examples: [VALL-E, AudioLM, EnCodec, Mimi]
    resources:
      - {kind: blog, title: "AudioLM: a Language Modeling Approach to Audio Generation", by: "Zalán Borsos, Neil Zeghidour (Google Research)", year: 2022, url: "https://research.google/blog/audiolm-a-language-modeling-approach-to-audio-generation/"}
      - {kind: talk, title: "Audio Language Models - Neil Zeghidour (Moshi)", by: "Neil Zeghidour (Hung-yi Lee's channel)", year: 2024, url: "https://www.youtube.com/watch?v=Zjpl84KCTvw"}
      - {kind: paper, title: "Neural Codec Language Models are Zero-Shot Text to Speech Synthesizers", by: "Chengyi Wang et al.", year: 2023, url: "https://arxiv.org/abs/2301.02111"}
      - {kind: paper, title: "High Fidelity Neural Audio Compression", by: "Alexandre Défossez et al.", year: 2022, url: "https://arxiv.org/abs/2210.13438"}
    status: added
  - id: full-duplex-voice
    name: Full-Duplex Voice Models
    aliases: [simultaneous listening and speaking, multi-stream speech models, Moshi]
    region: multimodal-applied
    also: [ai-product-and-interaction-design]
    layer: detail
    desc: Speech models that model the user's and the agent's audio as two parallel streams, so they listen and speak at the same time with no explicit turn boundaries.
    summary: "Most voice assistants take turns: they wait for you to stop, then answer. A full-duplex model processes your audio and its own as two streams at once, frame by frame, so overlaps, interruptions and small acknowledgements like \"uh-huh\" are handled by the model itself. Moshi also predicts a text version of its own speech slightly ahead of the audio, which keeps answers coherent, and responds in about 200 ms."
    parents:
      - {id: realtime-voice, rel: specializes, why: "An end-to-end realtime voice model with no turn-based structure.", src: "Moshi (Défossez et al. 2024)"}
      - {id: audio-language-models, rel: extends, why: "Models two parallel streams of codec tokens instead of one.", src: "Moshi (Défossez et al. 2024)"}
    maturity: 2
    maturity_note: Open research models and early products; most deployed voice agents still use turn detection.
    date: "2024-09"
    ref: {title: "Moshi: a speech-text foundation model for real-time dialogue (Défossez et al.)", arxiv: "2410.00037"}
    examples: [Moshi]
    resources:
      - {kind: code, title: "kyutai-labs/moshi", by: "Kyutai", year: 2024, url: "https://github.com/kyutai-labs/moshi"}
      - {kind: talk, title: "\"Moshi: a speech-text foundation model for real-time dialogue\" - Alexandre Défossez", by: "Alexandre Défossez (Conversational AI Reading Group)", year: 2025, url: "https://www.youtube.com/watch?v=0_c3bw_x6uU"}
      - {kind: talk, title: "Your Voice Agent is Just a Walkie Talkie", by: "Neil Zeghidour (Gradium, AI Engineer)", year: 2026, url: "https://www.youtube.com/watch?v=a8EcVumh71E"}
      - {kind: paper, title: "Generative Spoken Dialogue Language Modeling", by: "Tu Anh Nguyen et al.", year: 2022, url: "https://arxiv.org/abs/2203.16502"}
    status: added
  - id: diffusion-transformers
    name: Diffusion Transformers
    aliases: [DiT]
    region: multimodal-applied
    layer: detail
    desc: Diffusion models whose denoising network is a transformer over latent patches instead of a convolutional U-Net.
    summary: "Early diffusion models denoised with a U-Net, a convolutional network that stops improving much as it gets bigger. A diffusion transformer cuts the latent image into patches and processes them as tokens, like a vision transformer, so quality keeps rising with model size and compute. Most recent image and video generators use it."
    parents:
      - {id: diffusion-models, rel: specializes, why: "Replaces the U-Net denoiser with a transformer.", src: "Scalable Diffusion Models with Transformers (Peebles & Xie 2022)"}
      - {id: transformer-architecture, rel: applies, why: "Processes noised latent patches as a token sequence.", src: "Peebles & Xie 2022"}
    maturity: 4
    maturity_note: The backbone of most current image and video generators.
    date: "2022-12"
    ref: {title: "Scalable Diffusion Models with Transformers (Peebles & Xie)", arxiv: "2212.09748"}
    examples: [Sora, Stable Diffusion 3, Flux]
    resources:
      - {kind: docs, title: "DiT", by: "Hugging Face Diffusers", year: 2023, url: "https://huggingface.co/docs/diffusers/api/pipelines/dit"}
      - {kind: talk, title: "Diffusion Transformers (ViT, DiT, MMDiT)", by: "Julia Turc", year: 2026, url: "https://www.youtube.com/watch?v=jNPmSjrxGtY"}
      - {kind: paper, title: "Scaling Rectified Flow Transformers for High-Resolution Image Synthesis", by: "Patrick Esser et al.", year: 2024, url: "https://arxiv.org/abs/2403.03206"}
    status: added
  - id: flow-matching
    name: Flow Matching
    aliases: [rectified flow]
    region: multimodal-applied
    layer: detail
    desc: Training a generator to follow a learned velocity field from noise to data, usually along straight paths, instead of learning to reverse a noising process.
    summary: "An alternative training objective to diffusion. Instead of learning to remove noise step by step, the model learns which direction to move at each point to get from noise to an image, with the paths kept close to straight lines. Straighter paths need fewer sampling steps, and training is simpler. Recent image, video and speech models such as Stable Diffusion 3 and Flux use it."
    parents:
      - {id: diffusion-models, rel: replaces, why: "Does the same job as diffusion with a simpler objective and fewer sampling steps.", src: "Flow Matching for Generative Modeling (Lipman et al. 2022)"}
    maturity: 3
    maturity_note: The default objective for many 2024+ generators; diffusion remains common.
    date: "2022-10"
    ref: {title: "Flow Matching for Generative Modeling (Lipman et al.)", arxiv: "2210.02747"}
    examples: [Stable Diffusion 3, Flux, Movie Gen]
    resources:
      - {kind: blog, title: "An introduction to Flow Matching", by: "Tor Fjelde, Emile Mathieu, Vincent Dutordoir (Cambridge MLG)", year: 2024, url: "https://mlg.eng.cam.ac.uk/blog/2024/01/20/flow-matching.html"}
      - {kind: blog, title: "Diffusion Meets Flow Matching", by: "Ruiqi Gao, Emiel Hoogeboom, Jonathan Heek, Valentin De Bortoli, Kevin P. Murphy, Tim Salimans", year: 2024, url: "https://diffusionflow.github.io/"}
      - {kind: talk, title: "Flow Matching: Simplifying and Generalizing Diffusion Models", by: "Yaron Lipman (Proxima)", year: 2023, url: "https://www.youtube.com/watch?v=5ZSwYogAxYg"}
      - {kind: paper, title: "Flow Matching Guide and Code", by: "Yaron Lipman et al.", year: 2024, url: "https://arxiv.org/abs/2412.06264"}
    status: added
  - id: spatial-conditioning
    name: Spatial Conditioning
    aliases: [ControlNet, T2I-Adapter, controllable generation]
    region: multimodal-applied
    layer: detail
    desc: Steering a pretrained image generator with structural inputs (edge maps, depth, pose skeletons) through a trained add-on network, leaving the base model frozen.
    summary: "A text prompt can't say exactly where things go in a picture. Spatial conditioning adds a second input, such as a sketch, an edge map, a depth map or a pose skeleton, and a small trained add-on network makes the generator follow it. The base model stays frozen, so one model can take many kinds of control."
    parents:
      - {id: text-to-image, rel: extends, why: "Adds structural control to a frozen text-to-image model.", src: "Adding Conditional Control to Text-to-Image Diffusion Models (Zhang et al. 2023)"}
    maturity: 4
    maturity_note: Widely used in image tools and design pipelines.
    date: "2023-02"
    ref: {title: "Adding Conditional Control to Text-to-Image Diffusion Models (Zhang et al.)", arxiv: "2302.05543"}
    examples: [ControlNet, T2I-Adapter, ComfyUI]
    resources:
      - {kind: blog, title: "ControlNet in Diffusers", by: "Hugging Face (Sayak Paul, YiYi Xu, Patrick von Platen)", year: 2023, url: "https://huggingface.co/blog/controlnet"}
      - {kind: tutorial, title: "Train your ControlNet with diffusers", by: "Hugging Face (Apolinário, Pedro Cuenca)", year: 2023, url: "https://huggingface.co/blog/train-your-controlnet"}
      - {kind: talk, title: "Ok, but what IS ControlNet?", by: "koiboi", year: 2023, url: "https://www.youtube.com/watch?v=fhIGt7QGg4w"}
      - {kind: paper, title: "T2I-Adapter: Learning Adapters to Dig out More Controllable Ability for Text-to-Image Diffusion Models", by: "Chong Mou et al.", year: 2023, url: "https://arxiv.org/abs/2302.08453"}
    status: added
  - id: spatial-vlms
    name: Spatial Reasoning VLMs
    aliases: [SpatialVLM, embodied reasoning models, metric spatial reasoning, 3D spatial reasoning]
    region: multimodal-applied
    layer: detail
    also: [embodied-ai-and-world-models]
    desc: Vision-language models trained on large amounts of 3D spatial question answering so they can estimate distances, sizes and positions in a scene, not just name what's in it.
    summary: "Ordinary vision-language models can say there is a mug on the table but are poor at saying how far away it is or whether it fits in the box. Spatial reasoning VLMs are trained on millions of generated questions about distances, sizes and relative positions, built from images with estimated depth. Robots use them to ground plans in real coordinates, and embodied-reasoning models such as Gemini Robotics-ER build on the idea."
    parents:
      - {id: vision-language-models, rel: extends, why: "Adds quantitative 3D spatial reasoning to a VLM through generated spatial question-answer data.", src: "SpatialVLM: Endowing Vision-Language Models with Spatial Reasoning Capabilities (Chen et al. 2024)"}
    maturity: 2
    maturity_note: Used as the perception layer in some robot stacks; benchmarks still show large gaps.
    date: "2024-01"
    ref: {title: "SpatialVLM: Endowing Vision-Language Models with Spatial Reasoning Capabilities (Chen et al.)", arxiv: "2401.12168"}
    examples: [SpatialVLM, Gemini Robotics-ER, SpatialRGPT]
    resources:
      - {kind: docs, title: "Gemini Robotics ER", by: "Google (Gemini API docs)", year: 2026, url: "https://ai.google.dev/gemini-api/docs/robotics-overview"}
      - {kind: blog, title: "Introducing Gemini Robotics and Gemini Robotics-ER, AI models designed for robots to understand, act and react to the physical world", by: "Google DeepMind", year: 2025, url: "https://deepmind.google/blog/gemini-robotics-brings-ai-into-the-physical-world/"}
      - {kind: talk, title: "Introducing Gemini Robotics 2", by: "Carolina Parada, Stuart Bowers, Kanishka Rao, Jie Tan with Logan Kilpatrick (Google for Developers)", year: 2026, url: "https://www.youtube.com/watch?v=-rYFDefcq3k"}
      - {kind: paper, title: "Gemini Robotics 1.5: Pushing the Frontier of Generalist Robots with Advanced Embodied Reasoning, Thinking, and Motion Transfer", by: "Gemini Robotics Team", year: 2025, url: "https://arxiv.org/abs/2510.03342"}
