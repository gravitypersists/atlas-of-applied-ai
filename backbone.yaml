  # ---- deep dive (2026-10-09) ----
  - id: judge-bias-mitigation
    name: Judge Bias Mitigation
    aliases: [position-swap evaluation, length-controlled judging]
    region: evaluation-and-observability
    layer: detail
    desc: Countering the systematic biases of model judges, chiefly favoring the first option, longer answers, and their own outputs.
    summary: "Model judges prefer whichever answer they see first, longer answers, and text from their own model family. The standard fixes are to run each pairwise comparison twice with the order swapped and count a win only if it holds both ways, to control for length, and to avoid judging a model with itself. These are cheap and should be on by default in any judge setup."
    parents:
      - {id: llm-as-a-judge, rel: counters, why: "Targets the position, verbosity and self-enhancement biases measured in model judges.", src: "Judging LLM-as-a-Judge (Zheng et al. 2023)"}
    maturity: 3
    maturity_note: Order swapping and length control are built into common eval tools and leaderboards; self-preference is harder to remove.
    date: "2023-06"
    ref: {title: "Judging LLM-as-a-Judge with MT-Bench and Chatbot Arena (Zheng et al.), Section 3.3 on limitations", arxiv: "2306.05685"}
    examples: [position swapping, length-controlled AlpacaEval]
    resources:
      - {kind: paper, title: "Large Language Models are not Fair Evaluators", by: "Peiyi Wang et al.", year: 2023, url: "https://arxiv.org/abs/2305.17926"}
      - {kind: paper, title: "Length-Controlled AlpacaEval: A Simple Way to Debias Automatic Evaluators", by: "Yann Dubois et al.", year: 2024, url: "https://arxiv.org/abs/2404.04475"}
      - {kind: paper, title: "LLM Evaluators Recognize and Favor Their Own Generations", by: "Arjun Panickssery et al.", year: 2024, url: "https://arxiv.org/abs/2404.13076"}
      - {kind: paper, title: "Replacing Judges with Juries: Evaluating LLM Generations with a Panel of Diverse Models", by: "Pat Verga et al.", year: 2024, url: "https://arxiv.org/abs/2404.18796"}
    status: added
  - id: probabilistic-judge-scoring
    name: Probabilistic Judge Scoring
    aliases: [G-Eval, logprob-weighted scoring]
    region: evaluation-and-observability
    layer: detail
    desc: Reading the judge's token probabilities over the score values and taking their weighted average, instead of parsing one integer.
    summary: "When a judge is asked for a 1–5 score, the single number it writes is coarse and flips with small prompt changes. G-Eval instead reads the probability the judge assigns to each score token and averages them, giving a continuous score that correlates better with human ratings. It needs an API that exposes log probabilities, which many hosted models don't."
    parents:
      - {id: llm-as-a-judge, rel: extends, why: "Replaces the parsed integer score with a probability-weighted one.", src: "G-Eval (Liu et al. 2023)"}
    maturity: 2
    maturity_note: Implemented in eval libraries, but limited by providers that hide log probabilities.
    date: "2023-03"
    ref: {title: "G-Eval: NLG Evaluation using GPT-4 with Better Human Alignment (Liu et al.)", arxiv: "2303.16634"}
    examples: [G-Eval, DeepEval GEval metric]
    resources:
      - {kind: docs, title: "G-Eval | DeepEval", by: "Confident AI", year: 2025, url: "https://deepeval.com/docs/metrics-llm-evals"}
      - {kind: talk, title: "From BLEU to G-Eval: LLM-as-a-Judge Techniques & Limitations", by: "deepsense.ai", year: 2024, url: "https://www.youtube.com/watch?v=DBUK_0ZSCD8"}
    status: added
  - id: fine-tuned-evaluators
    name: Fine-Tuned Evaluators
    aliases: [judge models, open-weight judges, evaluator LMs]
    region: evaluation-and-observability
    also: [adaptation-and-post-training]
    layer: detail
    desc: Smaller models fine-tuned on graded examples to act as judges, often given a rubric and a reference answer in the prompt.
    summary: "Instead of paying a frontier model to grade everything, train a smaller open model to do only grading. JudgeLM and Prometheus fine-tune on large sets of judgments from strong models; Prometheus also takes a custom rubric and a reference answer, so it compares rather than solves. They are cheaper, faster and can run privately, but they generalize less well outside the kinds of tasks they were trained on."
    parents:
      - {id: llm-as-a-judge, rel: specializes, why: "A judge built for grading rather than a general model prompted to grade.", src: "JudgeLM (Zhu et al. 2023)"}
      - {id: supervised-fine-tuning, rel: applies, why: "Fine-tunes on judgments distilled from strong models.", src: "Prometheus (Kim et al. 2023)"}
      - {id: pairwise-preference-eval, rel: applies, why: "Trained largely on pairwise comparisons of two answers, the judging format arena evals made standard.", src: "JudgeLM (Zhu et al. 2023)", confidence: medium}
    maturity: 3
    maturity_note: Several open judge models in use; frontier judges still preferred for hard or novel tasks.
    date: "2023-10"
    ref: {title: "JudgeLM: Fine-tuned Large Language Models are Scalable Judges (Zhu et al.)", arxiv: "2310.17631"}
    examples: [Prometheus, JudgeLM, PandaLM]
    resources:
      - {kind: paper, title: "Prometheus: Inducing Fine-grained Evaluation Capability in Language Models", by: "Seungone Kim et al.", year: 2023, url: "https://arxiv.org/abs/2310.08491"}
      - {kind: paper, title: "Prometheus 2: An Open Source Language Model Specialized in Evaluating Other Language Models", by: "Seungone Kim et al.", year: 2024, url: "https://arxiv.org/abs/2405.01535"}
      - {kind: paper, title: "An Empirical Study of LLM-as-a-Judge for LLM Evaluation: Fine-tuned Judge Model is not a General Substitute for GPT-4", by: "Hui Huang et al.", year: 2024, url: "https://arxiv.org/abs/2403.02839"}
    status: added
  - id: judge-score-correction
    name: Judge Score Correction
    aliases: [prediction-powered inference, PPI, confidence intervals for judges]
    region: evaluation-and-observability
    also: [retrieval-and-knowledge]
    layer: detail
    desc: Combining many judge scores with a small human-labeled set to correct the judge's bias and put confidence intervals on the result.
    summary: "A judge's aggregate score can be wrong in a consistent direction. Prediction-powered inference uses a few hundred human labels to measure how far the judge is off and corrects the large automated run accordingly, producing a score with an honest confidence interval. ARES brought this to RAG evaluation, so a regression it reports is a real one rather than judge noise."
    parents:
      - {id: llm-as-a-judge, rel: extends, why: "Adds a statistical correction layer on top of judge scores.", src: "ARES (Saad-Falcon et al. 2023)"}
      - {id: "external:prediction-powered-inference", rel: applies, why: "Uses PPI's rectifier on a human-labeled subset to bound the error of model predictions.", src: "ARES (Saad-Falcon et al. 2023)"}
    maturity: 2
    maturity_note: Used in ARES and research; most production teams still report raw judge scores.
    date: "2023-11"
    ref: {title: "ARES: An Automated Evaluation Framework for Retrieval-Augmented Generation Systems (Saad-Falcon et al.)", arxiv: "2311.09476"}
    examples: [ARES]
    resources:
      - {kind: paper, title: "Prediction-Powered Inference", by: "Anastasios N. Angelopoulos et al.", year: 2023, url: "https://arxiv.org/abs/2301.09633"}
      - {kind: talk, title: "Prediction-Powered Inference", by: "Anastasios Angelopoulos (Simons Institute)", year: 2023, url: "https://www.youtube.com/watch?v=TjEWvEKtJM8"}
      - {kind: code, title: "ppi_py: prediction-powered inference", by: "Anastasios Angelopoulos et al.", year: 2023, url: "https://github.com/aangelopoulos/ppi_py"}
    status: added
  - id: agent-trajectory-evaluation
    name: Agent Trajectory Evaluation
    aliases: [step-level agent evals, trajectory grading, progress rate]
    region: evaluation-and-observability
    also: [agents-and-orchestration]
    layer: detail
    desc: Grading the steps of an agent run, including tool choices, arguments and error recovery, rather than only whether the final state is right.
    summary: "A pass/fail score on an agent task hides where things went wrong. Trajectory evaluation scores the path: which tools the agent picked, whether the calls were well formed, how far it got toward the goal, and whether it recovered from errors. It needs full traces of each run and is how teams find out whether a failure was planning, tool use, or reading the result."
    parents:
      - {id: agent-benchmarks, rel: extends, why: "Adds partial-progress and per-step scoring to outcome-only agent benchmarks.", src: "AgentBoard (Ma et al. 2024)"}
      - {id: llm-tracing, rel: combines, why: "Scores the intermediate steps captured in traces.", src: "AgentBoard (Ma et al. 2024)", confidence: medium}
    maturity: 2
    maturity_note: Widely wanted for debugging agents; no agreed metrics yet, and outcome grading is still preferred where possible.
    date: "2024-01"
    ref: {title: "AgentBoard: An Analytical Evaluation Board of Multi-turn LLM Agents (Ma et al.)", arxiv: "2401.13178"}
    examples: [AgentBoard, LangSmith trajectory evaluators]
    resources:
      - {kind: docs, title: "How to evaluate your agent with trajectory evaluations", by: "LangChain", year: 2025, url: "https://docs.langchain.com/langsmith/trajectory-evals"}
      - {kind: code, title: "agentevals: readymade evaluators for agent trajectories", by: "LangChain", year: 2025, url: "https://github.com/langchain-ai/agentevals"}
      - {kind: blog, title: "Demystifying evals for AI agents", by: "Anthropic", year: 2026, url: "https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents"}
    status: added
  - id: static-context-scoring
    name: Static Context Scoring
    aliases: [context quality scoring, preflight context evaluation]
    region: evaluation-and-observability
    also: [prompting-and-context-engineering]
    layer: detail
    desc: Scoring the quality of an agent's operating context (instructions, tool schemas, guardrails, grounding) before running it, as a predictor of reliability.
    summary: "Grading the context an agent will run with, rather than its behavior: are the role and instructions clear and consistent, are tool schemas well written, is there enough grounding, are guardrails present. One 2026 study found each of these scores predicted the matching behavior, such as grounding predicting hallucination resistance, which makes context a thing you can check before spending on runs. It is one paper so far."
    parents:
      - {id: context-engineering, rel: applies, why: "Treats the assembled context as an object that can be measured on its own.", src: "AI Agents Do Not Fail Alone: The Context Fails First (Bousetouane 2026)"}
      - {id: llm-as-a-judge, rel: applies, why: "Scores context with a panel of model jurors against fixed criteria.", src: "AI Agents Do Not Fail Alone: The Context Fails First (Bousetouane 2026)", confidence: medium}
      - {id: agent-benchmarks, rel: extends, why: "Moves agent evaluation upstream, scoring the context an agent runs with alongside its task outcomes.", src: "AI Agents Do Not Fail Alone: The Context Fails First (Bousetouane 2026)", confidence: medium}
    maturity: 1
    maturity_note: A single 2026 paper with an open-source harness; not yet replicated.
    date: "2026-07"
    ref: {title: "AI Agents Do Not Fail Alone: The Context Fails First (Bousetouane)", arxiv: "2607.14275"}
    examples: [ProofAgent-Harness]
    status: added

  # ---- practitioner staples (2026-10-10) ----
  - id: hallucination-detection
    name: Hallucination Detection
    aliases: [semantic entropy, SelfCheckGPT, groundedness checks, faithfulness checks, uncertainty estimation, confabulation detection]
    region: evaluation-and-observability
    also: [safety-and-security, retrieval-and-knowledge]
    desc: Flagging answers likely to be fabricated, by checking claims against the provided sources or by measuring how much the model's answers disagree across samples.
    summary: "Models state false things fluently, so you need a signal for when to distrust an answer. With sources (RAG), a grounding check asks whether each claim is supported by the retrieved text. Without sources, you sample several answers: if they disagree in meaning (high semantic entropy), the model is probably guessing. These scores gate answers in production, trigger a retry or an \"I don't know\", and feed monitoring."
    parents:
      - {id: self-consistency, rel: applies, why: "Uses disagreement across sampled answers as the warning sign, not as a vote.", src: "SelfCheckGPT (Manakul et al. 2023)"}
      - {id: llm-as-a-judge, rel: applies, why: "Grounding checks prompt a model to verify each claim against the sources.", src: "SelfCheckGPT (Manakul et al. 2023)", confidence: medium}
      - {id: "external:predictive-uncertainty", rel: applies, why: "Brings uncertainty estimation from statistics and ML to free-form generation.", src: "Semantic Uncertainty (Kuhn et al. 2023)"}
    maturity: 3
    maturity_note: Grounding checks are common in RAG products; sampling-based detectors cost several calls and are used selectively.
    date: "2023-03"
    ref: {title: "SelfCheckGPT: Zero-Resource Black-Box Hallucination Detection for Generative Large Language Models (Manakul et al.)", arxiv: "2303.08896"}
    examples: [semantic entropy, SelfCheckGPT, HHEM, Bespoke-MiniCheck, RAGAS faithfulness]
    status: added
  - id: bias-and-fairness-evals
    name: Bias and Fairness Evals
    aliases: [bias benchmarks, fairness testing, BBQ, demographic bias evaluation, counterfactual fairness tests]
    region: evaluation-and-observability
    also: [safety-and-security, governance-and-compliance]
    desc: Tests of whether a model treats demographic groups differently, using benchmark questions or counterfactual prompts that vary only a person's group.
    summary: "Checks whether a model's answers or decisions shift with a person's gender, race, age or other attributes. Benchmarks like BBQ ask questions where a stereotype would push to the wrong answer; counterfactual tests send the same prompt with only the name or group changed and compare outcomes. They appear in model cards, and teams using models for hiring, lending or similar decisions run their own on their actual task, which regulation increasingly requires."
    parents:
      - {id: capability-benchmarks, rel: specializes, why: "Benchmarks aimed at differential treatment rather than skill.", src: "BBQ (Parrish et al. 2021)"}
      - {id: "external:algorithmic-fairness", rel: applies, why: "Carries fairness metrics from classical ML to generated text.", src: "BBQ (Parrish et al. 2021)"}
    maturity: 3
    maturity_note: Reported in model cards and required for high-risk uses; task-specific testing is still uneven.
    date: "2021-10"
    ref: {title: "BBQ: A Hand-Built Bias Benchmark for Question Answering (Parrish et al.)", arxiv: "2110.08193"}
    examples: [BBQ, DiscrimEval, counterfactual name-swap tests]
    status: added

  # ======================= APPLIED: safety-and-security =======================
  - id: prompt-injection
    name: Prompt Injection
    aliases: [instruction injection]
    region: safety-and-security
    desc: Attacks in which text supplied by a user or third party is followed as instructions, overriding the developer's intent.
    summary: "Text from a user or another source is written so that the model follows it as instructions, overriding what the developer told it to do. It works because instructions and data reach the model in the same stream of text, much as SQL injection mixes code and data. There is no complete fix, so defenses aim to lower the odds and limit the damage."
    parents:
      - {id: injection-attacks, rel: applies, why: "The classic data-as-instructions flaw, where data and instructions share one channel.", src: "Ignore Previous Prompt (Perez & Ribeiro 2022)"}
      - {id: zero-shot-prompting, rel: applies, why: "Exploits instruction-following itself.", src: "Ignore Previous Prompt (Perez & Ribeiro 2022)"}
    maturity: 4
    maturity_note: Well-characterized threat; no complete fix.
    date: "2022-09"
    ref: {title: "Ignore Previous Prompt: Attack Techniques For Language Models (Perez & Ribeiro)", arxiv: "2211.09527"}
    examples: []
    resources:
      - {kind: "blog", title: "Prompt injection attacks against GPT-3", by: "Simon Willison", year: 2022, url: "https://simonwillison.net/2022/Sep/12/prompt-injection/"}
      - {kind: "talk", title: "Prompt Injection, explained", by: "Simon Willison", year: 2023, url: "https://www.youtube.com/watch?v=FgxwCaL6UTA"}
      - {kind: "docs", title: "LLM01:2025 Prompt Injection", by: "OWASP Gen AI Security Project", year: 2025, url: "https://genai.owasp.org/llmrisk/llm01-prompt-injection/"}
    status: added
  - id: indirect-prompt-injection
    name: Indirect Prompt Injection
    aliases: [data poisoning of context, tool-output injection, XPIA]
    region: safety-and-security
    also: [agents-and-orchestration]
    desc: Injection delivered through retrieved documents, web pages, emails, or tool outputs rather than the user's own message.
    summary: "The attacker never talks to the model directly. The instructions are hidden in a web page, email, document or tool result that the application pulls into context. Once an assistant can both read outside content and take actions, such as sending email or calling tools, a single poisoned page can make it leak data or act for the attacker. This is the central security problem for agents."
    parents:
      - {id: prompt-injection, rel: specializes, why: "Injection through third-party content.", src: "Not what you've signed up for (Greshake et al. 2023)"}
      - {id: retrieval-augmented-generation, rel: applies, why: "Exploits content pulled into context.", src: "Not what you've signed up for (Greshake et al. 2023)"}
    maturity: 4
    maturity_note: The central security problem for agents.
    date: "2023-02"
    ref: {title: "Not what you've signed up for: Compromising Real-World LLM-Integrated Applications with Indirect Prompt Injection (Greshake et al.)", arxiv: "2302.12173"}
    examples: []
    resources:
      - {kind: "blog", title: "The lethal trifecta for AI agents: private data, untrusted content, and external communication", by: "Simon Willison", year: 2025, url: "https://simonwillison.net/2025/Jun/16/the-lethal-trifecta/"}
      - {kind: "talk", title: "SpAIware & More: Advanced Prompt Injection Exploits in LLM Applications", by: "Johann Rehberger (Black Hat)", year: 2025, url: "https://www.youtube.com/watch?v=84NVG1c5LRI"}
      - {kind: "paper", title: "AgentDojo: A Dynamic Environment to Evaluate Prompt Injection Attacks and Defenses for LLM Agents", by: "Edoardo Debenedetti et al.", year: 2024, url: "https://arxiv.org/abs/2406.13352"}
    status: added
  - id: jailbreaks
    name: Jailbreaks
    aliases: [adversarial prompts, GCG]
    region: safety-and-security
    desc: Inputs crafted to make a model violate its own safety training.
    summary: "Inputs crafted to get a model to break its own safety training and produce content it would normally refuse. They range from hand-written role-play and persuasion to automatically optimized strings of odd tokens (adversarial suffixes such as GCG) that carry over between models. Attackers and defenders have traded moves ever since safety-tuned chat models launched."
    parents:
      - {id: rlhf, rel: counters, why: "Attacks the behaviors instilled by safety training.", src: "Jailbroken (Wei et al. 2023)", confidence: medium}
    maturity: 4
    maturity_note: Well-studied attack class; arms race ongoing.
    date: "2023-07"
    ref: {title: "Jailbroken: How Does LLM Safety Training Fail? (Wei et al.)", arxiv: "2307.02483"}
    examples: [universal adversarial suffixes]
    resources:
      - {kind: "blog", title: "Adversarial Attacks on LLMs", by: "Lilian Weng", year: 2023, url: "https://lilianweng.github.io/posts/2023-10-25-adv-attack-llm/"}
      - {kind: "talk", title: "Ten Years Hence Lecture: Adversarial Attacks on Large Language Models", by: "Zico Kolter (University of Notre Dame)", year: 2024, url: "https://www.youtube.com/watch?v=Ih34Ow9mdSY"}
      - {kind: "paper", title: "Universal and Transferable Adversarial Attacks on Aligned Language Models", by: "Andy Zou et al.", year: 2023, url: "https://arxiv.org/abs/2307.15043"}
      - {kind: "blog", title: "Many-shot jailbreaking", by: "Anthropic", year: 2024, url: "https://www.anthropic.com/research/many-shot-jailbreaking"}
    status: added
  - id: red-teaming
    name: AI Red Teaming
    aliases: [adversarial testing]
    region: safety-and-security
    also: [evaluation-and-observability]
    desc: Systematic adversarial testing by people and models to find harmful behaviors and vulnerabilities before release.
    summary: "Attacking your own system on purpose before release to find harmful outputs and security holes. People do it by hand, and models do it at scale by generating many attack attempts against a target. Major labs run it before every release, and open tools bring the same probing to application teams."
