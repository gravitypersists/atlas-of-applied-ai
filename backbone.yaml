  - id: context-compaction
    name: Context Compaction
    aliases: [prompt compression, summarization of history]
    region: prompting-and-context-engineering
    desc: Compressing, summarizing, or pruning context so long tasks fit within the window without losing what matters.
    summary: "Shrinking what goes into the context window (compressing documents, summarizing old conversation, dropping stale tool output) so long tasks fit and the model stays focused. It saves cost and keeps the signal high."
