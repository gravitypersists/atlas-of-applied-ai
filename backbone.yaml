# Applied AI Engineering Atlas — backbone v0.2
# Repaired from Gemini backbone run (v0.1, 2026-10-08).
# Schema notes:
#   parents[].id      : a node id in this file, or "external:<name>" for an ancestor not yet anchored
#   parents[].rel     : extends | specializes | combines | applies | replaces | counters
#   maturity          : 1 research, 2 emerging, 3 maturing, 4 established, 5 foundational
#   status            : kept (Gemini, unchanged edges) | repaired (Gemini node, edges/dates/refs fixed) | added
#   ref.arxiv         : arXiv id; ref.url for non-arXiv sources
#   layer             : core (default; shown on the overview) | detail (deep-dive content, shown only when zoomed in)
#   summary           : optional plain-language 2–3 sentences for the map panel
#   resources         : optional [{kind, title, by, year, url}] for the panel's "Learn more"; kind in meta.resource_kinds
#   region overview / learning_path : optional reader content for the region panel (learning_path items add `why`)

meta:
  version: "0.2"
  date: "2026-10-08"
  relationship_types:
    extends: adds capability to the parent
    specializes: a narrower variant of the parent
    combines: merges two or more parents (each listed separately)
    applies: uses the parent in a new domain or for a new purpose
    replaces: supersedes the parent for the same job
    counters: a defense or mitigation against the parent (added in v0.2 for attack/defense pairs)
  maturity_tiers:
    1: Research — primarily in papers; few or no production uses
    2: Emerging — early adopters and prototypes; patterns unsettled
    3: Maturing — real production use; best practices still forming
    4: Established — widely used; well-understood tradeoffs
    5: Foundational — assumed infrastructure; rarely discussed as new
  layers: [core, detail]
  resource_kinds: [paper, talk, blog, docs, tutorial, code]

regions:
  # ---------------- root disciplines ----------------
  - id: information-retrieval
    kind: root
    name: Information Retrieval
    definition: Finding relevant material in large collections. Origin of ranking, indexing, and question answering over corpora.
  - id: deep-learning-nlp
    kind: root
    name: Deep Learning and NLP
    definition: Neural networks for language — attention, sequence models, pretraining, transfer learning — that produced the transformer and LLMs. Also holds the few architecture choices engineers actually make (MoE, SSMs).
  - id: symbolic-ai-planning
    kind: root
    name: Symbolic AI and Planning
    definition: Explicit representations, search, and formal planning. Ancestor of tool use, planning-with-verifiers, and neuro-symbolic hybrids.
  - id: reinforcement-learning
    kind: root
    name: Reinforcement Learning
    definition: Learning from reward through interaction. Ancestor of every preference- and verifier-based post-training method.
  - id: knowledge-representation
    kind: root
    name: Knowledge Representation
    definition: Structured, machine-usable models of facts and relations — semantic networks, ontologies, knowledge graphs.
  - id: human-computer-interaction
    kind: root
    name: Human-Computer Interaction
    definition: How people work with computational systems. Ancestor of conversational UX, copilots, and human oversight patterns.
  - id: systems-security
    kind: root
    name: Software and Systems Security
    definition: Protecting systems from misuse — isolation, least privilege, injection attacks. Ancestor of most AI security thinking.
  - id: software-engineering
    kind: root
    name: Software Engineering and Operations
    definition: Practices for building and running reliable software — testing, observability, state machines, protocols. Added in v0.2; the ancestor of evals, tracing, workflows, and MCP.
  - id: robotics-and-control
    kind: root
    name: Robotics and Control
    definition: Getting machines to sense and move in the physical world — control, physics simulation, and learning from demonstration. Ancestor of robot foundation models, sim-to-real transfer, and imitation-based training.

  # ---------------- applied regions ----------------
  - id: inference-and-serving
    kind: applied
    name: Inference and Serving
    title: The Engine Works
    definition: Running models efficiently and cheaply — memory management, batching, quantization, decoding acceleration, caching, and routing between models.
    distinct_from: Treats weights as fixed (vs. Adaptation) and works below the prompt/API layer (vs. Prompting). Decoding-time mechanisms like constrained decoding live here; the practices built on them live in Prompting.
    descends_from: [deep-learning-nlp, software-engineering]
    deep_dive_focus:
      - The 2025–2026 serving stack (disaggregation, KV offload, multi-tier caching) and which techniques became defaults
      - Cost/latency engineering from the application side — routing, cascades, caching APIs
      - Local and on-device inference
    overview: "Inference and serving is the work of running a trained model fast and cheaply. The central fact is that generating text is limited by memory, not arithmetic: a model writes one token at a time, and each step has to read all of its weights plus a KV cache holding attention state for every earlier token. The cache grows with context length and with every concurrent request, and much of this region is about fitting, sharing and shrinking it.\n\nServing engines solved the basic problems first. Continuous batching lets requests join and leave a batch at every step so the GPU never idles, PagedAttention stores the cache in small blocks like virtual memory so little is wasted, and FlashAttention computes attention without moving large matrices through slow memory. Quantization stores weights, and then the cache, in fewer bits, which also makes models small enough for laptops and phones. Speculative decoding has a fast drafter guess several tokens that the big model checks at once.\n\nThe current stack treats the KV cache as data to manage across a cluster. Prompt caching reuses it for shared prefixes, and providers bill cache hits as cheaper input tokens. Chunked prefill keeps long prompts from stalling other users, and disaggregated serving runs prompt processing and token generation on separate machines, shipping the cache between them and offloading it to CPU memory or SSD for reuse. From the application side the main levers are routing easy requests to cheaper models, ordering prompts so caches hit, and constrained decoding for guaranteed output formats. Landmarks worth knowing: the KV cache, continuous batching, PagedAttention, FlashAttention, quantization, speculative decoding and prompt caching. The open questions are mostly economic: how to trade time to first token, streaming speed and cost per token across very different workloads, long-running agents especially."
    learning_path:
      - {kind: blog, title: "Transformer Inference Arithmetic", by: "kipply (Carol Chen)", year: 2022, url: "https://kipp.ly/p/transformer-inference-arithmetic", why: "Works through the memory and compute math of generating one token at a time. It shows why decoding is limited by memory bandwidth and why the KV cache is the main thing to manage."}
      - {kind: blog, title: "Achieve 23x LLM Inference Throughput & Reduce p50 Latency", by: "Cade Daniel et al. (Anyscale)", year: 2023, url: "https://www.anyscale.com/blog/continuous-batching-llm-inference", why: "Explains continuous batching and why paged KV memory makes it work. Read it to see how serving engines keep the GPU busy across many requests."}
      - {kind: blog, title: "A Visual Guide to Quantization", by: "Maarten Grootendorst", year: 2024, url: "https://newsletter.maartengrootendorst.com/p/a-visual-guide-to-quantization", why: "Illustrated tour of number formats and the main weight quantization methods (GPTQ, AWQ, GGUF). It covers the most common way to fit a model into less memory."}
      - {kind: blog, title: "Looking back at speculative decoding", by: "Yaniv Leviathan, Matan Kalman, Yossi Matias (Google Research)", year: 2024, url: "https://research.google/blog/looking-back-at-speculative-decoding/", why: "The original authors explain how a cheap draft model plus one verification pass speeds up decoding without changing outputs. Start here before draft heads like EAGLE and Medusa."}
      - {kind: blog, title: "Fast and Expressive LLM Inference with RadixAttention and SGLang", by: "Lianmin Zheng, Ying Sheng et al. (LMSYS)", year: 2024, url: "https://www.lmsys.org/blog/2024-01-17-sglang/", why: "Shows how reusing the KV cache across requests that share a prefix saves recomputation. This is the mechanism behind prefix and prompt caching."}
      - {kind: talk, title: "DistServe: disaggregating prefill and decoding for goodput-optimized LLM inference", by: "Hao Zhang (PyTorch Expert Exchange)", year: 2024, url: "https://www.youtube.com/watch?v=Bh-jlh5vlF0", why: "Explains why prefill and decode have different bottlenecks and why large deployments now run them on separate GPUs. It ties the earlier pieces into the shape of a modern serving stack."}
  - id: prompting-and-context-engineering
    kind: applied
    name: Prompting and Context Engineering
    title: The Whispering Coast
    definition: Shaping model behavior through inputs — prompt patterns, structured outputs, templates and chains, managing what occupies the context window, and optimizing prompts programmatically.
    distinct_from: No weight updates (vs. Adaptation); operates on text and API payloads rather than tensors (vs. Inference); concerns single calls and context state rather than control flow (vs. Agents).
    descends_from: [deep-learning-nlp, human-computer-interaction]
    deep_dive_focus:
      - The shift from prompt engineering to context engineering, and which techniques it absorbed
      - Programmatic prompt optimization in practice (DSPy, GEPA-style methods, eval-gated prompts)
      - Context management for long-running agents (compaction, note-taking, progressive disclosure)
    overview: "Prompting and Context Engineering is about shaping what a model does purely through what you send it, without touching its weights. It began as prompt engineering: finding instructions and examples that got a pretrained model to do a task. As models went into products, prompts became software: templates, chains, system prompts, and schema-shaped outputs that code can parse.\n\nTwo branches grew from there. Programmatic optimization stops hand-tuning: methods like APE, DSPy and TextGrad generate and score prompt variants against a dataset and a metric, so prompts become compiled artifacts gated by evals. Context engineering arrived with agents: once a model runs for hundreds of turns with tools, the question shifts from how to word an instruction to what should be in the context window at all. Long windows didn't remove the problem, since models still miss material buried in the middle, so compaction, careful ordering, and progressive disclosure keep the working set small and relevant.\n\nLandmarks worth knowing: few-shot prompting, structured outputs, declarative prompt compilation, and context engineering. The direction of travel is from writing prompts to engineering the whole input state, measured by evals."
    learning_path:
      - {kind: blog, title: "Prompt Engineering", by: "Lilian Weng", year: 2023, url: "https://lilianweng.github.io/posts/2023-03-15-prompt-engineering/", why: "A compact map of the basic techniques (zero-/few-shot, example selection, chain-of-thought, automatic prompt design), with the papers behind each, before you go deeper on any one."}
      - {kind: talk, title: "Prompting 101 | Code w/ Claude", by: "Anthropic (Hannah Moran, Christian Ryan)", year: 2025, url: "https://www.youtube.com/watch?v=ysPbXH0LpIE", why: "Watch a production prompt get built and debugged step by step: system prompt, task context, examples, output format."}
      - {kind: paper, title: "Lost in the Middle: How Language Models Use Long Contexts", by: "Nelson F. Liu et al.", year: 2023, url: "https://arxiv.org/abs/2307.03172", why: "The experiment that showed where you put information in a long context changes whether the model uses it, which is why context engineering became its own discipline."}
      - {kind: blog, title: "Effective context engineering for AI agents", by: "Anthropic", year: 2025, url: "https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents", why: "Shifts the question from wording one prompt to curating everything an agent sees over many turns: compaction, note-taking, sub-agents and just-in-time retrieval."}
      - {kind: talk, title: "Let the LLM Write the Prompts: An Intro to DSPy in Compound AI Pipelines", by: "Drew Breunig (Data + AI Summit)", year: 2025, url: "https://www.youtube.com/watch?v=I9ZtkgYZnOw", why: "A 30-minute practitioner case for treating prompts as optimizable parameters, showing a real pipeline improved with an optimizer instead of hand-tuning."}
      - {kind: paper, title: "DSPy: Compiling Declarative Language Model Calls into Self-Improving Pipelines", by: "Omar Khattab et al.", year: 2023, url: "https://arxiv.org/abs/2310.03714", why: "The formal version of that idea: signatures, modules and a compiler that bootstraps demonstrations and instructions against a metric."}
  - id: retrieval-and-knowledge
    kind: applied
    name: Retrieval and Knowledge
    title: The Archival Reach
    definition: Bringing external knowledge into context — embeddings, RAG and its variants, hybrid search, reranking, graph-based and agentic retrieval.
    distinct_from: Goal is answering from a corpus (vs. Agents, which change state). Agentic RAG lives here when the end goal is information.
    descends_from: [information-retrieval, knowledge-representation, deep-learning-nlp]
    deep_dive_focus:
      - Evidence on when long context replaces retrieval and when it doesn't
      - Agentic search (grep/filesystem-style retrieval by agents) vs. index-based RAG
      - Graph-based retrieval beyond GraphRAG, and its real production footprint
    overview: "Retrieval and Knowledge covers how AI systems bring outside facts into the model's context, so answers rest on your documents rather than on what the model memorized. It grew out of classical search (BM25 keyword ranking) and neural embeddings, and took its modern shape in 2020 with retrieval-augmented generation (RAG): find relevant passages, put them in the prompt, generate.\n\nThe basic pipeline of chunk, embed and retrieve fails in predictable ways, and most of the region is fixes for them. Chunks lose their surrounding context, so contextual retrieval, late chunking and parent-document retrieval put it back. A single embedding vector blurs exact terms and fine detail, so production systems combine keyword and vector search, rerank candidates with a cross-encoder, and sometimes keep one vector per token (late interaction). Bad retrieval poisons the answer, so newer designs grade what they retrieved, retrieve again mid-answer, or hand search to an agent that issues its own queries, including grep and file reads over code.\n\nTwo debates shape the region today. Million-token context windows did not make retrieval obsolete: models get distracted by irrelevant material in long contexts, and sending everything costs far more per query, so systems increasingly choose between retrieval and long context per question. Graph-based retrieval answers global, multi-hop questions that passage search can't, but full GraphRAG indexing is expensive, and lighter variants defer most of the work to query time. Landmarks worth knowing: embeddings and dense retrieval, RAG, hybrid search with reranking, contextual retrieval, and agentic RAG."
    learning_path:
    - {kind: talk, title: "Stanford CS25: V3 I Retrieval Augmented Language Models", by: "Douwe Kiela (Stanford CS25)", year: 2024, url: "https://www.youtube.com/watch?v=mE7IDf2SmJg", why: "One of the RAG paper's authors explains why a model's frozen weights go stale and make things up, and how pairing it with a retriever addresses both. A good map of the whole region before the details."}
    - {kind: blog, title: "Embeddings: What they are and why they matter", by: "Simon Willison", year: 2023, url: "https://simonwillison.net/2023/Oct/23/embeddings/", why: "A plain-language walk through what an embedding is and how similarity search over embeddings works, with runnable examples. This is the building block under dense retrieval."}
    - {kind: talk, title: "Beyond the Basics of Retrieval for Augmenting Generation (w/ Ben Clavié)", by: "Ben Clavié (Mastering LLMs conference, hosted by Hamel Husain)", year: 2024, url: "https://www.youtube.com/watch?v=0nA5QG3087g", why: "Lays out the production baseline step by step: keyword search alongside embeddings, a cross-encoder reranker on top, and where late-interaction models fit. Explains why a single vector search is rarely enough."}
    - {kind: blog, title: "Contextual Retrieval in AI Systems", by: "Anthropic", year: 2024, url: "https://www.anthropic.com/engineering/contextual-retrieval", why: "Measures how much each layer of the baseline helps (BM25 plus embeddings, then reranking) and adds one cheap fix: prefixing each chunk with a short note on where it came from before indexing."}
    - {kind: blog, title: "Long Context RAG Performance of LLMs", by: "Databricks", year: 2024, url: "https://www.databricks.com/blog/long-context-rag-performance-llms", why: "Tests whether stuffing more retrieved text into long-context models keeps helping. Most models peak and then decline, which is the practical answer to 'do we still need retrieval?'"}
    - {kind: talk, title: "The unreasonable effectiveness of BM25 for agentic search — Jo Kristian Bergum, Hornet.dev", by: "Jo Kristian Bergum (AI Engineer)", year: 2026, url: "https://www.youtube.com/watch?v=fZH97QHHYjY", why: "When an agent writes its own search queries, they get longer and more specific, and plain keyword search becomes a strong tool again. A useful counterweight as retrieval moves inside agent loops."}
  - id: agents-and-orchestration
    kind: applied
    name: Agents and Orchestration
    title: The Free Cities
    definition: Models acting in environments — tool use, agent loops, workflows vs. autonomous agents, multi-agent systems, memory, protocols, and coding, computer-use, and research agents.
    distinct_from: Changes environment state or runs multi-step control flow (vs. Retrieval, which reads). Reasoning techniques that don't act live in Planning and Reasoning.
    descends_from: [symbolic-ai-planning, software-engineering, deep-learning-nlp]
    deep_dive_focus:
      - Tool-use lineage from MRKL and Toolformer through function calling to MCP and skills
      - Agent harness design (loops, subagents, memory, long-horizon task management)
      - Where production systems sit on the workflow-to-autonomy spectrum in 2026
    overview: "Agents and Orchestration covers models that act: calling tools, running in loops, remembering across sessions, and working with other agents. It began with routing. MRKL sent parts of a request to calculators and APIs, Toolformer trained models to decide when to call tools themselves, and function calling made that a standard API: the model returns a structured call, your code runs it. ReAct wrapped this in the basic agent loop of think, act, observe, repeat.\n\nFully autonomous loops proved expensive and unpredictable in production, so most deployed systems moved back toward workflows: control flow written in code, with the model called only where judgment is needed. Autonomy survives where tasks are open-ended and the environment is safe to explore, above all in coding agents, which now run for hours across many context windows using progress files, memory, and subagents.\n\nProtocols turned tools into shared infrastructure. MCP lets one server work with any client, Agent Skills package know-how an agent loads on demand, and code execution keeps bulky tool results out of the context window. Landmarks worth knowing: function calling, the ReAct loop, workflow graphs, MCP, and coding agents. The direction of travel is toward bounded, well-instrumented agents rather than unconstrained autonomy."
    learning_path:
    - {kind: blog, title: "LLM Powered Autonomous Agents", by: "Lilian Weng", year: 2023, url: "https://lilianweng.github.io/posts/2023-06-23-agent/", why: "One map of the whole field (planning, memory, tool use) with the papers behind each part, so the later readings have somewhere to land."}
    - {kind: talk, title: "LLM Agents: History & Overview (UC Berkeley CS294-196)", by: "Shunyu Yao (Berkeley RDI)", year: 2024, url: "https://www.youtube.com/watch?v=RM6ZArd2nVc", why: "The ReAct author explains how agents grew out of reasoning plus acting, which is the loop every later system still runs."}
    - {kind: blog, title: "Building effective agents", by: "Anthropic", year: 2024, url: "https://www.anthropic.com/engineering/building-effective-agents", why: "Separates workflows (control flow in code) from agents (the model chooses the steps) and names the common patterns, which is the main design choice you will face in practice."}
    - {kind: blog, title: "Writing effective tools for AI agents—using AI agents", by: "Anthropic", year: 2025, url: "https://www.anthropic.com/engineering/writing-tools-for-agents", why: "Most agent failures trace back to tool design, and this covers naming, scoping, response size and how to evaluate tools."}
    - {kind: talk, title: "Building Agents with Model Context Protocol - Full Workshop", by: "Mahesh Murag (Anthropic, AI Engineer Summit)", year: 2025, url: "https://www.youtube.com/watch?v=kQmXtrmQ5Zg", why: "Shows how tools become shared infrastructure through MCP, walking through servers, clients and how an agent uses them."}
    - {kind: blog, title: "Effective harnesses for long-running agents", by: "Anthropic", year: 2025, url: "https://www.anthropic.com/engineering/effective-harnesses-for-long-running-agents", why: "Shows what changes when a task outlasts one context window: progress files, feature lists, one tested increment per session."}
  - id: planning-and-reasoning
    kind: applied
    name: Planning and Reasoning
    title: The Peninsula of Long Thought
    definition: Structured problem solving — the chain-of-thought lineage, search over reasoning, test-time compute and reasoning models, self-reflection, and neuro-symbolic planning with external solvers and verifiers.
    distinct_from: Concerns how a solution is derived, not whether actions are taken (vs. Agents). Training methods that produce reasoning (RLVR, GRPO) live in Adaptation.
    descends_from: [symbolic-ai-planning, deep-learning-nlp, reinforcement-learning]
    deep_dive_focus:
      - Neuro-symbolic planning — LLM+P, LLM-Modulo, LLM-generated PDDL, verifier-in-the-loop systems
      - Test-time compute strategies and when they pay for themselves
      - Faithfulness of reasoning traces and what that means for engineers
    overview: "Planning and Reasoning covers how a model works its way to an answer instead of producing it in one shot. It starts with chain-of-thought: asking the model to write out intermediate steps before answering turned out to unlock multi-step math and logic in large models. Variations followed quickly. Self-consistency samples several chains and takes the majority answer, and program-aided reasoning has the model write code so an interpreter does the arithmetic.\n\nA single chain can't recover from an early mistake, so the next step was search. Tree of Thoughts and its descendants treat partial reasoning as states to expand, score and backtrack from, and process reward models score each step so the search knows where to go. Planning researchers pushed further toward external checking: in LLM-Modulo systems the model only proposes plans and formal verifiers decide whether they are valid.\n\nSince late 2024 much of this has moved inside the model. Reasoning models are trained with reinforcement learning to think at length before answering, and test-time compute became a dial: more thinking or more samples for a better answer at higher cost and latency. Landmarks worth knowing: chain-of-thought, self-consistency, tree search, process reward models, and reasoning models. Open questions are whether the visible reasoning reflects what the model actually computed, which matters for anyone relying on it to monitor behavior, and whether reasoning will move out of text into hidden vectors."
    learning_path:
    - {kind: talk, title: "Stanford CS25: V5 I Large Language Model Reasoning, Denny Zhou of Google Deepmind", by: "Denny Zhou (Stanford CS25)", year: 2025, url: "https://www.youtube.com/watch?v=ebnX5Ur1hBk", why: "One of the people behind chain-of-thought and self-consistency explains why intermediate steps help and how sampling, aggregation and RL fine-tuning build on that, which gives you the frame for everything in this region."}
    - {kind: paper, title: "Chain-of-Thought Prompting Elicits Reasoning in Large Language Models", by: "Jason Wei et al.", year: 2022, url: "https://arxiv.org/abs/2201.11903", why: "The paper that showed a few worked examples with written-out steps make large models much better at math and logic problems. Most later techniques here start from it."}
    - {kind: blog, title: "Why We Think", by: "Lilian Weng", year: 2025, url: "https://lilianweng.github.io/posts/2025-05-01-thinking/", why: "A single long survey of test-time thinking: parallel sampling, sequential revision, search, reward models, latent thinking and faithfulness, with the papers behind each, so the node-level reading has somewhere to land."}
    - {kind: paper, title: "Scaling LLM Test-Time Compute Optimally can be More Effective than Scaling Model Parameters", by: "Charlie Snell et al.", year: 2024, url: "https://arxiv.org/abs/2408.03314", why: "Measures when spending more compute at answer time (search against a verifier, or revising answers) beats using a bigger model, and shows the best strategy depends on how hard the question is."}
    - {kind: blog, title: "Understanding Reasoning LLMs", by: "Sebastian Raschka", year: 2025, url: "https://magazine.sebastianraschka.com/p/understanding-reasoning-llms", why: "Explains how reasoning models like DeepSeek-R1 are actually built (inference-time scaling, pure RL, SFT plus RL, distillation) in plain terms, which connects the prompting techniques above to today's trained thinkers."}
    - {kind: talk, title: "LLM-Modulo Frameworks as Compound AI Architectures for Robust Planning (& Reasoning)", by: "Subbarao Kambhampati", year: 2024, url: "https://www.youtube.com/watch?v=lDCUr2V522o", why: "The skeptic's case: LLMs alone don't plan reliably, so pair them with external verifiers and solvers. Useful for deciding when to trust a model's plan and when to check it."}
  - id: adaptation-and-post-training
    kind: applied
    name: Adaptation and Post-Training
    title: The Tempering Grounds
    definition: Changing weights after pretraining — supervised fine-tuning, parameter-efficient methods, preference optimization, RL from verifiable rewards, distillation.
    distinct_from: Always changes weights, almost always through gradient updates (vs. Prompting); model merging is the exception. Dataset construction lives in Data.
    descends_from: [deep-learning-nlp, reinforcement-learning]
    deep_dive_focus:
      - The post-DPO and post-R1 landscape — which preference and RL methods practitioners actually use
      - Fine-tuning for application teams (when to fine-tune vs. prompt vs. retrieve)
      - Distillation of frontier capabilities into small models
    overview: "Adaptation and Post-Training covers everything done to a model's weights after pretraining. Pretraining produces a model that continues text; post-training turns it into an assistant that follows instructions, matches a style, behaves safely, or reasons through hard problems. Prompting and retrieval change what a model sees, while this region changes the model itself.\n\nThe classic recipe, popularized by InstructGPT, has three stages: supervised fine-tuning on example answers, a reward model trained on human comparisons, and reinforcement learning (PPO) against that reward. It works but runs several models at once, and most later methods simplify it. DPO trains directly on pairs of preferred and rejected answers with no reward model or RL loop, and spawned variants for unpaired thumbs-up data (KTO), single-stage training (ORPO), and fresh samples from the model being trained (online DPO). Constitutional AI replaced much of the human labeling with AI feedback. Reasoning models brought RL back: RL with verifiable rewards scores answers with checkers such as unit tests, and GRPO drops PPO's critic model to make that affordable. Distillation then passes the resulting skills on to small models.\n\nFor application teams, the practical tools are parameter-efficient. LoRA trains small add-on matrices instead of the full model, QLoRA does so over a 4-bit base on a single GPU, and DoRA and ReFT push efficiency further. Model merging combines fine-tunes by weight arithmetic with no training at all. Landmarks worth knowing: SFT, LoRA, RLHF, DPO, RLVR with GRPO, and distillation."
    learning_path:
      - {kind: docs, title: "Training Overview (RLHF Book)", by: "Nathan Lambert", year: 2025, url: "https://rlhfbook.com/c/03-training-overview", why: "A map of the modern post-training pipeline: instruction tuning, preference tuning and RL, and how labs chain them. Read it first so every later technique has a place to sit."}
      - {kind: talk, title: "Stanford CS336 Language Modeling from Scratch | Spring 2025 | Lecture 15: Alignment - SFT/RLHF", by: "Percy Liang, Tatsunori Hashimoto (Stanford Online)", year: 2025, url: "https://www.youtube.com/watch?v=Dfu7vC9jo4w", why: "A university lecture that walks from supervised fine-tuning to the classic RLHF setup, with the data and objectives spelled out. It gives the foundation the rest of the path builds on."}
      - {kind: blog, title: "LoRA Without Regret - Thinking Machines Lab", by: "John Schulman et al. (Thinking Machines)", year: 2025, url: "https://thinkingmachines.ai/blog/lora/", why: "Careful experiments on when low-rank fine-tuning matches full fine-tuning and which settings matter. It is the practical side of adapting a model on a budget."}
      - {kind: blog, title: "LLM Training: RLHF and Its Alternatives", by: "Sebastian Raschka", year: 2023, url: "https://magazine.sebastianraschka.com/p/llm-training-rlhf-and-its-alternatives", why: "Explains the reward-model-plus-PPO recipe and the simpler preference methods (DPO and others) that grew up around it. Read it to see why the preference-optimization family exists."}
      - {kind: blog, title: "The State of Reinforcement Learning for LLM Reasoning", by: "Sebastian Raschka", year: 2025, url: "https://magazine.sebastianraschka.com/p/the-state-of-llm-reasoning-model-training", why: "Covers RL with verifiable rewards, GRPO and the reasoning-model papers that followed DeepSeek-R1. It brings the region up to the current frontier."}
      - {kind: talk, title: "The Rise of Reasoning Models | Post-Training Course Lecture 5", by: "Nathan Lambert", year: 2026, url: "https://www.youtube.com/watch?v=o4AB5xHIDdM", why: "A lecture from someone who builds open post-training recipes, on how RL for reasoning is done in practice. A good closing view of where post-training is heading."}
  - id: data-and-synthetic-data
    kind: applied
    name: Data and Synthetic Data
    title: The Quarries
    definition: Creating, curating, and cleaning the data an AI system is built, tuned and tested on — golden and eval sets, model-assisted labeling, data flywheels from production traffic, synthetic generation, and corpus hygiene (deduplication, decontamination, quality filtering).
    distinct_from: Produces datasets (vs. Adaptation, which consumes them; vs. Evaluation, which uses them to measure).
    descends_from: [deep-learning-nlp, information-retrieval]
    deep_dive_focus:
      - Data work for application teams — golden and eval sets, synthetic test cases, LLM labeling with human review, mining production traces and feedback (the data flywheel)
      - Synthetic data for teams adapting models — task-specific generation, distillation data, verification and filtering of generated examples
      - Environments and task generation for agentic RL
      - Lab-scale corpus work (pretraining dedup, quality classifiers, synthetic pretraining corpora) only as background; keep it to detail-layer nodes
    overview: "Data and Synthetic Data is about making the datasets an AI system is tested, tuned and trained on. For an application team that mostly means two things. The first is a golden set: real requests and known failures, labeled by someone who knows the domain, that every change is tested against. The second is a data flywheel that keeps that set, and any fine-tuning data, growing from production traces and user feedback. Models now do much of the labeling, with people reviewing samples and hard cases.\n\nWhen real data runs short, models generate it. Self-Instruct showed in 2022 that a model can write an entire instruction dataset from a handful of seed tasks; Evol-Instruct made the generated tasks harder, and instruction backtranslation grounded them in human-written text. The same idea now produces RAG test questions from a company's own documents and, for agents, whole sandboxed tasks with automatic checks whose successful runs become training data. Generated data needs filtering as much as generating: near-duplicates, wrong answers and easy examples are thrown out, and a few thousand well-chosen examples often beat a much larger set.\n\nUnder this sits corpus hygiene, mostly the work of labs training base models: removing duplicates, filtering web text for quality, scrubbing personal information, and keeping test questions out of training data. A recurring worry is model collapse, where models trained only on earlier models' output lose rare knowledge over generations; keeping real data in the mix and checking generated examples against tests or solvers avoids it in practice. Landmarks worth knowing: golden sets, LLM-assisted labeling, the data flywheel, Self-Instruct, and decontamination."
    learning_path:
      - {kind: blog, title: "Your AI Product Needs Evals", by: "Hamel Husain", year: 2024, url: "https://hamel.dev/blog/posts/evals/", why: "Shows how a team builds its first eval set from real traces, unit-style checks and human review, using one product as the running example. Start here because the golden set is what every other dataset in this region gets measured against."}
      - {kind: blog, title: "A Field Guide to Rapidly Improving AI Products", by: "Hamel Husain", year: 2025, url: "https://hamel.dev/blog/posts/field-guide/", why: "Covers error analysis, a custom data viewer and domain-expert review as a repeating loop. Read it second because it turns a one-off eval set into a flywheel fed by production traffic."}
      - {kind: blog, title: "Generative Benchmarking", by: "Kelly Hong, Anton Troynikov, Jeff Huber (Chroma)", year: 2025, url: "https://www.trychroma.com/research/generative-benchmarking", why: "Generates test queries from your own documents, filters them, and checks them against real user queries. It is the first synthetic-data technique most application teams need, for testing retrieval before there is traffic."}
      - {kind: blog, title: "Synthetic data: save money, time and carbon with open source", by: "Moritz Laurer (Hugging Face)", year: 2024, url: "https://huggingface.co/blog/synthetic-data-save-costs", why: "Uses a large model to label data, has a person check the labels, and trains a small classifier on the result. It shows LLM labeling end to end, including where human review still matters."}
      - {kind: docs, title: "Synthetic Data & Distillation (RLHF Book)", by: "Nathan Lambert", year: 2025, url: "https://rlhfbook.com/c/12-synthetic-data", why: "Surveys how labs generate instruction, preference and feedback data with models, from Alpaca to on-policy distillation. Read it once you have used synthetic data yourself and want the wider landscape behind Self-Instruct and its successors."}
      - {kind: blog, title: "FineWeb: decanting the web for the finest text data at scale", by: "Guilherme Penedo et al. (Hugging Face)", year: 2024, url: "https://huggingface.co/spaces/HuggingFaceFW/blogpost-fineweb-v1", why: "Walks through deduplication, heuristic filters and a model-based quality classifier, with an ablation for each step. It comes last because it covers lab-scale corpus hygiene, which application teams mostly inherit rather than run."}
  - id: evaluation-and-observability
    kind: applied
    name: Evaluation and Observability
    title: The Watchtowers
    definition: Measuring and debugging AI systems — benchmarks, LLM-as-judge, eval-driven development, RAG and agent evals, tracing, and production monitoring.
    distinct_from: Measures and observes; does not change behavior. Reward models used for training or search live in Reasoning or Adaptation.
    descends_from: [software-engineering, deep-learning-nlp]
    deep_dive_focus:
      - Agent evaluation (trajectories, environments, SWE-bench-style harnesses)
      - Judge reliability and calibration; human vs. model graders
      - Observability standards (OpenTelemetry GenAI conventions) and online evals
    overview: "Evaluation and Observability is how teams find out whether an AI system works, and why it doesn't. Old NLP metrics like BLEU and ROUGE counted word overlap with a reference answer, which says nothing about whether an open-ended answer is right, so the field rebuilt measurement around benchmarks, human preference votes, and, above all, models grading other models.\n\nLLM-as-a-judge is the region's center. A strong model with a rubric agrees with human raters about as often as humans agree with each other, which made evaluation cheap enough to run on every change. Most of what surrounds it is about making judges trustworthy: swapping answer order to cancel position bias, reading score probabilities instead of a single number, training small dedicated judge models, and using a few human labels to correct a judge's aggregate score. Specialized evals grew out of this for RAG (was the right context found, and is the answer grounded in it?), for long context (can the model find a needle in a haystack?), and for agents, where benchmarks like SWE-bench check whether a task got done and trajectory evals grade the steps along the way.\n\nThe engineering side borrows from software practice. Eval-driven development runs eval suites in CI the way tests gate code, layering cheap deterministic checks under model-graded ones. Tracing records each model call, retrieval and tool call as spans, now with shared OpenTelemetry conventions, and online evaluation scores sampled production traffic to catch drift. Landmarks worth knowing: capability and agent benchmarks, LLM-as-a-judge, RAG evaluation, eval-driven development, and tracing."
    learning_path:
      - {kind: blog, title: "Your AI Product Needs Evals", by: "Hamel Husain", year: 2024, url: "https://hamel.dev/blog/posts/evals/", why: "The clearest case for why evals sit at the centre of building with LLMs, and how unit tests, human review and model graders fit together."}
      - {kind: blog, title: "Let's talk about LLM evaluation", by: "Clémentine Fourrier (Hugging Face)", year: 2024, url: "https://huggingface.co/blog/clefourrier/llm-evaluation", why: "A tour of the three ways models get scored (automatic benchmarks, human judges, model judges) from someone who ran the Open LLM Leaderboard. It shows what public benchmarks can and cannot tell you."}
      - {kind: blog, title: "Using LLM-as-a-Judge For Evaluation: A Complete Guide", by: "Hamel Husain", year: 2024, url: "https://hamel.dev/blog/posts/llm-judge/", why: "How to build a model grader that agrees with a domain expert, step by step. This is the workhorse technique of the whole region."}
      - {kind: blog, title: "Evaluating the Effectiveness of LLM-Evaluators (aka LLM-as-Judge)", by: "Eugene Yan", year: 2024, url: "https://eugeneyan.com/writing/llm-evaluators/", why: "A survey of the research on model judges: their biases, when they agree with people, and the fine-tuned alternatives. Read it once you have built a judge and want to know where it can fail."}
      - {kind: blog, title: "Demystifying evals for AI agents", by: "Anthropic", year: 2026, url: "https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents", why: "Carries the ideas over to agents, where a task has many steps and you grade both the outcome and the path taken."}
      - {kind: docs, title: "Evaluate Production Traffic - Langfuse", by: "Langfuse", year: 2025, url: "https://langfuse.com/docs/evaluation/get-started/online", why: "Closes the loop: run the same graders on sampled live traces, so evaluation continues after you ship."}
  - id: safety-and-security
    kind: applied
    name: Safety and Security
    title: The Bulwark
    definition: Keeping AI systems from causing harm — prompt injection and jailbreaks, guardrails and defenses, red teaming, sandboxing and permissions, and interpretability as a control tool.
    distinct_from: Primary purpose is risk reduction. Uses techniques from Prompting (guardrails) and Evaluation (red teaming) but is defined by intent. Policies, regulation, standards and documentation that govern AI systems live in Governance.
    descends_from: [systems-security, deep-learning-nlp, human-computer-interaction]
    deep_dive_focus:
      - Prompt injection in agentic systems — attack taxonomy and the defenses that hold up
      - Agent permissions, sandboxing, and least privilege for tools and MCP servers
      - Interpretability methods that have reached engineering use
    overview: "Safety and Security covers keeping AI systems from causing harm, whether through attacks, mistakes or misuse. Early on that meant filtering offensive output. Once models could read outside content and take actions, it became a security field: prompt injection showed that any text a model reads can act as an instruction, and agents with tools turned that into a way to leak data or take actions for an attacker.\n\nDefenses come in layers because none is complete. Guardrails screen what goes in and out. Injection defenses help the model tell instructions from data, by training it to rank sources by privilege (the instruction hierarchy), by marking untrusted text (spotlighting), or by designing the system so the model that reads untrusted text cannot act (the dual LLM pattern). Sandboxing and scoped permissions limit how much damage a hijacked agent can do. Red teaming, increasingly automated with attacker models, looks for the gaps before release.\n\nInterpretability is starting to become a control tool as well as a research field. Sparse autoencoders and representation engineering find concepts inside a model's activations, and circuit breakers and unlearning act on them directly. Landmarks worth knowing: prompt injection and its indirect form, guardrails, agent sandboxing, and red teaming."
    learning_path:
      - {kind: "docs", title: "OWASP Top 10 for LLM Applications (2025)", by: "OWASP Gen AI Security Project", year: 2025, url: "https://genai.owasp.org/llm-top-10/", why: "A checklist of the ten risks that come up most in real LLM applications, from prompt injection to excessive agency. It gives you the vocabulary and the overall picture before any one topic."}
      - {kind: "talk", title: "Prompt Injection, explained", by: "Simon Willison", year: 2023, url: "https://www.youtube.com/watch?v=FgxwCaL6UTA", why: "The person who named prompt injection explains why mixing trusted instructions with untrusted text is the root problem, and why filters and clever prompting do not fix it."}
      - {kind: "blog", title: "Design Patterns for Securing LLM Agents against Prompt Injections", by: "Simon Willison", year: 2025, url: "https://simonwillison.net/2025/Jun/13/prompt-injection-design-patterns/", why: "A readable summary of six system designs (plan-then-execute, dual LLM, code-then-execute and others) that limit what injected text can do. The defences come from how the system is built rather than from the model."}
      - {kind: "blog", title: "Making Claude Code more secure and autonomous with sandboxing", by: "Anthropic", year: 2025, url: "https://www.anthropic.com/engineering/claude-code-sandboxing", why: "A worked example of limiting an agent's damage through filesystem and network isolation. It also shows how a sandbox cuts the number of permission prompts a user has to answer."}
      - {kind: "paper", title: "Lessons From Red Teaming 100 Generative AI Products", by: "Blake Bullwinkel et al. (Microsoft AI Red Team)", year: 2025, url: "https://arxiv.org/abs/2501.07238", why: "Eight practical lessons from testing real products: start from what the system can actually do, simple attacks often beat gradient-based ones, and automation helps but humans still matter."}
      - {kind: "talk", title: "Interpretability: Understanding how AI models think", by: "Anthropic (Josh Batson, Emmanuel Ameisen, Jack Lindsey)", year: 2025, url: "https://www.youtube.com/watch?v=fGKNUvivvnc", why: "Three researchers explain in plain terms how they look inside a model to see what it is computing, and why that could become a way to check and steer behaviour rather than only test outputs."}
  - id: ai-product-and-interaction-design
    kind: applied
    name: AI Product and Interaction Design
    title: The Agora
    definition: How AI shows up for users — chat and copilot patterns, streaming, citations and grounding, human-in-the-loop approval, generative UI and canvases, trust and error recovery.
    distinct_from: Defined by the human-facing experience, not the backend mechanism.
    descends_from: [human-computer-interaction]
    deep_dive_focus:
      - Interaction patterns for agents (delegation, background work, approvals, handoff)
      - Trust calibration, uncertainty display, and error recovery
      - Evidence from HCI research on what actually helps users
    overview: "AI Product and Interaction Design is about how AI reaches people: the screens, conversations and controls that sit between a model and its user. It grew out of HCI work on mixed-initiative systems, and Microsoft's 2019 guidelines for human-AI interaction still frame the basics: set expectations, explain behavior, make correction cheap.\n\nThe modern era began with two surfaces. Copilots (2021) put suggestions inline where users already work, and chat (2022) made a message thread the default way to talk to a model. Streaming made replies feel fast, and citations let users check grounded answers. Chat's linear thread is a poor place to build something, so canvases and artifacts moved the work product into an editable pane beside the conversation, and generative UI lets the model answer with interface components instead of prose.\n\nAgents shifted the focus from what the model says to what it does. Approval gates pause before consequential actions, plan previews let users fix a plan before work starts, and action traces show what actually happened. Recent studies find that reviewing only an agent's final result misses errors made early in the run, which is pushing products toward step-level visibility and steering. Reasoning models added a visible thinking panel, which helps users follow along but is not a faithful explanation of how the answer was reached.\n\nLandmarks worth knowing: the human-AI interaction guidelines, chat, copilots, citations, and human-in-the-loop approval. The open problem is trust calibration: getting users to rely on AI when it is right and check it when it is not, as outputs become longer, more autonomous and harder to verify."
    learning_path:
    - {kind: blog, title: "Guidelines for human-AI interaction design", by: "Microsoft Research (Saleema Amershi et al.)", year: 2019, url: "https://www.microsoft.com/en-us/research/blog/guidelines-for-human-ai-interaction-design/", why: "The 18 tested guidelines (set expectations, support correction, explain behavior, adapt over time) give a checklist that still applies to every pattern later in this region."}
    - {kind: blog, title: "Why Chatbots Are Not the Future of Interfaces", by: "Amelia Wattenberger", year: 2023, url: "https://wattenberger.com/thoughts/boo-chatbots/", why: "Explains what a bare text box hides from users (what the tool can do, how to ask) and why most AI features need more structure than chat."}
    - {kind: talk, title: "Generative Interfaces Beyond Chat", by: "Linus Lee (LLMs in Production Conference)", year: 2023, url: "https://www.youtube.com/watch?v=rd-J3hmycQs", why: "Shows concrete alternatives to chat, with the model's output turned into things the user can see, point at and edit directly."}
    - {kind: blog, title: "Agentic UX Patterns: A Practical Guide to Designing AI That Acts", by: "Ali Tajer", year: 2026, url: "https://alitajer.com/blog/agentic-ux-patterns", why: "Covers the shift from answering to acting: plan previews, approvals, live action traces, and pause, stop and take-over controls, each with when to use it."}
    - {kind: talk, title: "AI Agent UX Patterns: Lessons From 1000 Startups", by: "Jonas Braadbaart (aiGrunn)", year: 2024, url: "https://www.youtube.com/watch?v=3kiTAGa7VFI", why: "A survey of how shipped agent products actually present their work to users, and which of those patterns hold up."}
    - {kind: paper, title: "Overreliance on AI: Literature Review", by: "Samir Passi, Mihaela Vorvoreanu (Microsoft)", year: 2022, url: "https://www.microsoft.com/en-us/research/publication/overreliance-on-ai-literature-review/", why: "Explains why people accept wrong AI output and which interface choices (explanations, uncertainty, friction) help them check it instead."}
  - id: multimodal-applied
    kind: applied
    name: Multimodal
    title: The Painted Isles
    definition: Vision, speech, documents, and generated media as used in applications — vision-language models, realtime voice, document understanding, image and video generation.
    distinct_from: Covers modality-specific engineering; general orchestration of multimodal agents lives in Agents.
    descends_from: [deep-learning-nlp]
    deep_dive_focus:
      - Document understanding pipelines (VLM parsing vs. OCR) and visual retrieval
      - Realtime voice agents — latency, turn-taking, interruption
      - Video understanding and generation as application building blocks
    overview: "Multimodal covers AI that works with images, audio, video and documents, not just text. It started with alignment: CLIP (2021) trained image and text encoders so a picture and its caption land close together, giving models a shared vocabulary for both. Vision-language models then fed those image vectors into a language model as extra tokens, and training on visual instructions turned them into assistants that read screenshots, charts and photos. Later models take images at their native resolution, which made small text and dense layouts readable, and sample frames to follow video.\n\nDocuments were one of the first places this paid off. Pipelines that chain layout detection and OCR lose reading order and garble tables, so vision models that read a whole page and output structured text are replacing them, and visual retrieval such as ColPali searches page images directly. Speech went the same way. Whisper made transcription a commodity, audio language models turned sound into tokens a language model can predict, and realtime voice moved from slow recognize-think-speak chains to single models that hear and speak audio, some of them listening and talking at once.\n\nGeneration runs on a separate line. Diffusion models create images by removing noise step by step; latent diffusion made text-to-image practical, transformers replaced the U-Net inside, and flow matching cut the number of steps. The same machinery, applied to patches across space and time, produces video. Landmarks worth knowing: CLIP, vision-language models, document understanding, Whisper, realtime voice, and latent diffusion. The open problems are mostly practical: images and audio use many tokens, so cost and latency dominate design, and generated video and speech still need better control."
    learning_path:
    - {kind: blog, title: "Multimodality and Large Multimodal Models (LMMs)", by: "Chip Huyen", year: 2023, url: "https://huyenchip.com/2023/10/10/multimodal.html", why: "Explains why models need more than text, then walks through CLIP and Flamingo, the two designs most later vision-language systems build on."}
    - {kind: blog, title: "Vision Language Models (Better, faster, stronger)", by: "Hugging Face (Merve Noyan, Sergio Paniego et al.)", year: 2025, url: "https://huggingface.co/blog/vlms-2025", why: "A current survey of how vision-language models are built and used: model families, video input, smaller models, and the uses engineers actually ship."}
    - {kind: blog, title: "ColPali: Efficient Document Retrieval with Vision Language Models", by: "Manuel Faysse (Hugging Face blog)", year: 2024, url: "https://huggingface.co/blog/manu/colpali", why: "Shows the problem with text-extraction pipelines for PDFs and how searching page images directly avoids it, which is the core idea of the documents part of this region."}
    - {kind: blog, title: "Voice AI & Voice Agents: An Illustrated Primer", by: "Kwindla Hultman Kramer (Daily)", year: 2025, url: "https://voiceaiandvoiceagents.com/", why: "A practical guide to building voice agents: the latency budget, transcription, turn detection, interruptions, and when to use speech-to-speech models instead of a pipeline."}
    - {kind: blog, title: "The Illustrated Stable Diffusion", by: "Jay Alammar", year: 2022, url: "https://jalammar.github.io/illustrated-stable-diffusion/", why: "Pictures each part of a latent diffusion image generator (text encoder, denoiser, image decoder) and how a prompt steers the denoising."}
    - {kind: talk, title: "Building Generative Image & Video models at Scale", by: "Sander Dieleman (Google DeepMind, AI Engineer)", year: 2026, url: "https://www.youtube.com/watch?v=xOP1PM8fwnk", why: "Covers how today's image and video generators are built, from latent spaces and denoising to conditioning and post-training, from someone who works on Veo."}
  - id: embodied-ai-and-world-models
    kind: applied
    name: Embodied AI and World Models
    title: The Clockwork Marches
    definition: Foundation models that act in the physical world or simulate it — vision-language-action policies, robot learning from demonstrations, language-model task planning for robots, sim-to-real transfer, and world models that predict how an environment responds to actions.
    distinct_from: Agents that act through software (APIs, browsers, desktops) stay in Agents. Perception-only vision and passive video generation stay in Multimodal. RL algorithms themselves stay in the Reinforcement Learning root.
    descends_from: [robotics-and-control, reinforcement-learning, deep-learning-nlp]
    node_target: "10–18"
    deep_dive_focus:
      - Action representations in VLAs (tokenized actions, diffusion and flow action heads, action chunking) and which ones are winning
      - The data bottleneck — teleoperation, cross-embodiment datasets, simulation, and learning from human video
      - World models — latent imagination for RL vs. generative interactive environments, and their use as simulators for training and policy evaluation
      - Hierarchical systems (a language model plans over learned skills) vs. end-to-end VLAs
      - What an engineer outside a robotics lab actually touches — fine-tuning an open VLA, on-robot inference latency, evaluating policies safely
    overview: "Embodied AI is about models that act in the physical world, or that simulate it well enough to train in. Classical robotics planned every motion explicitly and broke whenever the scene differed from what its engineers expected. The modern approach learns a policy, a model that maps camera images and an instruction to motor commands, from demonstrations, simulation and large pretrained models.\n\nThe field moved fast after 2022. Language models first entered as planners that picked from a robot's fixed list of skills (SayCan) or wrote code against its control API. Then vision-language-action models (RT-2, OpenVLA, π0) fine-tuned a vision-language model to output actions directly. How to output those actions became the central design question: discrete tokens were coarse, diffusion policies handled demonstrations that do a task several ways but were slow, and flow-matching action heads made smooth, high-rate control practical. Most current systems split the work: a slow vision-language model reasons about the scene a few times a second while a fast action policy drives the motors.\n\nThe hard limit is data. Robot demonstrations are expensive, so teams pool data across robot types, collect it with cheap teleoperation rigs, pretrain on human video, and train in simulation, increasingly with generated images or interactive world models standing in for the real world. Landmarks worth knowing: sim-to-real transfer, diffusion policy, action chunking, VLAs, and cross-embodiment training. The open problems are reliability outside the lab, evaluating policies without running them on real robots, and pushing past what imitation alone can teach, with reinforcement learning fine-tuning as the current bet."
    learning_path:
    - {kind: talk, title: "Chelsea Finn: Building Robots That Can Do Anything", by: "Chelsea Finn (Y Combinator AI Startup School)", year: 2025, url: "https://www.youtube.com/watch?v=a8-QsBHoH94", why: "A plain-spoken overview from a Physical Intelligence co-founder of why robots are hard, where the data comes from, and how one general model learned laundry folding and table bussing."}
    - {kind: blog, title: "SmolVLA: Efficient Vision-Language-Action Model trained on Lerobot Community Data", by: "Hugging Face (Dana Aubakirova et al.)", year: 2025, url: "https://huggingface.co/blog/smolvla", why: "Shows how a vision-language-action model is put together (a small VLM plus an action head), trained on community-collected robot data, and made fast enough to run on modest hardware."}
    - {kind: docs, title: "Imitation Learning on Real-World Robots", by: "Hugging Face LeRobot", year: 2025, url: "https://huggingface.co/docs/lerobot/il_robots", why: "The hands-on loop an engineer actually runs: record teleoperated demonstrations, train a policy, and evaluate it on a low-cost arm."}
    - {kind: blog, title: "Domain Randomization for Sim2Real Transfer", by: "Lilian Weng", year: 2019, url: "https://lilianweng.github.io/posts/2019-05-05-domain-randomization/", why: "Explains the simulation side of the data problem: why policies trained in a simulator fail on real robots and how randomizing the simulator closes the gap."}
    - {kind: talk, title: "Robot Learning 2026 – Lecture 8: World Models", by: "Oier Mees (ETH Zürich)", year: 2026, url: "https://www.youtube.com/watch?v=cTTmUZlOF2s", why: "A recent lecture that connects the two meanings of world model, learned simulators for planning and RL and generative interactive environments, and how each is used to train or test robot policies."}
    - {kind: paper, title: "A Survey on Vision-Language-Action Models for Embodied AI", by: "Yueen Ma et al.", year: 2024, url: "https://arxiv.org/abs/2405.14093", why: "A map of the field to come back to: the main model families, action representations, datasets and benchmarks in one place."}

  - id: governance-and-compliance
    kind: applied
    name: Governance and Compliance
    title: The Chancery
    definition: The rules, records and commitments around AI systems — model and system documentation, risk management frameworks and management-system standards, regulation such as the EU AI Act, frontier safety frameworks and the dangerous-capability evaluations that trigger them, content provenance, and training-data licensing.
    distinct_from: Defined by accountability to someone outside the engineering team (regulators, auditors, the public, rights holders). The technical controls these rules require live in their own regions (guardrails and sandboxing in Safety, eval harnesses in Evaluation, data pipelines in Data).
    descends_from: [systems-security, software-engineering]
    node_target: "8–14"
    deep_dive_focus:
      - What compliance work actually lands on an engineering team — EU AI Act obligations for providers and deployers, GPAI obligations and the Code of Practice, and how teams map them to NIST AI RMF and ISO/IEC 42001
      - Frontier safety frameworks and dangerous-capability evaluations — capability thresholds, safeguard levels, third-party testing, and how they show up in system cards
      - Content provenance in practice — C2PA content credentials, invisible watermarks for images, audio and text, and where each breaks
      - Training-data rights — licensing, opt-outs (robots.txt, AI crawler controls), dataset provenance audits, and copyright litigation as it affects what data teams can use
      - Documentation and transparency artifacts beyond the model card (system cards, AI bills of materials, incident reporting) and which ones are becoming standard
    overview: "The Governance and Compliance region covers what an AI team owes to people outside it: regulators, auditors, customers, the public and the owners of the data it trains on. It began with documentation. Model cards (2018) set out what a model is for, how it was evaluated and where it fails, and today's system cards, often running to hundreds of pages, grew out of them.\n\nFrom 2023 the voluntary principles turned into frameworks and law. NIST's AI Risk Management Framework gave teams a shared process for finding and managing risk, ISO/IEC 42001 made it certifiable, and the EU AI Act (in force from 2024, with duties phasing in through 2027) made it binding for high-risk systems and general-purpose models. The EU's Code of Practice then spelled out what model providers actually have to produce: a standard documentation form, a copyright policy that honors crawler opt-outs, and for the largest models a safety and security framework with evaluations and incident reporting.\n\nFrontier labs built their own rules for extreme risks. Dangerous-capability evaluations test whether a model could help with bioweapons or cyberattacks or act autonomously, and frontier safety frameworks such as Anthropic's Responsible Scaling Policy commit the lab to stronger safeguards, or a pause, once a threshold is crossed. In August 2026 OpenAI paused RL training for two weeks after it could not rule out that Astra had reached its Critical cyber threshold. Critics point out that the labs write and enforce these rules themselves.\n\nTwo further problems involve what models consume and produce. Content provenance (C2PA) signs media with a record of how it was made, though the metadata is easily stripped, so it is paired with watermarks. On the input side, audits found widespread license errors in training datasets and a fast rise in sites blocking AI crawlers, which pushed teams toward tracking licenses and buying data. Landmarks worth knowing: model cards, the NIST AI RMF, the EU AI Act, frontier safety frameworks and C2PA."
    learning_path:
    - {kind: docs, title: "High-level summary of the AI Act", by: "Future of Life Institute", year: 2024, url: "https://artificialintelligenceact.eu/high-level-summary/", why: "A short, plain-language walk through the Act's risk tiers and who has which duties. Read it first to see where your own system falls."}
    - {kind: docs, title: "NIST AI RMF Playbook", by: "NIST", year: 2023, url: "https://airc.nist.gov/airmf-resources/playbook/", why: "Turns the govern, map, measure and manage functions into concrete suggested actions, the most practical way into the vocabulary most AI risk programs use."}
    - {kind: talk, title: "Dangerous Capability Evals: Basis for Frontier Safety", by: "Mary Phuong (Google DeepMind, FAR.AI)", year: 2024, url: "https://www.youtube.com/watch?v=pO8IcIqhHuk", why: "Explains how labs test for severe-harm capabilities such as cyber offense, persuasion and self-proliferation, and why these tests are the trigger in a frontier safety framework."}
    - {kind: blog, title: "Common Elements of Frontier AI Safety Policies", by: "METR", year: 2025, url: "https://metr.org/common-elements", why: "Compares the published frontier safety frameworks side by side: thresholds, evaluations, safeguards and accountability, so you can read any one lab's policy in context."}
    - {kind: docs, title: "C2PA and Content Credentials Explainer", by: "C2PA", year: 2025, url: "https://spec.c2pa.org/specifications/specifications/2.2/explainer/Explainer.html", why: "The standard's own non-specialist explainer of manifests, signing and verification, including what provenance can and cannot prove."}
    - {kind: paper, title: "Consent in Crisis: The Rapid Decline of the AI Data Commons", by: "Shayne Longpre et al.", year: 2024, url: "https://arxiv.org/abs/2407.14933", why: "Measures how fast websites have restricted AI crawlers and how often robots.txt and terms of service disagree, the data behind today's licensing and opt-out practice."}

boundary_rules:
  - {concept: ReAct, home: agents-and-orchestration, rule: "Defined by acting in an environment via tools → Agents."}
  - {concept: Tree of Thoughts / tree search, home: planning-and-reasoning, rule: "Searches over generated reasoning paths without changing the world → Reasoning."}
  - {concept: Reflexion / self-reflection, home: planning-and-reasoning, rule: "Improves a solution via critique, even when the loop runs in an agent → Reasoning."}
  - {concept: Structured outputs, home: prompting-and-context-engineering, rule: "The practice lives in Prompting; the decoding mechanism (constrained decoding) lives in Inference."}
  - {concept: Agentic RAG / deep research, home: "retrieval-and-knowledge (agentic RAG); agents-and-orchestration (deep research agents)", rule: "Information goal over a corpus → Retrieval. Open-ended, multi-source research as a product capability → Agents."}
  - {concept: Agent memory, home: agents-and-orchestration, rule: "Memory that persists across agent sessions → Agents, even when implemented with retrieval."}
  - {concept: Prompt caching, home: inference-and-serving, rule: "KV reuse is an infrastructure optimization regardless of how APIs expose it."}
  - {concept: Function calling, home: agents-and-orchestration, rule: "The primitive for requesting external execution → Agents."}
  - {concept: MCP / Agent skills, home: agents-and-orchestration, rule: "Protocols and packaging for capabilities agents use → Agents."}
  - {concept: Self-instruct / synthetic data, home: data-and-synthetic-data, rule: "Producing the dataset → Data; training on it → Adaptation."}
  - {concept: Eval and golden sets, home: data-and-synthetic-data, rule: "Building, labeling and maintaining the dataset → Data; running it, grading outputs and tracking scores → Evaluation."}
  - {concept: Reasoning distillation, home: adaptation-and-post-training, rule: "The act of training a student → Adaptation; generating the traces → Data."}
  - {concept: Model compression, home: "inference-and-serving (quantization); adaptation-and-post-training (pruning with retraining)", rule: "Compression applied to a finished model with at most light calibration → Inference. Removing structure and retraining to produce a new, smaller model → Adaptation."}
  - {concept: Model merging, home: adaptation-and-post-training, rule: "Arithmetic on fine-tuned weights changes the model after pretraining → Adaptation, even though the merge itself runs no gradient steps."}
  - {concept: Text watermarking, home: inference-and-serving, rule: "A bias applied at the sampling step → Inference, even though its purpose (provenance) is governance; it appears in Governance through also."}
  - {concept: DSPy / prompt optimization, home: prompting-and-context-engineering, rule: "No gradient updates to model weights → Prompting."}
  - {concept: Process reward models, home: planning-and-reasoning, rule: "Primarily used to score steps for search and verification → Reasoning (secondary: Adaptation)."}
  - {concept: RLVR / GRPO, home: adaptation-and-post-training, rule: "Weight-updating methods → Adaptation, even when the goal is reasoning."}
  - {concept: Reranking, home: retrieval-and-knowledge, rule: "Scoring to order results for generation → Retrieval."}
  - {concept: Guardrails / injection defenses, home: safety-and-security, rule: "Components whose purpose is blocking harm → Safety."}
  - {concept: Agent sandboxing and permissions, home: safety-and-security, rule: "Mechanisms whose purpose is limiting blast radius → Safety (moved from Agents in v0.2)."}
  - {concept: Interpretability / RepE, home: safety-and-security, rule: "Used by engineers to detect and steer behavior → Safety (pure science stays offshore at maturity 1)."}
  - {concept: LLM-as-judge, home: evaluation-and-observability, rule: "Deployed to measure → Evaluation, though implemented as a prompt."}
  - {concept: Human-in-the-loop approval, home: ai-product-and-interaction-design, rule: "Defined by the human decision point → Product (secondary: Agents)."}
  - {concept: Architectures (MoE, SSMs), home: deep-learning-nlp, rule: "Model internals stay in the root unless engineers configure them at serving time."}
  - {concept: Physical vs. digital agents, home: "embodied-ai-and-world-models (physical); agents-and-orchestration (digital)", rule: "Acting through a body or a simulated physical world → Embodied. Acting through software interfaces, including GUIs → Agents."}
  - {concept: World models vs. video generation, home: "embodied-ai-and-world-models (action-conditioned); multimodal-applied (passive)", rule: "Generates what happens next given an action, for training or evaluating policies → Embodied. Generates media from a prompt → Multimodal."}
  - {concept: Robot policy training, home: embodied-ai-and-world-models, rule: "Training a policy to output physical actions → Embodied, even when it uses RL, imitation learning or fine-tuning (secondary: Adaptation)."}
  - {concept: Spatial reasoning VLMs, home: multimodal-applied, rule: "Perception models stay in Multimodal even when built for robots (secondary: Embodied). A model that outputs actions → Embodied."}
  - {concept: Regulation and standards vs. controls, home: governance-and-compliance, rule: "Rules, frameworks, policies and the documents that show compliance → Governance. The mechanism that implements a rule stays in its technical region (a guardrail required by policy is still Safety)."}
  - {concept: Dangerous-capability evals, home: governance-and-compliance, rule: "Evals run to decide whether a model crosses a risk threshold and needs stronger safeguards → Governance (secondary: Evaluation, Safety). General capability benchmarks → Evaluation."}
  - {concept: Content provenance, home: governance-and-compliance, rule: "Signed metadata and disclosure standards (C2PA) → Governance. Watermarks embedded by the generator → the region of the mechanism (text watermarking → Inference), with Governance through also."}
  - {concept: Training-data rights, home: governance-and-compliance, rule: "Licensing, consent, opt-outs and provenance audits of training data → Governance (secondary: Data). Filtering and deduplication pipelines → Data."}
  - {concept: Semantic caching / LLM gateways, home: inference-and-serving, rule: "Reusing answers and proxying model calls to cut cost and keep traffic flowing → Inference, alongside prompt caching and routing, even though they work at the API layer."}
  - {concept: Position encodings and context extension, home: "deep-learning-nlp (RoPE); inference-and-serving (context extension)", rule: "The architecture choice → the root. Rescaling it to run past the training length, set in model and serving configs → Inference (secondary: Adaptation for the fine-tune)."}
  - {concept: Embedding fine-tuning, home: retrieval-and-knowledge, rule: "Training a retriever or embedder for a search system → Retrieval (secondary: Adaptation). Training the generator → Adaptation."}
  - {concept: Hallucination detection, home: evaluation-and-observability, rule: "Scoring whether an answer is supported or confident → Evaluation, even when the score gates answers at runtime (secondary: Safety). Ways of grounding answers in the first place (RAG, citations) stay in their regions."}
  - {concept: Data poisoning vs. indirect prompt injection, home: safety-and-security, rule: "Both Safety. Malicious content in training or fine-tuning data that changes the weights → data poisoning. Malicious content read at inference time → indirect prompt injection."}

nodes:
  # ======================= ROOTS: information-retrieval =======================
  - id: bm25
    name: BM25
    aliases: [Okapi BM25, sparse retrieval, TF-IDF ranking]
    region: information-retrieval
    desc: Probabilistic ranking function scoring documents by term frequency and inverse document frequency; the standard lexical search baseline.
    parents: []
    maturity: 5
    maturity_note: Decades of deployment; default lexical scorer in search engines.
    date: "1994"
    ref: {title: "Okapi at TREC-3 (Robertson et al.)"}
    examples: [Lucene, Elasticsearch, OpenSearch]
    status: kept
  - id: approximate-nearest-neighbor-search
    name: Approximate Nearest Neighbor Search
    aliases: [ANN, HNSW, vector indexing]
    region: information-retrieval
    desc: Index structures that find near neighbors in high-dimensional vector spaces quickly at slight accuracy cost; the engine inside vector databases.
    parents: []
    maturity: 5
    maturity_note: Standard infrastructure in every vector store.
    date: "2016-03"
    ref: {title: "Efficient and robust approximate nearest neighbor search using Hierarchical Navigable Small World graphs (Malkov & Yashunin)", arxiv: "1603.09320"}
    examples: [FAISS, hnswlib, pgvector, Qdrant]
    status: added
  - id: open-domain-qa
    name: Open-Domain Question Answering
    aliases: [retriever-reader QA, DrQA]
    region: information-retrieval
    desc: Answering questions by retrieving passages from a large corpus and reading them with a neural model; the direct architectural ancestor of RAG.
    parents:
      - {id: bm25, rel: applies, why: "Early systems used lexical retrieval to select passages for a neural reader.", src: "Reading Wikipedia to Answer Open-Domain Questions (Chen et al. 2017)"}
    maturity: 4
    maturity_note: Mature research paradigm, largely absorbed into RAG.
    date: "2017-04"
    ref: {title: "Reading Wikipedia to Answer Open-Domain Questions (Chen et al.)", arxiv: "1704.00051"}
    examples: [DrQA]
    status: added

  # ======================= ROOTS: deep-learning-nlp =======================
  - id: attention-mechanism
    name: Attention Mechanism
    aliases: [neural attention]
    region: deep-learning-nlp
    desc: Lets a network weight different parts of its input dynamically when producing each output.
    parents: []
    maturity: 5
    maturity_note: Prerequisite for the transformer.
    date: "2014-09"
    ref: {title: "Neural Machine Translation by Jointly Learning to Align and Translate (Bahdanau et al.)", arxiv: "1409.0473"}
    examples: [seq2seq with attention]
    status: added
  - id: sequence-to-sequence-learning
    name: Sequence-to-Sequence Learning
    aliases: [seq2seq, encoder-decoder]
    region: deep-learning-nlp
    desc: Training networks to map an input sequence to an output sequence end to end.
    parents: []
    maturity: 5
    maturity_note: Foundational framing for translation and generation.
    date: "2014-09"
    ref: {title: "Sequence to Sequence Learning with Neural Networks (Sutskever et al.)", arxiv: "1409.3215"}
    examples: [T5, BART]
    status: kept
  - id: transformer-architecture
    name: Transformer
    aliases: [transformers]
    region: deep-learning-nlp
    desc: Architecture built entirely on self-attention, dispensing with recurrence; the basis of all modern LLMs.
    parents:
      - {id: attention-mechanism, rel: extends, why: "Uses self-attention as the sole sequence-mixing operation.", src: "Attention Is All You Need (2017)"}
      - {id: sequence-to-sequence-learning, rel: replaces, why: "Replaces recurrent encoder-decoders for sequence transduction.", src: "Attention Is All You Need (2017)"}
    maturity: 5
    maturity_note: Universal architecture for foundation models.
    date: "2017-06"
    ref: {title: "Attention Is All You Need (Vaswani et al.)", arxiv: "1706.03762"}
    examples: [GPT, BERT, Llama]
    status: repaired
  - id: pretrained-language-models
    name: Pretrained Language Models
    aliases: [LLMs, foundation models, generative pretraining]
    region: deep-learning-nlp
    desc: Transformers pretrained on large text corpora with a language-modeling objective, then used directly or adapted; the base every applied technique builds on.
    parents:
      - {id: transformer-architecture, rel: applies, why: "Applies the transformer to large-scale unsupervised language modeling.", src: "Improving Language Understanding by Generative Pre-Training (Radford et al. 2018)"}
    maturity: 5
    maturity_note: The substrate of applied AI engineering.
    date: "2018-06"
    ref: {title: "Improving Language Understanding by Generative Pre-Training (Radford et al.)", url: "https://cdn.openai.com/research-covers/language-unsupervised/language_understanding_paper.pdf"}
    examples: [GPT series, Claude, Gemini, Llama]
    status: added
  - id: transfer-learning-fine-tuning
    name: Transfer Learning and Fine-Tuning
    aliases: [fine-tuning, ULMFiT]
    region: deep-learning-nlp
    desc: Adapting a model pretrained on one task or corpus to a new task by continuing training on targeted data.
    parents: []
    maturity: 5
    maturity_note: Standard practice across deep learning.
    date: "2018-01"
    ref: {title: "Universal Language Model Fine-tuning for Text Classification (Howard & Ruder)", arxiv: "1801.06146"}
    examples: [Hugging Face Trainer]
    status: added
  - id: knowledge-distillation
    name: Knowledge Distillation
    aliases: [teacher-student training]
    region: deep-learning-nlp
    desc: Training a smaller student model to match the outputs of a larger teacher.
    parents: []
    maturity: 5
    maturity_note: Long-established compression technique.
    date: "2015-03"
    ref: {title: "Distilling the Knowledge in a Neural Network (Hinton et al.)", arxiv: "1503.02531"}
    examples: [DistilBERT]
    status: added
  - id: mixture-of-experts
    name: Mixture of Experts
    aliases: [MoE, sparse MoE]
    region: deep-learning-nlp
    also: [inference-and-serving]
    desc: Replaces dense layers with many expert subnetworks and a router that activates a few per token, scaling parameters without proportional compute.
    parents:
      - {id: "external:adaptive-mixtures-of-local-experts", rel: extends, why: "Scales the 1991 mixture-of-experts idea with sparse gating inside deep networks.", src: "Outrageously Large Neural Networks (Shazeer et al. 2017)"}
    maturity: 4
    maturity_note: Standard approach for frontier and large open models; has serving implications.
    date: "2017-01"
    ref: {title: "Outrageously Large Neural Networks: The Sparsely-Gated Mixture-of-Experts Layer (Shazeer et al.)", arxiv: "1701.06538"}
    examples: [Mixtral, DeepSeek-V3, Qwen MoE]
    status: added
  - id: state-space-models
    name: State-Space Models
    aliases: [SSMs, S4, Mamba, linear-time sequence models]
    region: deep-learning-nlp
    desc: Sequence models derived from control theory with linear-time scaling in sequence length, used alone or in hybrids with attention.
    parents:
      - {id: "external:control-theory-state-space", rel: applies, why: "Turns continuous state-space equations into trainable sequence layers.", src: "Efficiently Modeling Long Sequences with Structured State Spaces (Gu et al. 2021)"}
    maturity: 3
    maturity_note: Shipping in hybrid models; not yet a default choice.
    date: "2021-10"
    ref: {title: "Efficiently Modeling Long Sequences with Structured State Spaces (Gu et al.)", arxiv: "2111.00396"}
    examples: [Mamba, Jamba, Nemotron-H]
    status: added

  # ---- practitioner staples (2026-10-10) ----
  - id: subword-tokenization
    name: Subword Tokenization
    aliases: [tokenization, BPE, byte-pair encoding, tokenizers, SentencePiece, token counting]
    region: deep-learning-nlp
    desc: Splitting text into a fixed vocabulary of frequent word pieces, so any string can be encoded without unknown words; the unit models read, bill and limit by.
    summary: "Models don't read characters or words but tokens: pieces of words learned from how often they appear in the training text, so common words are one token and rare ones are split into several. Everything practical is counted in tokens: context limits, output limits, prices and rate limits. The same text can cost noticeably more in one model's tokenizer than another's, and code, numbers and non-English text often split into many more tokens than plain English."
    parents:
      - {id: sequence-to-sequence-learning, rel: extends, why: "Introduced to give neural translation models an open vocabulary.", src: "Neural Machine Translation of Rare Words with Subword Units (Sennrich et al. 2015)"}
      - {id: "external:byte-pair-encoding-compression", rel: applies, why: "Repurposes a 1994 compression algorithm to build the vocabulary.", src: "Sennrich et al. 2015"}
    maturity: 5
    maturity_note: Every production LLM uses a subword tokenizer; engineers meet it as token counting and cost.
    date: "2015-08"
    ref: {title: "Neural Machine Translation of Rare Words with Subword Units (Sennrich et al.)", arxiv: "1508.07909"}
    examples: [tiktoken, SentencePiece, Hugging Face tokenizers, token-counting APIs]
    status: added
  - id: rotary-position-embeddings
    name: Rotary Position Embeddings
    aliases: [RoPE, RoFormer, rotary embeddings]
    region: deep-learning-nlp
    desc: Encodes each token's position by rotating its query and key vectors by an angle proportional to the position, so attention depends on relative distance.
    summary: "Attention on its own doesn't know word order, so the model has to be told where each token sits. RoPE does this by rotating the vectors used in attention by an angle that grows with position, so that two tokens' interaction depends on how far apart they are. Almost every open LLM uses it, and its rotation frequencies are the knob that context-extension methods adjust."
    parents:
      - {id: transformer-architecture, rel: extends, why: "Replaces the transformer's absolute position encodings with relative rotations.", src: "RoFormer (Su et al. 2021)"}
    maturity: 5
    maturity_note: The default position encoding in Llama, Qwen, Mistral, DeepSeek and most open models.
    date: "2021-04"
    ref: {title: "RoFormer: Enhanced Transformer with Rotary Position Embedding (Su et al.)", arxiv: "2104.09864"}
    examples: [Llama, Qwen, Mistral, GPT-NeoX]
    status: added

  # ======================= ROOTS: symbolic-ai-planning =======================
  - id: heuristic-search
    name: Heuristic Search
    aliases: [A*, best-first search, state-space search]
    region: symbolic-ai-planning
    desc: Searching a space of states guided by an estimate of distance to the goal.
    parents: []
    maturity: 5
    maturity_note: Textbook foundation of AI planning.
    date: "1968"
    ref: {title: "A Formal Basis for the Heuristic Determination of Minimum Cost Paths (Hart, Nilsson & Raphael)"}
    examples: [A*, MCTS variants]
    status: added
  - id: strips-planning
    name: STRIPS Planning
    aliases: [classical planning]
    region: symbolic-ai-planning
    desc: Planning with explicit states, goals, and actions defined by preconditions and effects.
    parents:
      - {id: heuristic-search, rel: applies, why: "Plans are found by searching the state space defined by action models.", src: "STRIPS (Fikes & Nilsson 1971)"}
    maturity: 5
    maturity_note: Historical foundation of symbolic planning.
    date: "1971"
    ref: {title: "STRIPS: A New Approach to the Application of Theorem Proving to Problem Solving (Fikes & Nilsson)"}
    examples: [classical planners]
    status: repaired
  - id: pddl
    name: PDDL
    aliases: [Planning Domain Definition Language]
    region: symbolic-ai-planning
    desc: Standard language for describing planning domains and problems so general-purpose solvers can find plans.
    parents:
      - {id: strips-planning, rel: extends, why: "Generalizes STRIPS-style action descriptions into a shared standard.", src: "PDDL — The Planning Domain Definition Language (McDermott et al. 1998)"}
    maturity: 4
    maturity_note: Established standard; the interface for LLM+planner hybrids.
    date: "1998"
    ref: {title: "PDDL — The Planning Domain Definition Language (McDermott et al.)"}
    examples: [Fast Downward, VAL]
    status: repaired
  - id: expert-systems
    name: Expert Systems
    aliases: [rule-based systems, production systems]
    region: symbolic-ai-planning
    desc: Systems that encode domain expertise as explicit rules and route problems through them; an ancestor of modular neuro-symbolic architectures.
    parents: []
    maturity: 5
    maturity_note: Historical; ideas persist in routing and tool modules.
    date: "1976"
    ref: {title: "Computer-Based Medical Consultations: MYCIN (Shortliffe)"}
    examples: [MYCIN, CLIPS]
    status: added

  # ======================= ROOTS: reinforcement-learning =======================
  - id: markov-decision-process
    name: Markov Decision Process
    aliases: [MDP]
    region: reinforcement-learning
    desc: Formal model of sequential decision making with states, actions, transitions, and rewards.
    parents: []
    maturity: 5
    maturity_note: Theoretical foundation of RL.
    date: "1957"
    ref: {title: "A Markovian Decision Process (Bellman)"}
    examples: [Gymnasium environments]
    status: kept
  - id: policy-gradient-methods
    name: Policy Gradient Methods
    aliases: [REINFORCE, actor-critic]
    region: reinforcement-learning
    desc: Optimizing a parameterized policy directly by gradient ascent on expected reward.
    parents:
      - {id: markov-decision-process, rel: applies, why: "Optimizes policies defined over MDPs.", src: "Policy Gradient Methods for RL with Function Approximation (Sutton et al. 1999)"}
    maturity: 5
    maturity_note: Mathematical basis of LLM RL fine-tuning.
    date: "1999"
    ref: {title: "Policy Gradient Methods for Reinforcement Learning with Function Approximation (Sutton et al.)"}
    examples: [Stable Baselines3, TRL]
    status: repaired
  - id: ppo
    name: Proximal Policy Optimization
    aliases: [PPO]
    region: reinforcement-learning
    desc: A policy-gradient algorithm that clips updates to stay near the previous policy, giving stable training.
    parents:
      - {id: policy-gradient-methods, rel: specializes, why: "A clipped-objective policy-gradient method.", src: "Proximal Policy Optimization Algorithms (Schulman et al. 2017)"}
    maturity: 5
    maturity_note: Default RL optimizer behind classic RLHF.
    date: "2017-07"
    ref: {title: "Proximal Policy Optimization Algorithms (Schulman et al.)", arxiv: "1707.06347"}
    examples: [TRL PPOTrainer, OpenRLHF]
    status: added

  # ======================= ROOTS: robotics-and-control =======================
  - id: behavior-cloning
    name: Behavior Cloning
    aliases: [imitation learning, learning from demonstration, ALVINN]
    region: robotics-and-control
    desc: Training a policy by supervised learning on recorded state–action pairs from an expert, so the model copies what the demonstrator did.
    parents: []
    maturity: 5
    maturity_note: The default starting point for learning robot skills from demonstrations.
    date: "1989"
    ref: {title: "ALVINN: An Autonomous Land Vehicle in a Neural Network (Pomerleau)"}
    examples: [ALVINN, LeRobot]
    status: added
  - id: dagger
    name: DAgger
    aliases: [dataset aggregation, interactive imitation learning, on-policy imitation]
    region: robotics-and-control
    desc: Imitation learning that runs the learner's own policy, asks the expert what it should have done in the states it reached, and retrains on the growing dataset, fixing the compounding errors of plain behavior cloning.
    parents:
      - {id: behavior-cloning, rel: extends, why: "Trains on states the learner itself visits, so small mistakes no longer compound into unfamiliar states.", src: "A Reduction of Imitation Learning and Structured Prediction to No-Regret Online Learning (Ross et al. 2010)"}
    maturity: 4
    maturity_note: Standard remedy for compounding error; the idea behind on-policy distillation.
    date: "2010-11"
    ref: {title: "A Reduction of Imitation Learning and Structured Prediction to No-Regret Online Learning (Ross, Gordon & Bagnell)", arxiv: "1011.0686"}
    examples: [human-gated DAgger, HG-DAgger]
    status: added
  - id: physics-simulation
    name: Physics Simulation for Robotics
    aliases: [robot simulators, MuJoCo, rigid-body simulation]
    region: robotics-and-control
    desc: Fast simulators of rigid-body dynamics and contact, used to design controllers and to train and test robot policies without real hardware.
    parents: []
    maturity: 5
    maturity_note: Every robot learning pipeline uses one.
    date: "2012"
    ref: {title: "MuJoCo: A physics engine for model-based control (Todorov, Erez & Tassa)"}
    examples: [MuJoCo, Isaac Sim, PyBullet, Genesis]
    status: added
  # ======================= ROOTS: knowledge-representation =======================
  - id: semantic-networks
    name: Semantic Networks
    aliases: [ontologies, frames]
    region: knowledge-representation
    desc: Representing concepts as nodes and relations as labeled edges.
    parents: []
    maturity: 5
    maturity_note: Historical foundation of graph-structured knowledge.
    date: "1968"
    ref: {title: "Semantic Memory (Quillian)"}
    examples: [WordNet, OWL ontologies]
    status: added
  - id: knowledge-graphs
    name: Knowledge Graphs
    aliases: [property graphs]
    region: knowledge-representation
    desc: Large graphs of entities and typed relationships used to store and query structured knowledge.
    parents:
      - {id: semantic-networks, rel: extends, why: "Scales semantic-network ideas to web-scale entity graphs.", src: "Introducing the Knowledge Graph (Google 2012)"}
    maturity: 5
    maturity_note: Established enterprise and web infrastructure.
    date: "2012-05"
    ref: {title: "Introducing the Knowledge Graph: things, not strings (Singhal, Google)"}
    examples: [Wikidata, Neo4j]
    status: repaired

  # ======================= ROOTS: human-computer-interaction =======================
  - id: conversational-agents
    name: Conversational Agents
    aliases: [chatbots, dialogue systems]
    region: human-computer-interaction
    desc: Programs that interact with people through natural-language dialogue.
    parents: []
    maturity: 5
    maturity_note: Long-standing interaction paradigm.
    date: "1966"
    ref: {title: "ELIZA — A Computer Program for the Study of Natural Language Communication (Weizenbaum)"}
    examples: [ELIZA, voice assistants]
    status: added
  - id: direct-manipulation
    name: Direct Manipulation
    aliases: [WYSIWYG]
    region: human-computer-interaction
    desc: Interfaces where users act on visible objects with immediate, reversible feedback.
    parents: []
    maturity: 5
    maturity_note: Foundational UI principle.
    date: "1983"
    ref: {title: "Direct Manipulation: A Step Beyond Programming Languages (Shneiderman)"}
    examples: [GUIs, canvas editors]
    status: added
  - id: mixed-initiative-interaction
