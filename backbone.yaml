  - id: interactive-world-models
    name: Interactive World Models
    aliases: [generative interactive environments, action-conditioned video models, world foundation models, Genie]
    region: embodied-ai-and-world-models
    also: [multimodal-applied]
    desc: Video-generation models conditioned on actions, which produce a playable, explorable environment frame by frame and can stand in for a simulator.
    summary: "A video model that, instead of following a text prompt, takes an action such as 'move left' or a robot command and generates what the scene looks like next. Run in a loop, it becomes an environment you can play in or train a robot in, learned from video rather than hand-built. Current models drift over long runs, with objects changing shape or vanishing, so they are used more for generating training data than for trustworthy evaluation."
    parents:
      - {id: video-generation, rel: extends, why: "Conditions video generation on actions so the scene responds to control.", src: "Genie: Generative Interactive Environments (Bruce et al. 2024)"}
      - {id: latent-world-models, rel: extends, why: "Learns environment dynamics like a world model, but from internet video at scale.", src: "Bruce et al. 2024"}
    maturity: 2
    maturity_note: Public demos and early use for synthetic robot data; not yet a standard simulator.
    date: "2024-02"
    ref: {title: "Genie: Generative Interactive Environments (Bruce et al.)", arxiv: "2402.15391"}
    examples: [Genie 3, NVIDIA Cosmos, Oasis]
    resources:
      - {kind: blog, title: "Genie 3: A new frontier for world models", by: "Google DeepMind", year: 2025, url: "https://deepmind.google/blog/genie-3-a-new-frontier-for-world-models/"}
