  - id: video-generation
    name: Video Generation
    aliases: [text-to-video]
    region: multimodal-applied
    desc: Generating video from text or images with diffusion transformers over spacetime patches.
    summary: "Generating video clips from a text prompt or a starting image. Current models cut video into patches that span space and time and denoise them with a diffusion transformer, which keeps objects consistent from frame to frame. Commercial APIs exist, but clips are short and costly, and physics and fine control are unreliable."
    parents:
      - {id: text-to-image, rel: extends, why: "Extends image diffusion across time.", src: "Video generation models as world simulators (OpenAI 2024)"}
      - {id: transformer-architecture, rel: applies, why: "Uses diffusion transformers over spacetime patches.", src: "OpenAI 2024"}
      - {id: diffusion-transformers, rel: applies, why: "Sora-style models run a DiT over spacetime patches.", src: "Video generation models as world simulators (OpenAI 2024)"}
    maturity: 3
    maturity_note: Commercial APIs available; consistency and control still limited.
    date: "2024-02"
    ref: {title: "Video generation models as world simulators (OpenAI, February 2024)"}
    examples: [Sora, Veo, Runway]
    resources:
      - {kind: blog, title: "Diffusion Models for Video Generation", by: "Lilian Weng", year: 2024, url: "https://lilianweng.github.io/posts/2024-04-12-diffusion-video/"}
