  # ---- deep dive (2026-10-09) ----
  - id: program-aided-reasoning
    name: Program-Aided Reasoning
    aliases: [PAL, Program of Thoughts, PoT, program-aided language models]
    region: planning-and-reasoning
    also: [agents-and-orchestration]
    desc: The model writes its reasoning as a program, and an interpreter runs it to compute the answer, separating the logic from the arithmetic.
    summary: "Instead of doing math in its head, the model writes a short program that computes the answer, and an interpreter runs it. The model handles the logic and the interpreter handles the arithmetic, which removes most calculation errors. It's why assistants reach for a Python tool when a question involves numbers or data."
    parents:
      - {id: chain-of-thought, rel: extends, why: "Writes the reasoning steps as executable code instead of prose.", src: "PAL: Program-aided Language Models (Gao et al. 2022)"}
      - {id: mrkl-systems, rel: specializes, why: "Offloads computation to a symbolic executor, as MRKL routes arithmetic to a calculator, but the model writes the whole program.", src: "PAL: Program-aided Language Models (Gao et al. 2022)", confidence: medium}
    maturity: 4
    maturity_note: The papers' exact method is rarely used, but having the model write and run code for calculation is standard in assistants and agents.
    date: "2022-11"
    ref: {title: "PAL: Program-aided Language Models (Gao et al.)", arxiv: "2211.10435"}
    examples: [ChatGPT data analysis, code execution tools]
    resources:
      - {kind: paper, title: "Program of Thoughts Prompting: Disentangling Computation from Reasoning for Numerical Reasoning Tasks", by: "Wenhu Chen et al.", year: 2022, url: "https://arxiv.org/abs/2211.12588"}
      - {kind: docs, title: "PAL (Program-Aided Language Models)", by: "DAIR.AI Prompt Engineering Guide", year: 2023, url: "https://www.promptingguide.ai/techniques/pal"}
      - {kind: talk, title: "PAL : Program-aided Language Models with LangChain code", by: "Sam Witteveen (YouTube)", year: 2023, url: "https://www.youtube.com/watch?v=dy7-LvDu-3s"}
      - {kind: code, title: "reasoning-machines/pal", by: "Luyu Gao et al.", year: 2022, url: "https://github.com/reasoning-machines/pal"}
    status: added
  - id: reasoning-via-planning
    name: Reasoning via Planning
    aliases: [RAP, MCTS over reasoning]
    region: planning-and-reasoning
    layer: detail
    desc: Monte Carlo Tree Search over reasoning steps, with the language model acting both as the policy that proposes steps and as a world model that predicts their outcome.
    summary: "Runs Monte Carlo Tree Search, the algorithm behind game-playing programs like AlphaGo, over reasoning steps. The same model proposes the next step and predicts what state it leads to, and simulated rollouts tell the search which branches pay off. More principled than simple tree search, and more expensive."
    parents:
      - {id: tree-of-thoughts, rel: specializes, why: "Replaces breadth- or depth-first search with MCTS and a model-simulated world state.", src: "Reasoning with Language Model is Planning with World Model (Hao et al. 2023)"}
    maturity: 1
    maturity_note: Research method; MCTS over reasoning reappears in work on training reasoning models but rarely in deployed systems.
    date: "2023-05"
    ref: {title: "Reasoning with Language Model is Planning with World Model (Hao et al.)", arxiv: "2305.14992"}
    examples: [Blocksworld planning]
    resources:
      - {kind: talk, title: "SIGIR VF Lean and Learn Series: LLM Reasoners (Shibo Hao)", by: "Shibo Hao (SIGIR Virtual Forum)", year: 2024, url: "https://www.youtube.com/watch?v=d_x2pzEHGQY"}
      - {kind: paper, title: "LLM Reasoners: New Evaluation, Library, and Analysis of Step-by-Step Reasoning with Large Language Models", by: "Shibo Hao et al.", year: 2024, url: "https://arxiv.org/abs/2404.05221"}
      - {kind: code, title: "maitrix-org/llm-reasoners", by: "Maitrix", year: 2023, url: "https://github.com/maitrix-org/llm-reasoners"}
    status: added
  - id: graph-of-thoughts
    name: Graph of Thoughts
    aliases: [GoT]
    region: planning-and-reasoning
    layer: detail
    desc: Generalizes tree search so that partial thoughts form a graph, letting separate lines of reasoning be merged, refined and looped back.
    summary: "Like tree search, but branches can merge: several partial results are combined into one, or a thought is refined in a loop. This suits tasks that split into parts and recombine, such as sorting or merging documents. The orchestration is complex, so it stays mostly in research."
    parents:
      - {id: tree-of-thoughts, rel: extends, why: "Adds aggregation and refinement, so reasoning forms a graph rather than a tree.", src: "Graph of Thoughts (Besta et al. 2023)"}
    maturity: 1
    maturity_note: Research framework with an open-source implementation; little production use.
    date: "2023-08"
    ref: {title: "Graph of Thoughts: Solving Elaborate Problems with Large Language Models (Besta et al.)", arxiv: "2308.09687"}
    examples: []
    resources:
      - {kind: talk, title: "Maciej Besta: Chains, Trees, and Graphs of Thoughts", by: "Maciej Besta (KUIS AI)", year: 2023, url: "https://www.youtube.com/watch?v=n10_cdSGjXY"}
      - {kind: paper, title: "Demystifying Chains, Trees, and Graphs of Thoughts", by: "Maciej Besta et al.", year: 2024, url: "https://arxiv.org/abs/2401.14295"}
      - {kind: code, title: "spcl/graph-of-thoughts", by: "ETH Zurich SPCL", year: 2023, url: "https://github.com/spcl/graph-of-thoughts"}
    status: added
  - id: step-back-prompting
    name: Step-Back Prompting
    aliases: [abstraction prompting]
    region: planning-and-reasoning
    also: [prompting-and-context-engineering]
    layer: detail
    desc: Prompting the model to first state the general principle or concept behind a question, then reason from that principle to the specific answer.
    summary: "Before solving the problem, the model is asked a more general question, such as which physics law applies, and answers it first. Reasoning then starts from that principle rather than from surface details. The step-back question can also drive retrieval, fetching background a direct search would miss."
    parents:
      - {id: chain-of-thought, rel: specializes, why: "Starts the chain with an explicit abstraction step.", src: "Take a Step Back (Zheng et al. 2023)"}
      - {id: retrieval-augmented-generation, rel: combines, why: "Retrieves on the step-back question to ground the reasoning.", src: "Take a Step Back (Zheng et al. 2023)", confidence: medium}
    maturity: 2
    maturity_note: A cheap prompt pattern with clear gains in the paper; used in some RAG pipelines, rarely named in production.
    date: "2023-10"
    ref: {title: "Take a Step Back: Evoking Reasoning via Abstraction in Large Language Models (Zheng et al.)", arxiv: "2310.06117"}
    examples: [LangChain step-back retrieval]
    resources:
      - {kind: tutorial, title: "Step-Back Prompting", by: "Learn Prompting", year: 2024, url: "https://learnprompting.org/docs/advanced/thought_generation/step_back_prompting"}
    status: added
  - id: language-agent-tree-search
    name: Language Agent Tree Search
    aliases: [LATS]
    region: planning-and-reasoning
    also: [agents-and-orchestration]
    layer: detail
    desc: Monte Carlo Tree Search over an agent's actions in a real environment, using self-reflection on failed branches and model-estimated values to guide the search.
    summary: "Tree search for agents that act. The agent tries different action sequences in its environment, such as running code or querying a search API, scores the outcomes, writes reflections on failures, and searches toward the most promising path. It beats a single ReAct loop on coding and web tasks, but only where actions can be safely retried."
    parents:
      - {id: react-agent-loop, rel: extends, why: "Searches over many ReAct trajectories instead of following one.", src: "Language Agent Tree Search (Zhou et al. 2023)"}
      - {id: tree-of-thoughts, rel: combines, why: "Brings MCTS-style tree search from reasoning to environment actions.", src: "Language Agent Tree Search (Zhou et al. 2023)"}
      - {id: reflexion, rel: combines, why: "Uses self-reflections on failed trajectories as extra context for the search.", src: "Language Agent Tree Search (Zhou et al. 2023)"}
    maturity: 1
    maturity_note: Research method; deployed agents rarely branch because most real actions can't be undone.
    date: "2023-10"
    ref: {title: "Language Agent Tree Search Unifies Reasoning Acting and Planning in Language Models (Zhou et al.)", arxiv: "2310.04406"}
    examples: [LangGraph LATS example]
    resources:
      - {kind: blog, title: "Reflection Agents", by: "LangChain", year: 2024, url: "https://www.langchain.com/blog/reflection-agents"}
      - {kind: talk, title: "Andy Zhou: Language Agent Tree Search & Autonomous Red Teaming", by: "Andy Zhou (Nnamdi Iregbulem)", year: 2025, url: "https://www.youtube.com/watch?v=sr1n4Swgk8k"}
      - {kind: code, title: "andyz245/LanguageAgentTreeSearch", by: "Andy Zhou et al.", year: 2023, url: "https://github.com/andyz245/LanguageAgentTreeSearch"}
    status: added
  - id: math-shepherd
    name: Automatic Process Supervision
    aliases: [Math-Shepherd, Monte Carlo step labels]
    region: planning-and-reasoning
    also: [data-and-synthetic-data]
    layer: detail
    desc: Labeling each reasoning step for process reward model training without humans, by checking how often rollouts from that step reach the correct final answer.
    summary: "Process reward models need every step labeled right or wrong, and human labeling is slow and costly. Here the labels come from the model itself: from each step, it finishes the solution several times, and a step counts as good if those completions usually reach the known correct answer. This made step-level verifiers practical for open-source teams."
    parents:
      - {id: process-reward-models, rel: specializes, why: "Replaces human step annotations with labels estimated from rollouts.", src: "Math-Shepherd (Wang et al. 2023)"}
    maturity: 2
    maturity_note: Widely used to build open process reward models; later work found the labels noisy.
    date: "2023-12"
    ref: {title: "Math-Shepherd: Verify and Reinforce LLMs Step-by-step without Human Annotations (Wang et al.)", arxiv: "2312.08935"}
    examples: [Math-Shepherd PRM, OmegaPRM]
    resources:
      - {kind: code, title: "peiyi9979/math-shepherd-mistral-7b-prm", by: "Peiyi Wang (Hugging Face)", year: 2023, url: "https://huggingface.co/peiyi9979/math-shepherd-mistral-7b-prm"}
      - {kind: paper, title: "Improve Mathematical Reasoning in Language Models by Automated Process Supervision", by: "Liangchen Luo et al.", year: 2024, url: "https://arxiv.org/abs/2406.06592"}
      - {kind: paper, title: "The Lessons of Developing Process Reward Models in Mathematical Reasoning", by: "Zhenru Zhang et al.", year: 2025, url: "https://arxiv.org/abs/2501.07301"}
    status: added
