# Applied AI Engineering Atlas — backbone v0.2
# Repaired from Gemini backbone run (v0.1, 2026-10-08).
# Schema notes:
#   parents[].id      : a node id in this file, or "external:<name>" for an ancestor not yet anchored
#   parents[].rel     : extends | specializes | combines | applies | replaces | counters
#   maturity          : 1 research, 2 emerging, 3 maturing, 4 established, 5 foundational
#   status            : kept (Gemini, unchanged edges) | repaired (Gemini node, edges/dates/refs fixed) | added
#   ref.arxiv         : arXiv id; ref.url for non-arXiv sources
#   layer             : core (default; shown on the overview) | detail (deep-dive content, shown only when zoomed in)
#   summary           : optional plain-language 2–3 sentences for the map panel
#   resources         : optional [{kind, title, by, year, url}] for the panel's "Learn more"; kind in meta.resource_kinds
#   region overview / learning_path : optional reader content for the region panel (learning_path items add `why`)

meta:
  version: "0.2"
  date: "2026-10-08"
  relationship_types:
    extends: adds capability to the parent
    specializes: a narrower variant of the parent
    combines: merges two or more parents (each listed separately)
    applies: uses the parent in a new domain or for a new purpose
    replaces: supersedes the parent for the same job
    counters: a defense or mitigation against the parent (added in v0.2 for attack/defense pairs)
  maturity_tiers:
    1: Research — primarily in papers; few or no production uses
    2: Emerging — early adopters and prototypes; patterns unsettled
    3: Maturing — real production use; best practices still forming
    4: Established — widely used; well-understood tradeoffs
    5: Foundational — assumed infrastructure; rarely discussed as new
  layers: [core, detail]
  resource_kinds: [paper, talk, blog, docs, tutorial, code]

regions:
  # ---------------- root disciplines ----------------
  - id: information-retrieval
    kind: root
    name: Information Retrieval
    definition: Finding relevant material in large collections. Origin of ranking, indexing, and question answering over corpora.
  - id: deep-learning-nlp
    kind: root
    name: Deep Learning and NLP
    definition: Neural networks for language — attention, sequence models, pretraining, transfer learning — that produced the transformer and LLMs. Also holds the few architecture choices engineers actually make (MoE, SSMs).
  - id: symbolic-ai-planning
    kind: root
    name: Symbolic AI and Planning
    definition: Explicit representations, search, and formal planning. Ancestor of tool use, planning-with-verifiers, and neuro-symbolic hybrids.
  - id: reinforcement-learning
    kind: root
    name: Reinforcement Learning
    definition: Learning from reward through interaction. Ancestor of every preference- and verifier-based post-training method.
  - id: knowledge-representation
    kind: root
    name: Knowledge Representation
    definition: Structured, machine-usable models of facts and relations — semantic networks, ontologies, knowledge graphs.
  - id: human-computer-interaction
    kind: root
    name: Human-Computer Interaction
    definition: How people work with computational systems. Ancestor of conversational UX, copilots, and human oversight patterns.
  - id: systems-security
    kind: root
    name: Software and Systems Security
    definition: Protecting systems from misuse — isolation, least privilege, injection attacks. Ancestor of most AI security thinking.
  - id: software-engineering
    kind: root
    name: Software Engineering and Operations
    definition: Practices for building and running reliable software — testing, observability, state machines, protocols. Added in v0.2; the ancestor of evals, tracing, workflows, and MCP.

  # ---------------- applied regions ----------------
  - id: inference-and-serving
    kind: applied
    name: Inference and Serving
    title: The Engine Works
    definition: Running models efficiently and cheaply — memory management, batching, quantization, decoding acceleration, caching, and routing between models.
    distinct_from: Treats weights as fixed (vs. Adaptation) and works below the prompt/API layer (vs. Prompting). Decoding-time mechanisms like constrained decoding live here; the practices built on them live in Prompting.
    descends_from: [deep-learning-nlp, software-engineering]
    deep_dive_focus:
      - The 2025–2026 serving stack (disaggregation, KV offload, multi-tier caching) and which techniques became defaults
      - Cost/latency engineering from the application side — routing, cascades, caching APIs
      - Local and on-device inference
  - id: prompting-and-context-engineering
    kind: applied
    name: Prompting and Context Engineering
    title: The Whispering Coast
    definition: Shaping model behavior through inputs — prompt patterns, structured outputs, templates and chains, managing what occupies the context window, and optimizing prompts programmatically.
    distinct_from: No weight updates (vs. Adaptation); operates on text and API payloads rather than tensors (vs. Inference); concerns single calls and context state rather than control flow (vs. Agents).
    descends_from: [deep-learning-nlp, human-computer-interaction]
    deep_dive_focus:
      - The shift from prompt engineering to context engineering, and which techniques it absorbed
      - Programmatic prompt optimization in practice (DSPy, GEPA-style methods, eval-gated prompts)
      - Context management for long-running agents (compaction, note-taking, progressive disclosure)
    overview: "Prompting and Context Engineering is about shaping what a model does purely through what you send it, without touching its weights. It began as prompt engineering: finding instructions and examples that got a pretrained model to do a task. As models went into products, prompts became software: templates, chains, system prompts, and schema-shaped outputs that code can parse.\n\nTwo branches grew from there. Programmatic optimization stops hand-tuning: methods like APE, DSPy and TextGrad generate and score prompt variants against a dataset and a metric, so prompts become compiled artifacts gated by evals. Context engineering arrived with agents: once a model runs for hundreds of turns with tools, the question shifts from how to word an instruction to what should be in the context window at all. Long windows didn't remove the problem, since models still miss material buried in the middle, so compaction, careful ordering, and progressive disclosure keep the working set small and relevant.\n\nLandmarks worth knowing: few-shot prompting, structured outputs, declarative prompt compilation, and context engineering. The direction of travel is from writing prompts to engineering the whole input state, measured by evals."
    learning_path:
      - {kind: blog, title: "Prompt Engineering", by: "Lilian Weng", year: 2023, url: "https://lilianweng.github.io/posts/2023-03-15-prompt-engineering/", why: "A compact map of the basic techniques (zero-/few-shot, example selection, chain-of-thought, automatic prompt design), with the papers behind each, before you go deeper on any one."}
      - {kind: talk, title: "Prompting 101 | Code w/ Claude", by: "Anthropic (Hannah Moran, Christian Ryan)", year: 2025, url: "https://www.youtube.com/watch?v=ysPbXH0LpIE", why: "Watch a production prompt get built and debugged step by step: system prompt, task context, examples, output format."}
      - {kind: paper, title: "Lost in the Middle: How Language Models Use Long Contexts", by: "Nelson F. Liu et al.", year: 2023, url: "https://arxiv.org/abs/2307.03172", why: "The experiment that showed where you put information in a long context changes whether the model uses it, which is why context engineering became its own discipline."}
      - {kind: blog, title: "Effective context engineering for AI agents", by: "Anthropic", year: 2025, url: "https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents", why: "Shifts the question from wording one prompt to curating everything an agent sees over many turns: compaction, note-taking, sub-agents and just-in-time retrieval."}
      - {kind: talk, title: "Let the LLM Write the Prompts: An Intro to DSPy in Compound AI Pipelines", by: "Drew Breunig (Data + AI Summit)", year: 2025, url: "https://www.youtube.com/watch?v=I9ZtkgYZnOw", why: "A 30-minute practitioner case for treating prompts as optimizable parameters, showing a real pipeline improved with an optimizer instead of hand-tuning."}
      - {kind: paper, title: "DSPy: Compiling Declarative Language Model Calls into Self-Improving Pipelines", by: "Omar Khattab et al.", year: 2023, url: "https://arxiv.org/abs/2310.03714", why: "The formal version of that idea: signatures, modules and a compiler that bootstraps demonstrations and instructions against a metric."}
  - id: retrieval-and-knowledge
    kind: applied
    name: Retrieval and Knowledge
    title: The Archival Reach
    definition: Bringing external knowledge into context — embeddings, RAG and its variants, hybrid search, reranking, graph-based and agentic retrieval.
    distinct_from: Goal is answering from a corpus (vs. Agents, which change state). Agentic RAG lives here when the end goal is information.
    descends_from: [information-retrieval, knowledge-representation, deep-learning-nlp]
    deep_dive_focus:
      - Evidence on when long context replaces retrieval and when it doesn't
      - Agentic search (grep/filesystem-style retrieval by agents) vs. index-based RAG
      - Graph-based retrieval beyond GraphRAG, and its real production footprint
  - id: agents-and-orchestration
    kind: applied
    name: Agents and Orchestration
    title: The Free Cities
    definition: Models acting in environments — tool use, agent loops, workflows vs. autonomous agents, multi-agent systems, memory, protocols, and coding, computer-use, and research agents.
    distinct_from: Changes environment state or runs multi-step control flow (vs. Retrieval, which reads). Reasoning techniques that don't act live in Planning and Reasoning.
    descends_from: [symbolic-ai-planning, software-engineering, deep-learning-nlp]
    deep_dive_focus:
      - Tool-use lineage from MRKL and Toolformer through function calling to MCP and skills
      - Agent harness design (loops, subagents, memory, long-horizon task management)
      - Where production systems sit on the workflow-to-autonomy spectrum in 2026
    overview: "Agents and Orchestration covers models that act: calling tools, running in loops, remembering across sessions, and working with other agents. It began with routing. MRKL sent parts of a request to calculators and APIs, Toolformer trained models to decide when to call tools themselves, and function calling made that a standard API: the model returns a structured call, your code runs it. ReAct wrapped this in the basic agent loop of think, act, observe, repeat.\n\nFully autonomous loops proved expensive and unpredictable in production, so most deployed systems moved back toward workflows: control flow written in code, with the model called only where judgment is needed. Autonomy survives where tasks are open-ended and the environment is safe to explore, above all in coding agents, which now run for hours across many context windows using progress files, memory, and subagents.\n\nProtocols turned tools into shared infrastructure. MCP lets one server work with any client, Agent Skills package know-how an agent loads on demand, and code execution keeps bulky tool results out of the context window. Landmarks worth knowing: function calling, the ReAct loop, workflow graphs, MCP, and coding agents. The direction of travel is toward bounded, well-instrumented agents rather than unconstrained autonomy."
    learning_path:
    - {kind: blog, title: "LLM Powered Autonomous Agents", by: "Lilian Weng", year: 2023, url: "https://lilianweng.github.io/posts/2023-06-23-agent/", why: "One map of the whole field (planning, memory, tool use) with the papers behind each part, so the later readings have somewhere to land."}
    - {kind: talk, title: "LLM Agents: History & Overview (UC Berkeley CS294-196)", by: "Shunyu Yao (Berkeley RDI)", year: 2024, url: "https://www.youtube.com/watch?v=RM6ZArd2nVc", why: "The ReAct author explains how agents grew out of reasoning plus acting, which is the loop every later system still runs."}
    - {kind: blog, title: "Building effective agents", by: "Anthropic", year: 2024, url: "https://www.anthropic.com/engineering/building-effective-agents", why: "Separates workflows (control flow in code) from agents (the model chooses the steps) and names the common patterns, which is the main design choice you will face in practice."}
    - {kind: blog, title: "Writing effective tools for AI agents—using AI agents", by: "Anthropic", year: 2025, url: "https://www.anthropic.com/engineering/writing-tools-for-agents", why: "Most agent failures trace back to tool design, and this covers naming, scoping, response size and how to evaluate tools."}
    - {kind: talk, title: "Building Agents with Model Context Protocol - Full Workshop", by: "Mahesh Murag (Anthropic, AI Engineer Summit)", year: 2025, url: "https://www.youtube.com/watch?v=kQmXtrmQ5Zg", why: "Shows how tools become shared infrastructure through MCP, walking through servers, clients and how an agent uses them."}
    - {kind: blog, title: "Effective harnesses for long-running agents", by: "Anthropic", year: 2025, url: "https://www.anthropic.com/engineering/effective-harnesses-for-long-running-agents", why: "Shows what changes when a task outlasts one context window: progress files, feature lists, one tested increment per session."}
  - id: planning-and-reasoning
    kind: applied
    name: Planning and Reasoning
    title: The Peninsula of Long Thought
    definition: Structured problem solving — the chain-of-thought lineage, search over reasoning, test-time compute and reasoning models, self-reflection, and neuro-symbolic planning with external solvers and verifiers.
    distinct_from: Concerns how a solution is derived, not whether actions are taken (vs. Agents). Training methods that produce reasoning (RLVR, GRPO) live in Adaptation.
    descends_from: [symbolic-ai-planning, deep-learning-nlp, reinforcement-learning]
    deep_dive_focus:
      - Neuro-symbolic planning — LLM+P, LLM-Modulo, LLM-generated PDDL, verifier-in-the-loop systems
      - Test-time compute strategies and when they pay for themselves
      - Faithfulness of reasoning traces and what that means for engineers
    overview: "Planning and Reasoning covers how a model works its way to an answer instead of producing it in one shot. It starts with chain-of-thought: asking the model to write out intermediate steps before answering turned out to unlock multi-step math and logic in large models. Variations followed quickly. Self-consistency samples several chains and takes the majority answer, and program-aided reasoning has the model write code so an interpreter does the arithmetic.\n\nA single chain can't recover from an early mistake, so the next step was search. Tree of Thoughts and its descendants treat partial reasoning as states to expand, score and backtrack from, and process reward models score each step so the search knows where to go. Planning researchers pushed further toward external checking: in LLM-Modulo systems the model only proposes plans and formal verifiers decide whether they are valid.\n\nSince late 2024 much of this has moved inside the model. Reasoning models are trained with reinforcement learning to think at length before answering, and test-time compute became a dial: more thinking or more samples for a better answer at higher cost and latency. Landmarks worth knowing: chain-of-thought, self-consistency, tree search, process reward models, and reasoning models. Open questions are whether the visible reasoning reflects what the model actually computed, which matters for anyone relying on it to monitor behavior, and whether reasoning will move out of text into hidden vectors."
    learning_path:
    - {kind: talk, title: "Stanford CS25: V5 I Large Language Model Reasoning, Denny Zhou of Google Deepmind", by: "Denny Zhou (Stanford CS25)", year: 2025, url: "https://www.youtube.com/watch?v=ebnX5Ur1hBk", why: "One of the people behind chain-of-thought and self-consistency explains why intermediate steps help and how sampling, aggregation and RL fine-tuning build on that, which gives you the frame for everything in this region."}
    - {kind: paper, title: "Chain-of-Thought Prompting Elicits Reasoning in Large Language Models", by: "Jason Wei et al.", year: 2022, url: "https://arxiv.org/abs/2201.11903", why: "The paper that showed a few worked examples with written-out steps make large models much better at math and logic problems. Most later techniques here start from it."}
    - {kind: blog, title: "Why We Think", by: "Lilian Weng", year: 2025, url: "https://lilianweng.github.io/posts/2025-05-01-thinking/", why: "A single long survey of test-time thinking: parallel sampling, sequential revision, search, reward models, latent thinking and faithfulness, with the papers behind each, so the node-level reading has somewhere to land."}
    - {kind: paper, title: "Scaling LLM Test-Time Compute Optimally can be More Effective than Scaling Model Parameters", by: "Charlie Snell et al.", year: 2024, url: "https://arxiv.org/abs/2408.03314", why: "Measures when spending more compute at answer time (search against a verifier, or revising answers) beats using a bigger model, and shows the best strategy depends on how hard the question is."}
    - {kind: blog, title: "Understanding Reasoning LLMs", by: "Sebastian Raschka", year: 2025, url: "https://magazine.sebastianraschka.com/p/understanding-reasoning-llms", why: "Explains how reasoning models like DeepSeek-R1 are actually built (inference-time scaling, pure RL, SFT plus RL, distillation) in plain terms, which connects the prompting techniques above to today's trained thinkers."}
    - {kind: talk, title: "LLM-Modulo Frameworks as Compound AI Architectures for Robust Planning (& Reasoning)", by: "Subbarao Kambhampati", year: 2024, url: "https://www.youtube.com/watch?v=lDCUr2V522o", why: "The skeptic's case: LLMs alone don't plan reliably, so pair them with external verifiers and solvers. Useful for deciding when to trust a model's plan and when to check it."}
  - id: adaptation-and-post-training
    kind: applied
    name: Adaptation and Post-Training
    title: The Tempering Grounds
    definition: Changing weights after pretraining — supervised fine-tuning, parameter-efficient methods, preference optimization, RL from verifiable rewards, distillation.
    distinct_from: Always involves gradient updates (vs. Prompting). Dataset construction lives in Data.
    descends_from: [deep-learning-nlp, reinforcement-learning]
    deep_dive_focus:
      - The post-DPO and post-R1 landscape — which preference and RL methods practitioners actually use
      - Fine-tuning for application teams (when to fine-tune vs. prompt vs. retrieve)
      - Distillation of frontier capabilities into small models
  - id: data-and-synthetic-data
    kind: applied
    name: Data and Synthetic Data
    title: The Quarries
    definition: Creating, curating, and cleaning data for training, retrieval, and evaluation — synthetic generation, deduplication, decontamination, quality filtering, model-assisted annotation.
    distinct_from: Produces datasets (vs. Adaptation, which consumes them; vs. Evaluation, which uses them to measure).
    descends_from: [deep-learning-nlp, information-retrieval]
    deep_dive_focus:
      - Synthetic data at scale — what works, model collapse concerns, and verification
      - Environments and task generation for agentic RL
      - Data for application teams — eval sets, golden sets, labeling with LLMs
  - id: evaluation-and-observability
    kind: applied
    name: Evaluation and Observability
    title: The Watchtowers
    definition: Measuring and debugging AI systems — benchmarks, LLM-as-judge, eval-driven development, RAG and agent evals, tracing, and production monitoring.
    distinct_from: Measures and observes; does not change behavior. Reward models used for training or search live in Reasoning or Adaptation.
    descends_from: [software-engineering, deep-learning-nlp]
    deep_dive_focus:
      - Agent evaluation (trajectories, environments, SWE-bench-style harnesses)
      - Judge reliability and calibration; human vs. model graders
      - Observability standards (OpenTelemetry GenAI conventions) and online evals
  - id: safety-security-and-governance
    kind: applied
    name: Safety, Security and Governance
    title: The Bulwark
    definition: Keeping AI systems from causing harm — prompt injection and jailbreaks, guardrails and defenses, red teaming, sandboxing and permissions, interpretability as a control tool, documentation and governance.
    distinct_from: Primary purpose is risk reduction. Uses techniques from Prompting (guardrails) and Evaluation (red teaming) but is defined by intent.
    descends_from: [systems-security, deep-learning-nlp, human-computer-interaction]
    deep_dive_focus:
      - Prompt injection in agentic systems — attack taxonomy and the defenses that hold up
      - Agent permissions, sandboxing, and least privilege for tools and MCP servers
      - Interpretability methods that have reached engineering use
  - id: ai-product-and-interaction-design
    kind: applied
    name: AI Product and Interaction Design
    title: The Agora
    definition: How AI shows up for users — chat and copilot patterns, streaming, citations and grounding, human-in-the-loop approval, generative UI and canvases, trust and error recovery.
    distinct_from: Defined by the human-facing experience, not the backend mechanism.
    descends_from: [human-computer-interaction]
    deep_dive_focus:
      - Interaction patterns for agents (delegation, background work, approvals, handoff)
      - Trust calibration, uncertainty display, and error recovery
      - Evidence from HCI research on what actually helps users
    overview: "AI Product and Interaction Design is about how AI reaches people: the screens, conversations and controls that sit between a model and its user. It grew out of HCI work on mixed-initiative systems, and Microsoft's 2019 guidelines for human-AI interaction still frame the basics: set expectations, explain behavior, make correction cheap.\n\nThe modern era began with two surfaces. Copilots (2021) put suggestions inline where users already work, and chat (2022) made a message thread the default way to talk to a model. Streaming made replies feel fast, and citations let users check grounded answers. Chat's linear thread is a poor place to build something, so canvases and artifacts moved the work product into an editable pane beside the conversation, and generative UI lets the model answer with interface components instead of prose.\n\nAgents shifted the focus from what the model says to what it does. Approval gates pause before consequential actions, plan previews let users fix a plan before work starts, and action traces show what actually happened. Recent studies find that reviewing only an agent's final result misses errors made early in the run, which is pushing products toward step-level visibility and steering. Reasoning models added a visible thinking panel, which helps users follow along but is not a faithful explanation of how the answer was reached.\n\nLandmarks worth knowing: the human-AI interaction guidelines, chat, copilots, citations, and human-in-the-loop approval. The open problem is trust calibration: getting users to rely on AI when it is right and check it when it is not, as outputs become longer, more autonomous and harder to verify."
    learning_path:
    - {kind: blog, title: "Guidelines for human-AI interaction design", by: "Microsoft Research (Saleema Amershi et al.)", year: 2019, url: "https://www.microsoft.com/en-us/research/blog/guidelines-for-human-ai-interaction-design/", why: "The 18 tested guidelines (set expectations, support correction, explain behavior, adapt over time) give a checklist that still applies to every pattern later in this region."}
    - {kind: blog, title: "Why Chatbots Are Not the Future of Interfaces", by: "Amelia Wattenberger", year: 2023, url: "https://wattenberger.com/thoughts/boo-chatbots/", why: "Explains what a bare text box hides from users (what the tool can do, how to ask) and why most AI features need more structure than chat."}
    - {kind: talk, title: "Generative Interfaces Beyond Chat", by: "Linus Lee (LLMs in Production Conference)", year: 2023, url: "https://www.youtube.com/watch?v=rd-J3hmycQs", why: "Shows concrete alternatives to chat, with the model's output turned into things the user can see, point at and edit directly."}
    - {kind: blog, title: "Agentic UX Patterns: A Practical Guide to Designing AI That Acts", by: "Ali Tajer", year: 2026, url: "https://alitajer.com/blog/agentic-ux-patterns", why: "Covers the shift from answering to acting: plan previews, approvals, live action traces, and pause, stop and take-over controls, each with when to use it."}
    - {kind: talk, title: "AI Agent UX Patterns: Lessons From 1000 Startups", by: "Jonas Braadbaart (aiGrunn)", year: 2024, url: "https://www.youtube.com/watch?v=3kiTAGa7VFI", why: "A survey of how shipped agent products actually present their work to users, and which of those patterns hold up."}
    - {kind: paper, title: "Overreliance on AI: Literature Review", by: "Samir Passi, Mihaela Vorvoreanu (Microsoft)", year: 2022, url: "https://www.microsoft.com/en-us/research/publication/overreliance-on-ai-literature-review/", why: "Explains why people accept wrong AI output and which interface choices (explanations, uncertainty, friction) help them check it instead."}
  - id: multimodal-applied
    kind: applied
    name: Multimodal
    title: The Painted Isles
    definition: Vision, speech, documents, and generated media as used in applications — vision-language models, realtime voice, document understanding, image and video generation.
    distinct_from: Covers modality-specific engineering; general orchestration of multimodal agents lives in Agents.
    descends_from: [deep-learning-nlp]
    deep_dive_focus:
      - Document understanding pipelines (VLM parsing vs. OCR) and visual retrieval
      - Realtime voice agents — latency, turn-taking, interruption
      - Video understanding and generation as application building blocks

boundary_rules:
  - {concept: ReAct, home: agents-and-orchestration, rule: "Defined by acting in an environment via tools → Agents."}
  - {concept: Tree of Thoughts / tree search, home: planning-and-reasoning, rule: "Searches over generated reasoning paths without changing the world → Reasoning."}
  - {concept: Reflexion / self-reflection, home: planning-and-reasoning, rule: "Improves a solution via critique, even when the loop runs in an agent → Reasoning."}
  - {concept: Structured outputs, home: prompting-and-context-engineering, rule: "The practice lives in Prompting; the decoding mechanism (constrained decoding) lives in Inference."}
  - {concept: Agentic RAG / deep research, home: "retrieval-and-knowledge (agentic RAG); agents-and-orchestration (deep research agents)", rule: "Information goal over a corpus → Retrieval. Open-ended, multi-source research as a product capability → Agents."}
  - {concept: Agent memory, home: agents-and-orchestration, rule: "Memory that persists across agent sessions → Agents, even when implemented with retrieval."}
  - {concept: Prompt caching, home: inference-and-serving, rule: "KV reuse is an infrastructure optimization regardless of how APIs expose it."}
  - {concept: Function calling, home: agents-and-orchestration, rule: "The primitive for requesting external execution → Agents."}
  - {concept: MCP / Agent skills, home: agents-and-orchestration, rule: "Protocols and packaging for capabilities agents use → Agents."}
  - {concept: Self-instruct / synthetic data, home: data-and-synthetic-data, rule: "Producing the dataset → Data; training on it → Adaptation."}
  - {concept: Reasoning distillation, home: adaptation-and-post-training, rule: "The act of training a student → Adaptation; generating the traces → Data."}
  - {concept: DSPy / prompt optimization, home: prompting-and-context-engineering, rule: "No gradient updates to model weights → Prompting."}
  - {concept: Process reward models, home: planning-and-reasoning, rule: "Primarily used to score steps for search and verification → Reasoning (secondary: Adaptation)."}
  - {concept: RLVR / GRPO, home: adaptation-and-post-training, rule: "Weight-updating methods → Adaptation, even when the goal is reasoning."}
  - {concept: Reranking, home: retrieval-and-knowledge, rule: "Scoring to order results for generation → Retrieval."}
  - {concept: Guardrails / injection defenses, home: safety-security-and-governance, rule: "Components whose purpose is blocking harm → Safety."}
  - {concept: Agent sandboxing and permissions, home: safety-security-and-governance, rule: "Mechanisms whose purpose is limiting blast radius → Safety (moved from Agents in v0.2)."}
  - {concept: Interpretability / RepE, home: safety-security-and-governance, rule: "Used by engineers to detect and steer behavior → Safety (pure science stays offshore at maturity 1)."}
  - {concept: LLM-as-judge, home: evaluation-and-observability, rule: "Deployed to measure → Evaluation, though implemented as a prompt."}
  - {concept: Human-in-the-loop approval, home: ai-product-and-interaction-design, rule: "Defined by the human decision point → Product (secondary: Agents)."}
  - {concept: Architectures (MoE, SSMs), home: deep-learning-nlp, rule: "Model internals stay in the root unless engineers configure them at serving time."}

nodes:
  # ======================= ROOTS: information-retrieval =======================
  - id: bm25
    name: BM25
    aliases: [Okapi BM25, sparse retrieval, TF-IDF ranking]
    region: information-retrieval
    desc: Probabilistic ranking function scoring documents by term frequency and inverse document frequency; the standard lexical search baseline.
    parents: []
    maturity: 5
    maturity_note: Decades of deployment; default lexical scorer in search engines.
    date: "1994"
    ref: {title: "Okapi at TREC-3 (Robertson et al.)"}
    examples: [Lucene, Elasticsearch, OpenSearch]
    status: kept
  - id: approximate-nearest-neighbor-search
    name: Approximate Nearest Neighbor Search
    aliases: [ANN, HNSW, vector indexing]
    region: information-retrieval
    desc: Index structures that find near neighbors in high-dimensional vector spaces quickly at slight accuracy cost; the engine inside vector databases.
    parents: []
    maturity: 5
    maturity_note: Standard infrastructure in every vector store.
    date: "2016-03"
    ref: {title: "Efficient and robust approximate nearest neighbor search using Hierarchical Navigable Small World graphs (Malkov & Yashunin)", arxiv: "1603.09320"}
    examples: [FAISS, hnswlib, pgvector, Qdrant]
