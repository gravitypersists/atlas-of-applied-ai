  - id: pii-redaction
    name: PII Redaction
    aliases: [PII scrubbing, data anonymization]
    region: data-and-synthetic-data
    layer: detail
    also: [safety-and-security]
    desc: Detecting and masking personal information in training, eval and retrieval data before models see it.
    summary: "Finding names, emails, phone numbers, account numbers and similar details in data and masking or replacing them before the data is used for training, evals or retrieval. Detectors combine patterns for structured identifiers with named-entity models for names and places. Scrubbing reduces what a model can memorize and leak, but no detector is perfect, so it is one layer of privacy protection, not a guarantee."
