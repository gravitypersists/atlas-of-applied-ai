  # ======================= APPLIED: retrieval-and-knowledge =======================
  - id: text-embeddings
    name: Text Embeddings
    aliases: [embedding models, sentence embeddings]
    region: retrieval-and-knowledge
    desc: Models that map text to vectors so that semantically similar texts are close together.
    summary: "An embedding model turns a piece of text into a list of numbers (a vector) so that texts with similar meaning end up close together. This lets software compare texts by meaning rather than by shared words, and it is the base layer of almost every semantic search and RAG system."
    parents:
      - {id: pretrained-language-models, rel: specializes, why: "Fine-tunes pretrained encoders to produce comparable sentence vectors.", src: "Sentence-BERT (Reimers & Gurevych 2019)"}
    maturity: 5
    maturity_note: Bedrock of semantic search.
    date: "2019-08"
    ref: {title: "Sentence-BERT: Sentence Embeddings using Siamese BERT-Networks (Reimers & Gurevych)", arxiv: "1908.10084"}
    examples: [OpenAI text-embedding-3, Voyage, BGE, Nomic]
    resources:
      - {kind: blog, title: "Embeddings: What they are and why they matter", by: "Simon Willison", year: 2023, url: "https://simonwillison.net/2023/Oct/23/embeddings/"}
      - {kind: talk, title: "\"Embeddings: What they are and why they matter\" - Simon Willison (PyBay 2023)", by: "Simon Willison (PyBay)", year: 2023, url: "https://www.youtube.com/watch?v=snKTqb10vWQ"}
      - {kind: blog, title: "What are embeddings?", by: "Vicki Boykis", year: 2023, url: "https://vickiboykis.com/what_are_embeddings/"}
      - {kind: paper, title: "MTEB: Massive Text Embedding Benchmark", by: "Niklas Muennighoff, Nouamane Tazi, Loïc Magne, Nils Reimers", year: 2022, url: "https://arxiv.org/abs/2210.07316"}
    status: repaired
  - id: dense-retrieval
    name: Dense Retrieval
    aliases: [vector search, semantic search, DPR]
    region: retrieval-and-knowledge
    desc: Retrieving documents by embedding queries and passages into a shared vector space and searching by similarity.
    summary: "Dense retrieval finds documents by embedding the question and every passage into the same vector space and returning the passages nearest the question. Approximate nearest-neighbour indexes make this fast over millions of passages; it is what a vector database does, and it catches paraphrases that keyword search misses."
    parents:
      - {id: text-embeddings, rel: applies, why: "Uses learned embeddings as the retrieval representation.", src: "Dense Passage Retrieval (Karpukhin et al. 2020)"}
      - {id: approximate-nearest-neighbor-search, rel: combines, why: "Depends on ANN indexes to search at scale.", src: "Dense Passage Retrieval (Karpukhin et al. 2020)"}
      - {id: bm25, rel: replaces, why: "Positioned as a learned replacement for sparse retrieval.", src: "Dense Passage Retrieval (Karpukhin et al. 2020)"}
    maturity: 5
    maturity_note: Standard mechanism of vector databases.
    date: "2020-04"
    ref: {title: "Dense Passage Retrieval for Open-Domain Question Answering (Karpukhin et al.)", arxiv: "2004.04906"}
    examples: [Pinecone, Weaviate, pgvector]
    resources:
      - {kind: docs, title: "Semantic Search — Sentence Transformers documentation", by: "Sentence Transformers (Hugging Face)", year: 2024, url: "https://www.sbert.net/examples/sentence_transformer/applications/semantic-search/README.html"}
      - {kind: talk, title: "Stanford XCS224U: NLU I Information Retrieval, Part 4: Neural IR I Spring 2023", by: "Christopher Potts (Stanford XCS224U)", year: 2023, url: "https://www.youtube.com/watch?v=EDVqG86AT0Q"}
      - {kind: paper, title: "BEIR: A Heterogenous Benchmark for Zero-shot Evaluation of Information Retrieval Models", by: "Nandan Thakur et al.", year: 2021, url: "https://arxiv.org/abs/2104.08663"}
    status: repaired
  - id: retrieval-augmented-generation
    name: Retrieval-Augmented Generation
    aliases: [RAG, naive RAG]
    region: retrieval-and-knowledge
    desc: Retrieving relevant passages and placing them in the model's context so generation is grounded in external knowledge.
    summary: "RAG looks up passages relevant to a question and puts them in the model's prompt, so the answer is based on your documents instead of only on what the model memorized in training. It is the default way to ground an application in private or fresh data, and the answer is only as good as what retrieval finds."
    parents:
      - {id: open-domain-qa, rel: extends, why: "Replaces the extractive reader with a generative model.", src: "Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks (Lewis et al. 2020)"}
      - {id: dense-retrieval, rel: combines, why: "Uses dense retrieval as the retriever.", src: "Lewis et al. 2020"}
      - {id: pretrained-language-models, rel: combines, why: "Uses a pretrained generator.", src: "Lewis et al. 2020"}
    maturity: 5
    maturity_note: The default pattern for grounding applications.
    date: "2020-05"
    ref: {title: "Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks (Lewis et al.)", arxiv: "2005.11401"}
    examples: [LlamaIndex, LangChain, Haystack]
    resources:
      - {kind: blog, title: "Patterns for Building LLM-based Systems & Products", by: "Eugene Yan", year: 2023, url: "https://eugeneyan.com/writing/llm-patterns/"}
      - {kind: talk, title: "Stanford CS25: V3 I Retrieval Augmented Language Models", by: "Douwe Kiela (Stanford CS25)", year: 2024, url: "https://www.youtube.com/watch?v=mE7IDf2SmJg"}
      - {kind: talk, title: "RAG Agents in Prod: 10 Lessons We Learned — Douwe Kiela, creator of RAG", by: "Douwe Kiela (AI Engineer)", year: 2025, url: "https://www.youtube.com/watch?v=kPL-6-9MVyA"}
      - {kind: paper, title: "Retrieval-Augmented Generation for Large Language Models: A Survey", by: "Yunfan Gao et al.", year: 2023, url: "https://arxiv.org/abs/2312.10997"}
    status: repaired
  - id: chunking-strategies
    name: Chunking Strategies
    aliases: [text splitting, semantic chunking]
    region: retrieval-and-knowledge
    desc: Splitting documents into passages sized and bounded for embedding and retrieval.
    summary: "Documents are too long to embed and retrieve whole, so they are split into passages first. Chunk size and boundaries matter more than they look: small chunks match precisely but lose context, large ones keep context but blur the match. Splitting on structure (headings, paragraphs) usually beats fixed character counts."
    parents:
      - {id: retrieval-augmented-generation, rel: applies, why: "Required preprocessing for passage-level retrieval.", src: "RAG framework practice (2022)"}
    maturity: 4
    maturity_note: Well understood; variants still evolving.
    date: "2022"
    ref: {title: "LangChain text splitters documentation"}
    examples: [RecursiveCharacterTextSplitter, Unstructured]
    resources:
      - {kind: blog, title: "Chunking Strategies for LLM Applications", by: "Pinecone", year: 2023, url: "https://www.pinecone.io/learn/chunking-strategies/"}
      - {kind: talk, title: "The 5 Levels Of Text Splitting For Retrieval", by: "Greg Kamradt (YouTube)", year: 2024, url: "https://www.youtube.com/watch?v=8OJC21T2SL4"}
      - {kind: blog, title: "Evaluating Chunking Strategies for Retrieval", by: "Brandon Smith, Anton Troynikov (Chroma)", year: 2024, url: "https://www.trychroma.com/research/evaluating-chunking"}
    status: repaired
  - id: hybrid-search
    name: Hybrid Search
    aliases: [sparse + dense retrieval, reciprocal rank fusion]
    region: retrieval-and-knowledge
    desc: Combining lexical and vector retrieval, typically fusing rankings, to catch both exact terms and semantic matches.
    summary: "Hybrid search runs keyword search (BM25) and vector search side by side and merges the two result lists, usually with reciprocal rank fusion. Keywords catch exact names, codes and rare terms that embeddings blur; vectors catch paraphrases. It is the recommended production baseline."
    parents:
      - {id: bm25, rel: combines, why: "Contributes exact-term matching.", src: "Reciprocal Rank Fusion (Cormack et al. 2009)"}
      - {id: dense-retrieval, rel: combines, why: "Contributes semantic matching.", src: "Reciprocal Rank Fusion (Cormack et al. 2009)"}
    maturity: 4
    maturity_note: Recommended production baseline.
    date: "2022"
    ref: {title: "Reciprocal Rank Fusion Outperforms Condorcet and Individual Rank Learning Methods (Cormack et al., SIGIR 2009)"}
    examples: [Weaviate hybrid, Elasticsearch, Vespa]
    resources:
      - {kind: blog, title: "Hybrid Search Explained", by: "Weaviate", year: 2023, url: "https://weaviate.io/blog/hybrid-search-explained"}
      - {kind: docs, title: "Reciprocal rank fusion", by: "Elastic", year: 2024, url: "https://www.elastic.co/docs/reference/elasticsearch/rest-apis/reciprocal-rank-fusion"}
      - {kind: talk, title: "Haystack EU 2023 - Jo Kristian Bergum: Navigating Neural Search: Avoiding Common Pitfalls", by: "Jo Kristian Bergum (Haystack EU)", year: 2023, url: "https://www.youtube.com/watch?v=PrBtxqARY9U"}
    status: kept
  - id: cross-encoder-reranking
    name: Cross-Encoder Reranking
    aliases: [rerankers, retrieve-and-rerank, multi-stage retrieval]
    region: retrieval-and-knowledge
    desc: Rescoring a candidate set by passing query and document jointly through a transformer for a precise relevance score.
    summary: "A fast first-stage search pulls a few dozen to a few hundred candidates, then a cross-encoder reads the question and each candidate together and scores how relevant it is. Reading them jointly is much more accurate than comparing separate vectors, but too slow to run over a whole corpus, so it is used only on the shortlist."
    parents:
      - {id: pretrained-language-models, rel: applies, why: "Uses a pretrained transformer as a relevance scorer.", src: "Passage Re-ranking with BERT (Nogueira & Cho 2019)"}
      - {id: bm25, rel: extends, why: "Introduced as a second stage over first-stage lexical retrieval.", src: "Passage Re-ranking with BERT (Nogueira & Cho 2019)"}
    maturity: 4
    maturity_note: Standard in high-accuracy retrieval.
    date: "2019-01"
    ref: {title: "Passage Re-ranking with BERT (Nogueira & Cho)", arxiv: "1901.04085"}
    examples: [Cohere Rerank, BGE-Reranker, Voyage rerank]
    resources:
      - {kind: blog, title: "Rerankers and Two-Stage Retrieval", by: "James Briggs (Pinecone)", year: 2023, url: "https://www.pinecone.io/learn/series/rag/rerankers/"}
      - {kind: talk, title: "Beyond the Basics of Retrieval for Augmenting Generation (w/ Ben Clavié)", by: "Ben Clavié (Mastering LLMs conference, hosted by Hamel Husain)", year: 2024, url: "https://www.youtube.com/watch?v=0nA5QG3087g"}
      - {kind: docs, title: "Cross-Encoders — Sentence Transformers documentation", by: "Sentence Transformers (Hugging Face)", year: 2024, url: "https://www.sbert.net/examples/cross_encoder/applications/README.html"}
      - {kind: paper, title: "Document Ranking with a Pretrained Sequence-to-Sequence Model", by: "Rodrigo Nogueira, Zhiying Jiang, Jimmy Lin", year: 2020, url: "https://arxiv.org/abs/2003.06713"}
    status: repaired
  - id: query-rewriting
    name: Query Rewriting and HyDE
    aliases: [query expansion, HyDE, Rewrite-Retrieve-Read]
    region: retrieval-and-knowledge
    desc: Using a model to rewrite, expand, or answer hypothetically before retrieval, improving recall for short or vague queries.
    summary: "The model rewrites the user's question before searching: expanding it, splitting it, or (HyDE) writing a hypothetical answer and searching for passages that look like it. This helps when questions are short, vague, or worded differently from the documents, at the cost of an extra model call before retrieval."
    parents:
      - {id: dense-retrieval, rel: extends, why: "Changes the query representation fed to the retriever.", src: "Precise Zero-Shot Dense Retrieval without Relevance Labels (Gao et al. 2022)"}
    maturity: 3
    maturity_note: Common in advanced pipelines; adds latency.
    date: "2022-12"
    ref: {title: "Precise Zero-Shot Dense Retrieval without Relevance Labels (Gao et al.)", arxiv: "2212.10496"}
    examples: [LlamaIndex query transforms]
    resources:
      - {kind: blog, title: "Query Transformations", by: "LangChain", year: 2023, url: "https://www.langchain.com/blog/query-transformations"}
      - {kind: talk, title: "RAG from scratch: Part 9 (Query Translation -- HyDE)", by: "Lance Martin (LangChain)", year: 2024, url: "https://www.youtube.com/watch?v=SaDzIVkYqyY"}
      - {kind: paper, title: "Query Rewriting for Retrieval-Augmented Large Language Models", by: "Xinbei Ma et al.", year: 2023, url: "https://arxiv.org/abs/2305.14283"}
      - {kind: paper, title: "Query2doc: Query Expansion with Large Language Models", by: "Liang Wang, Nan Yang, Furu Wei", year: 2023, url: "https://arxiv.org/abs/2303.07678"}
    status: repaired
  - id: contextual-retrieval
    name: Contextual Retrieval
    aliases: [contextual chunking]
    region: retrieval-and-knowledge
    desc: Prepending model-generated document context to each chunk before embedding and indexing, reducing retrieval failures from orphaned chunks.
    summary: "Before indexing, a model writes a sentence or two placing each chunk in its document (\"this is from Acme's Q3 2024 report, on revenue\") and prepends it to the chunk. Chunks that said only \"it grew 15%\" become findable again. Anthropic reported far fewer retrieval failures when combined with hybrid search and reranking; prompt caching keeps the indexing cost down."
    parents:
      - {id: chunking-strategies, rel: extends, why: "Restores document context lost by chunking.", src: "Introducing Contextual Retrieval (Anthropic 2024)"}
      - {id: hybrid-search, rel: applies, why: "Applied to both embedding and BM25 indexes.", src: "Introducing Contextual Retrieval (Anthropic 2024)"}
    maturity: 3
    maturity_note: Widely copied pattern; relies on prompt caching for cost.
    date: "2024-09"
    ref: {title: "Introducing Contextual Retrieval (Anthropic)", url: "https://www.anthropic.com/engineering/contextual-retrieval"}
    examples: [Anthropic cookbook]
    resources:
      - {kind: code, title: "claude-cookbooks/capabilities/contextual-embeddings/guide.ipynb", by: "Anthropic", year: 2024, url: "https://github.com/anthropics/claude-cookbooks/blob/main/capabilities/contextual-embeddings/guide.ipynb"}
      - {kind: talk, title: "Build Contextual Retrieval with Anthropic and Pinecone", by: "Alex Albert, Arjun Patel (Pinecone webinar)", year: 2024, url: "https://www.youtube.com/watch?v=u-ocR-2P_YA"}
      - {kind: docs, title: "Prompt caching - Claude Platform Docs", by: "Anthropic", year: 2024, url: "https://platform.claude.com/docs/en/build-with-claude/prompt-caching"}
    status: repaired
  - id: graph-rag
    name: GraphRAG
    aliases: [knowledge-graph RAG]
    region: retrieval-and-knowledge
    desc: Using models to extract an entity graph from a corpus, cluster it into communities, and summarize them to answer global questions.
    summary: "GraphRAG has a model extract entities and relationships from a corpus into a knowledge graph, groups the graph into communities, and summarizes each one ahead of time. That lets it answer global questions (\"what are the main themes across these reports?\") that passage search cannot. The up-front extraction and summarization is expensive, which limits production use."
    parents:
      - {id: retrieval-augmented-generation, rel: combines, why: "Keeps retrieval-then-generate structure.", src: "From Local to Global (Edge et al. 2024)"}
      - {id: knowledge-graphs, rel: combines, why: "Builds and traverses a knowledge graph automatically.", src: "From Local to Global (Edge et al. 2024)"}
    maturity: 2
    maturity_note: High interest; indexing cost limits production use.
    date: "2024-04"
    ref: {title: "From Local to Global: A Graph RAG Approach to Query-Focused Summarization (Edge et al.)", arxiv: "2404.16130"}
    examples: [Microsoft GraphRAG, Neo4j GraphRAG]
    resources:
      - {kind: blog, title: "GraphRAG: Unlocking LLM discovery on narrative private data", by: "Microsoft Research (Jonathan Larson, Steven Truitt)", year: 2024, url: "https://www.microsoft.com/en-us/research/blog/graphrag-unlocking-llm-discovery-on-narrative-private-data/"}
      - {kind: docs, title: "Welcome - GraphRAG", by: "Microsoft", year: 2024, url: "https://microsoft.github.io/graphrag/"}
      - {kind: talk, title: "GraphRAG methods to create optimized LLM context windows for Retrieval — Jonathan Larson, Microsoft", by: "Jonathan Larson (AI Engineer World's Fair)", year: 2025, url: "https://www.youtube.com/watch?v=c5qJHr3DnT4"}
      - {kind: paper, title: "Graph Retrieval-Augmented Generation: A Survey", by: "Boci Peng et al.", year: 2024, url: "https://arxiv.org/abs/2408.08921"}
    status: repaired
  - id: self-rag
    name: Self-RAG
    aliases: [self-reflective RAG]
    region: retrieval-and-knowledge
    desc: Training a model to decide when to retrieve and to critique its own generations with reflection tokens.
    summary: "Self-RAG trains the model itself to decide when it needs to retrieve, whether what it retrieved is relevant, and whether its own answer is supported, by emitting special reflection tokens. It needs a fine-tuned model, so its ideas mostly live on in prompt-based and agentic retrieval rather than in the original form."
    parents:
      - {id: retrieval-augmented-generation, rel: extends, why: "Makes retrieval adaptive and self-critiqued.", src: "Self-RAG (Asai et al. 2023)"}
    maturity: 2
    maturity_note: Influential research; patterns absorbed into agentic RAG.
    date: "2023-10"
    ref: {title: "Self-RAG: Learning to Retrieve, Generate, and Critique through Self-Reflection (Asai et al.)", arxiv: "2310.11511"}
    examples: [Self-RAG checkpoints]
    resources:
      - {kind: talk, title: "Akari Asai: Self-reflective Language Models with Retrieval (2023-10-26)", by: "Akari Asai (UMass Machine Learning & Friends Lunch)", year: 2023, url: "https://www.youtube.com/watch?v=bVz8Ua1VVsE"}
      - {kind: code, title: "Self-RAG: Learning to Retrieve, Generate and Critique through Self-Reflection (project page, models and code)", by: "Akari Asai et al.", year: 2023, url: "https://selfrag.github.io/"}
      - {kind: talk, title: "Self-reflective RAG with LangGraph: Self-RAG and CRAG", by: "Lance Martin (LangChain)", year: 2024, url: "https://www.youtube.com/watch?v=pbAd8O1Lvm4"}
    status: repaired
  - id: corrective-rag
    name: Corrective RAG
    aliases: [CRAG]
    region: retrieval-and-knowledge
    desc: Grading retrieved documents and falling back to web search or refinement when retrieval quality is low.
    summary: "Corrective RAG adds a grader between retrieval and generation. If the retrieved documents look relevant it trims them to the useful parts; if they look wrong it throws them out and searches the web instead; if unsure it uses both. It is a common template pattern, with limited evidence of broad production use."
    parents:
      - {id: retrieval-augmented-generation, rel: extends, why: "Adds a retrieval evaluator and corrective actions.", src: "Corrective Retrieval Augmented Generation (Yan et al. 2024)"}
    maturity: 2
    maturity_note: Common in templates; limited evidence of broad production use.
    date: "2024-01"
    ref: {title: "Corrective Retrieval Augmented Generation (Yan et al.)", arxiv: "2401.15884"}
    examples: [LangGraph CRAG template]
    resources:
      - {kind: blog, title: "Self-Reflective RAG with LangGraph", by: "LangChain", year: 2024, url: "https://www.langchain.com/blog/agentic-rag-with-langgraph"}
      - {kind: talk, title: "Building Corrective RAG from scratch with open-source, local LLMs", by: "Lance Martin (LangChain)", year: 2024, url: "https://www.youtube.com/watch?v=E2shqsYwxck"}
      - {kind: code, title: "HuskyInSalt/CRAG: Corrective Retrieval Augmented Generation", by: "Shi-Qi Yan et al.", year: 2024, url: "https://github.com/HuskyInSalt/CRAG"}
    status: repaired
  - id: agentic-rag
    name: Agentic RAG
    aliases: [agentic search, iterative retrieval]
    region: retrieval-and-knowledge
    also: [agents-and-orchestration]
    desc: Letting an agent plan queries, choose sources and tools, and iterate retrieval until it has enough to answer.
    summary: "Instead of one fixed retrieval step, an agent decides what to search for, which source or tool to use (vector index, SQL, web, or grep and file reads over a codebase), reads the results, and searches again until it has enough to answer. It handles multi-step questions that a single lookup misses, at the cost of more latency and model calls. Coding agents often skip the index entirely and search files directly."
    parents:
      - {id: retrieval-augmented-generation, rel: combines, why: "Retrieval remains the core goal.", src: "Agentic RAG survey (Singh et al. 2025)"}
      - {id: react-agent-loop, rel: combines, why: "Wraps retrieval in an agent loop.", src: "Agentic RAG survey (Singh et al. 2025)"}
      - {id: self-rag, rel: extends, why: "Generalizes adaptive, self-critiqued retrieval.", src: "Agentic RAG survey (Singh et al. 2025)", confidence: medium}
    maturity: 3
    maturity_note: In enterprise production; agentic search increasingly replaces fixed pipelines.
    date: "2024"
    ref: {title: "Agentic Retrieval-Augmented Generation: A Survey on Agentic RAG (Singh et al.)", arxiv: "2501.09136"}
    examples: [LlamaIndex agents, agentic file search in coding agents]
    resources:
      - {kind: blog, title: "What Is Agentic RAG? From LLM RAG to AI Agents", by: "Weaviate", year: 2024, url: "https://weaviate.io/blog/what-is-agentic-rag"}
      - {kind: docs, title: "Build a custom RAG agent with LangGraph", by: "LangChain", year: 2025, url: "https://docs.langchain.com/oss/python/langgraph/agentic-rag"}
      - {kind: talk, title: "Agentic Search for Context Engineering — Leonie Monigatti, Elastic", by: "Leonie Monigatti (AI Engineer)", year: 2026, url: "https://www.youtube.com/watch?v=ynJyIKwjonM"}
      - {kind: paper, title: "Search-R1: Training LLMs to Reason and Leverage Search Engines with Reinforcement Learning", by: "Bowen Jin et al.", year: 2025, url: "https://arxiv.org/abs/2503.09516"}
