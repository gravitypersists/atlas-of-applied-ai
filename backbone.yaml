  - id: injection-defenses
    name: Prompt Injection Defenses
    aliases: [instruction hierarchy, injection detection]
    region: safety-and-security
    desc: Training, prompting, and architectural measures that make models distinguish trusted instructions from untrusted data.
    summary: "Measures that help a model tell trusted instructions from untrusted data. They work at three levels: training (the instruction hierarchy teaches a model to rank system, user and tool text by privilege), input handling (marking untrusted text, as spotlighting does, and detectors that flag likely attacks), and system design (keeping untrusted text away from the parts that can act, as in the dual LLM pattern). Each lowers attack success and none is complete, so they are layered."
    parents:
      - {id: prompt-injection, rel: counters, why: "Mitigates injection.", src: "The Instruction Hierarchy (Wallace et al. 2024)"}
      - {id: indirect-prompt-injection, rel: counters, why: "Mitigates injection via third-party content.", src: "The Instruction Hierarchy (Wallace et al. 2024)"}
    maturity: 3
    maturity_note: Deployed in frontier models; known to be incomplete.
    date: "2024-04"
    ref: {title: "The Instruction Hierarchy: Training LLMs to Prioritize Privileged Instructions (Wallace et al.)", arxiv: "2404.13208"}
    examples: [Lakera Guard, Prompt Shields, CaMeL-style designs]
    resources:
      - {kind: "blog", title: "How Microsoft defends against indirect prompt injection attacks", by: "Microsoft Security Response Center", year: 2025, url: "https://www.microsoft.com/en-us/msrc/blog/2025/07/how-microsoft-defends-against-indirect-prompt-injection-attacks"}
      - {kind: "blog", title: "Mitigating prompt injections in browser use", by: "Anthropic", year: 2025, url: "https://www.anthropic.com/research/prompt-injection-defenses"}
      - {kind: "docs", title: "LLM Prompt Injection Prevention Cheat Sheet", by: "OWASP Cheat Sheet Series", year: 2024, url: "https://cheatsheetseries.owasp.org/cheatsheets/LLM_Prompt_Injection_Prevention_Cheat_Sheet.html"}
      - {kind: "paper", title: "SecAlign: Defending Against Prompt Injection with Preference Optimization", by: "Sizhe Chen et al.", year: 2024, url: "https://arxiv.org/abs/2410.05451"}
    status: repaired
  - id: agent-sandboxing
    name: Agent Sandboxing and Permissions
    aliases: [secure code execution, tool permissions, least-privilege agents]
    region: safety-and-security
    also: [agents-and-orchestration]
    desc: Running agent actions in isolated environments with scoped credentials and explicit permission prompts to limit damage.
    summary: "Limits what an agent can do if it makes a mistake or is hijacked. Code it writes runs in an isolated container or VM, its credentials are scoped to the task, and risky actions need explicit permission. The design question is how much damage one bad step can do, not whether the model will behave. Standard for any agent that executes code."
    parents:
      - {id: sandboxing-and-isolation, rel: applies, why: "Applies isolation to LLM-generated code and actions.", src: "E2B (2023)"}
      - {id: least-privilege, rel: applies, why: "Scopes tools and credentials to what a task needs.", src: "Industry practice"}
      - {id: function-calling, rel: counters, why: "Contains the risks of models triggering real actions and code execution.", src: "Industry practice"}
    maturity: 4
    maturity_note: Standard for any agent that executes code.
    date: "2023"
