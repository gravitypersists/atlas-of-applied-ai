  - id: constitutional-ai
    name: Constitutional AI and RLAIF
    aliases: [RLAIF, AI feedback]
    region: adaptation-and-post-training
    also: [safety-and-security, data-and-synthetic-data]
    desc: Using a model guided by written principles to critique, revise, and rank outputs, replacing much of the human preference labeling.
    summary: "A model guided by a written set of principles (a constitution) critiques and revises answers and judges which of two is better, replacing most human preference labels with AI feedback (RLAIF). This makes preference data far cheaper to produce at scale, and the principles make the target behavior explicit."
    parents:
