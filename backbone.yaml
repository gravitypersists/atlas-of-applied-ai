  - id: data-flywheel
    name: Data Flywheel
    aliases: [production data loop, trace mining]
    region: data-and-synthetic-data
    also: [evaluation-and-observability, adaptation-and-post-training]
    desc: Turning logged production traffic and user feedback into eval cases and fine-tuning data, in a repeating loop.
    summary: "A loop that turns an application's own traffic into better data. Production traces are logged, scrubbed of personal data, and sorted by signals such as user feedback or judge scores; failures become new eval cases, and good interactions become fine-tuning data, often used to train a smaller, cheaper model for the task. Every turn of the loop improves the next one. The idea is simple, but the plumbing (tracing, review queues, privacy) makes it hard to run well."
    parents:
      - {id: golden-eval-sets, rel: extends, why: "Keeps the eval set growing from production failures instead of a one-off collection.", src: "Data flywheel (NVIDIA glossary)"}
      - {id: llm-tracing, rel: applies, why: "Draws its raw material from logged production traces.", src: "Data flywheel (NVIDIA glossary)"}
      - {id: online-evaluation, rel: combines, why: "Uses production scores and feedback to pick which traces enter the dataset.", src: "Data flywheel (NVIDIA glossary)", confidence: medium}
    maturity: 3
    maturity_note: Widely described, practiced end to end mainly by mature teams.
    date: "2024"
    ref: {title: "Data flywheel: What it is and how it works (NVIDIA Glossary)", url: "https://www.nvidia.com/en-us/glossary/data-flywheel/"}
    examples: [NVIDIA Data Flywheel Blueprint, LangSmith annotation queues]
    resources:
      - {kind: blog, title: "A Field Guide to Rapidly Improving AI Products", by: "Hamel Husain", year: 2025, url: "https://hamel.dev/blog/posts/field-guide/"}
      - {kind: talk, title: "Effective AI Agents Need Data Flywheels, Not The Next Biggest LLM", by: "Sylendran Arunagiri (NVIDIA), AI Engineer", year: 2025, url: "https://www.youtube.com/watch?v=6lTxD_oUjXQ"}
      - {kind: code, title: "NVIDIA-AI-Blueprints/data-flywheel", by: "NVIDIA", year: 2025, url: "https://github.com/NVIDIA-AI-Blueprints/data-flywheel"}
    status: added
  - id: synthetic-rag-data
    name: Synthetic RAG Test Sets
    aliases: [RAG testset generation, synthetic question-answer pairs]
    region: data-and-synthetic-data
    layer: detail
    also: [retrieval-and-knowledge, evaluation-and-observability]
    desc: Generating questions and reference answers from a document collection to test a RAG system before real users arrive.
    summary: "Writing hundreds of test questions about a private document collection by hand is slow, so a model reads the documents and writes questions with their answers and source passages. Good generators vary the questions by persona and difficulty, including ones that need several passages combined, so the set looks like real traffic rather than easy lookups. Generated questions are then filtered or reviewed, because some are unanswerable or trivially copied from the text."
    parents:
      - {id: golden-eval-sets, rel: specializes, why: "Builds an eval set for retrieval systems from the corpus itself.", src: "ARES (Saad-Falcon et al. 2023)"}
      - {id: self-instruct, rel: applies, why: "Applies model generation of tasks and answers, grounded in a given corpus.", src: "ARES (Saad-Falcon et al. 2023)", confidence: medium}
      - {id: retrieval-augmented-generation, rel: applies, why: "Produces the question-passage-answer triples used to test a RAG pipeline.", src: "ARES (Saad-Falcon et al. 2023)"}
    maturity: 3
    maturity_note: Built into the main RAG eval tools; quality of generated questions varies.
    date: "2023-11"
    ref: {title: "ARES: An Automated Evaluation Framework for Retrieval-Augmented Generation Systems (Saad-Falcon et al.)", arxiv: "2311.09476"}
