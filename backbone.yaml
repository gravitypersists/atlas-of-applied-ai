  - id: supervised-fine-tuning
    name: Supervised Fine-Tuning
    aliases: [SFT, instruction tuning]
    region: adaptation-and-post-training
    desc: Training a pretrained model on curated instruction-response pairs to follow instructions and adopt a format.
    summary: "Training a pretrained model on curated examples of instructions paired with good responses, so it learns to follow instructions and answer in the expected format and tone. It is the first post-training step for almost every model, and the usual starting point when an application team fine-tunes."
    parents:
      - {id: transfer-learning-fine-tuning, rel: specializes, why: "Fine-tuning on instruction-following data.", src: "Finetuned Language Models Are Zero-Shot Learners (Wei et al. 2021)"}
    maturity: 5
