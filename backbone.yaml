      - {id: autoregressive-decoding, rel: extends, why: "Breaks the strictly serial decode loop with parallel verification.", src: "Fast Inference from Transformers via Speculative Decoding (Leviathan et al. 2022)"}
    maturity: 4
    maturity_note: Broadly integrated into serving engines; variants (Medusa, EAGLE) still evolving.
