    status: added
  - id: draft-heads
    name: Speculative Draft Heads
    aliases: [EAGLE, Medusa, self-speculative decoding, draft trees]
    region: inference-and-serving
    layer: detail
    desc: Drafting tokens with small heads attached to the target model's own hidden states instead of a separate draft model, and verifying a tree of candidates at once.
    summary: "Instead of running a separate small draft model, these methods attach a light extra layer or a few output heads to the large model itself and draft from its hidden states. The drafts form a tree of candidate continuations that the model verifies in one pass. EAGLE drafts from the model's internal features, and its later versions grow the tree where the drafter is confident. These are the most common form of speculative decoding in serving engines, because there is no second model to deploy."
    parents:
      - {id: speculative-decoding, rel: specializes, why: "Drafts from heads on the target's own features instead of a separate model.", src: "EAGLE (Li et al. 2024); Medusa (Cai et al. 2024)"}
    maturity: 3
    maturity_note: Supported in vLLM, SGLang and TensorRT-LLM; speed-ups vary with workload and batch size.
    date: "2024-01"
    ref: {title: "EAGLE: Speculative Sampling Requires Rethinking Feature Uncertainty (Li et al.)", arxiv: "2401.15077"}
    examples: [Medusa, EAGLE-2, EAGLE-3]
    resources:
      - {kind: blog, title: "Medusa: Simple framework for accelerating LLM generation with multiple decoding heads", by: "Tianle Cai et al. (Together AI)", year: 2023, url: "https://www.together.ai/blog/medusa"}
      - {kind: talk, title: "EAGLE and EAGLE-2: Lossless Inference Acceleration for LLMs", by: "Hongyang Zhang (Faster LLMs seminar)", year: 2025, url: "https://www.youtube.com/watch?v=oXRSorx-Llg"}
      - {kind: paper, title: "EAGLE-2: Faster Inference of Language Models with Dynamic Draft Trees", by: "Yuhui Li et al.", year: 2024, url: "https://arxiv.org/abs/2406.16858"}
