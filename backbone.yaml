    name: Context-Aware MCP
    aliases: [CA-MCP, shared context store]
    region: agents-and-orchestration
    layer: detail
    desc: Adds a shared context store that MCP servers read and write, so servers coordinate on multi-step tasks without every intermediate state passing through the LLM.
    summary: "A research extension to MCP in which tool servers share a common memory. The model sets up the plan, then servers read and write intermediate state in the shared store and coordinate among themselves, which cut LLM calls on travel-planning benchmarks. It is one paper so far, not a standard."
    parents:
      - {id: model-context-protocol, rel: extends, why: "Adds a stateful shared context layer to otherwise stateless MCP servers.", src: "Enhancing MCP with Context-Aware Server Collaboration (Jayanti & Han 2026)"}
      - {id: multi-agent-systems, rel: combines, why: "A blackboard-style shared store lets servers coordinate like agents without a central relay.", src: "Enhancing MCP with Context-Aware Server Collaboration (Jayanti & Han 2026)", confidence: medium}
    maturity: 1
    maturity_note: A single 2026 research paper; no production adoption yet.
    date: "2026-01"
    ref: {title: "Enhancing Model Context Protocol (MCP) with Context-Aware Server Collaboration (Jayanti & Han)", arxiv: "2601.11595"}
    status: added
  - id: agent-to-agent-protocols
    name: Agent-to-Agent Protocols
    aliases: [A2A, Agent2Agent, agent interoperability protocols, agent cards]
    region: agents-and-orchestration
    layer: detail
    desc: Open protocols that let agents built by different teams or vendors discover each other, delegate tasks and exchange results, where MCP connects an agent to tools.
    summary: "MCP gives an agent a standard way to call tools. Agent-to-agent protocols such as A2A give agents a standard way to call each other: each agent publishes a card describing what it can do, and another agent can hand it a task, follow its progress and collect the result, without either side knowing how the other is built. They matter when agents from different vendors or teams need to work together."
    parents:
      - {id: model-context-protocol, rel: applies, why: "Takes MCP's idea of an open, standard interface and uses it between peer agents instead of between an agent and its tools.", src: "Announcing the Agent2Agent Protocol (A2A) (Google 2025)"}
      - {id: multi-agent-systems, rel: extends, why: "Lets multi-agent systems span vendors and organizations instead of one codebase.", src: "Google 2025"}
      - {id: "external:classical-multi-agent-systems", rel: replaces, why: "Revives the goal of agent communication languages such as FIPA ACL and KQML with web-native transport.", src: "Google 2025"}
    maturity: 2
    maturity_note: Backed by a Linux Foundation project and many vendors; production use across organizations is still rare.
    date: "2025-04"
    ref: {title: "Announcing the Agent2Agent Protocol (A2A) (Google Developers Blog)", url: "https://developers.googleblog.com/en/a2a-a-new-era-of-agent-interoperability/"}
    examples: [A2A, IBM ACP (merged into A2A)]
    resources:
      - {kind: docs, title: "A2A Protocol", by: "A2A Project (Linux Foundation)", year: 2025, url: "https://a2a-protocol.org/latest/"}
    status: added

  # ======================= APPLIED: planning-and-reasoning =======================
  - id: scratchpads
    name: Scratchpads
    aliases: [intermediate computation]
    region: planning-and-reasoning
    desc: Training or prompting models to write intermediate computation steps before the final answer.
    summary: "Training or prompting a model to write out intermediate steps, such as partial results of a calculation or a program's state, before it gives the final answer. The 2021 work showed that a model that \"shows its work\" can do multi-step computation it fails at when answering directly. The idea was quickly absorbed into chain-of-thought."
    parents:
      - {id: pretrained-language-models, rel: applies, why: "Has the model emit intermediate steps as text.", src: "Show Your Work (Nye et al. 2021)"}
    maturity: 4
    maturity_note: Idea fully absorbed into chain-of-thought.
    date: "2021-11"
    ref: {title: "Show Your Work: Scratchpads for Intermediate Computation with Language Models (Nye et al.)", arxiv: "2112.00114"}
    examples: []
    resources:
      - {kind: talk, title: "LLM Agents MOOC | UC Berkeley CS294-196 Fall 2024 | LLM Reasoning by Denny Zhou", by: "Denny Zhou (Berkeley RDI)", year: 2024, url: "https://www.youtube.com/watch?v=QL-FS_Zcmyo"}
      - {kind: blog, title: "Why We Think", by: "Lilian Weng", year: 2025, url: "https://lilianweng.github.io/posts/2025-05-01-thinking/"}
      - {kind: paper, title: "Chain of Thought Empowers Transformers to Solve Inherently Serial Problems", by: "Zhiyuan Li et al.", year: 2024, url: "https://arxiv.org/abs/2402.12875"}
    status: added
  - id: chain-of-thought
    name: Chain-of-Thought
    aliases: [CoT, step-by-step reasoning]
    region: planning-and-reasoning
    also: [prompting-and-context-engineering]
    desc: Eliciting intermediate reasoning steps before a final answer, improving performance on multi-step problems.
    summary: "Asking a model to reason step by step in plain language before answering. On multi-step math, logic and planning problems this sharply improves accuracy in large models, and it became the base of almost everything else in this region. Today reasoning models do it by default."
    parents:
      - {id: few-shot-prompting, rel: extends, why: "Adds rationales to few-shot demonstrations.", src: "Chain-of-Thought Prompting (Wei et al. 2022)"}
      - {id: scratchpads, rel: extends, why: "Generalizes scratchpads via prompting alone (contested lineage).", src: "Chain-of-Thought Prompting (Wei et al. 2022)", confidence: medium}
    maturity: 5
    maturity_note: Built into modern models and reasoning systems.
    date: "2022-01"
    ref: {title: "Chain-of-Thought Prompting Elicits Reasoning in Large Language Models (Wei et al.)", arxiv: "2201.11903"}
    examples: ["Let's think step by step"]
    resources:
      - {kind: blog, title: "Language Models Perform Reasoning via Chain of Thought", by: "Google Research (Jason Wei, Denny Zhou)", year: 2022, url: "https://research.google/blog/language-models-perform-reasoning-via-chain-of-thought/"}
      - {kind: docs, title: "Prompting best practices: leverage thinking", by: "Anthropic", year: 2025, url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices#leverage-thinking-and-interleaved-thinking-capabilities"}
      - {kind: talk, title: "Stanford CS25: V5 I Large Language Model Reasoning, Denny Zhou of Google Deepmind", by: "Denny Zhou (Stanford CS25)", year: 2025, url: "https://www.youtube.com/watch?v=ebnX5Ur1hBk"}
      - {kind: paper, title: "Large Language Models are Zero-Shot Reasoners", by: "Takeshi Kojima et al.", year: 2022, url: "https://arxiv.org/abs/2205.11916"}
    status: repaired
  - id: self-consistency
    name: Self-Consistency
    aliases: [majority voting, best-of-n]
    region: planning-and-reasoning
    desc: Sampling several reasoning paths and taking the most common answer.
    summary: "Run the same chain-of-thought prompt several times with some randomness, then take the answer that comes up most often. Wrong reasoning paths tend to disagree with each other while right ones converge, so the vote filters out many errors. It costs one call per sample."
    parents:
      - {id: chain-of-thought, rel: extends, why: "Aggregates multiple CoT samples.", src: "Self-Consistency (Wang et al. 2022)"}
    maturity: 4
    maturity_note: Standard accuracy technique.
    date: "2022-03"
    ref: {title: "Self-Consistency Improves Chain of Thought Reasoning in Language Models (Wang et al.)", arxiv: "2203.11171"}
    examples: []
    resources:
      - {kind: docs, title: "Self-Consistency", by: "DAIR.AI Prompt Engineering Guide", year: 2023, url: "https://www.promptingguide.ai/techniques/consistency"}
      - {kind: talk, title: "Adv. LLM Agents MOOC | UC Berkeley Sp25 | Inference-Time Techniques for LLM Reasoning by Xinyun Chen", by: "Xinyun Chen (Berkeley RDI)", year: 2025, url: "https://www.youtube.com/watch?v=g0Dwtf3BH-0"}
      - {kind: paper, title: "Universal Self-Consistency for Large Language Model Generation", by: "Xinyun Chen et al.", year: 2023, url: "https://arxiv.org/abs/2311.17311"}
    status: kept
  - id: tree-of-thoughts
    name: Tree Search over Reasoning
    aliases: [Tree of Thoughts, ToT, search-based decoding]
    region: planning-and-reasoning
    also: [agents-and-orchestration]
    desc: Exploring a tree of partial reasoning states with evaluation, lookahead, and backtracking.
    summary: "Treating partial reasoning as states in a search tree: the model proposes several next steps, an evaluator (often the model itself) scores them, and the search expands the promising ones and backtracks from dead ends. It solves puzzles a single chain can't, but uses many times the tokens, so it's mostly used in research and high-value offline tasks."
    parents:
      - {id: chain-of-thought, rel: extends, why: "Expands a single chain into a searched tree.", src: "Tree of Thoughts (Yao et al. 2023)"}
      - {id: heuristic-search, rel: combines, why: "Brings classical search (BFS/DFS, MCTS) to generated thoughts.", src: "Tree of Thoughts (Yao et al. 2023)"}
    maturity: 2
    maturity_note: Expensive; mostly research and high-value async tasks.
    date: "2023-05"
    ref: {title: "Tree of Thoughts: Deliberate Problem Solving with Large Language Models (Yao et al.)", arxiv: "2305.10601"}
    examples: [Game of 24 solvers, beam search over steps]
    resources:
      - {kind: talk, title: "Tree of Thoughts: Deliberate Problem Solving with Large Language Models (Full Paper Review)", by: "Yannic Kilcher (YouTube)", year: 2023, url: "https://www.youtube.com/watch?v=ut5kp56wW_4"}
      - {kind: docs, title: "Tree of Thoughts (ToT)", by: "DAIR.AI Prompt Engineering Guide", year: 2023, url: "https://www.promptingguide.ai/techniques/tot"}
      - {kind: code, title: "princeton-nlp/tree-of-thought-llm", by: "Shunyu Yao et al.", year: 2023, url: "https://github.com/princeton-nlp/tree-of-thought-llm"}
    status: repaired
  - id: reflexion
    name: Self-Reflection
    aliases: [Reflexion, self-critique, self-refine, evaluator-optimizer]
    region: planning-and-reasoning
    also: [agents-and-orchestration]
    desc: Having a model critique its own output or trajectory and retry with the critique in context.
    summary: "Having a model critique its own output or past attempt, then retry with that critique in context. Reflexion stores the lessons from failed agent trials as notes it reads on the next try; self-refine does the same within one answer. It works best when the critique is grounded in real feedback such as test results; pure self-critique can talk itself into errors."
    parents:
      - {id: react-agent-loop, rel: extends, why: "Adds verbal self-feedback across agent trials.", src: "Reflexion (Shinn et al. 2023)"}
    maturity: 3
    maturity_note: Common pattern; gains depend heavily on feedback quality.
    date: "2023-03"
    ref: {title: "Reflexion: Language Agents with Verbal Reinforcement Learning (Shinn et al.)", arxiv: "2303.11366"}
    examples: [critique-and-revise loops]
    resources:
      - {kind: blog, title: "Reflection Agents", by: "LangChain", year: 2024, url: "https://www.langchain.com/blog/reflection-agents"}
      - {kind: talk, title: "Reflection Agents", by: "LangChain (YouTube)", year: 2024, url: "https://www.youtube.com/watch?v=v5ymBTXNqtk"}
      - {kind: paper, title: "Self-Refine: Iterative Refinement with Self-Feedback", by: "Aman Madaan et al.", year: 2023, url: "https://arxiv.org/abs/2303.17651"}
      - {kind: code, title: "noahshinn/reflexion", by: "Noah Shinn et al.", year: 2023, url: "https://github.com/noahshinn/reflexion"}
    status: added
  - id: process-reward-models
    name: Process Reward Models
    aliases: [PRMs, step-level verifiers, process supervision]
    region: planning-and-reasoning
    also: [adaptation-and-post-training]
    desc: Reward models that score each reasoning step rather than only the final answer, used to guide search and training.
    summary: "A reward model that grades each step of a solution instead of only the final answer. Step-level scores tell a search where reasoning went wrong and can rank candidate solutions better than outcome checks. Labeling steps is expensive, and for training reasoning models, simple outcome checks have turned out easier to scale."
    parents:
      - {id: rlhf, rel: specializes, why: "A step-level variant of the learned reward model.", src: "Let's Verify Step by Step (Lightman et al. 2023)"}
    maturity: 2
    maturity_note: Influential; outcome-based verification has proven easier to scale.
    date: "2023-05"
    ref: {title: "Let's Verify Step by Step (Lightman et al.)", arxiv: "2305.20050"}
    examples: [PRM800K]
    resources:
      - {kind: blog, title: "Scaling test-time compute with open models", by: "Edward Beeching, Lewis Tunstall, Sasha Rush (Hugging Face)", year: 2024, url: "https://huggingface.co/spaces/HuggingFaceH4/blogpost-scaling-test-time-compute"}
