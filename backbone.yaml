  - id: rlvr
    name: RL with Verifiable Rewards
    aliases: [RLVR]
    region: adaptation-and-post-training
    also: [planning-and-reasoning]
    desc: Keeping the RLHF objective but replacing the learned reward model with a programmatic verifier such as answer checks or unit tests.
    summary: "Reinforcement learning where the reward comes from a program that checks the answer, such as comparing a math result or running unit tests, instead of a learned reward model. A checker is much harder to game than a reward model, so training can run long; it is a core ingredient of reasoning models. It only works where answers can be checked automatically."
    parents:
