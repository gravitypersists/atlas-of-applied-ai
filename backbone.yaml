  - id: llm-modulo
    name: LLM-Modulo
    aliases: [generate-test-critique, verifier-in-the-loop planning]
    region: planning-and-reasoning
    desc: LLMs generate candidate plans that a bank of external verifiers and critics checks, iterating until a plan passes.
    summary: "The model proposes candidate plans and a bank of external critics, such as formal verifiers, simulators or constraint checkers, tests them. Failures go back to the model as specific feedback, and the loop repeats until a plan passes. Correctness comes from the critics rather than the model, which only has to generate good guesses."
    parents:
      - {id: llm-plus-p, rel: extends, why: "Generalizes from translation to generate-and-verify with multiple critics.", src: "LLM-Modulo Frameworks (Kambhampati et al. 2024)"}
      - {id: chain-of-thought, rel: combines, why: "Uses LLM reasoning to propose candidates.", src: "LLM-Modulo Frameworks (Kambhampati et al. 2024)"}
    maturity: 2
    maturity_note: Prototyped in planning domains; ideas echo in verifier-based agents.
    date: "2024-02"
    ref: {title: "LLMs Can't Plan, But Can Help Planning in LLM-Modulo Frameworks (Kambhampati et al.)", arxiv: "2402.01817"}
