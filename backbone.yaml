      - {kind: "talk", title: "Demo: Gemma Scope: Sparse autoencoders on Gemma 2", by: "Google for Developers", year: 2024, url: "https://www.youtube.com/watch?v=X1gDXDQu_wU"}
      - {kind: "paper", title: "Scaling Monosemanticity: Extracting Interpretable Features from Claude 3 Sonnet", by: "Adly Templeton et al. (Anthropic)", year: 2024, url: "https://transformer-circuits.pub/2024/scaling-monosemanticity/"}
      - {kind: "code", title: "SAELens: Training Sparse Autoencoders on Language Models", by: "Joseph Bloom et al. (Decode Research)", year: 2024, url: "https://github.com/decoderesearch/SAELens"}
    status: added
  - id: representation-engineering
    name: Representation Engineering
    aliases: [RepE, activation steering]
    region: safety-and-security
    desc: Reading and steering high-level concepts in activation space to monitor or control behavior without retraining.
    summary: "Instead of tracing individual circuits, find the direction in a model's activations that corresponds to a high-level concept such as honesty or harmfulness, by contrasting activations on examples with and without it. That direction can be read to monitor the model, or added or subtracted while it runs to steer its behavior, with no retraining."
    parents:
      - {id: interpretability, rel: applies, why: "Top-down use of internal representations for control.", src: "Representation Engineering (Zou et al. 2023)"}
    maturity: 2
    maturity_note: Moving from research into defensive prototypes.
    date: "2023-10"
    ref: {title: "Representation Engineering: A Top-Down Approach to AI Transparency (Zou et al.)", arxiv: "2310.01405"}
    examples: [steering vectors]
    resources:
