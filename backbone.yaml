  # ---- practitioner staples (2026-10-10) ----
  - id: image-personalization
    name: Image Personalization
    aliases: [DreamBooth, subject-driven generation, diffusion LoRA, style LoRA, textual inversion]
    region: multimodal-applied
    desc: Teaching an image model a specific subject or style from a handful of photos by fine-tuning it, today usually as a small LoRA, then generating that subject in new scenes.
    summary: "Text alone can't describe your dog, your product or your brand's illustration style precisely enough. Fine-tuning an image model on three to twenty pictures binds them to a new word, after which prompts can put that subject anywhere. Training a small LoRA instead of the whole model made this cheap enough that thousands of shared style and character LoRAs exist; newer methods do it from a single reference image with no training."
    parents:
      - {id: text-to-image, rel: extends, why: "Fine-tunes a text-to-image model to bind a new subject to a token.", src: "DreamBooth (Ruiz et al. 2022)"}
      - {id: diffusion-models, rel: applies, why: "Fine-tunes the diffusion denoiser with a prior-preservation loss so the model keeps its general knowledge.", src: "DreamBooth (Ruiz et al. 2022)"}
      - {id: low-rank-adaptation, rel: applies, why: "LoRA made subject and style fine-tunes small and shareable.", src: "cloneofsimo/lora (2023)"}
    maturity: 4
    maturity_note: Mainstream in creative tools and open-model communities; zero-shot reference methods are catching up.
    date: "2022-08"
    ref: {title: "DreamBooth: Fine Tuning Text-to-Image Diffusion Models for Subject-Driven Generation (Ruiz et al.)", arxiv: "2208.12242"}
    examples: [DreamBooth, Civitai LoRAs, IP-Adapter, textual inversion]
    status: added
  - id: instruction-image-editing
    name: Instruction-Based Image Editing
    aliases: [InstructPix2Pix, text-guided image editing, edit by instruction]
    region: multimodal-applied
    desc: Editing an existing image by telling the model what to change ("make it night", "remove the car"), with a model trained on before-after pairs.
    summary: "Instead of masking areas and writing a fresh prompt, you give the image and an instruction, and the model changes only what was asked. InstructPix2Pix trained on synthetic before-and-after pairs written by a language model and rendered by an image model; today's editors are much more faithful at keeping the rest of the picture intact. It is how most people now edit images with AI."
    parents:
      - {id: text-to-image, rel: extends, why: "Conditions generation on an input image plus an edit instruction.", src: "InstructPix2Pix (Brooks et al. 2022)"}
      - {id: "external:prompt-to-prompt", rel: applies, why: "Renders its synthetic before-and-after training pairs with Prompt-to-Prompt editing.", src: "InstructPix2Pix (Brooks et al. 2022)"}
    maturity: 4
    maturity_note: Shipped in major image tools and model APIs; consistency over many edits still varies.
    date: "2022-11"
    ref: {title: "InstructPix2Pix: Learning to Follow Image Editing Instructions (Brooks et al.)", arxiv: "2211.09800"}
    examples: [InstructPix2Pix, FLUX.1 Kontext, Qwen-Image-Edit, Photoshop Generative Fill]
    status: added

  # ======================= APPLIED: embodied-ai-and-world-models =======================
  - id: sim-to-real-transfer
    name: Sim-to-Real Transfer
    aliases: [domain randomization, sim2real, real-to-sim-to-real]
    region: embodied-ai-and-world-models
    also: [data-and-synthetic-data]
    desc: Training a policy in simulation and deploying it on a real robot, with simulator parameters randomized so the real world looks like one more variation.
    summary: "Training on real robots is slow, costly and sometimes dangerous, so policies are trained in a physics simulator instead. To keep them from depending on the simulator's clean look and exact physics, engineers randomize textures, lighting, masses and friction during training, so the real world becomes just one more variation the policy has already seen. It is standard for legged locomotion and increasingly used for manipulation."
    parents:
      - {id: policy-gradient-methods, rel: applies, why: "Simulated policies are commonly trained with RL, which needs far more trials than a real robot can afford.", src: "Domain Randomization for Transferring Deep Neural Networks from Simulation to the Real World (Tobin et al. 2017)"}
      - {id: physics-simulation, rel: applies, why: "Rests on physics engines and rendering for robots.", src: "Tobin et al. 2017"}
    maturity: 4
    maturity_note: Standard practice for locomotion and increasingly for manipulation.
    date: "2017-03"
    ref: {title: "Domain Randomization for Transferring Deep Neural Networks from Simulation to the Real World (Tobin et al.)", arxiv: "1703.06907"}
    examples: [Isaac Sim, Isaac Lab, MuJoCo]
    resources:
      - {kind: blog, title: "Domain Randomization for Sim2Real Transfer", by: "Lilian Weng", year: 2019, url: "https://lilianweng.github.io/posts/2019-05-05-domain-randomization/"}
      - {kind: talk, title: "Lecture 22 Sim2Real and Domain Randomization -- CS287-FA19 Advanced Robotics at UC Berkeley", by: "Josh Tobin (guest lecture, Pieter Abbeel's CS287)", year: 2019, url: "https://www.youtube.com/watch?v=ac_W9IgKX2c"}
      - {kind: docs, title: "Isaac Lab Documentation", by: "NVIDIA", year: 2024, url: "https://isaac-sim.github.io/IsaacLab/main/index.html"}
      - {kind: paper, title: "Sim-to-Real Transfer in Deep Reinforcement Learning for Robotics: a Survey", by: "Wenshuai Zhao, Jorge Peña Queralta, Tomi Westerlund", year: 2020, url: "https://arxiv.org/abs/2009.13303"}
    status: added
  - id: latent-world-models
    name: Latent World Models
    aliases: [model-based RL, Dreamer, learning in imagination, World Models (Ha & Schmidhuber)]
    region: embodied-ai-and-world-models
    also: [planning-and-reasoning]
    desc: Learning a compact model of how an environment changes in response to actions, then training a policy inside that learned model instead of the real environment.
    summary: "The model learns to compress what it sees into a small internal state and to predict how that state, and the reward, will change after each action. A policy can then practice inside this learned model, imagining thousands of trajectories, and needs far fewer trials in the real environment. DreamerV3 made the approach work across many domains with one set of settings."
    parents:
      - {id: markov-decision-process, rel: extends, why: "Learns the MDP's transition and reward functions from experience.", src: "World Models (Ha & Schmidhuber 2018)"}
      - {id: policy-gradient-methods, rel: applies, why: "Trains an actor-critic on trajectories imagined by the model.", src: "Dream to Control (Hafner et al. 2019)"}
    maturity: 3
    maturity_note: Strong results in games and robot learning; few product deployments.
    date: "2019-12"
    ref: {title: "Dream to Control: Learning Behaviors by Latent Imagination (Hafner et al.)", arxiv: "1912.01603"}
    examples: [DreamerV3, DayDreamer, TD-MPC2, V-JEPA 2]
    resources:
      - {kind: blog, title: "Introducing Dreamer: Scalable Reinforcement Learning Using World Models", by: "Danijar Hafner (Google Research)", year: 2020, url: "https://research.google/blog/introducing-dreamer-scalable-reinforcement-learning-using-world-models/"}
      - {kind: talk, title: "Dream to Control: Learning Behaviors by Latent Imagination (paper explained)", by: "Yannic Kilcher", year: 2020, url: "https://www.youtube.com/watch?v=awyuuJoHawo"}
      - {kind: blog, title: "World Models (interactive article)", by: "David Ha, Jürgen Schmidhuber", year: 2018, url: "https://worldmodels.github.io/"}
      - {kind: paper, title: "Mastering Diverse Domains through World Models (DreamerV3)", by: "Danijar Hafner et al.", year: 2023, url: "https://arxiv.org/abs/2301.04104"}
    status: added
  - id: llm-robot-planning
    name: LLM Task Planning for Robots
    aliases: [SayCan, Code as Policies, language model programs, language-conditioned task planning, hierarchical robot control]
    region: embodied-ai-and-world-models
    also: [planning-and-reasoning]
    desc: A language model breaks an instruction into steps and picks from a library of learned robot skills, or writes code that calls them, while low-level controllers do the moving.
    summary: "A language model knows that cleaning up a spill means finding a sponge first, but it has no body. Here it acts as the planner: it breaks an instruction into steps and either picks each one from the robot's list of skills, checking that the skill can succeed in the current scene (SayCan), or writes a short program against the robot's control API (Code as Policies). The plan is easy to inspect, but the robot can only do what its skill library or API allows."
    parents:
      - {id: pretrained-language-models, rel: applies, why: "Uses an LLM's world knowledge to choose and order skills.", src: "Do As I Can, Not As I Say (Ahn et al. 2022)"}
      - {id: strips-planning, rel: replaces, why: "Sequences skills from a fixed library, the job classical planners did with hand-written operators.", src: "Ahn et al. 2022"}
    maturity: 3
    maturity_note: Common as the high-level layer of hierarchical robot systems.
    date: "2022-04"
    ref: {title: "Do As I Can, Not As I Say: Grounding Language in Robotic Affordances (Ahn et al.)", arxiv: "2204.01691"}
    examples: [SayCan, Code as Policies, Inner Monologue, VoxPoser]
    resources:
      - {kind: blog, title: "Towards Helpful Robots: Grounding Language in Robotic Affordances", by: "Brian Ichter, Karol Hausman (Google Research)", year: 2022, url: "https://research.google/blog/towards-helpful-robots-grounding-language-in-robotic-affordances/"}
      - {kind: talk, title: "Andy Zeng: From words to actions", by: "Andy Zeng (Montreal Robotics)", year: 2023, url: "https://www.youtube.com/watch?v=jgujjU4IYAs"}
      - {kind: paper, title: "Code as Policies: Language Model Programs for Embodied Control", by: "Jacky Liang et al.", year: 2022, url: "https://arxiv.org/abs/2209.07753"}
      - {kind: paper, title: "Inner Monologue: Embodied Reasoning through Planning with Language Models", by: "Wenlong Huang et al.", year: 2022, url: "https://arxiv.org/abs/2207.05608"}
    status: added
  - id: diffusion-policy
    name: Diffusion Policy
    aliases: [action diffusion, visuomotor diffusion policy]
    region: embodied-ai-and-world-models
    desc: Generating robot actions with a denoising diffusion model conditioned on observations, which captures demonstrations that have several valid ways to do the task.
    summary: "People demonstrate the same task in different ways, for example reaching around a cup from the left one time and from the right the next. A model trained to predict the average action would reach straight into the cup. A diffusion policy generates the next stretch of actions by denoising, as image generators do, so it commits to one valid way instead of averaging them. It became the default for learning from demonstrations, at the cost of several model passes per action."
    parents:
      - {id: diffusion-models, rel: applies, why: "Denoises action sequences instead of images.", src: "Diffusion Policy (Chi et al. 2023)"}
      - {id: behavior-cloning, rel: extends, why: "Learns from demonstrations like behavior cloning, with a generative model in place of regression.", src: "Chi et al. 2023"}
    maturity: 3
    maturity_note: A default baseline for imitation learning; flow-matching heads are replacing it where speed matters.
    date: "2023-03"
    ref: {title: "Diffusion Policy: Visuomotor Policy Learning via Action Diffusion (Chi et al.)", arxiv: "2303.04137"}
    examples: [LeRobot, Octo]
    resources:
      - {kind: talk, title: "Diffusion Policy: LeRobot Research Presentation #2 by Cheng Chi", by: "Cheng Chi (Hugging Face)", year: 2024, url: "https://www.youtube.com/watch?v=M03sZFfW-qU"}
      - {kind: talk, title: "Princeton Robotics - Russ Tedrake - Dexterous Manipulation with Diffusion Policies", by: "Russ Tedrake (Princeton Robotics seminar)", year: 2023, url: "https://www.youtube.com/watch?v=whpK0HDtOJ0"}
      - {kind: code, title: "diffusion_policy: Visuomotor Policy Learning via Action Diffusion", by: "Columbia / Stanford REAL lab (Cheng Chi et al.)", year: 2023, url: "https://github.com/real-stanford/diffusion_policy"}
    status: added
  - id: action-chunking
    name: Action Chunking and Low-Cost Teleoperation
    aliases: [ACT, ALOHA, action chunking with transformers, teleoperation data collection]
    region: embodied-ai-and-world-models
    also: [data-and-synthetic-data]
    desc: Collecting demonstrations with cheap teleoperation rigs and training a transformer to predict short sequences of future actions at once, which smooths control and reduces compounding errors.
    summary: "ALOHA showed that a pair of low-cost arms, puppeteered by a person holding a matching pair, can collect good demonstrations for fine two-handed tasks. Its policy, ACT, predicts a chunk of the next few dozen actions at once instead of one step at a time, which keeps motion smooth and stops small errors from piling up. Predicting action chunks is now standard in almost every robot policy."
    parents:
      - {id: transformer-architecture, rel: applies, why: "A transformer predicts a chunk of future actions from images and joint states.", src: "Learning Fine-Grained Bimanual Manipulation with Low-Cost Hardware (Zhao et al. 2023)"}
      - {id: behavior-cloning, rel: extends, why: "Behavior cloning that predicts action sequences rather than single steps.", src: "Zhao et al. 2023"}
    maturity: 3
    maturity_note: Widely reproduced; chunked action output is now standard in VLAs.
    date: "2023-04"
    ref: {title: "Learning Fine-Grained Bimanual Manipulation with Low-Cost Hardware (Zhao et al.)", arxiv: "2304.13705"}
    examples: [ALOHA, Mobile ALOHA, LeRobot, SO-100 arm]
    resources:
      - {kind: docs, title: "ACT (Action Chunking with Transformers)", by: "Hugging Face LeRobot", year: 2025, url: "https://huggingface.co/docs/lerobot/act"}
      - {kind: talk, title: "ALOHA and ACT: LeRobot Research Presentation #1 by Alexander Soare", by: "Alexander Soare (Hugging Face)", year: 2024, url: "https://www.youtube.com/watch?v=ft73x0LfGpM"}
      - {kind: paper, title: "Mobile ALOHA: Learning Bimanual Mobile Manipulation with Low-Cost Whole-Body Teleoperation", by: "Zipeng Fu, Tony Z. Zhao, Chelsea Finn", year: 2024, url: "https://arxiv.org/abs/2401.02117"}
    status: added
  - id: vision-language-action-models
    name: Vision-Language-Action Models
    aliases: [VLA, VLAs, RT-2, OpenVLA, robot foundation models, generalist robot policies]
    region: embodied-ai-and-world-models
    also: [multimodal-applied]
    desc: A vision-language model fine-tuned to output robot actions directly, so web-scale knowledge of objects and language carries over to physical control.
    summary: "A VLA starts from a vision-language model and is trained further on robot data so that, given camera images and an instruction, it outputs the robot's next actions. Because the base model already knows what objects are and what words mean, the robot can follow instructions it was never shown, like 'move the banana to the picture of Germany'. Teams usually fine-tune an open VLA on their own robot rather than train one, and reliability outside familiar settings is still the main problem."
    parents:
      - {id: vision-language-models, rel: extends, why: "Adds action outputs to a pretrained VLM and co-trains on robot data.", src: "RT-2 (Brohan et al. 2023)"}
      - {id: llm-robot-planning, rel: replaces, why: "Folds high-level planning and low-level control into one end-to-end model.", src: "RT-2 (Brohan et al. 2023)"}
    maturity: 3
    maturity_note: Open models are fine-tuned widely and commercial pilots exist; generalization outside training conditions is unreliable.
    date: "2023-07"
    ref: {title: "RT-2: Vision-Language-Action Models Transfer Web Knowledge to Robotic Control (Brohan et al.)", arxiv: "2307.15818"}
    examples: [RT-2, OpenVLA, Octo, π0, Gemini Robotics, GR00T N1]
    resources:
      - {kind: blog, title: "RT-2: New model translates vision and language into action", by: "Google DeepMind", year: 2023, url: "https://deepmind.google/blog/rt-2-new-model-translates-vision-and-language-into-action/"}
      - {kind: blog, title: "SmolVLA: Efficient Vision-Language-Action Model trained on Lerobot Community Data", by: "Hugging Face (Dana Aubakirova et al.)", year: 2025, url: "https://huggingface.co/blog/smolvla"}
      - {kind: talk, title: "OpenVLA: LeRobot Research Presentation #5 by Moo Jin Kim", by: "Moo Jin Kim (Hugging Face)", year: 2024, url: "https://www.youtube.com/watch?v=-0s0v3q7mBk"}
      - {kind: paper, title: "OpenVLA: An Open-Source Vision-Language-Action Model", by: "Moo Jin Kim et al.", year: 2024, url: "https://arxiv.org/abs/2406.09246"}
    status: added
  - id: cross-embodiment-training
    name: Cross-Embodiment Training
    aliases: [Open X-Embodiment, RT-X, pooled robot datasets]
    region: embodied-ai-and-world-models
    also: [data-and-synthetic-data]
    desc: Training one policy on pooled demonstrations from many different robot bodies, so data collected on one robot helps others.
    summary: "No single lab has enough robot data, so the Open X-Embodiment project pooled demonstrations from dozens of robot types across many labs. A policy trained on the mix performed better on each robot than one trained on that robot's data alone. Pooled datasets are now how generalist robot models are pretrained, though a model still needs fine-tuning before it works well on a new robot."
    parents:
      - {id: vision-language-action-models, rel: extends, why: "Trains generalist policies on data from many robot types.", src: "Open X-Embodiment (2023)"}
      - {id: transfer-learning-fine-tuning, rel: applies, why: "Pretrain broadly across robots, then fine-tune to a specific one.", src: "Open X-Embodiment (2023)"}
    maturity: 3
    maturity_note: The standard way to pretrain generalist robot policies; gains on a new robot vary.
    date: "2023-10"
    ref: {title: "Open X-Embodiment: Robotic Learning Datasets and RT-X Models (Open X-Embodiment Collaboration)", arxiv: "2310.08864"}
    examples: [Open X-Embodiment, DROID, LeRobot datasets]
    resources:
      - {kind: blog, title: "Scaling up learning across many different robot types", by: "Google DeepMind", year: 2023, url: "https://deepmind.google/blog/scaling-up-learning-across-many-different-robot-types/"}
      - {kind: talk, title: "Robot Learning 2025: Unlocking Scalable Robot Learning in the Real World with Karl Pertsch", by: "Karl Pertsch (Montreal Robotics)", year: 2025, url: "https://www.youtube.com/watch?v=vDeuS7V1VqY"}
      - {kind: blog, title: "LeRobot Community Datasets: The \"ImageNet\" of Robotics — When and How?", by: "Hugging Face", year: 2025, url: "https://huggingface.co/blog/lerobot-datasets"}
      - {kind: paper, title: "Octo: An Open-Source Generalist Robot Policy", by: "Octo Model Team (Dibya Ghosh, Homer Walke et al.)", year: 2024, url: "https://arxiv.org/abs/2405.12213"}
