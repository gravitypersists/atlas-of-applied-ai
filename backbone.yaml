  - id: citation-ux
    name: Citation and Grounding UX
    aliases: [source attribution, inline citations]
    region: ai-product-and-interaction-design
    also: [retrieval-and-knowledge]
    desc: Linking claims in a response to the sources they came from so users can verify them.
    summary: "Links each claim in an answer to the source it came from, so users can check it instead of taking it on trust. It is how retrieval shows up in the interface: footnotes, inline markers, or source cards beside the answer. Citations only help if they are accurate, and a confident link to a source that does not support the claim can mislead more than no link at all."
    parents:
      - {id: retrieval-augmented-generation, rel: applies, why: "Surfaces retrieved sources in the interface.", src: "Perplexity launch (2022)"}
      - {id: human-ai-interaction-guidelines, rel: applies, why: "Implements 'make clear why the system did what it did'.", src: "Guidelines for Human-AI Interaction (2019)", confidence: medium}
    maturity: 4
    maturity_note: Expected in search and research products.
    date: "2022-12"
    ref: {title: "Perplexity AI launch (December 2022)"}
    examples: [Perplexity, Claude citations, Gemini grounding]
