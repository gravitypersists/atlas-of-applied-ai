  - id: zero-shot-cot
    name: Zero-Shot Chain-of-Thought
    aliases: [zero-shot CoT, "Let's think step by step"]
    region: prompting-and-context-engineering
    also: [planning-and-reasoning]
    desc: Eliciting step-by-step reasoning without demonstrations by appending a trigger phrase such as "Let's think step by step" to the prompt.
    summary: "Adding a phrase like \"Let's think step by step\" gets a model to reason before it answers, with no worked examples. It showed that step-by-step reasoning was already latent in large models."
    parents:
      - {id: zero-shot-prompting, rel: extends, why: "Unlocks multi-step reasoning in a purely zero-shot setting.", src: "Large Language Models are Zero-Shot Reasoners (Kojima et al. 2022)"}
      - {id: chain-of-thought, rel: specializes, why: "Chain-of-thought triggered by a cue instead of few-shot exemplars.", src: "Large Language Models are Zero-Shot Reasoners (Kojima et al. 2022)"}
    maturity: 5
    maturity_note: A universal baseline, now largely absorbed into reasoning models.
    date: "2022-05"
    ref: {title: "Large Language Models are Zero-Shot Reasoners (Kojima et al.)", arxiv: "2205.11916"}
    examples: [Plan-and-Solve prompting]
    resources:
      - {kind: docs, title: "Chain-of-Thought Prompting | Prompt Engineering Guide", by: "DAIR.AI", year: 2023, url: "https://www.promptingguide.ai/techniques/cot"}
