  # ======================= APPLIED: evaluation-and-observability =======================
  - id: capability-benchmarks
    name: Capability Benchmarks
    aliases: [static benchmarks, MMLU-style evals]
    region: evaluation-and-observability
    desc: Fixed datasets with reference answers used to compare model capabilities.
    summary: "Fixed sets of questions with known answers, such as MMLU or GPQA, used to compare what models know and can reason about. They are the common yardstick for model releases, but scores saturate quickly and leak into training data, and a high score says little about how a model behaves inside your product."
    parents:
      - {id: "external:shared-task-benchmarks", rel: applies, why: "Continues NLP's tradition of shared benchmark datasets.", src: "Measuring Massive Multitask Language Understanding (Hendrycks et al. 2020)"}
    maturity: 5
    maturity_note: Universal, though saturation and contamination limit value.
    date: "2020-09"
    ref: {title: "Measuring Massive Multitask Language Understanding (Hendrycks et al.)", arxiv: "2009.03300"}
    examples: [MMLU, GPQA, HLE]
    resources:
      - {kind: blog, title: "Let's talk about LLM evaluation", by: "Clémentine Fourrier (Hugging Face)", year: 2024, url: "https://huggingface.co/blog/clefourrier/llm-evaluation"}
      - {kind: tutorial, title: "The LLM Evaluation Guidebook", by: "Hugging Face", year: 2024, url: "https://github.com/huggingface/evaluation-guidebook"}
