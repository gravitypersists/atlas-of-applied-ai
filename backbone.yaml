  # ======================= APPLIED: inference-and-serving =======================
  - id: autoregressive-decoding
    name: Autoregressive Decoding
    aliases: [next-token generation, sampling]
    region: inference-and-serving
    desc: Generating text one token at a time, each conditioned on everything generated so far, using a sampling strategy.
    parents:
      - {id: pretrained-language-models, rel: applies, why: "The generation loop for causal language models.", src: "Improving Language Understanding by Generative Pre-Training (2018)"}
    maturity: 5
    maturity_note: The baseline execution pattern of every generative model.
    date: "2018-06"
    ref: {title: "Improving Language Understanding by Generative Pre-Training (Radford et al.)"}
    examples: [vLLM, llama.cpp, Hugging Face generate]
    status: repaired
  - id: kv-cache
    name: KV Cache
    aliases: [key-value cache, incremental decoding]
    region: inference-and-serving
    desc: Storing attention keys and values from earlier tokens so each decoding step avoids recomputation; its memory footprint dominates serving design.
    parents:
      - {id: autoregressive-decoding, rel: extends, why: "Memoizes attention state across decoding steps.", src: "Fast Transformer Decoding: One Write-Head is All You Need (Shazeer 2019)"}
    maturity: 5
    maturity_note: Non-negotiable serving infrastructure.
    date: "2019-11"
    ref: {title: "Fast Transformer Decoding: One Write-Head is All You Need (Shazeer)", arxiv: "1911.02150"}
    examples: [TensorRT-LLM, vLLM]
    status: repaired
  - id: paged-attention
    name: PagedAttention
    aliases: [paged KV cache]
    region: inference-and-serving
    desc: Stores the KV cache in non-contiguous fixed-size blocks, like OS virtual memory, cutting fragmentation and raising batch sizes.
    parents:
      - {id: kv-cache, rel: extends, why: "Applies virtual-memory paging to KV cache storage.", src: "Efficient Memory Management for LLM Serving with PagedAttention (Kwon et al. 2023)"}
    maturity: 4
    maturity_note: Dominant memory-management approach in serving engines.
    date: "2023-09"
    ref: {title: "Efficient Memory Management for Large Language Model Serving with PagedAttention (Kwon et al.)", arxiv: "2309.06180"}
    examples: [vLLM]
    status: repaired
  - id: continuous-batching
    name: Continuous Batching
    aliases: [in-flight batching, iteration-level scheduling]
    region: inference-and-serving
    desc: Scheduling at the level of decoding steps so new requests join and finished ones leave a batch continuously.
    parents:
      - {id: autoregressive-decoding, rel: extends, why: "Schedules per decoding iteration rather than per request.", src: "Orca (Yu et al., OSDI 2022)"}
    maturity: 4
    maturity_note: Required for production-scale serving.
    date: "2022-07"
    ref: {title: "Orca: A Distributed Serving System for Transformer-Based Generative Models (Yu et al., OSDI 2022)"}
    examples: [vLLM, TGI, TensorRT-LLM]
    status: repaired
  - id: speculative-decoding
    name: Speculative Decoding
    aliases: [assisted generation, draft-and-verify]
    region: inference-and-serving
    desc: A small draft model or head proposes several tokens that the target model verifies in parallel, reducing latency without changing outputs.
