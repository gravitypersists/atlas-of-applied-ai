  - id: plan-preview
    name: Plan Preview
    aliases: [plan mode, plan approval, intent preview]
    region: ai-product-and-interaction-design
    also: [agents-and-orchestration]
    layer: detail
    desc: The agent shows its intended steps, tools and assumptions for the user to edit or approve before it starts executing.
    summary: "Before a long or risky task, the agent writes out what it plans to do, and you edit or approve the plan before any work starts. Misunderstandings get caught when they cost a sentence to fix rather than an hour of wasted work. A plan made up front cannot anticipate everything the agent will find, so it complements approvals during the run rather than replacing them."
    parents:
      - {id: human-in-the-loop-approval, rel: extends, why: "Moves the approval gate from single actions to the whole plan, before execution.", src: "Agentic UX Patterns (Tajer)"}
    maturity: 3
    maturity_note: Standard in coding and research agents; how detailed plans should be is still unsettled.
    date: "2024-04"
    ref: {title: "Copilot Workspace (GitHub Next, April 2024)", url: "https://githubnext.com/projects/copilot-workspace/"}
    examples: [Copilot Workspace, Gemini Deep Research plan, Claude Code plan mode, Cursor plan mode, Devin]
    resources:
      - {kind: blog, title: "Agentic UX Patterns: A Practical Guide to Designing AI That Acts", by: "Ali Tajer", year: 2026, url: "https://alitajer.com/blog/agentic-ux-patterns"}
      - {kind: docs, title: "Common workflows (plan mode)", by: "Anthropic (Claude Code)", year: 2025, url: "https://code.claude.com/docs/en/common-workflows"}
      - {kind: talk, title: "How to use Copilot Workspace | Full Demo", by: "GitHub", year: 2024, url: "https://www.youtube.com/watch?v=bsfE9c2pRD0"}
      - {kind: blog, title: "Gemini: Try Deep Research and Gemini 2.0 Flash Experimental", by: "Google", year: 2024, url: "https://blog.google/products-and-platforms/products/gemini/google-gemini-deep-research/"}
    status: added
  - id: agent-action-trace
    name: Agent Action Trace
    aliases: [activity feed, tool call display, action log]
    region: ai-product-and-interaction-design
    also: [agents-and-orchestration]
    layer: detail
    desc: A user-facing, live record of each tool an agent calls, with its inputs and results, as it runs.
    summary: "A running feed of what the agent is actually doing: which tool it called, with what inputs, and what came back. It shows the user what changed in the world, which is harder to fake than a description of the agent's thinking, and it is where people notice a wrong step. It is the user-facing cousin of the developer traces in observability tools."
    parents:
      - {id: react-agent-loop, rel: applies, why: "Renders each act and observe step of the agent loop to the user.", src: "Agentic UX Patterns (Tajer)", confidence: medium}
      - {id: human-ai-interaction-guidelines, rel: applies, why: "Implements 'make clear why the system did what it did' for agents that act.", src: "Guidelines for Human-AI Interaction (Amershi et al. 2019)", confidence: medium}
    maturity: 3
    maturity_note: Every agent product shows tool activity; how much detail to show, and when to collapse it, is still forming.
    date: "2023"
    ref: {title: "Agentic UX Patterns: A Practical Guide to Designing AI That Acts (Ali Tajer)", url: "https://alitajer.com/blog/agentic-ux-patterns"}
    examples: [ChatGPT agent activity, Claude Code tool output, Cursor agent panel]
    resources:
      - {kind: blog, title: "Building effective agents", by: "Anthropic", year: 2024, url: "https://www.anthropic.com/engineering/building-effective-agents"}
      - {kind: docs, title: "Chatbot Tool Usage", by: "Vercel (AI SDK)", year: 2025, url: "https://ai-sdk.dev/docs/ai-sdk-ui/chatbot-tool-usage"}
      - {kind: talk, title: "AI Agent UX Patterns: Lessons From 1000 Startups", by: "Jonas Braadbaart (aiGrunn)", year: 2024, url: "https://www.youtube.com/watch?v=3kiTAGa7VFI"}
    status: added
  - id: mid-run-steering
    name: Mid-Run Steering
    aliases: [active execution participation, mid-flight intervention, agent steering]
    region: ai-product-and-interaction-design
    also: [agents-and-orchestration]
    layer: detail
    desc: Users inspect and redirect an agent step by step while it runs, rather than reviewing only the final result.
    summary: "Instead of reviewing a long agent run only at the end, the user follows it step by step and corrects course while it works. A Microsoft Research study of spreadsheet agents found that end-of-run review misses errors buried in early steps, while step-level participation caught them and left users understanding the result. It costs attention, so it fits work where a late-found mistake is expensive."
    parents:
      - {id: human-in-the-loop-approval, rel: extends, why: "Turns occasional approval gates into continuous, step-level participation.", src: "Auditing and Controlling AI Agent Actions in Spreadsheets (Microsoft Research 2026)"}
      - {id: agent-action-trace, rel: extends, why: "Steering needs a step-level view of what the agent has done.", src: "Auditing and Controlling AI Agent Actions in Spreadsheets (Microsoft Research 2026)", confidence: medium}
    maturity: 2
    maturity_note: Evidence comes from recent studies; most products offer only interrupt-and-redirect.
    date: "2026-04"
    ref: {title: "Auditing and Controlling AI Agent Actions in Spreadsheets (Microsoft Research, 2026)", url: "https://www.microsoft.com/en-us/research/publication/auditing-and-controlling-ai-agent-actions-in-spreadsheets/"}
    examples: [Claude Code message queueing, Codex steering]
    resources:
      - {kind: blog, title: "Magentic-UI, an experimental human-centered web agent", by: "Microsoft Research", year: 2025, url: "https://www.microsoft.com/en-us/research/blog/magentic-ui-an-experimental-human-centered-web-agent/"}
      - {kind: paper, title: "Cocoa: Co-Planning and Co-Execution with AI Agents", by: "Feng et al.", year: 2024, url: "https://arxiv.org/abs/2412.10999"}
      - {kind: talk, title: "Claude Code & the evolution of agentic coding — Boris Cherny, Anthropic", by: "Boris Cherny (Anthropic, AI Engineer)", year: 2025, url: "https://www.youtube.com/watch?v=Lue8K2jqfKk"}
    status: added
  - id: trust-calibration
    name: Trust Calibration
    aliases: [appropriate reliance, uncertainty display, confidence indicators, overreliance mitigation]
    region: ai-product-and-interaction-design
    layer: detail
    desc: Designing interfaces so users rely on AI output when it is right and check it when it is not, through uncertainty display, framing and friction.
    summary: "The goal is appropriate reliance: users accept the AI's output when it is right and catch it when it is wrong. Too much trust (automation bias) lets errors through, and too little wastes the tool. Levers include showing uncertainty, framing what the system is good at, and adding friction where mistakes are costly. Research shows simple, intuitive uncertainty cues help, while complex statistical displays tend to be ignored."
    parents:
      - {id: human-ai-interaction-guidelines, rel: extends, why: "Moves from setting expectations to measuring and shaping how much users rely on the system.", src: "A Survey of AI Reliance (Eckhardt et al. 2024)"}
      - {id: "external:trust-in-automation", rel: applies, why: "Applies the human-factors theory of calibrated trust in automation to AI products.", src: "A Survey of AI Reliance (Eckhardt et al. 2024)", confidence: medium}
    maturity: 2
    maturity_note: Well studied in HCI, but production products rarely go beyond disclaimers and citations.
    date: "2024-07"
    ref: {title: "A Survey of AI Reliance (Eckhardt et al.)", arxiv: "2408.03948"}
    examples: [confidence indicators, low-confidence highlighting, review checklists]
    resources:
      - {kind: paper, title: "Overreliance on AI: Literature Review", by: "Samir Passi, Mihaela Vorvoreanu (Microsoft)", year: 2022, url: "https://www.microsoft.com/en-us/research/publication/overreliance-on-ai-literature-review/"}
      - {kind: talk, title: "Fostering appropriate reliance on AI", by: "Mihaela Vorvoreanu (Microsoft Research Forum)", year: 2024, url: "https://www.microsoft.com/en-us/research/articles/fostering-appropriate-reliance-on-ai/"}
      - {kind: docs, title: "Explainability + Trust (People + AI Guidebook)", by: "Google PAIR", year: 2021, url: "https://pair.withgoogle.com/chapter/explainability-trust/"}
      - {kind: paper, title: "Evaluating the Impact of Uncertainty Visualization on Model Reliance", by: "Zhao et al. (IEEE TVCG)", year: 2023, url: "https://jieqiongzhao.github.io/assets/data/uncertainty2023.pdf"}
    status: added
  - id: voice-turn-taking
    name: Turn-Taking and Barge-In
    aliases: [barge-in, voice interruption handling, semantic VAD, endpointing]
    region: ai-product-and-interaction-design
    also: [multimodal-applied]
    layer: detail
    desc: Deciding when a voice user has finished speaking and stopping generation the moment they interrupt, over a full-duplex audio connection.
    summary: "In a voice conversation the system has to judge when you have finished speaking and stop talking the moment you interrupt. Older assistants waited for a fixed silence, which cut people off mid-thought or left awkward gaps. Realtime speech models listen while they speak, and semantic turn detection uses what you said, not just the pause, to decide whether it is their turn."
    parents:
      - {id: realtime-voice, rel: applies, why: "Full-duplex speech-to-speech models make interruption and fast turn-taking possible.", src: "Introducing the Realtime API (OpenAI 2024)"}
      - {id: streaming-responses, rel: extends, why: "Barge-in is stop-on-interrupt for streamed audio instead of streamed text.", src: "OpenAI Realtime API guide", confidence: medium}
    maturity: 3
    maturity_note: Expected in voice agents since 2024; semantic turn detection is newer and still tuned per product.
    date: "2024-10"
    ref: {title: "Introducing the Realtime API (OpenAI, October 2024)"}
    examples: [ChatGPT Advanced Voice Mode, OpenAI semantic VAD, LiveKit turn detector]
    resources:
      - {kind: docs, title: "Getting started with the Realtime API", by: "OpenAI", year: 2025, url: "https://developers.openai.com/api/docs/guides/realtime"}
      - {kind: blog, title: "Using a transformer to improve end of turn detection", by: "LiveKit", year: 2024, url: "https://livekit.com/blog/using-a-transformer-to-improve-end-of-turn-detection"}
      - {kind: talk, title: "Fix AI Voice Interruptions with Semantic Turn Detection", by: "LiveKit", year: 2026, url: "https://www.youtube.com/watch?v=XbrlOY4Z-Ow"}
      - {kind: paper, title: "Moshi: a speech-text foundation model for real-time dialogue", by: "Défossez et al. (Kyutai)", year: 2024, url: "https://arxiv.org/abs/2410.00037"}
    status: added
  - id: background-agents
    name: Background Agents
    aliases: [asynchronous agents, cloud agents, agent delegation, assign-and-review]
    region: ai-product-and-interaction-design
    also: [agents-and-orchestration]
    desc: Handing an agent a whole task, such as an issue, and letting it work unattended in a cloud sandbox, then reviewing the result it returns as a pull request or report.
    summary: "Instead of watching an agent step by step, you assign it a task the way you would a colleague, and it works on its own in a sandboxed environment, possibly for an hour, while you do something else. When it's done it hands back a pull request, a report or a question. The design work moves from approving each action to writing a good task description and reviewing finished work."
    parents:
      - {id: coding-agents, rel: applies, why: "Runs coding agents unattended on assigned issues.", src: "GitHub Copilot: Meet the new coding agent (GitHub 2025)"}
      - {id: human-in-the-loop-approval, rel: replaces, why: "Moves human review from each step to the finished result.", src: "GitHub 2025"}
      - {id: agent-sandboxing, rel: applies, why: "Each task runs in its own isolated cloud environment.", src: "GitHub 2025"}
    maturity: 3
    maturity_note: Shipped by major coding tools in 2025; how to review and trust the output is still being worked out.
    date: "2025-05"
    ref: {title: "GitHub Copilot: Meet the new coding agent (GitHub Blog)", url: "https://github.blog/news-insights/product-news/github-copilot-meet-the-new-coding-agent/"}
    examples: [Devin, OpenAI Codex, GitHub Copilot coding agent, Jules, Claude Code on the web]
    status: added

  # ======================= APPLIED: multimodal-applied =======================
  - id: contrastive-image-text-pretraining
    name: Contrastive Image-Text Pretraining
    aliases: [CLIP, joint embeddings]
    region: multimodal-applied
    desc: Training image and text encoders so matching pairs land close together in a shared embedding space.
    summary: "An image encoder and a text encoder are trained together on hundreds of millions of captioned images, so that a picture and a matching caption end up as nearby vectors. The result can search images by text, classify images it was never trained on, and serves as the visual front end for many vision-language and image-generation models."
    parents:
      - {id: transformer-architecture, rel: applies, why: "Uses transformer encoders for both modalities.", src: "CLIP (Radford et al. 2021)"}
    maturity: 5
    maturity_note: Foundational component of vision-language systems.
    date: "2021-02"
    ref: {title: "Learning Transferable Visual Models From Natural Language Supervision (Radford et al.)", arxiv: "2103.00020"}
    examples: [CLIP, SigLIP, ALIGN]
    resources:
      - {kind: blog, title: "Multimodality and Large Multimodal Models (LMMs)", by: "Chip Huyen", year: 2023, url: "https://huyenchip.com/2023/10/10/multimodal.html"}
      - {kind: talk, title: "OpenAI CLIP: ConnectingText and Images (Paper Explained)", by: "Yannic Kilcher", year: 2021, url: "https://www.youtube.com/watch?v=T9XSU0pKX2E"}
      - {kind: paper, title: "Sigmoid Loss for Language Image Pre-Training", by: "Xiaohua Zhai et al.", year: 2023, url: "https://arxiv.org/abs/2303.15343"}
      - {kind: code, title: "open_clip: An open source implementation of CLIP", by: "LAION / mlfoundations", year: 2021, url: "https://github.com/mlfoundations/open_clip"}
    status: added
  - id: vision-language-models
    name: Vision-Language Models
    aliases: [VLMs, multimodal LLMs, visual instruction tuning, LLaVA]
    region: multimodal-applied
    desc: Language models that accept images (and often video) alongside text by projecting visual features into the model.
    summary: "A language model that takes images, and often video, alongside text. A vision encoder turns the image into vectors and a small projection layer feeds them to the language model as if they were extra tokens. Training on visual instructions, such as questions and answers about images, turns it into an assistant that can describe scenes, read charts and screenshots, and answer questions about them."
    parents:
      - {id: contrastive-image-text-pretraining, rel: combines, why: "Uses pretrained vision encoders such as CLIP.", src: "LLaVA (Liu et al. 2023)"}
      - {id: pretrained-language-models, rel: combines, why: "Connects visual features to an LLM.", src: "LLaVA (Liu et al. 2023)"}
    maturity: 4
    maturity_note: Standard capability of frontier APIs.
    date: "2023-04"
    ref: {title: "Visual Instruction Tuning (Liu et al.)", arxiv: "2304.08485"}
    examples: [GPT-4o, Claude, Gemini, Qwen-VL, LLaVA]
    resources:
      - {kind: blog, title: "Vision Language Models (Better, faster, stronger)", by: "Hugging Face (Merve Noyan, Sergio Paniego et al.)", year: 2025, url: "https://huggingface.co/blog/vlms-2025"}
      - {kind: blog, title: "Generalized Visual Language Models", by: "Lilian Weng", year: 2022, url: "https://lilianweng.github.io/posts/2022-06-09-vlm/"}
      - {kind: talk, title: "Lucas Beyer - Computer Vision in the Age of LLMs | ML in PL 2024", by: "Lucas Beyer (ML in PL)", year: 2024, url: "https://www.youtube.com/watch?v=kxO6ARgI_SU"}
      - {kind: paper, title: "Flamingo: a Visual Language Model for Few-Shot Learning", by: "Jean-Baptiste Alayrac et al.", year: 2022, url: "https://arxiv.org/abs/2204.14198"}
    status: repaired
  - id: document-understanding
    name: Document Understanding
    aliases: [PDF parsing, OCR-free parsing, layout understanding]
    region: multimodal-applied
    also: [retrieval-and-knowledge]
    desc: Extracting text, tables, and structure from documents with vision models rather than brittle OCR pipelines.
    summary: "Turning PDFs, scans and slides into clean text, tables and structure that software can use. The older approach chains layout detection, character recognition (OCR) and hand-written rules, which loses reading order in multi-column pages and garbles tables. Vision models that read the whole page image and output Markdown or JSON directly are replacing it, especially for preparing documents for retrieval."
    parents:
      - {id: transformer-architecture, rel: applies, why: "Reads page images end to end with transformers; VLMs now dominate this role.", src: "OCR-free Document Understanding Transformer (Kim et al. 2021)"}
      - {id: "external:ocr", rel: replaces, why: "Replaces traditional OCR-plus-heuristics pipelines.", src: "Donut (Kim et al. 2021)"}
    maturity: 3
    maturity_note: Rapidly replacing legacy OCR in RAG ingestion.
    date: "2021-11"
    ref: {title: "OCR-free Document Understanding Transformer (Kim et al.)", arxiv: "2111.15664"}
    examples: [Docling, Nougat, Unstructured, Mistral OCR, Reducto]
    resources:
      - {kind: docs, title: "Docling documentation", by: "Docling Project (IBM Research)", year: 2025, url: "https://docling-project.github.io/docling/"}
      - {kind: talk, title: "Structuring the Unstructured - Cedric Clyburn, Red Hat", by: "Cedric Clyburn (AI Engineer)", year: 2026, url: "https://www.youtube.com/watch?v=-x5GEVnkuRw"}
      - {kind: paper, title: "Nougat: Neural Optical Understanding for Academic Documents", by: "Lukas Blecher et al.", year: 2023, url: "https://arxiv.org/abs/2308.13418"}
      - {kind: paper, title: "Docling: An Efficient Open-Source Toolkit for AI-driven Document Conversion", by: "Nikolaos Livathinos et al.", year: 2025, url: "https://arxiv.org/abs/2501.17887"}
    status: repaired
  - id: visual-document-retrieval
    name: Visual Document Retrieval
    aliases: [ColPali, page-image retrieval, visual late interaction]
    region: multimodal-applied
    also: [retrieval-and-knowledge]
    desc: Retrieving documents by embedding page images directly, skipping text extraction.
    summary: "Searching documents by embedding pictures of their pages instead of extracted text, so charts, tables and layout count toward the match. ColPali splits each page into patches, keeps one vector per patch, and scores a query by matching each query word to its best patch (late interaction, as in ColBERT). It handles visually rich documents well but stores hundreds of vectors per page."
    parents:
      - {id: vision-language-models, rel: specializes, why: "Uses VLM embeddings of page images.", src: "ColPali (Faysse et al. 2024)"}
      - {id: dense-retrieval, rel: applies, why: "Multi-vector dense retrieval over images.", src: "ColPali (Faysse et al. 2024)"}
      - {id: late-interaction, rel: applies, why: "Scores queries against page patches with ColBERT's max-sim late interaction.", src: "ColPali (Faysse et al. 2024)"}
    maturity: 2
    maturity_note: Promising; early production use.
    date: "2024-07"
    ref: {title: "ColPali: Efficient Document Retrieval with Vision Language Models (Faysse et al.)", arxiv: "2407.01449"}
    examples: [ColPali, ColQwen]
    resources:
      - {kind: blog, title: "ColPali: Efficient Document Retrieval with Vision Language Models", by: "Manuel Faysse (Hugging Face blog)", year: 2024, url: "https://huggingface.co/blog/manu/colpali"}
      - {kind: blog, title: "Scaling ColPali to billions of PDFs with Vespa", by: "Jo Kristian Bergum (Vespa)", year: 2024, url: "https://blog.vespa.ai/scaling-colpali-to-billions/"}
      - {kind: talk, title: "ColPali: Document Retrieval with Vision-Language Models only (with Manuel Faysse)", by: "Manuel Faysse (Zeta Alpha)", year: 2024, url: "https://www.youtube.com/watch?v=5zbwT4j_9KY"}
    status: added
  - id: speech-recognition
    name: Speech Recognition
    aliases: [ASR, speech-to-text, Whisper]
    region: multimodal-applied
    desc: Transcribing spoken audio to text with large weakly supervised transformer models.
    summary: "Turning spoken audio into text. Whisper showed that an encoder-decoder transformer trained on hundreds of thousands of hours of loosely labeled web audio handles accents, noise and many languages without per-task tuning. It is a commodity API today and the first stage of most voice pipelines."
    parents:
      - {id: sequence-to-sequence-learning, rel: applies, why: "Encoder-decoder audio-to-text modeling.", src: "Whisper (Radford et al. 2022)"}
    maturity: 5
    maturity_note: Commodity capability.
    date: "2022-12"
    ref: {title: "Robust Speech Recognition via Large-Scale Weak Supervision (Radford et al.)", arxiv: "2212.04356"}
    examples: [Whisper, Deepgram, AssemblyAI]
    resources:
      - {kind: blog, title: "Fine-Tune Whisper For Multilingual ASR with Transformers", by: "Sanchit Gandhi (Hugging Face)", year: 2022, url: "https://huggingface.co/blog/fine-tune-whisper"}
      - {kind: talk, title: "OpenAI Whisper: Robust Speech Recognition via Large-Scale Weak Supervision | Paper and Code", by: "Aleksa Gordić (The AI Epiphany)", year: 2022, url: "https://www.youtube.com/watch?v=AwJf8aQfChE"}
      - {kind: code, title: "openai/whisper", by: "OpenAI", year: 2022, url: "https://github.com/openai/whisper"}
    status: added
  - id: realtime-voice
    name: Realtime Voice Agents
    aliases: [speech-to-speech, voice mode]
    region: multimodal-applied
    desc: Low-latency spoken conversation with interruption handling, either end-to-end audio models or ASR-LLM-TTS pipelines.
    summary: "Spoken conversation with an AI fast enough to feel natural, including being interrupted. One design chains speech recognition, a language model and speech synthesis; it is easy to control but slow, and it drops tone of voice. The other uses a single model that hears and speaks audio directly, which cuts latency and keeps emotion and pacing. Turn-taking and latency are still the hard parts."
    parents:
      - {id: speech-recognition, rel: combines, why: "Pipelines start from transcription; end-to-end models subsume it.", src: "Hello GPT-4o (OpenAI 2024)"}
      - {id: pretrained-language-models, rel: combines, why: "An LLM drives the conversation.", src: "Hello GPT-4o (OpenAI 2024)"}
      - {id: audio-language-models, rel: extends, why: "End-to-end voice models hear and speak in discrete audio tokens.", src: "Moshi (Défossez et al. 2024)"}
    maturity: 3
    maturity_note: In production for support and assistants; latency and turn-taking still hard.
    date: "2024-05"
    ref: {title: "Hello GPT-4o (OpenAI, May 2024)"}
    examples: [OpenAI Realtime API, Gemini Live, Pipecat, LiveKit Agents]
    resources:
      - {kind: blog, title: "Voice AI & Voice Agents: An Illustrated Primer", by: "Kwindla Hultman Kramer (Daily)", year: 2025, url: "https://voiceaiandvoiceagents.com/"}
      - {kind: docs, title: "Getting started with the Realtime API", by: "OpenAI", year: 2025, url: "https://developers.openai.com/api/docs/guides/realtime"}
      - {kind: talk, title: "How to build the world's fastest voice bot", by: "Kwindla Hultman Kramer (AI Engineer)", year: 2025, url: "https://www.youtube.com/watch?v=dRQHikOrH2A"}
    status: repaired
  - id: diffusion-models
    name: Diffusion Models
    aliases: [DDPM, denoising diffusion]
    region: multimodal-applied
    desc: Generative models that learn to reverse a gradual noising process, now standard for images, audio, and video.
    summary: "A model is trained to remove a little noise from a noisy image. To generate, it starts from pure noise and denoises step by step until a clean image appears. The approach is stable to train and produces high-quality images, audio and video, at the cost of many sampling steps."
    parents:
      - {id: "external:nonequilibrium-thermodynamics-generative-modeling", rel: extends, why: "Builds on early diffusion probabilistic models (Sohl-Dickstein et al. 2015).", src: "DDPM (Ho et al. 2020)"}
    maturity: 5
    maturity_note: Dominant approach to media generation.
    date: "2020-06"
    ref: {title: "Denoising Diffusion Probabilistic Models (Ho et al.)", arxiv: "2006.11239"}
    examples: [Stable Diffusion, Imagen, Flux]
    resources:
      - {kind: blog, title: "What are Diffusion Models?", by: "Lilian Weng", year: 2021, url: "https://lilianweng.github.io/posts/2021-07-11-diffusion-models/"}
      - {kind: blog, title: "Perspectives on diffusion", by: "Sander Dieleman", year: 2023, url: "https://sander.ai/2023/07/20/perspectives.html"}
      - {kind: talk, title: "Tutorial on Denoising Diffusion-based Generative Modeling: Foundations and Applications", by: "Karsten Kreis, Ruiqi Gao, Arash Vahdat (CVPR 2022 tutorial)", year: 2022, url: "https://www.youtube.com/watch?v=cS6JQpEY9cs"}
      - {kind: paper, title: "Score-Based Generative Modeling through Stochastic Differential Equations", by: "Yang Song et al.", year: 2020, url: "https://arxiv.org/abs/2011.13456"}
    status: added
  - id: text-to-image
    name: Text-to-Image Generation
    aliases: [latent diffusion, image generation]
    region: multimodal-applied
    desc: Generating images from text prompts, typically with latent diffusion guided by text encoders.
    summary: "Generating a picture from a written prompt. Latent diffusion made it practical: denoising runs in a compressed latent space instead of on full-size pixels, and a text encoder such as CLIP steers each step toward the prompt. Mature APIs and open models exist, and prompts alone give limited control over layout."
    parents:
      - {id: diffusion-models, rel: extends, why: "Runs diffusion in a compressed latent space with text conditioning.", src: "High-Resolution Image Synthesis with Latent Diffusion Models (Rombach et al. 2021)"}
      - {id: contrastive-image-text-pretraining, rel: combines, why: "Uses CLIP-style text encoders for conditioning.", src: "Rombach et al. 2021"}
    maturity: 4
    maturity_note: Mature APIs and open models.
    date: "2021-12"
    ref: {title: "High-Resolution Image Synthesis with Latent Diffusion Models (Rombach et al.)", arxiv: "2112.10752"}
    examples: [Stable Diffusion, Midjourney, Imagen, gpt-image]
    resources:
      - {kind: blog, title: "The Illustrated Stable Diffusion", by: "Jay Alammar", year: 2022, url: "https://jalammar.github.io/illustrated-stable-diffusion/"}
      - {kind: blog, title: "Stable Diffusion with Diffusers", by: "Hugging Face (Suraj Patil, Pedro Cuenca, Nathan Lambert, Patrick von Platen)", year: 2022, url: "https://huggingface.co/blog/stable_diffusion"}
      - {kind: talk, title: "Stable Diffusion and Friends - Generative Modeling in Latent Space", by: "Robin Rombach (heidelberg.ai)", year: 2023, url: "https://www.youtube.com/watch?v=7W4aZObNucI"}
