      - {kind: paper, title: "RouteLLM: Learning to Route LLMs with Preference Data", by: "Isaac Ong et al.", year: 2024, url: "https://arxiv.org/abs/2406.18665"}
      - {kind: paper, title: "Hybrid LLM: Cost-Efficient and Quality-Aware Query Routing", by: "Dujian Ding et al.", year: 2024, url: "https://arxiv.org/abs/2404.14618"}
      - {kind: paper, title: "Small Language Models are the Future of Agentic AI", by: "Peter Belcak et al. (NVIDIA)", year: 2025, url: "https://arxiv.org/abs/2506.02153"}
