  - id: ai-bill-of-materials
    name: AI Bill of Materials
    aliases: [AIBOM, AI-BOM, ML-BOM, SBOM for AI]
    region: governance-and-compliance
    also: [safety-and-security]
    layer: detail
    desc: A machine-readable inventory of what an AI system is built from — models and their lineage, datasets and their licenses, code dependencies and pipelines — in a software bill of materials format.
    summary: "A machine-readable parts list for an AI system: which models (with weight hashes and what they were fine-tuned from), which datasets and licenses, which libraries and pipelines. It extends the software bill of materials that security teams already use, so the same tools can flag a vulnerable dependency or a problem license. Critics note that it lists components but not what an agent is allowed to do at runtime."
    parents:
      - {id: "external:software-bill-of-materials", rel: extends, why: "Extends SBOM formats such as CycloneDX and SPDX to models, datasets and training lineage.", src: "CycloneDX v1.5 ML-BOM (2023); SPDX 3.0 AI profile"}
      - {id: model-documentation, rel: extends, why: "Turns the facts in a model card into structured, machine-checkable records.", src: "OWASP AI SBOM Initiative"}
    maturity: 2
    maturity_note: Formats exist (CycloneDX ML-BOM, SPDX 3.0 AI) and government guidance appeared in 2026; tooling and adoption are early.
    date: "2023-06"
    ref: {title: "Machine Learning Bill of Materials (AI/ML-BOM), CycloneDX", url: "https://cyclonedx.org/capabilities/mlbom/"}
    examples: [CycloneDX ML-BOM, SPDX 3.0 AI profile, OWASP AIBOM Generator]
    resources:
      - {kind: docs, title: "SPDX 3.0.1 AI profile", by: "SPDX (Linux Foundation)", year: 2024, url: "https://spdx.github.io/spdx-spec/v3.0.1/model/AI/AI/"}
      - {kind: docs, title: "AI SBOM Initiative", by: "OWASP Gen AI Security Project", year: 2025, url: "https://genai.owasp.org/initiatives/ai-sbom-initiative/"}
      - {kind: blog, title: "Introducing OWASP CycloneDX v1.5", by: "CycloneDX", year: 2023, url: "https://cyclonedx.org/news/cyclonedx-v1.5-released/"}
    status: added
  - id: ai-impact-assessment
    name: AI Impact Assessments
    aliases: [fundamental rights impact assessment, FRIA, algorithmic impact assessment, ISO/IEC 42005]
    region: governance-and-compliance
    layer: detail
    desc: A documented review, before deployment, of how an AI system could affect the people it is used on — discrimination, loss of rights, harm to vulnerable groups — and what oversight and mitigations will address it.
    summary: "A written review, done before an AI system goes live, of how it could affect the people it makes decisions about: who could be treated unfairly, what rights are at stake, and what human oversight and complaint routes exist. The EU AI Act requires one (a fundamental rights impact assessment) from certain deployers of high-risk systems such as public bodies, banks and insurers. It works like a GDPR data protection impact assessment, widened from privacy to all fundamental rights."
    parents:
      - {id: eu-ai-act, rel: applies, why: "Article 27 makes the assessment mandatory for certain deployers of high-risk systems.", src: "Regulation (EU) 2024/1689, Art. 27"}
      - {id: "external:data-protection-impact-assessment", rel: extends, why: "Follows the GDPR DPIA method but covers all fundamental rights, not only privacy.", src: "TechGDPR (2024)"}
    maturity: 2
    maturity_note: Mandatory under the EU AI Act for some deployers from August 2026; templates and practice are still forming.
    date: "2024-08"
    ref: {title: "Article 27: Fundamental Rights Impact Assessment for High-Risk AI Systems (AI Act Explorer)", url: "https://artificialintelligenceact.eu/article/27/"}
    examples: [EU AI Act FRIA, ISO/IEC 42005, Canada Algorithmic Impact Assessment]
    resources:
      - {kind: blog, title: "Difference between Fundamental Rights Impact Assessment & Data Protection Impact Assessment", by: "TechGDPR", year: 2024, url: "https://techgdpr.com/blog/difference-fundamental-rights-impact-assessment-dpia/"}
    status: added
