    maturity: 3
    maturity_note: Standard ingredient of reasoning-model training since 2025.
    date: "2024-11"
    ref: {title: "Tülu 3: Pushing Frontiers in Open Language Model Post-Training (Lambert et al.)", arxiv: "2411.15124"}
