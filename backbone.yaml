    status: repaired
  - id: generative-ui
    name: Generative UI
    aliases: [server-driven UI from models]
    region: ai-product-and-interaction-design
    desc: Models emit structured payloads the front end renders as interactive components instead of plain text.
    summary: "Instead of answering in text, the model picks or fills an interface component, such as a flight picker, chart or form, and the front end renders it. Usually the model makes a tool call with structured arguments and your code maps it to a component, so the UI stays under your control. Generated interfaces can look polished while failing basic usability and accessibility checks, so they need the same review as hand-built ones."
    parents:
      - {id: structured-outputs, rel: applies, why: "Structured output drives component rendering.", src: "Vercel AI SDK 3.0 (2024)"}
      - {id: direct-manipulation, rel: applies, why: "Returns manipulable interface elements instead of prose.", src: "Vercel AI SDK 3.0 (2024)", confidence: medium}
    maturity: 3
    maturity_note: Adopted in products; patterns still forming.
    date: "2024-03"
