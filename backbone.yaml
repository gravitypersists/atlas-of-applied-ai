  - id: textual-gradients
    name: Textual Gradients
    aliases: [TextGrad, textual gradient descent]
    region: prompting-and-context-engineering
    layer: detail
    desc: Treating a compound AI system as a computation graph and backpropagating natural-language critiques from an evaluator model to update prompts and other text variables.
    summary: Optimizing a multi-step AI pipeline the way neural networks are trained, but with words. An evaluator model critiques the output, and the critique is passed back to improve each prompt. Promising, but still mostly research.
