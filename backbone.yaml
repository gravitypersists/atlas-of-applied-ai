  - id: grpo
    name: Group Relative Policy Optimization
    aliases: [GRPO]
    region: adaptation-and-post-training
    desc: A policy-gradient method that baselines each response against a group of samples for the same prompt, removing the value network.
    summary: "A reinforcement learning algorithm that samples a group of answers to the same prompt and scores each one against the group's average, so it needs no separate value (critic) model. That saves a lot of memory, and since DeepSeek-R1 it has been the standard algorithm for training reasoning models with verifiable rewards."
    parents:
      - {id: ppo, rel: specializes, why: "PPO-style objective with group-relative advantages instead of a critic.", src: "DeepSeekMath (Shao et al. 2024)"}
    maturity: 4
    maturity_note: Algorithm of choice for open reasoning RL after DeepSeek-R1; built into the main open training libraries.
    date: "2024-02"
    ref: {title: "DeepSeekMath: Pushing the Limits of Mathematical Reasoning in Open Language Models (Shao et al.)", arxiv: "2402.03300"}
    examples: [TRL GRPOTrainer, verl]
    resources:
      - {kind: blog, title: "Group Relative Policy Optimization (GRPO)", by: "Cameron R. Wolfe", year: 2025, url: "https://cameronrwolfe.substack.com/p/grpo"}
      - {kind: docs, title: "GRPO Trainer · Hugging Face", by: "Hugging Face TRL", year: 2025, url: "https://huggingface.co/docs/trl/grpo_trainer"}
      - {kind: talk, title: "[GRPO Explained] DeepSeekMath: Pushing the Limits of Mathematical Reasoning in Open Language Models", by: "Yannic Kilcher", year: 2025, url: "https://www.youtube.com/watch?v=bAWV_yrqx4w"}
      - {kind: paper, title: "Understanding R1-Zero-Like Training: A Critical Perspective", by: "Liu et al.", year: 2025, url: "https://arxiv.org/abs/2503.20783"}
    status: repaired
  - id: llm-distillation
    name: LLM Distillation
    aliases: [reasoning distillation, distilled CoT, small language models, SLM]
    region: adaptation-and-post-training
    also: [data-and-synthetic-data]
    desc: Fine-tuning smaller models on outputs and rationales generated by larger ones.
    summary: "Fine-tuning a small model on answers and step-by-step reasoning written by a larger one, so the small model picks up much of the larger one's skill at a fraction of the cost. Most small reasoning models are made this way. Small students can struggle to imitate reasoning traces that are too long or complex for them."
    parents:
      - {id: knowledge-distillation, rel: applies, why: "Applies teacher-student training to generated text and rationales.", src: "Distilling Step-by-Step (Hsieh et al. 2023)"}
      - {id: supervised-fine-tuning, rel: applies, why: "Implemented as SFT on teacher outputs.", src: "Distilling Step-by-Step (Hsieh et al. 2023)"}
    maturity: 4
    maturity_note: Pervasive for small and open models.
    date: "2023-05"
    ref: {title: "Distilling Step-by-Step! Outperforming Larger Language Models with Less Training Data and Smaller Model Sizes (Hsieh et al.)", arxiv: "2305.02301"}
    examples: [DeepSeek-R1-Distill models]
    resources:
      - {kind: docs, title: "Synthetic Data & Distillation (RLHF Book)", by: "Nathan Lambert", year: 2025, url: "https://rlhfbook.com/c/12-synthetic-data"}
      - {kind: talk, title: "Knowledge Distillation: How LLMs train each other", by: "Julia Turc", year: 2025, url: "https://www.youtube.com/watch?v=jrJKRYAdh7I"}
      - {kind: paper, title: "A Survey on Knowledge Distillation of Large Language Models", by: "Xu et al.", year: 2024, url: "https://arxiv.org/abs/2402.13116"}
    status: repaired

  # ---- deep dive (2026-10-09) ----
  - id: dora
    name: DoRA
    aliases: [weight-decomposed low-rank adaptation]
    region: adaptation-and-post-training
    layer: detail
    desc: A LoRA variant that splits each weight into a magnitude and a direction and applies the low-rank update to the direction only.
    summary: "A LoRA variant that splits each weight matrix into a size (magnitude) and a direction, trains the magnitude directly, and applies the low-rank update only to the direction. Results come closer to full fine-tuning at almost the same cost as LoRA, and common fine-tuning libraries offer it as a switch."
    parents:
      - {id: low-rank-adaptation, rel: extends, why: "Adds a trainable magnitude and confines the low-rank update to the weight direction.", src: "DoRA (Liu et al. 2024)"}
    maturity: 2
    maturity_note: A drop-in LoRA upgrade in the main libraries, but not yet the default.
    date: "2024-02"
    ref: {title: "DoRA: Weight-Decomposed Low-Rank Adaptation (Liu et al.)", arxiv: "2402.09353"}
    examples: [Hugging Face PEFT use_dora, Unsloth]
    resources:
      - {kind: blog, title: "Improving LoRA: Implementing Weight-Decomposed Low-Rank Adaptation (DoRA) from Scratch", by: "Sebastian Raschka", year: 2024, url: "https://magazine.sebastianraschka.com/p/lora-and-dora-from-scratch"}
      - {kind: blog, title: "Introducing DoRA, a High-Performing Alternative to LoRA for Fine-Tuning", by: "NVIDIA (Min-Hung Chen)", year: 2024, url: "https://developer.nvidia.com/blog/introducing-dora-a-high-performing-alternative-to-lora-for-fine-tuning/"}
    status: added
  - id: reft
    name: Representation Fine-Tuning
    aliases: [ReFT, LoReFT]
    region: adaptation-and-post-training
    layer: detail
    desc: Freezing all weights and training small interventions that edit hidden activations at chosen layers and token positions.
    summary: "Instead of changing weights, ReFT leaves the whole model frozen and trains small functions that edit its hidden activations at chosen layers and token positions. It can match LoRA while training far fewer parameters. It is still mostly a research technique."
    parents:
      - {id: parameter-efficient-fine-tuning, rel: specializes, why: "Parameter-efficient adaptation that trains edits to activations instead of weight updates.", src: "ReFT (Wu et al. 2024)"}
      - {id: representation-engineering, rel: applies, why: "Learns by gradient descent the kind of activation-space interventions representation engineering sets by hand.", src: "ReFT (Wu et al. 2024)"}
    maturity: 1
    maturity_note: Research; one main library and little production use.
    date: "2024-04"
    ref: {title: "ReFT: Representation Finetuning for Language Models (Wu et al.)", arxiv: "2404.03592"}
    examples: [pyreft]
    resources:
      - {kind: code, title: "stanfordnlp/pyreft: Stanford NLP Python library for Representation Finetuning (ReFT)", by: "Stanford NLP", year: 2024, url: "https://github.com/stanfordnlp/pyreft"}
      - {kind: talk, title: "How ReFT Works w/ Author Zhengxuan Wu", by: "Zhengxuan Wu (Oxen)", year: 2024, url: "https://www.youtube.com/watch?v=to2oKwnknUk"}
    status: added
  - id: kto
    name: Kahneman-Tversky Optimization
    aliases: [KTO]
    region: adaptation-and-post-training
    layer: detail
    desc: Preference optimization from unpaired thumbs-up or thumbs-down labels, using a loss modeled on prospect theory.
    summary: "A DPO-style method that learns from single answers labeled good or bad, instead of pairs ranked against each other. That matches the feedback many products already collect (thumbs up, thumbs down), so training data is cheaper to get. Its loss borrows loss aversion from prospect theory, weighting bad answers more heavily than good ones."
    parents:
      - {id: direct-preference-optimization, rel: extends, why: "Drops DPO's need for paired comparisons and learns from binary labels.", src: "KTO (Ethayarajh et al. 2024)"}
    maturity: 2
    maturity_note: Implemented in the main training libraries; chosen mainly when only binary feedback exists.
    date: "2024-02"
    ref: {title: "KTO: Model Alignment as Prospect Theoretic Optimization (Ethayarajh et al.)", arxiv: "2402.01306"}
    examples: [TRL KTOTrainer]
    resources:
      - {kind: blog, title: "Better, Cheaper, Faster LLM Alignment with KTO", by: "Contextual AI", year: 2023, url: "https://contextual.ai/research/better-cheaper-faster-llm-alignment-with-kto"}
      - {kind: docs, title: "KTO Trainer · Hugging Face", by: "Hugging Face TRL", year: 2025, url: "https://huggingface.co/docs/trl/kto_trainer"}
      - {kind: talk, title: "4 Ways to Align LLMs: RLHF, DPO, KTO, and ORPO", by: "Snorkel AI", year: 2024, url: "https://www.youtube.com/watch?v=lBzw9ku86dg"}
    status: added
  - id: orpo
    name: Odds Ratio Preference Optimization
    aliases: [ORPO]
    region: adaptation-and-post-training
    layer: detail
    desc: Combining instruction tuning and preference alignment in one training stage by adding an odds-ratio penalty to the SFT loss, with no reference model.
    summary: "Folds instruction tuning and preference alignment into one training run: the usual SFT loss plus a penalty that makes the rejected answer less likely relative to the chosen one. It needs no frozen reference model, which saves memory and a whole training stage, but results are sensitive to its settings."
    parents:
      - {id: supervised-fine-tuning, rel: combines, why: "Keeps the SFT loss as the base of the single training stage.", src: "ORPO (Hong et al. 2024)"}
      - {id: direct-preference-optimization, rel: combines, why: "Adds a preference term over chosen and rejected pairs, without DPO's reference model.", src: "ORPO (Hong et al. 2024)"}
    maturity: 2
    maturity_note: Implemented in the main training libraries; used for some open models.
    date: "2024-03"
    ref: {title: "ORPO: Monolithic Preference Optimization without Reference Model (Hong et al.)", arxiv: "2403.07691"}
    examples: [TRL ORPOTrainer]
    resources:
      - {kind: blog, title: "Fine-tune Llama 3 with ORPO", by: "Maxime Labonne", year: 2024, url: "https://huggingface.co/blog/mlabonne/orpo-llama-3"}
      - {kind: docs, title: "ORPO Trainer · Hugging Face", by: "Hugging Face TRL", year: 2025, url: "https://huggingface.co/docs/trl/orpo_trainer"}
      - {kind: talk, title: "ORPO: Monolithic Preference Optimization without Reference Model (Paper Explained)", by: "Yannic Kilcher", year: 2024, url: "https://www.youtube.com/watch?v=52kMBrAI_IM"}
    status: added
  - id: online-preference-optimization
    name: Online Preference Optimization
    aliases: [online DPO, iterative DPO, OAIF]
    region: adaptation-and-post-training
    layer: detail
    desc: Repeatedly sampling fresh answers from the model being trained, labeling preferences with a reward model or AI judge, and training on them.
    summary: "Standard DPO learns from a fixed set of answers, often written by other models. The online version keeps generating new answers from the model being trained, has a reward model or AI judge pick the better ones, and trains on those, round after round. Learning from its own current mistakes closes much of the gap with full RL, at the cost of more infrastructure."
    parents:
      - {id: direct-preference-optimization, rel: extends, why: "Runs the DPO loss in a loop over freshly sampled answers instead of a fixed dataset.", src: "Direct Language Model Alignment from Online AI Feedback (Guo et al. 2024)"}
      - {id: constitutional-ai, rel: applies, why: "Uses an AI annotator to label preferences between fresh samples.", src: "Direct Language Model Alignment from Online AI Feedback (Guo et al. 2024)"}
    maturity: 3
    maturity_note: Iterative rounds of sampling and preference training are common in open and frontier post-training recipes.
    date: "2024-02"
    ref: {title: "Direct Language Model Alignment from Online AI Feedback (Guo et al.)", arxiv: "2402.04792"}
    examples: [TRL OnlineDPOTrainer, Llama 3 post-training]
    resources:
      - {kind: docs, title: "Online DPO Trainer · Hugging Face", by: "Hugging Face TRL", year: 2025, url: "https://huggingface.co/docs/trl/online_dpo_trainer"}
      - {kind: paper, title: "RLHF Workflow: From Reward Modeling to Online RLHF", by: "Dong et al.", year: 2024, url: "https://arxiv.org/abs/2405.07863"}
      - {kind: paper, title: "Self-Rewarding Language Models", by: "Yuan et al. (Meta)", year: 2024, url: "https://arxiv.org/abs/2401.10020"}
      - {kind: paper, title: "Preference Fine-Tuning of LLMs Should Leverage Suboptimal, On-Policy Data", by: "Tajwar et al.", year: 2024, url: "https://arxiv.org/abs/2404.14367"}
    status: added
  - id: model-merging
    name: Model Merging
    aliases: [task arithmetic, task vectors, model soups, TIES-Merging, SLERP merging]
    region: adaptation-and-post-training
    desc: Combining fine-tuned models by arithmetic on their weights, such as averaging them or adding task vectors, with no further training.
    summary: "Combines fine-tuned versions of the same base model by doing arithmetic on their weights: averaging them, or adding and subtracting the change each fine-tune made (a task vector). No training is needed, so it is a cheap way to mix skills. Naive merges interfere with each other, and methods like TIES trim and reconcile the changes first; results are still less predictable than training."
    parents:
      - {id: supervised-fine-tuning, rel: applies, why: "Operates on the weight changes that fine-tuning produces.", src: "Editing Models with Task Arithmetic (Ilharco et al. 2022)"}
      - {id: "external:weight-averaging", rel: extends, why: "Generalizes averaging the weights of models from a shared starting point.", src: "Model soups (Wortsman et al. 2022)"}
    maturity: 3
    maturity_note: Widely used for open models and in some lab pipelines; behavior is hard to predict.
    date: "2022-12"
    ref: {title: "Editing Models with Task Arithmetic (Ilharco et al.)", arxiv: "2212.04089"}
    examples: [MergeKit]
    resources:
      - {kind: blog, title: "Merge Large Language Models with mergekit", by: "Maxime Labonne", year: 2024, url: "https://huggingface.co/blog/mlabonne/merge-models"}
      - {kind: blog, title: "Model Merging: A Survey", by: "Cameron R. Wolfe", year: 2024, url: "https://cameronrwolfe.substack.com/p/model-merging"}
      - {kind: talk, title: "mergekit founder explains model merging", by: "Charles Goddard (Arcee AI)", year: 2024, url: "https://www.youtube.com/watch?v=IVDNhQIzyIY"}
      - {kind: paper, title: "TIES-Merging: Resolving Interference When Merging Models", by: "Yadav et al.", year: 2023, url: "https://arxiv.org/abs/2306.01708"}
    status: added

  # ---- small models (2026-10-10) ----
  - id: structured-pruning
    name: Structured Pruning
    aliases: [LLM pruning, width and depth pruning, Minitron, Sheared LLaMA]
    region: adaptation-and-post-training
    also: [inference-and-serving]
    desc: Removing whole layers, attention heads or hidden dimensions from a trained model, then retraining briefly to recover quality, producing a smaller model.
    summary: "Makes a small model by cutting a large one down: whole layers, attention heads or hidden dimensions are removed, chosen by how little each contributes, and the result is retrained briefly, often by distilling from the original model. This costs a small fraction of training the small model from scratch. Unlike scattering zeros through the weights, removing whole structures gives a genuinely smaller model that runs faster on ordinary hardware."
    parents:
      - {id: llm-distillation, rel: combines, why: "Recovers the pruned model's quality by distilling from the unpruned original.", src: "Compact Language Models via Pruning and Knowledge Distillation (Muralidharan et al. 2024)"}
      - {id: "external:network-pruning", rel: extends, why: "Applies classic neural-network pruning to whole structures of a pretrained LLM.", src: "LLM-Pruner (Ma et al. 2023)"}
    maturity: 3
    maturity_note: Used by NVIDIA and Meta to make released small models; recipes are still evolving.
    date: "2023-10"
    ref: {title: "Sheared LLaMA: Accelerating Language Model Pre-training via Structured Pruning (Xia et al.)", arxiv: "2310.06694"}
    examples: [Llama-3.1-Minitron 4B, Llama 3.2 1B and 3B, Sheared-LLaMA]
    resources:
      - {kind: blog, title: "How to Prune and Distill Llama-3.1 8B to an NVIDIA Llama-3.1-Minitron 4B Model", by: "NVIDIA Technical Blog", year: 2024, url: "https://developer.nvidia.com/blog/how-to-prune-and-distill-llama-3-1-8b-to-an-nvidia-llama-3-1-minitron-4b-model/"}
      - {kind: paper, title: "Compact Language Models via Pruning and Knowledge Distillation", by: "Saurav Muralidharan et al.", year: 2024, url: "https://arxiv.org/abs/2407.14679"}
      - {kind: paper, title: "LLM-Pruner: On the Structural Pruning of Large Language Models", by: "Xinyin Ma et al.", year: 2023, url: "https://arxiv.org/abs/2305.11627"}
    status: added
  - id: on-policy-distillation
    name: On-Policy Distillation
    aliases: [generalized knowledge distillation, GKD, MiniLLM]
    region: adaptation-and-post-training
    layer: detail
    desc: Distillation in which the student generates its own outputs and the teacher scores each token, so the student learns to recover from its own mistakes.
    summary: "Ordinary distillation trains the student on text the teacher wrote, but at use time the student reads its own output, and one early slip can lead it somewhere the teacher's examples never went. In on-policy distillation the student writes its own answers and the teacher grades every token, so the student learns from the mistakes it actually makes. It gets much of the benefit of reinforcement learning with dense, per-token feedback, at a fraction of the compute."
    parents:
      - {id: llm-distillation, rel: extends, why: "Trains the student on its own samples instead of fixed teacher outputs.", src: "On-Policy Distillation of Language Models (Agarwal et al. 2023)"}
      - {id: dagger, rel: applies, why: "Applies imitation learning's fix for compounding errors, training on states the learner itself visits.", src: "On-Policy Distillation of Language Models (Agarwal et al. 2023)"}
    maturity: 3
    maturity_note: Used in the post-training of recent small open models such as Qwen3's; supported in common training libraries.
    date: "2023-06"
    ref: {title: "On-Policy Distillation of Language Models: Learning from Self-Generated Mistakes (Agarwal et al.)", arxiv: "2306.13649"}
    examples: [Qwen3 small models, TRL GKDTrainer]
    resources:
      - {kind: blog, title: "On-Policy Distillation - Thinking Machines Lab", by: "Kevin Lu et al. (Thinking Machines)", year: 2025, url: "https://thinkingmachines.ai/blog/on-policy-distillation/"}
      - {kind: docs, title: "Generalized Knowledge Distillation Trainer", by: "Hugging Face TRL", year: 2024, url: "https://huggingface.co/docs/trl/gkd_trainer"}
      - {kind: paper, title: "MiniLLM: On-Policy Distillation of Large Language Models", by: "Yuxian Gu et al.", year: 2023, url: "https://arxiv.org/abs/2306.08543"}
    status: added

  # ---- practitioner staples (2026-10-10) ----
  - id: continued-pretraining
    name: Continued Pretraining
    aliases: [domain-adaptive pretraining, DAPT, continual pretraining, task-adaptive pretraining, TAPT]
    region: adaptation-and-post-training
    desc: Resuming next-token pretraining on a large unlabeled corpus from a new domain or language before instruction tuning, to teach knowledge and vocabulary that fine-tuning can't.
    summary: "Fine-tuning teaches a model how to behave, but it is a poor way to teach a lot of new knowledge. Continued pretraining runs the original next-token training on billions of tokens of domain text (code, medicine, finance, a new language) and then re-applies instruction tuning. It is how most domain models are built; the main risk is forgetting general skills, which is managed by mixing in general data and keeping the learning rate low."
    parents:
      - {id: pretrained-language-models, rel: extends, why: "Continues the same self-supervised objective on new-domain text.", src: "Don't Stop Pretraining (Gururangan et al. 2020)"}
      - {id: transfer-learning-fine-tuning, rel: specializes, why: "An unsupervised adaptation stage inserted before task fine-tuning.", src: "Gururangan et al. 2020"}
    maturity: 4
    maturity_note: Standard route to domain and language models; recipes to avoid forgetting are well documented.
    date: "2020-04"
    ref: {title: "Don't Stop Pretraining: Adapt Language Models to Domains and Tasks (Gururangan et al.)", arxiv: "2004.10964"}
    examples: [Code Llama, BloombergGPT, Meditron, SaulLM]
    status: added

  # ======================= APPLIED: data-and-synthetic-data =======================
  - id: self-instruct
    name: Self-Instruct
    aliases: [synthetic instruction generation]
    region: data-and-synthetic-data
    desc: Bootstrapping instruction datasets by prompting a model to generate tasks, inputs, and outputs from a few seeds.
    summary: "Builds an instruction-tuning dataset with a model instead of human writers. Starting from a small seed set of hand-written tasks (175 in the paper), the model is shown a few examples and asked for new instructions, then for inputs and answers to them, and near-duplicates and malformed items are filtered out. It made instruction data cheap: Stanford's Alpaca set of 52,000 examples cost a few hundred dollars to generate."
    parents:
      - {id: few-shot-prompting, rel: applies, why: "Uses few-shot prompts seeded with example tasks to generate new ones.", src: "Self-Instruct (Wang et al. 2022)"}
    maturity: 4
    maturity_note: Established technique behind many open instruction sets.
    date: "2022-12"
    ref: {title: "Self-Instruct: Aligning Language Models with Self-Generated Instructions (Wang et al.)", arxiv: "2212.10560"}
    examples: [Alpaca data]
    resources:
      - {kind: blog, title: "Alpaca: A Strong, Replicable Instruction-Following Model", by: "Rohan Taori et al. (Stanford CRFM)", year: 2023, url: "https://crfm.stanford.edu/2023/03/13/alpaca.html"}
      - {kind: docs, title: "SelfInstruct - Distilabel Docs", by: "Argilla", year: 2024, url: "https://distilabel.argilla.io/latest/components-gallery/tasks/selfinstruct/"}
      - {kind: talk, title: "Instruction Tuning of Large Language Models", by: "Yizhong Wang (JHU CLSP)", year: 2023, url: "https://www.youtube.com/watch?v=jpbt3IZgbcc"}
      - {kind: docs, title: "Synthetic Data & Distillation (RLHF Book)", by: "Nathan Lambert", year: 2025, url: "https://rlhfbook.com/c/12-synthetic-data"}
    status: repaired
  - id: evol-instruct
    name: Evol-Instruct
    aliases: [instruction evolution]
    region: data-and-synthetic-data
    desc: Iteratively rewriting instructions to be harder or broader, producing more complex training data.
    summary: "Model-generated instructions tend to be easy and alike, because the generator sticks to likely, simple requests. Evol-Instruct has a model rewrite each instruction over several rounds, adding constraints, requiring more reasoning steps, or moving it to a new topic, so the dataset gets harder and more varied. It was used to train WizardLM and WizardCoder."
    parents:
      - {id: self-instruct, rel: extends, why: "Evolves generated instructions for difficulty and diversity.", src: "WizardLM (Xu et al. 2023)"}
    maturity: 3
    maturity_note: Influential; one of many synthetic recipes.
    date: "2023-04"
    ref: {title: "WizardLM: Empowering Large Language Models to Follow Complex Instructions (Xu et al.)", arxiv: "2304.12244"}
    examples: [WizardLM, WizardCoder]
    resources:
      - {kind: docs, title: "EvolInstruct - Distilabel Docs", by: "Argilla", year: 2024, url: "https://distilabel.argilla.io/latest/components-gallery/tasks/evolinstruct/"}
      - {kind: talk, title: "WizardLM: Evolving Instruction Datasets to Create a Better Model", by: "Sam Witteveen", year: 2023, url: "https://www.youtube.com/watch?v=5IAxCL4dHWk"}
      - {kind: paper, title: "WizardCoder: Empowering Code Large Language Models with Evol-Instruct", by: "Ziyang Luo et al.", year: 2023, url: "https://arxiv.org/abs/2306.08568"}
    status: repaired
  - id: synthetic-textbook-data
    name: Synthetic Pretraining Data
    aliases: [textbook-quality data, synthetic corpora]
    region: data-and-synthetic-data
    layer: detail
    desc: Generating large, high-quality synthetic corpora with strong models to pretrain or mid-train smaller ones.
    summary: "Training a model on text that a stronger model wrote to be clear and instructive, such as textbook chapters and exercises, instead of on raw web text. Microsoft's phi-1 was trained mostly on filtered web code plus under a billion tokens of synthetic textbooks, and beat coding models many times its size. Varying the prompts by topic and audience keeps the generated text from becoming repetitive. Training only on model output, generation after generation, can make models lose rare knowledge (model collapse), so pipelines keep real data in the mix."
    parents:
      - {id: self-instruct, rel: extends, why: "Scales model-generated data from instructions to full training corpora.", src: "Textbooks Are All You Need (Gunasekar et al. 2023)", confidence: medium}
    maturity: 3
    maturity_note: Common in frontier and small-model training.
    date: "2023-06"
    ref: {title: "Textbooks Are All You Need (Gunasekar et al.)", arxiv: "2306.11644"}
    examples: [phi models, Cosmopedia]
    resources:
      - {kind: blog, title: "Cosmopedia: how to create large-scale synthetic data for pre-training Large Language Models", by: "Loubna Ben Allal, Anton Lozhkov, Daniel van Strien (Hugging Face)", year: 2024, url: "https://huggingface.co/blog/cosmopedia"}
      - {kind: talk, title: "Best of 2024: Synthetic Data / Smol Models", by: "Loubna Ben Allal (Latent Space Live, NeurIPS 2024)", year: 2024, url: "https://www.youtube.com/watch?v=AjmdDy7Rzx0"}
      - {kind: paper, title: "Is Model Collapse Inevitable? Breaking the Curse of Recursion by Accumulating Real and Synthetic Data", by: "Matthias Gerstgrasser et al.", year: 2024, url: "https://arxiv.org/abs/2404.01413"}
    status: added
  - id: human-instruction-datasets
    name: Crowdsourced Instruction Data
    aliases: [human-written demonstrations, OpenAssistant]
    region: data-and-synthetic-data
    desc: Collecting instruction and conversation data written and rated by people.
    summary: "Instruction and conversation data written and rated by people. In OpenAssistant, more than 13,000 volunteers wrote prompts, played the assistant, and ranked each other's replies, with review and voting to keep quality up. Human data like this is expensive and rarely very hard, so it is now mostly a small, trusted core alongside larger synthetic sets."
    parents:
