  - id: interpretability
    name: Mechanistic Interpretability
    aliases: [circuits, interpretability]
    region: safety-and-security
    desc: Reverse-engineering the internal mechanisms of neural networks into human-understandable features and circuits.
    summary: "Reverse-engineering a trained network to find the internal features and circuits behind its behavior, such as the attention heads that continue repeated patterns. It is mostly research, but it supplies the methods the applied techniques nearby build on: sparse autoencoders, reading and steering representations, and circuit breakers."
    parents:
