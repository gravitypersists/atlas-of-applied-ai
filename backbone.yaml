  - id: llm-as-a-judge
    name: LLM-as-a-Judge
    aliases: [model-graded evals, autoevals]
    region: evaluation-and-observability
    desc: Using a strong model with a rubric to grade or compare outputs where exact answers don't exist.
    summary: "Using a strong model, given a rubric, to grade or compare outputs where no exact answer exists, such as tone, helpfulness or faithfulness. Judges agree with human raters about as often as humans agree with each other, which made open-ended evaluation cheap and fast. They also have known biases (favoring the first option, longer answers and their own outputs), so a judge has to be checked against human labels before you trust it."
    parents:
      - {id: zero-shot-prompting, rel: applies, why: "Grading is posed as an instructed evaluation task.", src: "Judging LLM-as-a-Judge (Zheng et al. 2023)"}
    maturity: 4
    maturity_note: Standard for open-ended evaluation; reliability caveats well documented.
    date: "2023-03"
    ref: {title: "Judging LLM-as-a-Judge with MT-Bench and Chatbot Arena (Zheng et al.)", arxiv: "2306.05685"}
    examples: [G-Eval, MT-Bench, Ragas, LangSmith evaluators]
    resources:
      - {kind: blog, title: "Using LLM-as-a-Judge For Evaluation: A Complete Guide", by: "Hamel Husain", year: 2024, url: "https://hamel.dev/blog/posts/llm-judge/"}
      - {kind: blog, title: "Evaluating the Effectiveness of LLM-Evaluators (aka LLM-as-Judge)", by: "Eugene Yan", year: 2024, url: "https://eugeneyan.com/writing/llm-evaluators/"}
      - {kind: talk, title: "Who Validates the Validators? Aligning LLM-Assisted Evaluation of LLM Outputs with Human Preferences", by: "Shreya Shankar et al. (ACM SIGCHI)", year: 2024, url: "https://www.youtube.com/watch?v=pkJJNgMYUyM"}
      - {kind: paper, title: "A Survey on LLM-as-a-Judge", by: "Jiawei Gu et al.", year: 2024, url: "https://arxiv.org/abs/2411.15594"}
    status: repaired
  - id: pairwise-preference-eval
    name: Pairwise Preference Evaluation
    aliases: [arena evals, Elo leaderboards]
    region: evaluation-and-observability
    desc: Comparing two anonymous responses side by side, by humans or judges, and aggregating into ratings.
    summary: "Showing two anonymous responses side by side and asking a person or a judge model which is better, then turning many such votes into a ranking with Elo or Bradley-Terry ratings. Relative comparison is easier and more consistent than absolute scoring, which is why arena leaderboards became the public scoreboard for chat models. Votes reward style and length as well as substance."
    parents:
      - {id: "external:elo-rating", rel: applies, why: "Aggregates pairwise votes with Elo/Bradley-Terry ratings.", src: "Chatbot Arena (Chiang et al. 2024)"}
    maturity: 4
    maturity_note: Widely cited; known biases toward style.
    date: "2023-05"
    ref: {title: "Chatbot Arena: An Open Platform for Evaluating LLMs by Human Preference (Chiang et al.)", arxiv: "2403.04132"}
    examples: [LMArena, AlpacaEval]
    resources:
      - {kind: talk, title: "Chatbot Arena: An Open Crowdsourced Platform for Human Feedback on LLMs", by: "Wei-Lin Chiang (The Linux Foundation)", year: 2023, url: "https://www.youtube.com/watch?v=Ktby6XR3xII"}
      - {kind: paper, title: "From Crowdsourced Data to High-Quality Benchmarks: Arena-Hard and BenchBuilder Pipeline", by: "Tianle Li et al.", year: 2024, url: "https://arxiv.org/abs/2406.11939"}
    status: repaired
  - id: rag-evaluation
    name: RAG Evaluation
    aliases: [faithfulness and context-relevance metrics, RAGAS]
    region: evaluation-and-observability
    also: [retrieval-and-knowledge]
    desc: Measuring retrieval quality and grounded answer faithfulness, often with model-graded metrics.
    summary: "Measuring a retrieval-augmented system part by part rather than only end to end: did retrieval find the right passages (context relevance), is the answer supported by them (faithfulness), and does it answer the question (answer relevance). Splitting the score tells you whether to fix chunking and search or the generation prompt. The metrics are mostly model-graded, so they inherit judge reliability problems."
    parents:
      - {id: llm-as-a-judge, rel: specializes, why: "Judges specialized to faithfulness and relevance.", src: "RAGAS (Es et al. 2023)"}
      - {id: retrieval-augmented-generation, rel: applies, why: "Targets RAG pipeline components.", src: "RAGAS (Es et al. 2023)"}
    maturity: 3
    maturity_note: Common practice; metrics still debated.
    date: "2023-09"
    ref: {title: "RAGAS: Automated Evaluation of Retrieval Augmented Generation (Es et al.)", arxiv: "2309.15217"}
    examples: [Ragas, TruLens, DeepEval]
    resources:
      - {kind: docs, title: "RAG Triad", by: "TruLens", year: 2024, url: "https://www.trulens.org/getting_started/core_concepts/rag_triad/"}
      - {kind: blog, title: "Best Practices for LLM Evaluation of RAG Applications", by: "Databricks", year: 2023, url: "https://www.databricks.com/blog/LLM-auto-eval-best-practices-RAG"}
      - {kind: docs, title: "Ragas documentation", by: "Ragas", year: 2024, url: "https://docs.ragas.io/en/stable/"}
      - {kind: paper, title: "Evaluation of Retrieval-Augmented Generation: A Survey", by: "Hao Yu et al.", year: 2024, url: "https://arxiv.org/abs/2405.07437"}
    status: added
  - id: eval-driven-development
    name: Eval-Driven Development
    aliases: [EDD, offline evals, prompt regression testing, assertion-based testing]
    region: evaluation-and-observability
    also: [prompting-and-context-engineering]
    desc: Gating prompt, model, and pipeline changes on eval suites run in CI, the way tests gate code.
    summary: "Treating evals like tests: every change to a prompt, model or pipeline runs against an eval suite, often in CI, before it ships. Suites usually layer cheap deterministic checks (valid JSON, required strings, latency) under model-graded checks for qualities like tone and correctness. It replaces \"vibe checks\" with regression testing for systems whose outputs are never exactly the same twice."
    parents:
