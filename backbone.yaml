  - id: canvas-artifacts
    name: Canvases and Artifacts
    aliases: [side-by-side editing, artifacts, canvas]
    region: ai-product-and-interaction-design
    desc: A persistent, editable work object beside the conversation that the user and model revise together.
    summary: "Moves the thing being made, such as a document, piece of code or small app, out of the chat thread into a persistent pane beside it. You and the model both edit the same object, ask for changes to a selected part, and keep versions, instead of re-generating the whole output in each reply. Claude Artifacts (2024) and ChatGPT Canvas made this standard."
    parents:
