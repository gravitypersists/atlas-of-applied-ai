      - {id: tree-of-thoughts, rel: extends, why: "Includes search-based allocation strategies.", src: "Scaling LLM Test-Time Compute Optimally (Snell et al. 2024)"}
      - {id: process-reward-models, rel: combines, why: "One of its two scaling mechanisms is search guided by a process reward model.", src: "Scaling LLM Test-Time Compute Optimally (Snell et al. 2024)"}
    maturity: 4
    maturity_note: Reshaped how systems trade latency and cost for quality.
    date: "2024-08"
    ref: {title: "Scaling LLM Test-Time Compute Optimally can be More Effective than Scaling Model Parameters (Snell et al.)", arxiv: "2408.03314"}
    examples: [reasoning effort settings, best-of-n with verifiers]
    resources:
      - {kind: talk, title: "Charlie Snell, UC Berkeley. Title: Scaling LLM Test-Time Compute", by: "Charlie Snell (Decentralized AI)", year: 2024, url: "https://www.youtube.com/watch?v=OXwGp9YeuBg"}
