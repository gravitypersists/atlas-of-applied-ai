  # ---- deep dive (2026-10-10) ----
  - id: human-video-pretraining
    name: Human Video Pretraining
    aliases: [R3M, VIP, VC-1, egocentric video pretraining, learning from human video, latent action pretraining]
    region: embodied-ai-and-world-models
    layer: detail
    also: [data-and-synthetic-data]
    desc: Pretraining a robot's visual encoder, or its whole policy, on large collections of first-person video of people handling objects, then fine-tuning on a much smaller amount of robot data.
    summary: "Robot data is scarce, but there are thousands of hours of first-person video of people cooking, cleaning and building things. Pretraining a robot's vision model on that video teaches it what matters in a manipulation scene, such as hands, contact and how objects move, so far less robot data is needed afterwards. Newer work goes further and infers the actions people took in video to pretrain whole policies."
    parents:
      - {id: contrastive-image-text-pretraining, rel: applies, why: "Aligns video frames with language descriptions, CLIP-style, to learn representations for control.", src: "R3M: A Universal Visual Representation for Robot Manipulation (Nair et al. 2022)"}
      - {id: transfer-learning-fine-tuning, rel: applies, why: "Pretrain on human video, then fine-tune on scarce robot demonstrations.", src: "Nair et al. 2022"}
    maturity: 3
    maturity_note: A common way to initialize visual encoders for robot policies.
    date: "2022-03"
    ref: {title: "R3M: A Universal Visual Representation for Robot Manipulation (Nair et al.)", arxiv: "2203.12601"}
    examples: [R3M, VIP, VC-1, Ego4D]
    resources:
      - {kind: talk, title: "Autonomy Talks - Deepak Pathak: Robotics In The Wild: Continual Improvement by Watching & Practicing", by: "Deepak Pathak (Autonomy Talks)", year: 2022, url: "https://www.youtube.com/watch?v=mBkbnQoknr8"}
      - {kind: paper, title: "VIP: Towards Universal Visual Reward and Representation via Value-Implicit Pre-Training", by: "Yecheng Jason Ma et al.", year: 2022, url: "https://arxiv.org/abs/2210.00030"}
