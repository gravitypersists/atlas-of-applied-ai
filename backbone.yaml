# Applied AI Engineering Atlas — backbone v0.2
# Repaired from Gemini backbone run (v0.1, 2026-10-08).
# Schema notes:
#   parents[].id      : a node id in this file, or "external:<name>" for an ancestor not yet anchored
#   parents[].rel     : extends | specializes | combines | applies | replaces | counters
#   maturity          : 1 research, 2 emerging, 3 maturing, 4 established, 5 foundational
#   status            : kept (Gemini, unchanged edges) | repaired (Gemini node, edges/dates/refs fixed) | added
#   ref.arxiv         : arXiv id; ref.url for non-arXiv sources

meta:
  version: "0.2"
  date: "2026-10-08"
  relationship_types:
    extends: adds capability to the parent
    specializes: a narrower variant of the parent
    combines: merges two or more parents (each listed separately)
    applies: uses the parent in a new domain or for a new purpose
    replaces: supersedes the parent for the same job
    counters: a defense or mitigation against the parent (added in v0.2 for attack/defense pairs)
  maturity_tiers:
    1: Research — primarily in papers; few or no production uses
    2: Emerging — early adopters and prototypes; patterns unsettled
    3: Maturing — real production use; best practices still forming
    4: Established — widely used; well-understood tradeoffs
    5: Foundational — assumed infrastructure; rarely discussed as new

regions:
  # ---------------- root disciplines ----------------
  - id: information-retrieval
    kind: root
    name: Information Retrieval
    definition: Finding relevant material in large collections. Origin of ranking, indexing, and question answering over corpora.
  - id: deep-learning-nlp
    kind: root
    name: Deep Learning and NLP
    definition: Neural networks for language — attention, sequence models, pretraining, transfer learning — that produced the transformer and LLMs. Also holds the few architecture choices engineers actually make (MoE, SSMs).
  - id: symbolic-ai-planning
    kind: root
    name: Symbolic AI and Planning
    definition: Explicit representations, search, and formal planning. Ancestor of tool use, planning-with-verifiers, and neuro-symbolic hybrids.
  - id: reinforcement-learning
    kind: root
    name: Reinforcement Learning
    definition: Learning from reward through interaction. Ancestor of every preference- and verifier-based post-training method.
  - id: knowledge-representation
    kind: root
    name: Knowledge Representation
    definition: Structured, machine-usable models of facts and relations — semantic networks, ontologies, knowledge graphs.
  - id: human-computer-interaction
    kind: root
    name: Human-Computer Interaction
    definition: How people work with computational systems. Ancestor of conversational UX, copilots, and human oversight patterns.
  - id: systems-security
    kind: root
    name: Software and Systems Security
    definition: Protecting systems from misuse — isolation, least privilege, injection attacks. Ancestor of most AI security thinking.
  - id: software-engineering
    kind: root
    name: Software Engineering and Operations
    definition: Practices for building and running reliable software — testing, observability, state machines, protocols. Added in v0.2; the ancestor of evals, tracing, workflows, and MCP.

  # ---------------- applied regions ----------------
  - id: inference-and-serving
    kind: applied
    name: Inference and Serving
    title: The Engine Works
    definition: Running models efficiently and cheaply — memory management, batching, quantization, decoding acceleration, caching, and routing between models.
    distinct_from: Treats weights as fixed (vs. Adaptation) and works below the prompt/API layer (vs. Prompting). Decoding-time mechanisms like constrained decoding live here; the practices built on them live in Prompting.
    descends_from: [deep-learning-nlp, software-engineering]
    deep_dive_focus:
      - The 2025–2026 serving stack (disaggregation, KV offload, multi-tier caching) and which techniques became defaults
      - Cost/latency engineering from the application side — routing, cascades, caching APIs
      - Local and on-device inference
  - id: prompting-and-context-engineering
    kind: applied
    name: Prompting and Context Engineering
    title: The Whispering Coast
    definition: Shaping model behavior through inputs — prompt patterns, structured outputs, templates and chains, managing what occupies the context window, and optimizing prompts programmatically.
    distinct_from: No weight updates (vs. Adaptation); operates on text and API payloads rather than tensors (vs. Inference); concerns single calls and context state rather than control flow (vs. Agents).
    descends_from: [deep-learning-nlp, human-computer-interaction]
    deep_dive_focus:
      - The shift from prompt engineering to context engineering, and which techniques it absorbed
      - Programmatic prompt optimization in practice (DSPy, GEPA-style methods, eval-gated prompts)
      - Context management for long-running agents (compaction, note-taking, progressive disclosure)
  - id: retrieval-and-knowledge
    kind: applied
    name: Retrieval and Knowledge
    title: The Archival Reach
    definition: Bringing external knowledge into context — embeddings, RAG and its variants, hybrid search, reranking, graph-based and agentic retrieval.
    distinct_from: Goal is answering from a corpus (vs. Agents, which change state). Agentic RAG lives here when the end goal is information.
    descends_from: [information-retrieval, knowledge-representation, deep-learning-nlp]
    deep_dive_focus:
      - Evidence on when long context replaces retrieval and when it doesn't
      - Agentic search (grep/filesystem-style retrieval by agents) vs. index-based RAG
      - Graph-based retrieval beyond GraphRAG, and its real production footprint
  - id: agents-and-orchestration
    kind: applied
    name: Agents and Orchestration
    title: The Free Cities
    definition: Models acting in environments — tool use, agent loops, workflows vs. autonomous agents, multi-agent systems, memory, protocols, and coding, computer-use, and research agents.
    distinct_from: Changes environment state or runs multi-step control flow (vs. Retrieval, which reads). Reasoning techniques that don't act live in Planning and Reasoning.
    descends_from: [symbolic-ai-planning, software-engineering, deep-learning-nlp]
    deep_dive_focus:
      - Tool-use lineage from MRKL and Toolformer through function calling to MCP and skills
      - Agent harness design (loops, subagents, memory, long-horizon task management)
      - Where production systems sit on the workflow-to-autonomy spectrum in 2026
  - id: planning-and-reasoning
    kind: applied
    name: Planning and Reasoning
    title: The Peninsula of Long Thought
    definition: Structured problem solving — the chain-of-thought lineage, search over reasoning, test-time compute and reasoning models, self-reflection, and neuro-symbolic planning with external solvers and verifiers.
    distinct_from: Concerns how a solution is derived, not whether actions are taken (vs. Agents). Training methods that produce reasoning (RLVR, GRPO) live in Adaptation.
    descends_from: [symbolic-ai-planning, deep-learning-nlp, reinforcement-learning]
    deep_dive_focus:
      - Neuro-symbolic planning — LLM+P, LLM-Modulo, LLM-generated PDDL, verifier-in-the-loop systems
      - Test-time compute strategies and when they pay for themselves
      - Faithfulness of reasoning traces and what that means for engineers
  - id: adaptation-and-post-training
    kind: applied
    name: Adaptation and Post-Training
    title: The Tempering Grounds
    definition: Changing weights after pretraining — supervised fine-tuning, parameter-efficient methods, preference optimization, RL from verifiable rewards, distillation.
    distinct_from: Always involves gradient updates (vs. Prompting). Dataset construction lives in Data.
    descends_from: [deep-learning-nlp, reinforcement-learning]
    deep_dive_focus:
      - The post-DPO and post-R1 landscape — which preference and RL methods practitioners actually use
      - Fine-tuning for application teams (when to fine-tune vs. prompt vs. retrieve)
      - Distillation of frontier capabilities into small models
  - id: data-and-synthetic-data
    kind: applied
    name: Data and Synthetic Data
    title: The Quarries
    definition: Creating, curating, and cleaning data for training, retrieval, and evaluation — synthetic generation, deduplication, decontamination, quality filtering, model-assisted annotation.
    distinct_from: Produces datasets (vs. Adaptation, which consumes them; vs. Evaluation, which uses them to measure).
    descends_from: [deep-learning-nlp, information-retrieval]
    deep_dive_focus:
      - Synthetic data at scale — what works, model collapse concerns, and verification
      - Environments and task generation for agentic RL
      - Data for application teams — eval sets, golden sets, labeling with LLMs
  - id: evaluation-and-observability
    kind: applied
    name: Evaluation and Observability
    title: The Watchtowers
    definition: Measuring and debugging AI systems — benchmarks, LLM-as-judge, eval-driven development, RAG and agent evals, tracing, and production monitoring.
    distinct_from: Measures and observes; does not change behavior. Reward models used for training or search live in Reasoning or Adaptation.
    descends_from: [software-engineering, deep-learning-nlp]
    deep_dive_focus:
      - Agent evaluation (trajectories, environments, SWE-bench-style harnesses)
      - Judge reliability and calibration; human vs. model graders
      - Observability standards (OpenTelemetry GenAI conventions) and online evals
  - id: safety-security-and-governance
    kind: applied
    name: Safety, Security and Governance
    title: The Bulwark
    definition: Keeping AI systems from causing harm — prompt injection and jailbreaks, guardrails and defenses, red teaming, sandboxing and permissions, interpretability as a control tool, documentation and governance.
    distinct_from: Primary purpose is risk reduction. Uses techniques from Prompting (guardrails) and Evaluation (red teaming) but is defined by intent.
    descends_from: [systems-security, deep-learning-nlp, human-computer-interaction]
    deep_dive_focus:
      - Prompt injection in agentic systems — attack taxonomy and the defenses that hold up
      - Agent permissions, sandboxing, and least privilege for tools and MCP servers
      - Interpretability methods that have reached engineering use
  - id: ai-product-and-interaction-design
    kind: applied
    name: AI Product and Interaction Design
    title: The Agora
    definition: How AI shows up for users — chat and copilot patterns, streaming, citations and grounding, human-in-the-loop approval, generative UI and canvases, trust and error recovery.
    distinct_from: Defined by the human-facing experience, not the backend mechanism.
    descends_from: [human-computer-interaction]
    deep_dive_focus:
      - Interaction patterns for agents (delegation, background work, approvals, handoff)
      - Trust calibration, uncertainty display, and error recovery
      - Evidence from HCI research on what actually helps users
  - id: multimodal-applied
    kind: applied
    name: Multimodal
    title: The Painted Isles
    definition: Vision, speech, documents, and generated media as used in applications — vision-language models, realtime voice, document understanding, image and video generation.
    distinct_from: Covers modality-specific engineering; general orchestration of multimodal agents lives in Agents.
    descends_from: [deep-learning-nlp]
    deep_dive_focus:
      - Document understanding pipelines (VLM parsing vs. OCR) and visual retrieval
      - Realtime voice agents — latency, turn-taking, interruption
      - Video understanding and generation as application building blocks

boundary_rules:
  - {concept: ReAct, home: agents-and-orchestration, rule: "Defined by acting in an environment via tools → Agents."}
  - {concept: Tree of Thoughts / tree search, home: planning-and-reasoning, rule: "Searches over generated reasoning paths without changing the world → Reasoning."}
  - {concept: Reflexion / self-reflection, home: planning-and-reasoning, rule: "Improves a solution via critique, even when the loop runs in an agent → Reasoning."}
  - {concept: Structured outputs, home: prompting-and-context-engineering, rule: "The practice lives in Prompting; the decoding mechanism (constrained decoding) lives in Inference."}
  - {concept: Agentic RAG / deep research, home: "retrieval-and-knowledge (agentic RAG); agents-and-orchestration (deep research agents)", rule: "Information goal over a corpus → Retrieval. Open-ended, multi-source research as a product capability → Agents."}
  - {concept: Agent memory, home: agents-and-orchestration, rule: "Memory that persists across agent sessions → Agents, even when implemented with retrieval."}
  - {concept: Prompt caching, home: inference-and-serving, rule: "KV reuse is an infrastructure optimization regardless of how APIs expose it."}
  - {concept: Function calling, home: agents-and-orchestration, rule: "The primitive for requesting external execution → Agents."}
  - {concept: MCP / Agent skills, home: agents-and-orchestration, rule: "Protocols and packaging for capabilities agents use → Agents."}
  - {concept: Self-instruct / synthetic data, home: data-and-synthetic-data, rule: "Producing the dataset → Data; training on it → Adaptation."}
  - {concept: Reasoning distillation, home: adaptation-and-post-training, rule: "The act of training a student → Adaptation; generating the traces → Data."}
  - {concept: DSPy / prompt optimization, home: prompting-and-context-engineering, rule: "No gradient updates to model weights → Prompting."}
  - {concept: Process reward models, home: planning-and-reasoning, rule: "Primarily used to score steps for search and verification → Reasoning (secondary: Adaptation)."}
  - {concept: RLVR / GRPO, home: adaptation-and-post-training, rule: "Weight-updating methods → Adaptation, even when the goal is reasoning."}
  - {concept: Reranking, home: retrieval-and-knowledge, rule: "Scoring to order results for generation → Retrieval."}
  - {concept: Guardrails / injection defenses, home: safety-security-and-governance, rule: "Components whose purpose is blocking harm → Safety."}
  - {concept: Agent sandboxing and permissions, home: safety-security-and-governance, rule: "Mechanisms whose purpose is limiting blast radius → Safety (moved from Agents in v0.2)."}
  - {concept: Interpretability / RepE, home: safety-security-and-governance, rule: "Used by engineers to detect and steer behavior → Safety (pure science stays offshore at maturity 1)."}
  - {concept: LLM-as-judge, home: evaluation-and-observability, rule: "Deployed to measure → Evaluation, though implemented as a prompt."}
  - {concept: Human-in-the-loop approval, home: ai-product-and-interaction-design, rule: "Defined by the human decision point → Product (secondary: Agents)."}
  - {concept: Architectures (MoE, SSMs), home: deep-learning-nlp, rule: "Model internals stay in the root unless engineers configure them at serving time."}

nodes:
  # ======================= ROOTS: information-retrieval =======================
  - id: bm25
    name: BM25
    aliases: [Okapi BM25, sparse retrieval, TF-IDF ranking]
    region: information-retrieval
    desc: Probabilistic ranking function scoring documents by term frequency and inverse document frequency; the standard lexical search baseline.
    parents: []
    maturity: 5
    maturity_note: Decades of deployment; default lexical scorer in search engines.
    date: "1994"
    ref: {title: "Okapi at TREC-3 (Robertson et al.)"}
    examples: [Lucene, Elasticsearch, OpenSearch]
    status: kept
  - id: approximate-nearest-neighbor-search
    name: Approximate Nearest Neighbor Search
    aliases: [ANN, HNSW, vector indexing]
    region: information-retrieval
    desc: Index structures that find near neighbors in high-dimensional vector spaces quickly at slight accuracy cost; the engine inside vector databases.
    parents: []
    maturity: 5
    maturity_note: Standard infrastructure in every vector store.
    date: "2016-03"
    ref: {title: "Efficient and robust approximate nearest neighbor search using Hierarchical Navigable Small World graphs (Malkov & Yashunin)", arxiv: "1603.09320"}
    examples: [FAISS, hnswlib, pgvector, Qdrant]
    status: added
  - id: open-domain-qa
    name: Open-Domain Question Answering
    aliases: [retriever-reader QA, DrQA]
    region: information-retrieval
    desc: Answering questions by retrieving passages from a large corpus and reading them with a neural model; the direct architectural ancestor of RAG.
    parents:
      - {id: bm25, rel: applies, why: "Early systems used lexical retrieval to select passages for a neural reader.", src: "Reading Wikipedia to Answer Open-Domain Questions (Chen et al. 2017)"}
    maturity: 4
    maturity_note: Mature research paradigm, largely absorbed into RAG.
    date: "2017-04"
    ref: {title: "Reading Wikipedia to Answer Open-Domain Questions (Chen et al.)", arxiv: "1704.00051"}
    examples: [DrQA]
    status: added

  # ======================= ROOTS: deep-learning-nlp =======================
  - id: attention-mechanism
    name: Attention Mechanism
    aliases: [neural attention]
    region: deep-learning-nlp
    desc: Lets a network weight different parts of its input dynamically when producing each output.
    parents: []
    maturity: 5
    maturity_note: Prerequisite for the transformer.
    date: "2014-09"
    ref: {title: "Neural Machine Translation by Jointly Learning to Align and Translate (Bahdanau et al.)", arxiv: "1409.0473"}
    examples: [seq2seq with attention]
    status: added
  - id: sequence-to-sequence-learning
    name: Sequence-to-Sequence Learning
    aliases: [seq2seq, encoder-decoder]
    region: deep-learning-nlp
    desc: Training networks to map an input sequence to an output sequence end to end.
    parents: []
    maturity: 5
    maturity_note: Foundational framing for translation and generation.
    date: "2014-09"
    ref: {title: "Sequence to Sequence Learning with Neural Networks (Sutskever et al.)", arxiv: "1409.3215"}
    examples: [T5, BART]
    status: kept
  - id: transformer-architecture
    name: Transformer
    aliases: [transformers]
    region: deep-learning-nlp
    desc: Architecture built entirely on self-attention, dispensing with recurrence; the basis of all modern LLMs.
    parents:
      - {id: attention-mechanism, rel: extends, why: "Uses self-attention as the sole sequence-mixing operation.", src: "Attention Is All You Need (2017)"}
      - {id: sequence-to-sequence-learning, rel: replaces, why: "Replaces recurrent encoder-decoders for sequence transduction.", src: "Attention Is All You Need (2017)"}
    maturity: 5
    maturity_note: Universal architecture for foundation models.
    date: "2017-06"
    ref: {title: "Attention Is All You Need (Vaswani et al.)", arxiv: "1706.03762"}
    examples: [GPT, BERT, Llama]
    status: repaired
  - id: pretrained-language-models
    name: Pretrained Language Models
    aliases: [LLMs, foundation models, generative pretraining]
    region: deep-learning-nlp
    desc: Transformers pretrained on large text corpora with a language-modeling objective, then used directly or adapted; the base every applied technique builds on.
    parents:
      - {id: transformer-architecture, rel: applies, why: "Applies the transformer to large-scale unsupervised language modeling.", src: "Improving Language Understanding by Generative Pre-Training (Radford et al. 2018)"}
    maturity: 5
    maturity_note: The substrate of applied AI engineering.
    date: "2018-06"
    ref: {title: "Improving Language Understanding by Generative Pre-Training (Radford et al.)", url: "https://cdn.openai.com/research-covers/language-unsupervised/language_understanding_paper.pdf"}
    examples: [GPT series, Claude, Gemini, Llama]
    status: added
  - id: transfer-learning-fine-tuning
    name: Transfer Learning and Fine-Tuning
    aliases: [fine-tuning, ULMFiT]
    region: deep-learning-nlp
    desc: Adapting a model pretrained on one task or corpus to a new task by continuing training on targeted data.
    parents: []
    maturity: 5
    maturity_note: Standard practice across deep learning.
    date: "2018-01"
    ref: {title: "Universal Language Model Fine-tuning for Text Classification (Howard & Ruder)", arxiv: "1801.06146"}
    examples: [Hugging Face Trainer]
    status: added
  - id: knowledge-distillation
    name: Knowledge Distillation
    aliases: [teacher-student training]
    region: deep-learning-nlp
    desc: Training a smaller student model to match the outputs of a larger teacher.
    parents: []
    maturity: 5
    maturity_note: Long-established compression technique.
    date: "2015-03"
    ref: {title: "Distilling the Knowledge in a Neural Network (Hinton et al.)", arxiv: "1503.02531"}
    examples: [DistilBERT]
    status: added
  - id: mixture-of-experts
    name: Mixture of Experts
    aliases: [MoE, sparse MoE]
    region: deep-learning-nlp
    also: [inference-and-serving]
    desc: Replaces dense layers with many expert subnetworks and a router that activates a few per token, scaling parameters without proportional compute.
    parents:
      - {id: "external:adaptive-mixtures-of-local-experts", rel: extends, why: "Scales the 1991 mixture-of-experts idea with sparse gating inside deep networks.", src: "Outrageously Large Neural Networks (Shazeer et al. 2017)"}
    maturity: 4
    maturity_note: Standard approach for frontier and large open models; has serving implications.
    date: "2017-01"
    ref: {title: "Outrageously Large Neural Networks: The Sparsely-Gated Mixture-of-Experts Layer (Shazeer et al.)", arxiv: "1701.06538"}
    examples: [Mixtral, DeepSeek-V3, Qwen MoE]
    status: added
  - id: state-space-models
    name: State-Space Models
    aliases: [SSMs, S4, Mamba, linear-time sequence models]
    region: deep-learning-nlp
    desc: Sequence models derived from control theory with linear-time scaling in sequence length, used alone or in hybrids with attention.
    parents:
      - {id: "external:control-theory-state-space", rel: applies, why: "Turns continuous state-space equations into trainable sequence layers.", src: "Efficiently Modeling Long Sequences with Structured State Spaces (Gu et al. 2021)"}
    maturity: 3
    maturity_note: Shipping in hybrid models; not yet a default choice.
    date: "2021-10"
    ref: {title: "Efficiently Modeling Long Sequences with Structured State Spaces (Gu et al.)", arxiv: "2111.00396"}
    examples: [Mamba, Jamba, Nemotron-H]
    status: added

  # ======================= ROOTS: symbolic-ai-planning =======================
  - id: heuristic-search
    name: Heuristic Search
    aliases: [A*, best-first search, state-space search]
    region: symbolic-ai-planning
    desc: Searching a space of states guided by an estimate of distance to the goal.
    parents: []
    maturity: 5
    maturity_note: Textbook foundation of AI planning.
    date: "1968"
    ref: {title: "A Formal Basis for the Heuristic Determination of Minimum Cost Paths (Hart, Nilsson & Raphael)"}
    examples: [A*, MCTS variants]
    status: added
  - id: strips-planning
    name: STRIPS Planning
    aliases: [classical planning]
    region: symbolic-ai-planning
    desc: Planning with explicit states, goals, and actions defined by preconditions and effects.
    parents:
      - {id: heuristic-search, rel: applies, why: "Plans are found by searching the state space defined by action models.", src: "STRIPS (Fikes & Nilsson 1971)"}
    maturity: 5
    maturity_note: Historical foundation of symbolic planning.
    date: "1971"
    ref: {title: "STRIPS: A New Approach to the Application of Theorem Proving to Problem Solving (Fikes & Nilsson)"}
    examples: [classical planners]
    status: repaired
  - id: pddl
    name: PDDL
    aliases: [Planning Domain Definition Language]
    region: symbolic-ai-planning
    desc: Standard language for describing planning domains and problems so general-purpose solvers can find plans.
    parents:
      - {id: strips-planning, rel: extends, why: "Generalizes STRIPS-style action descriptions into a shared standard.", src: "PDDL — The Planning Domain Definition Language (McDermott et al. 1998)"}
    maturity: 4
    maturity_note: Established standard; the interface for LLM+planner hybrids.
    date: "1998"
    ref: {title: "PDDL — The Planning Domain Definition Language (McDermott et al.)"}
    examples: [Fast Downward, VAL]
    status: repaired
  - id: expert-systems
    name: Expert Systems
    aliases: [rule-based systems, production systems]
    region: symbolic-ai-planning
    desc: Systems that encode domain expertise as explicit rules and route problems through them; an ancestor of modular neuro-symbolic architectures.
    parents: []
    maturity: 5
    maturity_note: Historical; ideas persist in routing and tool modules.
    date: "1976"
    ref: {title: "Computer-Based Medical Consultations: MYCIN (Shortliffe)"}
    examples: [MYCIN, CLIPS]
    status: added

  # ======================= ROOTS: reinforcement-learning =======================
  - id: markov-decision-process
    name: Markov Decision Process
    aliases: [MDP]
    region: reinforcement-learning
    desc: Formal model of sequential decision making with states, actions, transitions, and rewards.
    parents: []
    maturity: 5
    maturity_note: Theoretical foundation of RL.
    date: "1957"
    ref: {title: "A Markovian Decision Process (Bellman)"}
    examples: [Gymnasium environments]
    status: kept
  - id: policy-gradient-methods
    name: Policy Gradient Methods
    aliases: [REINFORCE, actor-critic]
    region: reinforcement-learning
    desc: Optimizing a parameterized policy directly by gradient ascent on expected reward.
    parents:
      - {id: markov-decision-process, rel: applies, why: "Optimizes policies defined over MDPs.", src: "Policy Gradient Methods for RL with Function Approximation (Sutton et al. 1999)"}
    maturity: 5
    maturity_note: Mathematical basis of LLM RL fine-tuning.
    date: "1999"
    ref: {title: "Policy Gradient Methods for Reinforcement Learning with Function Approximation (Sutton et al.)"}
    examples: [Stable Baselines3, TRL]
    status: repaired
  - id: ppo
    name: Proximal Policy Optimization
    aliases: [PPO]
    region: reinforcement-learning
    desc: A policy-gradient algorithm that clips updates to stay near the previous policy, giving stable training.
    parents:
      - {id: policy-gradient-methods, rel: specializes, why: "A clipped-objective policy-gradient method.", src: "Proximal Policy Optimization Algorithms (Schulman et al. 2017)"}
    maturity: 5
    maturity_note: Default RL optimizer behind classic RLHF.
    date: "2017-07"
    ref: {title: "Proximal Policy Optimization Algorithms (Schulman et al.)", arxiv: "1707.06347"}
    examples: [TRL PPOTrainer, OpenRLHF]
    status: added

  # ======================= ROOTS: knowledge-representation =======================
  - id: semantic-networks
    name: Semantic Networks
    aliases: [ontologies, frames]
    region: knowledge-representation
    desc: Representing concepts as nodes and relations as labeled edges.
    parents: []
    maturity: 5
    maturity_note: Historical foundation of graph-structured knowledge.
    date: "1968"
    ref: {title: "Semantic Memory (Quillian)"}
    examples: [WordNet, OWL ontologies]
    status: added
  - id: knowledge-graphs
    name: Knowledge Graphs
    aliases: [property graphs]
    region: knowledge-representation
    desc: Large graphs of entities and typed relationships used to store and query structured knowledge.
    parents:
      - {id: semantic-networks, rel: extends, why: "Scales semantic-network ideas to web-scale entity graphs.", src: "Introducing the Knowledge Graph (Google 2012)"}
    maturity: 5
    maturity_note: Established enterprise and web infrastructure.
    date: "2012-05"
    ref: {title: "Introducing the Knowledge Graph: things, not strings (Singhal, Google)"}
    examples: [Wikidata, Neo4j]
    status: repaired

  # ======================= ROOTS: human-computer-interaction =======================
  - id: conversational-agents
    name: Conversational Agents
    aliases: [chatbots, dialogue systems]
    region: human-computer-interaction
    desc: Programs that interact with people through natural-language dialogue.
    parents: []
    maturity: 5
    maturity_note: Long-standing interaction paradigm.
    date: "1966"
    ref: {title: "ELIZA — A Computer Program for the Study of Natural Language Communication (Weizenbaum)"}
    examples: [ELIZA, voice assistants]
    status: added
  - id: direct-manipulation
    name: Direct Manipulation
    aliases: [WYSIWYG]
    region: human-computer-interaction
    desc: Interfaces where users act on visible objects with immediate, reversible feedback.
    parents: []
