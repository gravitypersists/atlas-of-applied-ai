      - {kind: paper, title: "A Survey on Data Selection for Language Models", by: "Alon Albalak et al.", year: 2024, url: "https://arxiv.org/abs/2402.16827"}
    status: added
  - id: agent-trajectory-synthesis
    name: Agent Trajectory Synthesis
    aliases: [agent RL environments, SWE-Gym, trajectory harvesting]
    region: data-and-synthetic-data
    layer: detail
    also: [agents-and-orchestration, adaptation-and-post-training]
    desc: Building sandboxed task environments with automatic checks, running agents in them, and keeping the verified trajectories as training data.
    summary: "Agents learn from multi-step examples, not single question-answer pairs. This builds sandboxed tasks with an automatic check, such as a real repository with an issue and unit tests, runs agents on them, and records every command, file read and edit. Runs that pass the check become fine-tuning data or reward signal for reinforcement learning, without needing a judge model."
