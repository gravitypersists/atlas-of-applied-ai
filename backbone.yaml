  - id: ai-risk-management
    name: AI Risk Management Frameworks
    aliases: [NIST AI RMF, AI risk assessment, ISO/IEC 23894]
    region: governance-and-compliance
    desc: A repeatable process for finding, measuring and managing the risks of an AI system across its life cycle, organized in NIST's framework as govern, map, measure and manage.
    summary: "A structured way to find and handle what could go wrong with an AI system, from design through retirement. NIST's framework splits the work into four functions: govern (who is accountable), map (where the system is used and who it affects), measure (test for bias, security and reliability problems) and manage (put controls in place and monitor them). It is voluntary but widely used as the common vocabulary for AI risk programs."
    parents:
      - {id: "external:enterprise-risk-management", rel: applies, why: "Brings general risk management practice (ISO 31000) to AI-specific harms such as bias, misuse and unreliability.", src: "NIST AI RMF 1.0 (2023)"}
      - {id: model-documentation, rel: extends, why: "Turns one-off documentation into an ongoing cycle in which documented risks are measured and managed.", src: "NIST AI RMF 1.0, Map and Measure functions"}
    maturity: 3
    maturity_note: The common reference for enterprise AI risk programs and the frame many teams map regulation onto; practice varies widely.
    date: "2023-01"
    ref: {title: "Artificial Intelligence Risk Management Framework (AI RMF 1.0), NIST AI 100-1", url: "https://www.nist.gov/publications/artificial-intelligence-risk-management-framework-ai-rmf-10"}
    examples: [NIST AI RMF, NIST Generative AI Profile, ISO/IEC 23894]
    resources:
      - {kind: docs, title: "NIST AI RMF Playbook", by: "NIST", year: 2023, url: "https://airc.nist.gov/airmf-resources/playbook/"}
      - {kind: docs, title: "Artificial Intelligence Risk Management Framework: Generative Artificial Intelligence Profile (NIST AI 600-1)", by: "NIST", year: 2024, url: "https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.600-1.pdf"}
    status: added
  - id: ai-management-systems
    name: AI Management Systems (ISO/IEC 42001)
    aliases: [ISO 42001, AIMS, AI management system certification]
    region: governance-and-compliance
    layer: detail
    desc: A certifiable standard for how an organization runs AI responsibly — policies, roles, risk and impact assessments, and controls — audited the same way as information security management.
    summary: "An international standard for running AI responsibly across an organization, which outside auditors can certify. Like ISO 27001 for information security, it asks for policies, assigned roles, risk and impact assessments, and a set of controls (Annex A) covering data quality, life-cycle checks and logging. Companies use the certificate to answer customer and procurement due diligence."
    parents:
      - {id: ai-risk-management, rel: extends, why: "Embeds AI risk management in an auditable organizational management system.", src: "ISO/IEC 42001:2023"}
      - {id: "external:iso-27001-information-security-management", rel: applies, why: "Reuses the management-system structure and certification model of ISO/IEC 27001.", src: "ISO/IEC 42001:2023"}
    maturity: 3
    maturity_note: Published in late 2023; major AI vendors (AWS, Anthropic and others) are certified and enterprise buyers increasingly ask for it.
    date: "2023-12"
    ref: {title: "ISO/IEC 42001:2023 Information technology — Artificial intelligence — Management system", url: "https://www.iso.org/standard/42001"}
    examples: [ISO/IEC 42001 certification, ISO/IEC 42005 impact assessment]
    resources:
      - {kind: blog, title: "AI lifecycle risk management: ISO/IEC 42001:2023 for AI governance", by: "AWS Security Blog", year: 2025, url: "https://aws.amazon.com/blogs/security/ai-lifecycle-risk-management-iso-iec-420012023-for-ai-governance/"}
      - {kind: blog, title: "Anthropic achieves ISO 42001 certification for responsible AI", by: "Anthropic", year: 2025, url: "https://www.anthropic.com/news/anthropic-achieves-iso-42001-certification-for-responsible-ai"}
    status: added
  - id: eu-ai-act
    name: EU AI Act
    aliases: [Regulation (EU) 2024/1689, risk-based AI regulation, AI Act]
    region: governance-and-compliance
    desc: The EU regulation that sorts AI systems by risk — banned practices, high-risk systems with documentation, risk management and oversight duties, and transparency rules — with separate obligations for providers of general-purpose AI models.
    summary: "The European Union's AI law. It bans a few practices outright, puts strict documentation, risk management, data and human-oversight duties on high-risk systems such as those used in hiring or credit, and requires chatbots and generated media to be disclosed. Providers of general-purpose models have their own obligations, with more for the largest models. Obligations phase in between 2025 and 2027 and apply to anyone serving users in the EU."
    parents:
      - {id: ai-risk-management, rel: applies, why: "Makes a life-cycle risk management system a legal duty for high-risk AI.", src: "Regulation (EU) 2024/1689, Art. 9"}
      - {id: model-documentation, rel: applies, why: "Requires technical documentation for high-risk systems and general-purpose models.", src: "Regulation (EU) 2024/1689, Art. 11 and 53"}
      - {id: "external:gdpr", rel: extends, why: "Follows GDPR's model of EU-wide product regulation that reaches anyone serving EU users.", src: "Regulation (EU) 2024/1689"}
    maturity: 3
    maturity_note: In force since August 2024, with obligations phasing in from 2025 to 2027; the most common compliance driver for teams selling into the EU.
    date: "2024-08"
    ref: {title: "AI Act (European Commission overview of Regulation (EU) 2024/1689)", url: "https://digital-strategy.ec.europa.eu/en/policies/regulatory-framework-ai"}
    examples: [EU AI Act, Colorado AI Act, California SB 53]
    resources:
      - {kind: docs, title: "High-level summary of the AI Act", by: "Future of Life Institute", year: 2024, url: "https://artificialintelligenceact.eu/high-level-summary/"}
      - {kind: docs, title: "AI Act implementation timeline", by: "Future of Life Institute", year: 2024, url: "https://artificialintelligenceact.eu/implementation-timeline/"}
      - {kind: docs, title: "AI Act Explorer", by: "Future of Life Institute", year: 2024, url: "https://artificialintelligenceact.eu/ai-act-explorer/"}
    status: added
  - id: gpai-code-of-practice
    name: General-Purpose AI Code of Practice
    aliases: [GPAI Code of Practice, EU code of practice for general-purpose AI]
    region: governance-and-compliance
    layer: detail
    desc: A voluntary EU code that spells out how providers of general-purpose models can meet the AI Act's transparency, copyright and, for the most capable models, safety and security obligations.
    summary: "A voluntary EU code that tells providers of general-purpose models how to meet the AI Act in practice. Its three chapters cover transparency (a standard model documentation form), copyright (honoring robots.txt and other machine-readable opt-outs when crawling) and, for the most capable models, safety and security: a risk framework, evaluations, incident reporting and cybersecurity. Signing it is the easiest way to show compliance."
    parents:
      - {id: eu-ai-act, rel: specializes, why: "Turns the Act's general-purpose model obligations into concrete commitments.", src: "General-Purpose AI Code of Practice (European Commission, 2025)"}
      - {id: frontier-safety-frameworks, rel: applies, why: "Its Safety and Security chapter asks providers of systemic-risk models for a framework of the kind frontier labs already published.", src: "General-Purpose AI Code of Practice, Safety and Security chapter"}
      - {id: training-data-licensing, rel: applies, why: "Its Copyright chapter asks providers to respect machine-readable opt-outs when crawling training data.", src: "General-Purpose AI Code of Practice, Copyright chapter"}
    maturity: 2
    maturity_note: Published July 2025 and signed by most large model providers; how the AI Office enforces it is still settling.
    date: "2025-07"
    ref: {title: "The General-Purpose AI Code of Practice (European Commission)", url: "https://digital-strategy.ec.europa.eu/en/policies/contents-code-gpai"}
    examples: [Transparency chapter model documentation form, Copyright chapter, Safety and Security chapter]
    resources:
      - {kind: docs, title: "Overview of the Code of Practice", by: "Future of Life Institute", year: 2025, url: "https://artificialintelligenceact.eu/code-of-practice-overview/"}
      - {kind: docs, title: "Guidelines for providers of general-purpose AI models", by: "European Commission", year: 2025, url: "https://digital-strategy.ec.europa.eu/en/policies/guidelines-gpai-providers"}
      - {kind: blog, title: "EU's General-Purpose AI Obligations Are Now in Force, With New Guidance", by: "Skadden", year: 2025, url: "https://www.skadden.com/insights/publications/2025/08/eus-general-purpose-ai-obligations"}
    status: added
  - id: dangerous-capability-evals
    name: Dangerous Capability Evaluations
    aliases: [frontier risk evals, extreme-risk evaluation, CBRN and cyber evals, uplift studies]
    region: governance-and-compliance
    also: [evaluation-and-observability, safety-and-security]
    desc: Tests of whether a model can meaningfully help with severe harms — bioweapons, cyberattacks, autonomous replication, undermining oversight — run before release to decide what safeguards it needs.
    summary: "Tests of whether a model could meaningfully help someone cause severe harm, such as building a biological weapon or breaking into hardened computer systems, or could act on its own in dangerous ways, such as copying itself or evading oversight. Many measure uplift: how much better a person does with the model than without it. Labs and government institutes run them before major releases, and the results decide which safeguards a model needs."
    parents:
      - {id: red-teaming, rel: extends, why: "Moves from finding individual harmful outputs to measuring whether a capability crosses a risk threshold.", src: "Model evaluation for extreme risks (Shevlane et al. 2023)"}
      - {id: capability-benchmarks, rel: applies, why: "Uses benchmark-style task suites, aimed at dangerous capabilities rather than general skill.", src: "Shevlane et al. 2023"}
    maturity: 3
    maturity_note: Run by every frontier lab and by government AI safety institutes before major releases; methods and thresholds are not standardized.
    date: "2023-05"
    ref: {title: "Model evaluation for extreme risks (Shevlane et al.)", arxiv: "2305.15324"}
    examples: [UK AISI pre-deployment testing, METR autonomy evals, system card CBRN and cyber sections]
    resources:
      - {kind: talk, title: "Dangerous Capability Evals: Basis for Frontier Safety", by: "Mary Phuong (Google DeepMind, FAR.AI)", year: 2024, url: "https://www.youtube.com/watch?v=pO8IcIqhHuk"}
      - {kind: paper, title: "Evaluating Frontier Models for Dangerous Capabilities", by: "Mary Phuong et al.", year: 2024, url: "https://arxiv.org/abs/2403.13793"}
      - {kind: paper, title: "Measuring AI Ability to Complete Long Software Tasks", by: "Thomas Kwa et al. (METR)", year: 2025, url: "https://arxiv.org/abs/2503.14499"}
      - {kind: code, title: "Inspect", by: "UK AI Security Institute", year: 2024, url: "https://inspect.aisi.org.uk/"}
    status: added
  - id: frontier-safety-frameworks
    name: Frontier Safety Frameworks
    aliases: [responsible scaling policies, RSP, Preparedness Framework, if-then commitments]
    region: governance-and-compliance
    also: [safety-and-security]
    desc: A lab's published commitment that sets capability thresholds, says how they are measured, and names the safeguards required before a model that crosses one can be trained further or deployed.
    summary: "A frontier lab's published if-then commitment: if testing shows a model has crossed a defined danger threshold, then specific security and deployment safeguards must be in place before it is trained further or released. Anthropic's AI Safety Levels, OpenAI's High and Critical tiers and Google DeepMind's Critical Capability Levels all work this way. Critics note that the labs write and enforce these rules themselves."
    parents:
      - {id: dangerous-capability-evals, rel: applies, why: "Uses dangerous-capability evals to decide when a threshold has been crossed.", src: "Anthropic's Responsible Scaling Policy (2023)"}
      - {id: ai-risk-management, rel: specializes, why: "Risk management narrowed to severe, capability-driven risks from frontier models.", src: "Anthropic RSP; OpenAI Preparedness Framework (2023)"}
    maturity: 3
    maturity_note: Published by every major frontier lab and referenced by law (EU Code of Practice, California SB 53). In August 2026 OpenAI paused RL training for two weeks after it could not rule out that Astra had reached its framework's Critical cyber threshold, the first publicly reported trigger of this kind.
    date: "2023-09"
    ref: {title: "Introducing Anthropic's Responsible Scaling Policy", url: "https://www.anthropic.com/news/anthropics-responsible-scaling-policy"}
    examples: [Anthropic Responsible Scaling Policy, OpenAI Preparedness Framework, Google DeepMind Frontier Safety Framework]
    resources:
      - {kind: docs, title: "Anthropic's Responsible Scaling Policy (current version and history)", by: "Anthropic", year: 2026, url: "https://www.anthropic.com/responsible-scaling-policy"}
      - {kind: docs, title: "Preparedness Framework (Version 2)", by: "OpenAI", year: 2025, url: "https://cdn.openai.com/pdf/18a02b5d-6b67-4cec-ab64-68cdfbddebcd/preparedness-framework-v2.pdf"}
      - {kind: blog, title: "Introducing the Frontier Safety Framework", by: "Google DeepMind", year: 2024, url: "https://deepmind.google/blog/introducing-the-frontier-safety-framework/"}
      - {kind: blog, title: "Common Elements of Frontier AI Safety Policies", by: "METR", year: 2025, url: "https://metr.org/common-elements"}
      - {kind: docs, title: "GPT-6 Astra System Card", by: "OpenAI", year: 2026, url: "https://deploymentsafety.openai.com/gpt-6-astra"}
    status: added
  - id: content-provenance
    name: Content Provenance and Credentials
    aliases: [C2PA, Content Credentials, provenance metadata]
    region: governance-and-compliance
    also: [multimodal-applied]
    desc: Attaching cryptographically signed metadata to media that records who or what made it and how it was edited, so viewers can check whether an image, video or audio clip was generated by AI.
    summary: "A signed record attached to an image, video or audio file that says who or what made it and how it was edited. The C2PA standard bundles these claims into a manifest, signs it with a certificate and binds it to the file's exact bytes, so any viewer can check it offline. Its weakness is that many tools silently strip the metadata, so it is usually paired with invisible watermarks that survive re-encoding."
    parents:
      - {id: "external:digital-signatures", rel: applies, why: "Binds a signed manifest of origin and edit history to the media file.", src: "C2PA Technical Specification 1.0"}
    maturity: 3
    maturity_note: Built into major image generators, cameras and some platforms; metadata is easily stripped, so it is paired with watermarks.
    date: "2022-01"
    ref: {title: "C2PA Technical Specification 1.0", url: "https://spec.c2pa.org/specifications/specifications/1.0/specs/C2PA_Specification.html"}
    examples: [Content Credentials, Adobe Firefly, OpenAI image generation metadata]
    resources:
      - {kind: docs, title: "C2PA and Content Credentials Explainer", by: "C2PA", year: 2025, url: "https://spec.c2pa.org/specifications/specifications/2.2/explainer/Explainer.html"}
      - {kind: blog, title: "How C2PA Content Credentials Work and What Their Limits Are", by: "SoftwareSeni", year: 2026, url: "https://www.softwareseni.com/how-c2pa-content-credentials-work-and-what-their-limits-are/"}
      - {kind: docs, title: "How it works", by: "Content Authenticity Initiative", year: 2025, url: "https://contentauthenticity.org/how-it-works"}
      - {kind: code, title: "c2pa-rs: Rust SDK for C2PA", by: "Content Authenticity Initiative", year: 2025, url: "https://github.com/contentauth/c2pa-rs"}
    status: added
  - id: training-data-licensing
    name: Training Data Licensing and Opt-Outs
    aliases: [data provenance, AI crawler opt-outs, robots.txt for AI, data licensing]
    region: governance-and-compliance
    also: [data-and-synthetic-data]
    layer: detail
    desc: Tracking where training data came from, under what license, and whether its owners opted out, so a team knows what it may legally train on.
    summary: "Knowing where training data came from, what license it carries and whether its owners have opted out of AI training. Audits found that dataset licenses are often wrong or missing, and that a large share of the best web sources now block AI crawlers in robots.txt. Teams respond by tracking the license of every source, honoring opt-outs and buying licensed data, while courts are still deciding how copyright applies."
    parents:
      - {id: "external:copyright-and-licensing", rel: applies, why: "Applies copyright and license terms to datasets assembled for training.", src: "The Data Provenance Initiative (Longpre et al. 2023)"}
      - {id: model-documentation, rel: extends, why: "Extends documentation from the model to the licenses and sources of its training data (data provenance cards).", src: "Longpre et al. 2023"}
    maturity: 3
    maturity_note: Opt-out controls and licensing deals are now routine for large crawls; the legal ground (fair use, text-and-data-mining exceptions) is still being decided in court.
    date: "2023-10"
    ref: {title: "The Data Provenance Initiative: A Large Scale Audit of Dataset Licensing & Attribution in AI (Longpre et al.)", arxiv: "2310.16787"}
    examples: [Data Provenance Explorer, robots.txt GPTBot and Google-Extended rules, publisher licensing deals]
    resources:
      - {kind: paper, title: "Consent in Crisis: The Rapid Decline of the AI Data Commons", by: "Shayne Longpre et al.", year: 2024, url: "https://arxiv.org/abs/2407.14933"}
      - {kind: blog, title: "Discit ergo est: Training Data Provenance and Fair Use", by: "Robert Mahari, Shayne Longpre (Network Law Review)", year: 2024, url: "https://www.networklawreview.org/mahari-longpre-generative-ai/"}
      - {kind: docs, title: "Overview of OpenAI Crawlers", by: "OpenAI", year: 2025, url: "https://developers.openai.com/api/docs/bots"}
    status: added
