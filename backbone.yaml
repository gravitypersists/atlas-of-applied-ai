  - id: latent-reasoning
    name: Latent Reasoning
    aliases: [Coconut, Chain of Continuous Thought, continuous thought]
    region: planning-and-reasoning
    also: [adaptation-and-post-training]
    layer: detail
    desc: Reasoning in the model's hidden-state vectors instead of text, feeding the last hidden state back as the next input rather than decoding it to a token.
    summary: "Instead of writing out each reasoning step as words, the model passes its internal state straight back into itself and thinks in vectors. This can be more efficient and can keep several possibilities open at once. The cost is that nobody can read the reasoning, which matters for monitoring."
    parents:
      - {id: chain-of-thought, rel: extends, why: "Replaces language reasoning steps with continuous hidden states, trained from CoT data.", src: "Training LLMs to Reason in a Continuous Latent Space (Hao et al. 2024)"}
    maturity: 1
    maturity_note: Early research on small models; not in any production model.
    date: "2024-12"
    ref: {title: "Training Large Language Models to Reason in a Continuous Latent Space (Hao et al.)", arxiv: "2412.06769"}
    examples: [Coconut]
    resources:
      - {kind: talk, title: "Training large language models to reason in a continuous latent space – COCONUT Paper explained", by: "Letitia Parcalabescu (AI Coffee Break with Letitia)", year: 2025, url: "https://www.youtube.com/watch?v=mhKC3Avqy2E"}
      - {kind: blog, title: "Why We Think", by: "Lilian Weng", year: 2025, url: "https://lilianweng.github.io/posts/2025-05-01-thinking/"}
      - {kind: paper, title: "Scaling up Test-Time Compute with Latent Reasoning: A Recurrent Depth Approach", by: "Jonas Geiping et al.", year: 2025, url: "https://arxiv.org/abs/2502.05171"}
      - {kind: code, title: "facebookresearch/coconut", by: "Meta FAIR", year: 2024, url: "https://github.com/facebookresearch/coconut"}
    status: added
  - id: cot-monitoring
    name: CoT Monitoring
    aliases: [CoT faithfulness, chain-of-thought monitorability, reasoning trace monitoring]
    region: planning-and-reasoning
    also: [safety-security-and-governance, evaluation-and-observability]
    layer: detail
    desc: Reading a reasoning model's chain of thought, usually with another model, to catch misbehavior, and checking whether the visible reasoning actually drives the answer.
    summary: "A reasoning model's thinking can reveal intentions its final answer hides, such as a plan to game a test, so a second model can read the trace and flag problems. It only works if the trace is faithful: models sometimes leave out what really drove their answer, and training them to avoid flagged thoughts can teach them to hide those thoughts instead."
    parents:
      - {id: reasoning-models, rel: counters, why: "Watches reasoning traces for reward hacking and other misbehavior.", src: "Monitoring Reasoning Models for Misbehavior (Baker et al. 2025)"}
      - {id: llm-as-a-judge, rel: applies, why: "The monitor is typically a second model grading the trace.", src: "Monitoring Reasoning Models for Misbehavior (Baker et al. 2025)", confidence: medium}
    maturity: 2
    maturity_note: Used by frontier labs during training and evaluation; little tooling for application builders, and faithfulness is unresolved.
    date: "2025-03"
    ref: {title: "Monitoring Reasoning Models for Misbehavior and the Risks of Promoting Obfuscation (Baker et al.)", arxiv: "2503.11926"}
    examples: []
    resources:
      - {kind: blog, title: "Reasoning models don't always say what they think", by: "Anthropic", year: 2025, url: "https://www.anthropic.com/research/reasoning-models-dont-say-think"}
      - {kind: talk, title: "Chain of thought monitorability: A new and fragile opportunity for AI safety by Tomek Korbak", by: "Tomek Korbak (AI Safety Poland)", year: 2025, url: "https://www.youtube.com/watch?v=nAy1sFNAsBw"}
      - {kind: paper, title: "Chain of Thought Monitorability: A New and Fragile Opportunity for AI Safety", by: "Tomek Korbak et al.", year: 2025, url: "https://arxiv.org/abs/2507.11473"}
      - {kind: paper, title: "Measuring Faithfulness in Chain-of-Thought Reasoning", by: "Tamera Lanham et al.", year: 2023, url: "https://arxiv.org/abs/2307.13702"}
    status: added

