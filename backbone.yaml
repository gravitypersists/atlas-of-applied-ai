      - {kind: blog, title: "A deep dive into Clef, Cloudflare's decision model", by: "Flavio Copes", year: 2026, url: "https://flaviocopes.com/clef/"}
      - {kind: paper, title: "General Decision Models: Benchmarking and Insights Beyond Jev", by: "Feiyu Duan et al.", year: 2026, url: "https://arxiv.org/abs/2610.03935"}
