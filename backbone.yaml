  - id: prefill-decode-disaggregation
    name: Prefill-Decode Disaggregation
    aliases: [disaggregated serving, split-level inference]
    region: inference-and-serving
    desc: Running the compute-bound prefill phase and the memory-bound decode phase on separate hardware pools, transferring KV state between them.
    summary: "Generating a response has two phases: prefill reads the whole prompt at once and is limited by compute, while decode produces tokens one at a time and is limited by memory bandwidth. On the same GPUs the two slow each other down, so disaggregated serving puts them on separate pools of machines and ships the KV cache from prefill to decode over a fast network. Each pool can then be sized and tuned for its own phase."
    parents:
      - {id: continuous-batching, rel: extends, why: "Separates the two phases continuous batching interleaves on one device.", src: "DistServe (Zhong et al. 2024)"}
      - {id: kv-cache, rel: applies, why: "Requires moving KV cache between prefill and decode workers.", src: "DistServe (Zhong et al. 2024)"}
    maturity: 3
    maturity_note: Adopted by large-scale providers; becoming standard in open engines.
    date: "2024-01"
    ref: {title: "DistServe: Disaggregating Prefill and Decoding for Goodput-optimized LLM Serving (Zhong et al.)", arxiv: "2401.09670"}
    examples: [NVIDIA Dynamo, llm-d, Mooncake, DistServe]
    resources:
      - {kind: blog, title: "Throughput is Not All You Need: Maximizing Goodput in LLM Serving using Prefill-Decode Disaggregation", by: "Hao AI Lab (UCSD)", year: 2024, url: "https://haoailab.com/blogs/distserve/"}
      - {kind: talk, title: "DistServe: disaggregating prefill and decoding for goodput-optimized LLM inference", by: "Hao Zhang (PyTorch Expert Exchange)", year: 2024, url: "https://www.youtube.com/watch?v=Bh-jlh5vlF0"}
      - {kind: blog, title: "NVIDIA Dynamo, A Low-Latency Distributed Inference Framework for Scaling Reasoning AI Models", by: "NVIDIA", year: 2025, url: "https://developer.nvidia.com/blog/introducing-nvidia-dynamo-a-low-latency-distributed-inference-framework-for-scaling-reasoning-ai-models/"}
      - {kind: paper, title: "Splitwise: Efficient generative LLM inference using phase splitting", by: "Pratyush Patel et al.", year: 2023, url: "https://arxiv.org/abs/2311.18677"}
    status: repaired
  - id: local-inference
    name: Local and On-Device Inference
    aliases: [llama.cpp, edge inference, on-device models]
    region: inference-and-serving
    desc: Running models on consumer hardware or devices, relying on quantization and efficient kernels.
    summary: "Running models on your own laptop, phone or workstation instead of calling a cloud API. Heavily quantized weights (often 4-bit, in formats such as GGUF) and engines tuned for CPUs and Apple Silicon, such as llama.cpp and MLX, make mid-sized open models usable on consumer hardware. People use it for privacy, offline use and zero per-token cost, giving up the quality of the largest models."
    parents:
      - {id: weight-quantization, rel: applies, why: "Quantization makes models fit consumer memory.", src: "llama.cpp (Gerganov 2023)"}
    maturity: 4
    maturity_note: Mature tooling and a large user base.
    date: "2023-03"
    ref: {title: "llama.cpp (Gerganov)", url: "https://github.com/ggml-org/llama.cpp"}
    examples: [llama.cpp, Ollama, LM Studio, MLX]
    resources:
      - {kind: blog, title: "Large language models are having their Stable Diffusion moment", by: "Simon Willison", year: 2023, url: "https://simonwillison.net/2023/Mar/11/llama/"}
      - {kind: blog, title: "Introduction to ggml", by: "Xuan Son Nguyen et al. (Hugging Face)", year: 2024, url: "https://huggingface.co/blog/introduction-to-ggml"}
      - {kind: docs, title: "GGUF", by: "Hugging Face", year: 2024, url: "https://huggingface.co/docs/hub/gguf"}
      - {kind: talk, title: "Bringing Whisper and LLaMA to the masses (Interview)", by: "Georgi Gerganov (The Changelog)", year: 2024, url: "https://www.youtube.com/watch?v=8D3GNEq_FNY"}
    status: added
  # Added by the Bulwark deep dive (2026-10-10): homed here for its mechanism, purpose is provenance.
  - id: llm-watermarking
    name: LLM Watermarking
    aliases: [text watermarking, green-list watermarking]
    region: inference-and-serving
    also: [governance-and-compliance]
    layer: detail
    desc: Nudging a model's token choices with a secret, key-dependent bias during generation so its text can later be detected statistically.
    summary: "At each step of generation, a secret key and the preceding tokens split the vocabulary into a favored and an unfavored part, and the model is nudged toward the favored words. The text reads normally, but anyone with the key can count favored words and detect it with high confidence from a short passage. Paraphrasing weakens the signal, and it only works when the provider controls generation, so open-weight models are out of reach."
    parents:
      - {id: autoregressive-decoding, rel: applies, why: "Biases the sampling step of token-by-token generation.", src: "A Watermark for Large Language Models (Kirchenbauer et al. 2023)"}
      - {id: "external:digital-watermarking", rel: extends, why: "Carries watermarking of media over to generated text.", src: "Kirchenbauer et al. 2023"}
    maturity: 3
    maturity_note: Deployed by Google as SynthID Text; most providers don't watermark text, and paraphrasing weakens it.
    date: "2023-01"
    ref: {title: "A Watermark for Large Language Models (Kirchenbauer et al.)", arxiv: "2301.10226"}
    examples: [SynthID Text]
    resources:
      - {kind: "blog", title: "Introducing SynthID Text", by: "Hugging Face, Google DeepMind", year: 2024, url: "https://huggingface.co/blog/synthid-text"}
