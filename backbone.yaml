  - id: test-time-compute-scaling
    name: Test-Time Compute Scaling
    aliases: [inference-time scaling, search against verifiers]
    region: planning-and-reasoning
    also: [inference-and-serving]
    desc: Spending more computation at inference — longer reasoning, more samples, search — to improve answers, with predictable returns.
    summary: "Spending more computation when answering, through longer reasoning, more samples, or search against a verifier, to get better answers. Returns are predictable enough to plan around, and on hard problems extra inference compute can beat a larger model. It turned reasoning effort into a setting you trade against cost and latency."
    parents:
