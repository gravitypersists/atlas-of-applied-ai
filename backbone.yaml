  - id: dynamic-few-shot-selection
    name: Dynamic Few-Shot Selection
    aliases: [example selection, prompt retrieval, kNN prompting, KATE]
    region: prompting-and-context-engineering
    also: [retrieval-and-knowledge]
    layer: detail
    desc: Selecting in-context demonstrations at runtime by retrieving the examples most similar to the incoming query from a larger pool.
    summary: Instead of hard-coding the same examples into every prompt, retrieve the past examples most similar to the current input. Better-matched examples give better answers for the same token cost.
    parents:
      - {id: few-shot-prompting, rel: extends, why: "Replaces fixed demonstrations with ones chosen per input.", src: "What Makes Good In-Context Examples for GPT-3? (Liu et al. 2021)"}
      - {id: dense-retrieval, rel: applies, why: "Uses embedding similarity to pick the nearest examples.", src: "What Makes Good In-Context Examples for GPT-3? (Liu et al. 2021)"}
    maturity: 4
    maturity_note: A standard pattern wherever few-shot prompts meet varied inputs.
    date: "2021-01"
    ref: {title: "What Makes Good In-Context Examples for GPT-3? (Liu et al.)", arxiv: "2101.06804"}
    examples: [LangChain SemanticSimilarityExampleSelector, DSPy KNNFewShot]
    resources:
      - {kind: blog, title: "Few-shot prompting to improve tool-calling performance", by: "LangChain", year: 2024, url: "https://www.langchain.com/blog/few-shot-prompting-to-improve-tool-calling-performance"}
      - {kind: docs, title: "KNNFewShot - DSPy", by: "DSPy", year: 2024, url: "https://dspy.ai/current/api/optimizers/KNNFewShot/"}
      - {kind: paper, title: "Learning To Retrieve Prompts for In-Context Learning", by: "Ohad Rubin, Jonathan Herzig, Jonathan Berant", year: 2021, url: "https://arxiv.org/abs/2112.08633"}
      - {kind: paper, title: "In-context Learning with Retrieved Demonstrations for Language Models: A Survey", by: "Man Luo et al.", year: 2024, url: "https://arxiv.org/abs/2401.11624"}
    status: added
  - id: decomposed-prompting
    name: Decomposed Prompting
    aliases: [DECOMP, task decomposition prompting]
    region: prompting-and-context-engineering
    also: [planning-and-reasoning]
    layer: detail
    desc: Breaking a complex task into sub-tasks, each delegated to a specialized prompt handler or a symbolic function, under a decomposer prompt.
    summary: Breaking a hard problem into sub-tasks, each handled by its own specialized prompt or by ordinary code. It's prompt chaining with an explicit plan for who does what.
