  - id: sparse-autoencoders
    name: Sparse Autoencoders
    aliases: [SAEs, dictionary learning, monosemantic features]
    region: safety-and-security
    desc: Decomposing model activations into many sparse, interpretable features.
    summary: "A single neuron inside a model usually responds to many unrelated things. A sparse autoencoder learns to rewrite the model's internal activations as a mix drawn from a much larger set of features, only a few active at a time, and many of those features match one recognizable concept. Labs use them to inspect what a model is representing and to steer it by turning features up or down (as in Golden Gate Claude)."
    parents:
      - {id: interpretability, rel: extends, why: "Scalable method for finding interpretable features.", src: "Towards Monosemanticity (Bricken et al. 2023)"}
    maturity: 2
    maturity_note: Used by labs for analysis and steering; tooling emerging.
    date: "2023-10"
    ref: {title: "Towards Monosemanticity: Decomposing Language Models With Dictionary Learning (Bricken et al.)", url: "https://transformer-circuits.pub/2023/monosemantic-features"}
    examples: [Gemma Scope, Neuronpedia]
    resources:
