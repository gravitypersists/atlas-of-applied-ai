  - id: semantic-routing
    name: Semantic Routing
    aliases: [embedding-based intent routing, Semantic Router]
    region: agents-and-orchestration
    layer: detail
    desc: Choosing a tool, prompt, or sub-agent by comparing the query's embedding with example utterances for each route, with no LLM call.
    summary: "Picks where a request should go by comparing its embedding with example phrases for each route, instead of asking an LLM to decide. It takes milliseconds and costs almost nothing, so it often sits in front of an agent as a first-pass router. It handles clear-cut intents well and ambiguous ones poorly."
    parents:
      - {id: mrkl-systems, rel: specializes, why: "A MRKL-style router implemented with embedding similarity instead of a model call.", src: "Semantic Router (Aurelio AI 2023)", confidence: medium}
      - {id: text-embeddings, rel: applies, why: "Routes by cosine similarity between the query and each route's example utterances.", src: "Semantic Router (Aurelio AI 2023)"}
    maturity: 3
    maturity_note: A common cheap pre-filter in front of agents and chatbots; less necessary as LLM routing gets cheaper.
    date: "2023-10"
    ref: {title: "Semantic Router (Aurelio AI)", url: "https://github.com/aurelio-labs/semantic-router"}
    examples: [Aurelio Semantic Router]
